сгоныг холбосон хэрчмийн дундаж перпендикуляр дээр"]], ["Багийн даалгавар", ["Эмнэлэг — гурвалжинд багтаасан тойргийн төв (гурван цэгээс ижил зайтай).", "Гурвалжин мохоо өнцөгтэй бол энэ цэг гурвалжнаас гадна гарна.", "Зураглалыг шалгуураар үнэлнэ."]], ["II. Гэрийн даалгавар", ["№1: 6,5", "№2: 3", "№3: 10", "№4: 108°", "№5: 1980°"]], ["III. Гарах тасалбар", ["№1: талуудын дундаж перпендикуляр (шалгуур 1)", "№2: өнцгийн биссектрис (шалгуур 2)", "№3: √3 (шалгуур 3)"]]], "F": ["R=\\frac{c}{2}\\ \\text{(тэгш өнцөгт)},\\quad r=\\frac{S}{p}", "a+c=b+d", "\\alpha_{n}=\\frac{(n-2)\\cdot 180^{\\circ}}{n}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mtext>&#x000A0;</mtext><mtext>(тэгш&#x000A0;өнцөгт)</mtext><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>r</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>S</mi></mrow><mrow><mi>p</mi></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>&#x0002B;</mo><mi>c</mi><mo>&#x0003D;</mo><mi>b</mi><mo>&#x0002B;</mo><mi>d</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>&#x003B1;</mi><mrow><mi>n</mi></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x000B7;</mo><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow><mrow><mi>n</mi></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-46"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-46"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «багтсан тойрог» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L46.png", "ol": [["Гүдгэр 13 өнцөгтийн дотоод өнцгийн нийлбэр", "1980°", "Олонлог 10, Дасгал 10 №1"], ["Зөв n өнцөгтийн дотоод өнцөг ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>144</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ бол n", "10", "Олонлог 10, Дасгал 10 №2"], ["Дөрвөн өнцөгтийн өнцгүүд 3 : 3 : 4 : 8 бол өнцгүүд", "60°, 60°, 80°, 160°", "Олонлог 10, Дасгал 10 №4"]], "tb": [["AB = AC = 7, BC = 4 адил хажуут гурвалжны талбай ба багтсан тойргийн радиус", "h = √45 = 3√5; S = 6√5; r = 6√5 : 9 = 2√5/3", "Математик X, §7.2 №10"], ["3 см талтай зөв гурвалжинд багтсан тойргийн радиус", "√3/2 см", "Математик X, §7.2 №11"], ["Зөв зургаан өнцөгтийн тал 6 см бол багтсан ба багтаасан тойргийн радиус", "r = 3√3; R = 6", "Математик X, §7.2 №36"]], "digital": true, "stype": "C", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Шударга байдал»:** Багтаасан тойргийн төв гурван оройгоос ижил зайтай: хэнийг ч ялгахгүй. Сайн удирдагч, багш ч хүн бүрт ижил хандана. Асуулт: «Би найзууддаа ижил хандаж чаддаг уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) Зургаан өнцөгтийн дотоод өнцгийн нийлбэр; 2) Катетууд 3, 4 бол гипотенуз; 3) Тэгш өнцөгт гурвалжинд багтаасан тойргийн төв хаана вэ?", "**Холбоос (1 мин):** №44–45-д тойрог дахь өнцөг, шулуунуудыг үзсэн; өнөөдөр тойрог ба олон өнцөгтийг холбож, нэгжээ нэгтгэнэ."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Гурван сумаас ижил зайд эмнэлэг барих газрыг хэрхэн олох вэ? Ийм цэг үргэлж байх уу?", "**1. Гол санаа (самбарт):** Цэгийн геометр байр: 2 цэгээс ижил зайтай цэгүүд — дундаж перпендикуляр; өнцгийн 2 талаас ижил зайтай — биссектрис; O-оос r зайтай — тойрог.", "   Багтаасан тойргийн төв — талуудын дундаж перпендикуляруудын огтлолцол (тэгш өнцөгт гурвалжинд R = c : 2). Багтсан тойргийн төв — биссектрисуудын огтлолцол, r = S : p (p — хагас периметр). Зөв гурвалжин: R = a : √3, r = a : (2√3). Зөв зургаан өнцөгт: R = a. Багтаасан дөрвөн өнцөгт: a + c = b + d.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): Катетууд 6, 8 бол R", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 6 талтай зөв гурвалжны R ба r", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): Тойрогт багтаасан ABCD: AB = 7, BC = 9, CD = 10 бол DA", "**3. Түгээмэл алдаа:** Багтсан ба багтаасан тойргийн төвийг андуурах; r = S : p-д бүтэн периметр авах; багтаасан дөрвөн өнцөгтөд хөрш талуудын нийлбэрийг тэнцүүлэх.", "**4. Шалгах цэг (3 мин):** 1) 3, 4, 5 талтай гурвалжны r; 2) Зөв найман өнцөгтийн дотоод өнцөг. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Оюуны зураглал (багаар):** 1-р хэсэг (15 мин): Газрын зураг дээр Арвайхээр, Хужирт, Хархорин гурван цэгийг (багшийн өгсөн координатаар) тэмдэглэж, циркуль, шугамаар 2 дундаж перпендикуляр татаж эмнэлгийн цэгийг олно. 2-р хэсэг: «Тойрог» нэгжийн оюуны зураглал — төвд «Тойрог»; салаа: өнцөг (төв, багтсан, диаметрт тулсан), шулуун (хөвч, шүргэгч, огтлогч + томьёо), олон өнцөгт (багтсан, багтаасан, зөв олон өнцөгт), цэгийн геометр байр. Салаа бүрт томьёо, жишээ зураг, амьдралын хэрэглээ.", "**Бүтээгдэхүүн:** Байгуулалт ба А3 оюуны зураглал", "**Нэгж 11-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "47": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Бие даасан гүйцэтгэлийн даалгавар", 16], ["VIII. Өөрийгөө шалгах, засварлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Тойргийн нумын урт, дугуйн секторын ба сегментийн талбайг тооцоолж, арчигч, цаг, усалгааны талбай зэрэг бодит бодлогод хэрэглэх.", "crit": ["Би нумын урт ба секторын талбайг олж чадна.", "Би сегментийн талбайг сектор ба гурвалжны талбайгаар олж чадна.", "Би бодит бодлогод томьёог сонгож хэрэглэж чадна."], "words": "нумын урт l = πrα/180; секторын талбай S = πr²α/360 = l·r/2; сегментийн талбай = сектор − гурвалжин (½r²·sin α).", "ex": [["r = 6, α = 60° бол l ба S_сектор", "l = 2π; S = 6π"], ["Мөн сегментийн талбай", "6π − ½·36·√3/2 = 6π − 9√3 ≈ 3,3"], ["r = 10, α = 90° сегмент", "25π − 50 ≈ 28,5"]], "ck": [["r = 9, α = 40° бол l", "2π"], ["l = 5π, r = 10 бол α", "90°"]], "ws": [["Сэргээх", ["r = 5 бол тойргийн урт", "r = 3 бол дугуйн талбай"]], ["Дадлага 1", ["r = 9, α = 40° бол l", "r = 6, α = 90° бол S_сектор"]], ["Дадлага 2", ["r = 4, α = 135° бол S_сектор", "l = 5π, r = 10 бол α"]], ["★ Сорилт", ["r = 6, α = 90° сегментийн талбай", "r = 4, α = 60° сегментийн талбай"]], ["Хэрэглээ", ["r = 12 см бялууг 8 тэнцүү хэсэглэв. Нэг зүсмийн талбай"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "r = 12, α = 30° бол l", "r = 10, α = 72° бол S_сектор", "r = 8, α = 90° сегмент", "l = 4π, r = 6 бол α", "55° өнцөгтэй, 15 см радиустай секторын талбай __(Математик X, §15.1 №1)__"], "quiz": ["r = 3, α = 120° бол l", "r = 6, α = 60° бол S_сектор", "l = 5, r = 4 бол S_сектор"], "key": [["III. Суурь сэргээх", ["1) 10π", "2) 9π", "3) 1/12"]], ["Жишээ 1–3", ["Жишээ 1: l = 2π; S = 6π", "Жишээ 2: 6π − ½·36·√3/2 = 6π − 9√3 ≈ 3,3", "Жишээ 3: 25π − 50 ≈ 28,5"]], ["Шалгах цэг", ["1) 2π", "2) 90°"]], ["I. Ажлын хуудас", ["№1: 10π", "№2: 9π", "№3: 2π", "№4: 9π", "№5: 6π", "№6: 90°", "№7: 9π − 18 ≈ 10,3", "№8: 8π/3 − 4√3 ≈ 1,45", "№9: 18π ≈ 56,5 см²"]], ["Багийн даалгавар", ["1: S = 144π/8 = 18π ≈ 56,5 см²; l = 24π/8 = 3π ≈ 9,4 см.", "2: α = 120° → l = 20π/3 ≈ 20,9 см.", "3: S = (120/360)·π·(50² − 10²) = 800π ≈ 2513 см²."]], ["II. Гэрийн даалгавар", ["№1: 2π", "№2: 20π", "№3: 16π − 32 ≈ 18,3", "№4: 120°", "№5: ≈ 108 см²"]], ["III. Гарах тасалбар", ["№1: 2π (шалгуур 1)", "№2: 6π (шалгуур 2)", "№3: 10 (шалгуур 3)"]]], "F": ["l=\\frac{\\pi r\\alpha}{180^{\\circ}}", "S_{\\text{сектор}}=\\frac{\\pi r^{2}\\alpha}{360^{\\circ}}=\\frac{lr}{2}", "S_{\\text{сегмент}}=S_{\\text{сектор}}-\\frac{1}{2}r^{2}\\sin\\alpha"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>&#x003C0;</mi><mi>r</mi><mi>&#x003B1;</mi></mrow><mrow><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S</mi><mrow><mtext>сектор</mtext></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mi>&#x003C0;</mi><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup><mi>&#x003B1;</mi></mrow><mrow><msup><mn>360</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>l</mi><mi>r</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S</mi><mrow><mtext>сегмент</mtext></mrow></msub><mo>&#x0003D;</mo><msub><mi>S</mi><mrow><mtext>сектор</mtext></mrow></msub><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup><mi>sin</mi><mi>&#x003B1;</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-47"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-47"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «дугуйн сектор» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L47.png", "ol": [], "tb": [["55° өнцөгтэй, 15 см радиустай секторын талбай", "≈ 108 см²", "Математик X, §15.1 №1"], ["1,4 м диаметртэй дамар минутад 80 эргэнэ. Дамрын тойрог дээрх цэгийн хурд", "80·1,4π ≈ 352 м/мин", "Математик X, §15.1 №7"]], "digital": false, "stype": "A", "mode": "ганцаар", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Шударга хуваах»:** Бялуу, пиццаг тэнцүү сектороор хуваахад хүн бүр ижил хэмжээ авна. Шударга хуваах, бусдыг бодох нь гэр бүл, найз нөхдийн харилцааны үндэс. Асуулт: «Би хамгийн том хэсгийг өөртөө авах гэж оролддог уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) r = 5 бол тойргийн урт; 2) r = 3 бол дугуйн талбай; 3) 30° нь 360°-ын хэдэн хэсэг вэ?", "**Холбоос (1 мин):** 8 дугаар ангид тойргийн урт, дугуйн талбайг (Олонлог 8, х. 8), №41-д гурвалжны талбайг үзсэн; өнөөдөр тойргийн хэсгийг хэмжинэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Машины шил арчигч 120° эргэдэг. Шилний хэдэн см² талбайг цэвэрлэдэг вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** α градусын нум бүтэн тойргийн α/360 хэсэг: l = 2πr·α/360 = πrα/180. Сектор: S = πr²·α/360 = l·r/2.", "   Сегмент (хөвч ба нумаар хүрээлэгдсэн): S = S_сектор − S_гурвалжин = πr²α/360 − ½r²·sin α.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): r = 6, α = 60° бол l ба S_сектор", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Мөн сегментийн талбай", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): r = 10, α = 90° сегмент", "**3. Түгээмэл алдаа:** Нумын томьёонд 180-ын оронд 360 авах (эсвэл эсрэгээр); сегментийг секторын талбайтай тэнцүү гэх; градус ба нумын уртыг андуурах.", "**4. Шалгах цэг (3 мин):** 1) r = 9, α = 40° бол l; 2) l = 5π, r = 10 бол α. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Бие даасан гүйцэтгэлийн даалгавар", ["**Бие даасан гүйцэтгэлийн даалгавар:** «Амьдрал дахь сектор» (сонгож хийнэ, 1 → 3 хүндрэнэ). 1) Дугуй бялуу r = 12 см-ийг 8 тэнцүү хэсэглэв. Нэг зүсмийн талбай ба нумын урт? 2) Цагийн минутын зүү 10 см. 20 минутад үзүүр нь хэдэн см зам туулах вэ? 3) Арчигчийн бариул 10 см-ээс 50 см хүртэл резинтэй, 120° эргэдэг. Цэвэрлэх талбай (цагираган сектор)?", "**Бүтээгдэхүүн:** Бие даасан бодолт (дэвтэрт)", "• Суралцагч бүр өөрийн бүтээгдэхүүнийг хийнэ; багш шалгуурын дагуу ажиглаж, хэрэгтэй хүнд чиглүүлэх асуулт тавина."]], ["VIII. Өөрийгөө шалгах, засварлах", ["• Багш түлхүүрийг (эсвэл шалгуурын жишээ хариуг) үзүүлнэ.", "• Суралцагч бүр ажлаа шалгуураар өөрөө шалгаж, алдаагаа өөр өнгөөр засна. 2–3 суралцагч засварласан алхмаа тайлбарлана."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "48": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Призм ба пирамидын хажуу ба бүтэн гадаргуу, эзэлхүүнийг тооцоолж, картоноор хайрцаг бүтээж хамгийн их эзэлхүүнийг судлах.", "crit": ["Би призмийн гадаргуу ба эзэлхүүнийг олж чадна.", "Би зөв пирамидын апофем, гадаргуу, эзэлхүүнийг олж чадна.", "Би хайрцгийн загвараа тооцоогоор үндэслэж чадна."], "words": "призм, пирамид; суурь, хажуу тал, ирмэг; өндөр h; апофем — хажуу талын өндөр; бүтэн гадаргуу; эзэлхүүн V.", "ex": [["4 × 3 × 5 хайрцаг", "S = 2(12 + 20 + 15) = 94; V = 60"], ["Суурь нь 6 талтай квадрат, h = 4 зөв пирамидын апофем", "m = √(16 + 9) = 5"], ["Мөн пирамидын S_бүтэн ба V", "S = ½·24·5 + 36 = 96; V = ⅓·36·4 = 48"]], "ck": [["4 ирмэгтэй кубын S ба V", "96; 64"], ["Суурь 8 талтай квадрат, h = 3 зөв пирамидын апофем", "√(9 + 16) = 5"]], "ws": [["Сэргээх", ["4 × 5 тэгш өнцөгтийн талбай", "2·3·4"]], ["Дадлага 1", ["4 ирмэгтэй кубын S", "Мөн кубын V"]], ["Дадлага 2", ["2 × 3 × 4 хайрцгийн S ба V", "Суурь нь 3, 4 катеттай тэгш өнцөгт гурвалжин, h = 10 призмийн V"]], ["★ Сорилт", ["Суурь 8 талтай квадрат, h = 3 зөв пирамидын S_хажуу ба V", "Кубын эзэлхүүн 125 бол S"]], ["Хэрэглээ", ["Сүүний хайрцаг 6 × 6 × 20 см. Багтаамж ба материал"]], ["Код унших (сонголттой)", ["Гаралт:", "for (int x = 3; x <= 5; x++) cout << (30 - 2*x) * (20 - 2*x) * x << \" \";"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "5 ирмэгтэй кубын S ба V", "3 × 4 × 5 хайрцгийн S ба V", "Суурь 6 талтай квадрат, h = 4 зөв пирамидын V", "Мөн пирамидын S_бүтэн", "Кубын тал ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ см бол гадаргуу __(Олонлог 10, Дасгал 13 №1)__"], "quiz": ["S_суурь = 12, h = 5 призмийн V", "S_суурь = 12, h = 5 пирамидын V", "1 × 2 × 3 хайрцгийн S"], "key": [["III. Суурь сэргээх", ["1) 20", "2) 24", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: S = 2(12 + 20 + 15) = 94; V = 60", "Жишээ 2: m = √(16 + 9) = 5", "Жишээ 3: S = ½·24·5 + 36 = 96; V = ⅓·36·4 = 48"]], ["Шалгах цэг", ["1) 96; 64", "2) √(9 + 16) = 5"]], ["I. Ажлын хуудас", ["№1: 20", "№2: 24", "№3: 96", "№4: 64", "№5: 52; 24", "№6: 60", "№7: ½·32·5 = 80; ⅓·64·3 = 64", "№8: ирмэг 5; S = 150", "№9: V = 720 см³ = 0,72 л; S = 552 см²", "№10: 1008 1056 1000"]], ["Багийн даалгавар", ["x = 3: 24 × 14 × 3 = 1008 см³; материал 564 см².", "x = 4: 22 × 12 × 4 = 1056 см³; x = 5: 20 × 10 × 5 = 1000 см³.", "Бүхэл тоонуудаас x = 4 хамгийн их (≈ 1,06 л)."]], ["II. Гэрийн даалгавар", ["№1: 150; 125", "№2: 94; 60", "№3: 48", "№4: 96", "№5: 12 см²"]], ["III. Гарах тасалбар", ["№1: 60 (шалгуур 1)", "№2: 20 (шалгуур 2)", "№3: 22 (шалгуур 3)"]]], "F": ["V_{\\text{призм}}=S\\,h,\\quad S_{\\text{хажуу}}=P\\,h", "V_{\\text{пирамид}}=\\frac{1}{3}S\\,h,\\quad S_{\\text{хажуу}}=\\frac{1}{2}P\\,m"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mrow><mtext>призм</mtext></mrow></msub><mo>&#x0003D;</mo><mi>S</mi><mspace width=\"0.167em\" /><mi>h</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>S</mi><mrow><mtext>хажуу</mtext></mrow></msub><mo>&#x0003D;</mo><mi>P</mi><mspace width=\"0.167em\" /><mi>h</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mrow><mtext>пирамид</mtext></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>S</mi><mspace width=\"0.167em\" /><mi>h</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>S</mi><mrow><mtext>хажуу</mtext></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>P</mi><mspace width=\"0.167em\" /><mi>m</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-48"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-48"], ["GeoGebra 3D", "https://www.geogebra.org/3d"], ["Mozaik: «призм, пирамид» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L48.png", "ol": [["Кубын тал ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ см бол гадаргуу", "12 см²", "Олонлог 10, Дасгал 13 №1"], ["Кубын эзэлхүүн ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>64</mn></mrow></math>⟧ см³ бол нэг талсын талбай", "16 см²", "Олонлог 10, Дасгал 13 №3"], ["Тэгш өнцөгт параллелепипедийн 3 талсын талбай 12, 15, 20 бол эзэлхүүн ба гадаргуу", "V = √(12·15·20) = 60; S = 94", "Олонлог 10, Дасгал 13 №5"]], "tb": [["3 см, 4 см, 5 см ирмэгтэй гурван гуулин кубийг хайлуулж нэг куб цутгав. Кубын ирмэг", "∛216 = 6 см", "Математик X, §15.2 №15"], ["10 м³ багтаамжтай усны савын ёроол 2,5 м × 1,75 м бол өндөр", "10 : 4,375 ≈ 2,29 м", "Математик X, §15.2 №18"]], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хэмнэлт»:** Хайрцаг хийхэд материал бага, багтаамж их байвал мөнгө, байгаль хэмнэнэ. Хог хаягдлаа багасгах нь хүн бүрийн хариуцлага. Асуулт: «Би өдөрт хэдэн хуванцар уут хаядаг вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) 4 × 5 тэгш өнцөгтийн талбай; 2) 2·3·4; 3) Катетууд 3, 4 бол гипотенуз", "**Холбоос (1 мин):** 6–8 дугаар ангид куб, параллелепипедийн эзэлхүүнийг үзсэн (Олонлог 8, х. 8); өнөөдөр призм, пирамидад өргөтгөнө."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** 20 × 30 см картоны 4 булангаас ижил квадрат хайчилж, хайрцаг нугалъя. Ямар хэмжээтэй квадрат хайчилбал хайрцагт хамгийн их зүйл багтах вэ?", "**1. Гол санаа (самбарт):** Призм: S_хажуу = P_суурь·h; S_бүтэн = S_хажуу + 2S_суурь; V = S_суурь·h. Тэгш өнцөгт параллелепипед: S = 2(ab + bc + ac), V = abc.", "   Зөв пирамид: апофем m = √(h² + r²) (r — суурийн төвөөс талын дунд хүртэлх зай); S_хажуу = ½P·m; V = ⅓S_суурь·h. Ижил суурь, өндөртэй призм ба пирамидын эзэлхүүн 3 : 1.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 4 × 3 × 5 хайрцаг", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Суурь нь 6 талтай квадрат, h = 4 зөв пирамидын апофем", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): Мөн пирамидын S_бүтэн ба V", "**3. Түгээмэл алдаа:** Пирамидын эзэлхүүнд ⅓-ийг мартах; апофем ба өндрийг андуурах; бүтэн гадаргууд суурийг 2 удаа (пирамидад) нэмэх.", "**4. Шалгах цэг (3 мин):** 1) 4 ирмэгтэй кубын S ба V; 2) Суурь 8 талтай квадрат, h = 3 зөв пирамидын апофем. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Хамгийн их багтаамжтай хайрцаг»: 20 × 30 см картоны булангаас x см-ийн квадрат хайчилж, таггүй хайрцаг нугална. 1) Баг бүр өөр x (3, 4, 5 см) сонгож хайрцгаа хийнэ. 2) Хэмжээс (30 − 2x) × (20 − 2x) × x, эзэлхүүн, материалын талбай (600 − 4x²)-г тооцоолно. 3) Ангийн хүснэгтэд нэгтгэж, аль x хамгийн их эзэлхүүн өгснийг дүгнэнэ.", "**Бүтээгдэхүүн:** Хайрцаг ба тооцооны хүснэгт", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "49": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: цилиндр ба конус — Монгол гэрийн жишээгээр", 28], ["V. Хосын гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Хос солилцож шалгах, сайжруулах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Цилиндр ба конусын хажуу, бүтэн гадаргуу, эзэлхүүнийг тооцоолж, Монгол гэрийн эзэлхүүн ба бүрээсийн материалыг тооцоолох.", "crit": ["Би цилиндрийн гадаргуу ба эзэлхүүнийг олж чадна.", "Би конусын байгуулагч, гадаргуу, эзэлхүүнийг олж чадна.", "Би Монгол гэрийн хэмжээг цилиндр, конусаар тооцоолж чадна."], "words": "цилиндр; конус; суурийн радиус r; өндөр h; байгуулагч l = √(r² + h²); хажуу гадаргуу; эзэлхүүн.", "ex": [["r = 3, h = 5 цилиндр", "S_хажуу = 30π; S = 48π; V = 45π"], ["r = 3, h = 4 конус", "l = 5; S_хажуу = 15π; S = 24π; V = 12π"], ["Гэр: r = 3, хана 1,5 м, дээвэр 1,5 м. Эзэлхүүн", "13,5π + 4,5π = 18π ≈ 56,5 м³"]], "ck": [["r = 2, h = 5 цилиндрийн V", "20π"], ["r = 6, h = 8 конусын l ба V", "10; 96π"]], "ws": [["Сэргээх", ["π·2²", "2π·3"]], ["Дадлага 1", ["r = 2, h = 5 цилиндрийн V", "Мөн цилиндрийн S_хажуу"]], ["Дадлага 2", ["r = 6, h = 8 конусын l ба V", "r = 4, h = 3 цилиндрийн S"]], ["★ Сорилт", ["r = 3, l = 5 конусын S_бүтэн", "Цилиндрийн V = 36π, r = 3 бол h"]], ["Хэрэглээ", ["Гэр: r = 3, хана 1,5 м, дээвэр 1,5 м. Эзэлхүүн"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "r = 5, h = 2 цилиндрийн V", "Мөн цилиндрийн S_хажуу", "r = 5, h = 12 конусын l ба V", "Мөн конусын S_бүтэн", "Цилиндрийн ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>&#x0003D;</mo><mn>5</mn></mrow></math>⟧, өндөр нь радиусаас 2 дахин их бол эзэлхүүн __(Олонлог 10, Дасгал 13 №7)__"], "quiz": ["r = 1, h = 10 цилиндрийн V", "r = 3, h = 4 конусын V", "Ижил суурь, өндөртэй цилиндр ба конусын V-ийн харьцаа"], "key": [["III. Суурь сэргээх", ["1) 4π", "2) 6π", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: S_хажуу = 30π; S = 48π; V = 45π", "Жишээ 2: l = 5; S_хажуу = 15π; S = 24π; V = 12π", "Жишээ 3: 13,5π + 4,5π = 18π ≈ 56,5 м³"]], ["Шалгах цэг", ["1) 20π", "2) 10; 96π"]], ["I. Ажлын хуудас", ["№1: 4π", "№2: 6π", "№3: 20π", "№4: 20π", "№5: 10; 96π", "№6: 56π", "№7: 24π", "№8: 4", "№9: 18π ≈ 56,5 м³"]], ["Багийн даалгавар", ["V = 13,5π + 4,5π = 18π ≈ 56,5 м³.", "Хана 9π ≈ 28,3 м²; дээвэр π·3·3,35 ≈ 31,6 м²; нийт ≈ 59,9 м².", "Эсгий ≈ 59,9 · 25 000 ≈ 1 497 500₮; хүн ≈ 5."]], ["II. Гэрийн даалгавар", ["№1: 50π", "№2: 20π", "№3: 13; 100π", "№4: 90π", "№5: 250π"]], ["III. Гарах тасалбар", ["№1: 10π (шалгуур 1)", "№2: 12π (шалгуур 2)", "№3: 3 : 1 (шалгуур 3)"]]], "F": ["V_{\\text{цил.}}=\\pi r^{2}h,\\quad S_{\\text{хажуу}}=2\\pi rh", "V_{\\text{конус}}=\\frac{1}{3}\\pi r^{2}h,\\quad l=\\sqrt{r^{2}+h^{2}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mrow><mtext>цил.</mtext></mrow></msub><mo>&#x0003D;</mo><mi>&#x003C0;</mi><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup><mi>h</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>S</mi><mrow><mtext>хажуу</mtext></mrow></msub><mo>&#x0003D;</mo><mn>2</mn><mi>&#x003C0;</mi><mi>r</mi><mi>h</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mrow><mtext>конус</mtext></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#x003C0;</mi><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup><mi>h</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>l</mi><mo>&#x0003D;</mo><msqrt><mrow><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><msup><mi>h</mi><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-49"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-49"], ["GeoGebra 3D", "https://www.geogebra.org/3d"], ["Mozaik: «цилиндр, конус» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L49.png", "ol": [["Цилиндрийн ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>&#x0003D;</mo><mn>5</mn></mrow></math>⟧, өндөр нь радиусаас 2 дахин их бол эзэлхүүн", "250π", "Олонлог 10, Дасгал 13 №7"], ["Конусын байгуулагч ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10</mn></mrow></math>⟧ см, радиус ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6</mn></mrow></math>⟧ см бол өндөр ба эзэлхүүн", "h = 8; V = 96π", "Олонлог 10, Дасгал 13 №8"]], "tb": [["Конусын радиус 3 см, өндөр нь радиусаас 2 см-ээр илүү бол эзэлхүүн ба хажуу гадаргуу", "h = 5; V = 15π; l = √34; S = 3√34·π", "Математик X, §15.2 №14"]], "digital": false, "stype": "B", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Өв уламжлалаа хүндлэх»:** Монгол гэр нь цилиндр (хана) ба конус (дээвэр)-оос бүрдсэн, салхинд тэсвэртэй, дулаан хадгалдаг ухаалаг бүтэц. Өвөг дээдсийн мэргэн ухааныг хүндлэх нь бидний үүрэг. Асуулт: «Гэр бүлдээ ямар уламжлалыг хадгалдаг вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) π·2²; 2) 2π·3; 3) √(9 + 16)", "**Холбоос (1 мин):** №48-д призм, пирамидыг үзсэн: цилиндр бол «дугуй суурьтай призм», конус бол «дугуй суурьтай пирамид»."]], ["IV. Самбарын тайлбар: цилиндр ба конус — Монгол гэрийн жишээгээр", ["**Асуудал:** Таван ханатай гэрт хэдэн м³ агаар байдаг вэ? Дээврийн бүрээсэнд хэдэн м² эсгий хэрэгтэй вэ?", "**1. Гол санаа (самбарт):** Цилиндр — дугуй суурьтай «призм»: S_хажуу = 2πr·h (дэлгэхэд тэгш өнцөгт), S = 2πr(r + h), V = πr²h.", "   Конус — дугуй суурьтай «пирамид»: байгуулагч l = √(r² + h²); S_хажуу = πrl (дэлгэхэд сектор), S = πr(r + l), V = ⅓πr²h. Ижил суурь, өндөртэй цилиндр ба конусын V-ийн харьцаа 3 : 1.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): r = 3, h = 5 цилиндр", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): r = 3, h = 4 конус", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): Гэр: r = 3, хана 1,5 м, дээвэр 1,5 м. Эзэлхүүн", "**3. Түгээмэл алдаа:** Конусын эзэлхүүнд ⅓-ийг мартах; байгуулагч l ба өндөр h-ийг андуурах; голчийг радиус гэж авах.", "**4. Шалгах цэг (3 мин):** 1) r = 2, h = 5 цилиндрийн V; 2) r = 6, h = 8 конусын l ба V. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Манай гэр»: r = 3 м, хананы өндөр 1,5 м, дээврийн өндөр 1,5 м. 1) Гэрийн эзэлхүүн (цилиндр + конус). 2) Ханын бүрээс (цилиндрийн хажуу) ба дээврийн бүрээс (конусын хажуу)-ний талбай. 3) Эсгий 1 м² нь 25 000₮ бол бүрээсний эсгий хэд вэ? (π ≈ 3,14; √11,25 ≈ 3,35) 4) Нэг хүнд 10 м³ агаар хэрэгтэй бол гэрт хэдэн хүн тухтай байх вэ?", "**Бүтээгдэхүүн:** Гэрийн тооцооны хуудас", "**Нэгж 12-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "50": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн уралдаан", 16], ["VIII. Дүн гаргах, алдааг задлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Бөмбөрцгийн гадаргуу, бөмбөлгийн эзэлхүүнийг тооцоолж, урвуу бодлого бодох, бөмбөг ба Дэлхийн хэмжээний бодлогод хэрэглэх.", "crit": ["Би бөмбөрцгийн гадаргуу ба бөмбөлгийн эзэлхүүнийг олж чадна.", "Би S эсвэл V өгөгдсөн үед R-ийг олж чадна.", "Би бодит биетийн хэмжээг тооцоолж харьцуулж чадна."], "words": "бөмбөрцөг; бөмбөлөг; радиус R; гадаргуу S = 4πR²; эзэлхүүн V = 4/3·πR³; хагас бөмбөрцөг.", "ex": [["R = 3", "S = 36π; V = 36π"], ["R = 6", "S = 144π; V = 288π"], ["R = 3 хагас бөмбөлгийн бүтэн гадаргуу", "27π"]], "ck": [["R = 2 бол S ба V", "16π; 32π/3"], ["S = 100π бол R", "5"]], "ws": [["Сэргээх", ["3³", "4·9"]], ["Дадлага 1", ["R = 2 бол S", "R = 2 бол V"]], ["Дадлага 2", ["R = 6 бол V", "S = 100π бол R"]], ["★ Сорилт", ["R = 3 хагас бөмбөлгийн бүтэн гадаргуу", "V = 36π бол R"]], ["Хэрэглээ", ["Сагсан бөмбөг R = 12 см. Арьсны талбай (π ≈ 3,14)"]], ["Код унших (сонголттой)", ["cout << 4/3 * 3.14 * 27;  юу гарах вэ? Зөв бичих?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "R = 1 бол S ба V", "R = 10 бол S", "R = 3 хагас бөмбөлгийн V", "S = 64π бол R", "Бөмбөрцгийн радиус ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><msqrt><mrow><mn>3</mn></mrow></msqrt></mrow></math>⟧ бол эзэлхүүн __(Олонлог 10, Дасгал 13 №9)__"], "quiz": ["R = 3 бол V", "R-ийг 2 дахин ихэсгэвэл S хэд дахин ихсэх вэ?", "V = 288π бол R"], "key": [["III. Суурь сэргээх", ["1) 27", "2) 36", "3) 8"]], ["Жишээ 1–3", ["Жишээ 1: S = 36π; V = 36π", "Жишээ 2: S = 144π; V = 288π", "Жишээ 3: 27π"]], ["Шалгах цэг", ["1) 16π; 32π/3", "2) 5"]], ["I. Ажлын хуудас", ["№1: 27", "№2: 36", "№3: 16π", "№4: 32π/3", "№5: 288π", "№6: 5", "№7: 27π", "№8: 3", "№9: 576π ≈ 1809 см²", "№10: 84.78 (4/3 = 1 болно); 4.0/3 → 113.04"]], ["Багийн даалгавар", ["1: 4π; 100π; 400π.", "2: R = 3, S = 36π; (36π) : (4π/3) = 27 бөмбөлөг.", "3: S ≈ 4·3,14·6400² ≈ 514 000 000 км²; 1,56 : 514 ≈ 0,3%."]], ["II. Гэрийн даалгавар", ["№1: 4π; 4π/3", "№2: 400π", "№3: 18π", "№4: 4", "№5: 108√3·π"]], ["III. Гарах тасалбар", ["№1: 36π (шалгуур 1)", "№2: 4 дахин (шалгуур 2)", "№3: 6 (шалгуур 3)"]]], "F": ["S=4\\pi R^{2}", "V=\\frac{4}{3}\\pi R^{3}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>&#x0003D;</mo><mn>4</mn><mi>&#x003C0;</mi><msup><mi>R</mi><mrow><mn>2</mn></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V</mi><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#x003C0;</mi><msup><mi>R</mi><mrow><mn>3</mn></mrow></msup></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-50"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-50"], ["GeoGebra 3D", "https://www.geogebra.org/3d"], ["Mozaik: «бөмбөрцөг» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L50.png", "ol": [["Бөмбөрцгийн радиус ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><msqrt><mrow><mn>3</mn></mrow></msqrt></mrow></math>⟧ бол эзэлхүүн", "108√3·π", "Олонлог 10, Дасгал 13 №9"]], "tb": [["Гадаад шүргэлттэй хоёр бөмбөрцгийн төвүүдийн зай 24 см, гадаргуугийн ялгавар 192π см² бол радиусууд", "R + r = 24, R² − r² = 48 → R = 13, r = 11", "Математик X, §15.2 №30"]], "digital": true, "stype": "A", "mode": "уралдаан", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Нэг гэр — Дэлхий»:** Дэлхий бол бүх хүн, амьтны нэг гэр. Монгол нутаг Дэлхийн гадаргын 0,3% орчим ч бидний хариуцлага их. Асуулт: «Би байгальд ээлтэй ямар зүйл хийдэг вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3³; 2) 4·9; 3) 2³", "**Холбоос (1 мин):** №48–49-д призм, пирамид, цилиндр, конусыг үзсэн; өнөөдөр бөөрөнхий биетийг судална."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Сагсан бөмбөгийн арьсанд хэдэн см² материал орох вэ? Монгол нутаг Дэлхийн гадаргын хэдэн хувь вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** R радиустай бөмбөрцгийн гадаргуу S = 4πR² (их тойргийн талбайгаас 4 дахин их). Бөмбөлгийн эзэлхүүн V = 4/3·πR³.", "   Хагас бөмбөлөг: V = 2/3·πR³, бүтэн гадаргуу 2πR² + πR² = 3πR². R-ийг k дахин ихэсгэвэл S — k², V — k³ дахин.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): R = 3", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): R = 6", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): R = 3 хагас бөмбөлгийн бүтэн гадаргуу", "**3. Түгээмэл алдаа:** V-д R² эсвэл S-д R³ авах; 4/3-ийг мартах; голчийг радиус гэж авах.", "**4. Шалгах цэг (3 мин):** 1) R = 2 бол S ба V; 2) S = 100π бол R. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн уралдаан", ["**Багийн уралдаан:** «Бөмбөрцгийн уралдаан» (3 шат). 1 (1 оноо): R = 1, R = 5, R = 10-ын S. 2 (2 оноо): V = 36π бол R ба S; R = 3 бөмбөлгийг хайлуулж R = 1 бөмбөлөг хэдийг цутгах вэ? 3 (3 оноо): Дэлхийн R ≈ 6400 км. Гадаргуу (π ≈ 3,14)-г олж, Монгол нутаг (1,56 сая км²) хэдэн хувь болохыг тооцоол.", "**Бүтээгдэхүүн:** Онооны самбар ба бодолттой картууд", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Дүн гаргах, алдааг задлах", ["• Багуудын онооны самбарыг нэгтгэж, хамгийн олон алдсан даалгаврыг ангиар задлан шинжилнэ.", "• Баг бүр алдсан нэг даалгавраа засаж, засварын оноо авна (сайжруулалтыг урамшуулна)."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "51": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Куб, призм, цилиндр, конус, бөмбөрцгийн хавтгай огтлолын хэлбэрийг таамаглаж, загвар огтолж шалгах, огтлолын хэмжээг тооцоолох.", "crit": ["Би биетийн огтлолын хэлбэрийг таамаглаж, зурж чадна.", "Би огтлолын хэмжээсийг тооцоолж чадна.", "Би огтлолыг амьдралын жишээгээр тайлбарлаж чадна."], "words": "хавтгай огтлол; тэнхлэгийн огтлол; огтлолын хэлбэр; бөмбөрцгийн огтлол — тойрог, r = √(R² − d²).", "ex": [["4 ирмэгтэй кубыг суурийн диагональ ба хажуу ирмэгийг дайруулан огтлов", "тэгш өнцөгт 4 × 4√2"], ["r = 3, h = 5 цилиндрийн тэнхлэгийн огтлол", "тэгш өнцөгт 6 × 5"], ["R = 5 бөмбөрцгийг төвөөс 3 зайд огтлов", "тойрог r = 4"]], "ck": [["R = 10, d = 6 бол огтлолын r", "8"], ["r = 3, h = 4 конусын тэнхлэгийн огтлолын талууд", "6, 5, 5"]], "ws": [["Сэргээх", ["4 талтай квадратын диагональ", "√(25 − 9)"]], ["Дадлага 1", ["r = 2, h = 7 цилиндрийн тэнхлэгийн огтлол", "Конусын тэнхлэгийн огтлолын хэлбэр"]], ["Дадлага 2", ["R = 10, d = 6 бол огтлолын r", "r = 3, h = 4 конусын тэнхлэгийн огтлолын талууд"]], ["★ Сорилт", ["2 ирмэгтэй кубыг нэг оройн хөрш 3 оройгоор огтлов. Огтлол", "Кубын огтлол зургаан өнцөгт байж болох уу?"]], ["Хэрэглээ", ["Цилиндр хэлбэрийн хиамыг ташуу огтлоход ямар хэлбэр гарах вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "R = 13, d = 5 бол огтлолын r", "r = 4, h = 10 цилиндрийн тэнхлэгийн огтлол", "3 ирмэгтэй кубын диагоналийн огтлол", "Конусыг ямар хэлбэрээр огтолж болох вэ?", "Кубын диагоналийн огтлолын талбай ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ бол эзэлхүүн: а) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ б) 8 в) 16 г) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ __(Олонлог 10, Дасгал 13 №10)__"], "quiz": ["Бөмбөрцгийн хавтгай огтлолын хэлбэр", "R = 5, d = 4 бол огтлолын r", "Кубын огтлол ямар олон өнцөгт байж болох вэ?"], "key": [["III. Суурь сэргээх", ["1) 4√2", "2) 4", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: тэгш өнцөгт 4 × 4√2", "Жишээ 2: тэгш өнцөгт 6 × 5", "Жишээ 3: тойрог r = 4"]], ["Шалгах цэг", ["1) 8", "2) 6, 5, 5"]], ["I. Ажлын хуудас", ["№1: 4√2", "№2: 4", "№3: тэгш өнцөгт 4 × 7", "№4: адил хажуут гурвалжин", "№5: 8", "№6: 6, 5, 5", "№7: зөв гурвалжин, тал 2√2", "№8: Тийм: 6 ирмэгийн дундаж цэгийг дайрвал", "№9: эллипс"]], ["Багийн даалгавар", ["Куб: 3 орой дайрвал гурвалжин; 2 эсрэг ирмэг дайрвал тэгш өнцөгт; 6 ирмэгийн дундаж цэгийг дайрвал зөв зургаан өнцөгт.", "Цилиндр: суурьтай параллель — тойрог; тэнхлэгийн дагуу — тэгш өнцөгт; ташуу — эллипс.", "Конус: суурьтай параллель — тойрог; оройг дайрсан — гурвалжин; ташуу — эллипс."]], ["II. Гэрийн даалгавар", ["№1: 12", "№2: 8 × 10", "№3: тэгш өнцөгт 3 × 3√2", "№4: тойрог, гурвалжин, эллипс (бас парабол, гипербол)", "№5: б) 8 (a = 2)"]], ["III. Гарах тасалбар", ["№1: тойрог (шалгуур 1)", "№2: 3 (шалгуур 2)", "№3: 3, 4, 5, 6 өнцөгт (шалгуур 3)"]]], "F": ["r=\\sqrt{R^{2}-d^{2}}", "\\text{цилиндрийн тэнхлэгийн огтлол}:\\ 2r\\times h"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>&#x0003D;</mo><msqrt><mrow><msup><mi>R</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mi>d</mi><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>цилиндрийн&#x000A0;тэнхлэгийн&#x000A0;огтлол</mtext><mi>:</mi><mtext>&#x000A0;</mtext><mn>2</mn><mi>r</mi><mo>&#x000D7;</mo><mi>h</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-51"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-51"], ["GeoGebra 3D", "https://www.geogebra.org/3d"], ["Mozaik: «огтлол» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L51.png", "ol": [["Кубын диагоналийн огтлолын талбай ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ бол эзэлхүүн: а) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ б) 8 в) 16 г) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧", "б) 8 (a = 2)", "Олонлог 10, Дасгал 13 №10"]], "tb": [["Бөмбөрцгийн радиус 41 см, төвөөс 9 см зайд огтлов. Огтлолын радиус", "√(41² − 9²) = 40 см", "Математик X, §15.3 №37"]], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Гаднаас нь дүгнэхгүй»:** Гаднаас нь харахад ижил биет огтолж үзэхэд гурвалжин, зургаан өнцөгт, эллипс гарч болно. Хүнийг ч гадаад төрхөөр нь биш, дотоод чанараар нь дүгнэнэ. Асуулт: «Би хэн нэгнийг гадаад төрхөөр нь яаран дүгнэж байсан уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) 4 талтай квадратын диагональ; 2) √(25 − 9); 3) 3 × 4 тэгш өнцөгтийн диагональ", "**Холбоос (1 мин):** №48–50-д биетийн гадаргуу, эзэлхүүнийг үзсэн; өнөөдөр биетийг хавтгайгаар огтолно."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Кубыг нэг удаа шулуун огтлоход зургаан өнцөгт гарч болох уу? Таамаглаад, туршиж үзье!", "**1. Гол санаа (самбарт):** Огтлол — биет ба хавтгайн огтлолцол. Огтлох хавтгайн байрлалаас хамаарч хэлбэр өөрчлөгдөнө. Кубын огтлол 3–6 өнцөгт байж болно.", "   Цилиндр: суурьтай параллель — тойрог, тэнхлэгийг дайрсан — тэгш өнцөгт (2r × h), ташуу — эллипс. Конус: тэнхлэгийн огтлол — адил хажуут гурвалжин (2r, l, l). Бөмбөрцөг: төвөөс d зайд — r = √(R² − d²) радиустай тойрог.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 4 ирмэгтэй кубыг суурийн диагональ ба хажуу ирмэгийг дайруулан огтлов", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): r = 3, h = 5 цилиндрийн тэнхлэгийн огтлол", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): R = 5 бөмбөрцгийг төвөөс 3 зайд огтлов", "**3. Түгээмэл алдаа:** Цилиндрийн тэнхлэгийн огтлолын өргөнийг r гэх (зөв нь 2r); бөмбөрцгийн огтлолын радиусыг R − d гэх; кубын огтлол зөвхөн дөрвөлжин гэж бодох.", "**4. Шалгах цэг (3 мин):** 1) R = 10, d = 6 бол огтлолын r; 2) r = 3, h = 4 конусын тэнхлэгийн огтлолын талууд. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Таамаглаад огтол»: 1) Хуванцар шавар/төмсөөр куб, цилиндр, конус хийнэ. 2) Огтлохоос өмнө хүснэгтэд таамаглалаа бичнэ: кубаас гурвалжин, тэгш өнцөгт, трапец, зургаан өнцөгт; цилиндрээс тойрог, тэгш өнцөгт, эллипс; конусаас тойрог, гурвалжин, эллипс гаргах хавтгайн байрлалыг заана. 3) Утсаар огтолж шалгана, зургийг дэвтэрт зурна. 4) Хэдэн таамаглал зөв байсныг тоолж дүгнэнэ.", "**Бүтээгдэхүүн:** Таамаглал–үр дүнгийн хүснэгт ба огтлолын зургууд", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "52": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Оюуны зураглал (багаар)", 16], ["VIII. Зураглал танилцуулах, нөхөх", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Куб, пирамид, цилиндр, конус, бөмбөрцгийн хавтгай огтлолын талбайг тооцоолж, «Хэмжигдэхүүн ба биет» нэгжийг оюуны зураглалаар нэгтгэх.", "crit": ["Би тэнхлэгийн огтлол ба бөмбөрцгийн огтлолын талбайг олж чадна.", "Би кубын ба пирамидын огтлолын талбайг олж чадна.", "Би нэгжийн томьёонуудыг оюуны зураглалаар холбож чадна."], "words": "огтлолын талбай; тэнхлэгийн огтлол; суурьтай параллель огтлол — талбай (k)² дахин; оюуны зураглал.", "ex": [["4 ирмэгтэй кубын диагоналийн огтлол", "16√2"], ["R = 5, d = 3 бөмбөрцгийн огтлол", "16π"], ["r = 3, h = 4 конусын тэнхлэгийн огтлол", "½·6·4 = 12"]], "ck": [["r = 3, h = 4 цилиндрийн тэнхлэгийн огтлол", "24"], ["Пирамидын суурь 36, өндрийн голоор параллель огтлол", "9"]], "ws": [["Сэргээх", ["4 × 6 тэгш өнцөгтийн талбай", "Суурь 6, өндөр 4 гурвалжны талбай"]], ["Дадлага 1", ["r = 3, h = 4 цилиндрийн тэнхлэгийн огтлол", "R = 5, d = 4 бөмбөрцгийн огтлол"]], ["Дадлага 2", ["2 ирмэгтэй кубын диагоналийн огтлол", "r = 5, h = 12 конусын тэнхлэгийн огтлол"]], ["★ Сорилт", ["Пирамидын суурь 36, өндрийн голоор параллель огтлол", "2 ирмэгтэй кубын нэг оройн хөрш 3 оройгоор огтлол"]], ["Хэрэглээ", ["r = 20 см, урт 2 м гуалиныг голоор нь хөрөөдөв. Банзны талбай"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "R = 13, d = 12 бөмбөрцгийн огтлол", "r = 1,5, h = 4 цилиндрийн тэнхлэгийн огтлол", "6 ирмэгтэй кубын диагоналийн огтлол", "r = 6, h = 8 конусын тэнхлэгийн огтлол", "Кубын диагоналийн огтлолын талбай ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ бол кубын ирмэг __(Олонлог 10, Дасгал 13 №10)__"], "quiz": ["R = 10, d = 6 бөмбөрцгийн огтлол", "r = 2, h = 3 цилиндрийн тэнхлэгийн огтлол", "Пирамидын суурь 100, өндрийн голоор параллель огтлол"], "key": [["III. Суурь сэргээх", ["1) 24", "2) 12", "3) 16π"]], ["Жишээ 1–3", ["Жишээ 1: 16√2", "Жишээ 2: 16π", "Жишээ 3: ½·6·4 = 12"]], ["Шалгах цэг", ["1) 24", "2) 9"]], ["I. Ажлын хуудас", ["№1: 24", "№2: 12", "№3: 24", "№4: 9π", "№5: 4√2", "№6: 60", "№7: 9", "№8: зөв гурвалжин 2√2 → 2√3", "№9: 0,8 м²"]], ["Багийн даалгавар", ["Гэр: 6·1,5 + ½·6·1,5 = 9 + 4,5 = 13,5 м².", "Банз: 0,4 · 2 = 0,8 м².", "Зураглалыг шалгуураар үнэлнэ."]], ["II. Гэрийн даалгавар", ["№1: 25π", "№2: 12", "№3: 36√2", "№4: 48", "№5: 2"]], ["III. Гарах тасалбар", ["№1: 64π (шалгуур 1)", "№2: 12 (шалгуур 2)", "№3: 25 (шалгуур 3)"]]], "F": ["S=\\pi\\left(R^{2}-d^{2}\\right)", "S_{\\text{огтлол}}=S_{\\text{суурь}}\\cdot k^{2}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>&#x0003D;</mo><mi>&#x003C0;</mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>R</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mi>d</mi><mrow><mn>2</mn></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S</mi><mrow><mtext>огтлол</mtext></mrow></msub><mo>&#x0003D;</mo><msub><mi>S</mi><mrow><mtext>суурь</mtext></mrow></msub><mo>&#x000B7;</mo><msup><mi>k</mi><mrow><mn>2</mn></mrow></msup></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-52"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-52"], ["GeoGebra 3D", "https://www.geogebra.org/3d"], ["Mozaik: «огтлол» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L52.png", "ol": [["Кубын диагоналийн огтлолын талбай ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4</mn><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow></math>⟧ бол кубын ирмэг", "2", "Олонлог 10, Дасгал 13 №10"]], "tb": [["Бөмбөрцгийн радиус 41 см, төвөөс 9 см зайд огтлов. Огтлолын талбай", "1600π см²", "Математик X, §15.3 №37"], ["Тэгш өнцөгт параллелепипедийн өндөр 16 см, суурийн талууд 10, 12 см. Суурийн бага талыг дайрсан диагональ огтлолын талбай", "10·√(16² + 12²) = 10·20 = 200 см²", "Математик X, §15.3 №34"]], "digital": false, "stype": "A", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Бүхэл ба хэсэг»:** Нэг огтлол биетийн зөвхөн нэг хэсгийг харуулдаг, бүхэл биетийг биш. Хүн, үйл явдлыг нэг хэсгээр нь бүхэлд нь дүгнэхгүй. Асуулт: «Нэг алдаагаар хэн нэгнийг дүгнэж байсан уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 4 × 6 тэгш өнцөгтийн талбай; 2) Суурь 6, өндөр 4 гурвалжны талбай; 3) π·4²", "**Холбоос (1 мин):** №51-д огтлолын хэлбэрийг үзсэн; өнөөдөр талбайг тооцоолж, нэгжээ нэгтгэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** r = 20 см, урт 2 м гуалиныг голоор нь хөрөөдөхөд гарах банзны талбай хэд вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Цилиндрийн тэнхлэгийн огтлол: 2r·h. Конусын тэнхлэгийн огтлол: ½·2r·h = rh. Бөмбөрцөг: S = π(R² − d²).", "   Кубын диагоналийн огтлол: a·a√2 = a²√2. Пирамидыг суурьтай параллель, оройгоос өндрийн k хэсэгт огтловол S_огтлол = S_суурь·k² (жишээ: голоор нь огтловол ¼).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 4 ирмэгтэй кубын диагоналийн огтлол", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): R = 5, d = 3 бөмбөрцгийн огтлол", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): r = 3, h = 4 конусын тэнхлэгийн огтлол", "**3. Түгээмэл алдаа:** Конусын тэнхлэгийн огтлолд ½-ийг мартах; бөмбөрцгийн огтлолд π(R − d)² авах; пирамидын огтлолд k² биш k авах.", "**4. Шалгах цэг (3 мин):** 1) r = 3, h = 4 цилиндрийн тэнхлэгийн огтлол; 2) Пирамидын суурь 36, өндрийн голоор параллель огтлол. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Оюуны зураглал (багаар)", ["**Оюуны зураглал (багаар):** 1-р хэсэг (12 мин): Монгол гэрийн тэнхлэгийн огтлолын талбай (голч 6 м, хана 1,5 м, дээвэр 1,5 м) ба гуалингийн банзны талбай (r = 20 см, урт 2 м). 2-р хэсэг: «Хэмжигдэхүүн ба биет» нэгжийн (№47–52) оюуны зураглал — төвд «Биет»; салаа: тойргийн хэсэг (нум, сектор, сегмент), призм ба пирамид, цилиндр ба конус, бөмбөрцөг, огтлол. Салаа бүрт S ба V-ийн томьёо, жижиг зураг, амьдралын жишээ (хайрцаг, гэр, бөмбөг, банз). «Пирамид — призмийн ⅓, конус — цилиндрийн ⅓» гэх мэт холбоосыг сумаар харуулна.", "**Бүтээгдэхүүн:** Тооцоо ба А3 оюуны зураглал", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Нэгж 11–12-ын явцын сорил:** гэрт Microsoft Forms-оор 20 минут (10 бодлого, нэгжийн төлөвлөлтийн хавсралт).", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "53": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Функцийг томьёо, хүснэгт, график, үгээр өгөх аргуудыг харьцуулж, нэг аргаас нөгөөд шилжүүлэх, функц мөн эсэхийг тогтоох, тодорхойлогдох мужийг олох.", "crit": ["Би функцийг 4 аргаар илэрхийлж, нэгээс нөгөөд шилжүүлж чадна.", "Би функц мөн эсэх ба тодорхойлогдох мужийг тогтоож чадна.", "Би бодит мэдээллийг функцээр загварчилж чадна."], "words": "функц — x бүрт ганц y; өгөх арга: томьёо, хүснэгт, график, үгээр (тайлбар), сумтай диаграмм; тодорхойлогдох муж.", "ex": [["f(x) = 2x − 3: f(4) ба x = 0, 1, 2-ын хүснэгт", "f(4) = 5; −3, −1, 1"], ["x: 1, 2, 3, 4; y: 3, 5, 7, 9-ийн томьёо", "y = 2x + 1"], ["x² + y² = 1 тойрог функц мөн үү?", "Үгүй: x = 0-д y = ±1"]], "ck": [["f(x) = x² − 1 бол f(3)", "8"], ["{(1; 2), (2; 3), (1; 4)} функц мөн үү?", "Үгүй: 1-д 2 утга"]], "ws": [["Сэргээх", ["3·4 − 5", "(2; −1) цэг аль мөчөнд вэ?"]], ["Дадлага 1", ["f(x) = x² − 1 бол f(3)", "Мөн f(−2)"]], ["Дадлага 2", ["x: 0, 1, 2, 3; y: 1, 4, 7, 10-ын томьёо", "{(1; 2), (2; 3), (1; 4)} функц мөн үү?"]], ["★ Сорилт", ["f(x) = √(x − 2)-ийн тодорхойлогдох муж", "f(x) = 1 : (x − 3)-ийн тодорхойлогдох муж"]], ["Хэрэглээ", ["Такси: 2000₮ + км бүр 1000₮. Томьёо ба 5 км-ийн төлбөр"]], ["Код унших (сонголттой)", ["Гаралт:", "double fare(double x) { return 2000 + 1000 * x; }", "cout << fare(3.5);"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "f(x) = 3x + 2 бол f(−1)", "x: 1, 2, 3; y: 2, 4, 6-гийн томьёо", "f(x) = √(5 − x)-ийн тодорхойлогдох муж", "Утасны багц 10 000₮ + 1 ГБ тутам 500₮. f(10)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>3</mn><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><mo>&#x02212;</mo><mn>27</mn><mi>x</mi><mo>&#x0002B;</mo><mn>5</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>5</mn></mrow></math>⟧ байх x-үүд __(Олонлог 10, Дасгал 5 №3)__"], "quiz": ["f(x) = x² + 1 бол f(2)", "Аль нь функц биш вэ? А) {(1; 1), (2; 1)} Б) {(1; 1), (1; 3)}", "Функцийг өгөх 4 аргыг нэрлэ"], "key": [["III. Суурь сэргээх", ["1) 7", "2) IV", "3) 4"]], ["Жишээ 1–3", ["Жишээ 1: f(4) = 5; −3, −1, 1", "Жишээ 2: y = 2x + 1", "Жишээ 3: Үгүй: x = 0-д y = ±1"]], ["Шалгах цэг", ["1) 8", "2) Үгүй: 1-д 2 утга"]], ["I. Ажлын хуудас", ["№1: 7", "№2: IV", "№3: 8", "№4: 3", "№5: y = 3x + 1", "№6: Үгүй", "№7: x ≥ 2", "№8: x ≠ 3", "№9: f(x) = 2000 + 1000x; 7000₮", "№10: 5500"]], ["Багийн даалгавар", ["1: f(x) = 2000 + 1000x; 2: 2000, 4000, 6000, 8000.", "3: шулуун (0; 2000)-аас эхэлнэ; f(3,5) = 5500₮.", "4: 150·150 + 50·200 = 22 500 + 10 000 = 32 500₮."]], ["II. Гэрийн даалгавар", ["№1: −1", "№2: y = 2x", "№3: x ≤ 5", "№4: 15 000₮", "№5: x = 0; ±3"]], ["III. Гарах тасалбар", ["№1: 5 (шалгуур 1)", "№2: Б (шалгуур 2)", "№3: томьёо, хүснэгт, график, үгээр (шалгуур 3)"]]], "F": ["f(x)=2000+1000x", "x\\ \\text{бүрт ганц}\\ y=f(x)"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>2000</mn><mo>&#x0002B;</mo><mn>1000</mn><mi>x</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x</mi><mtext>&#x000A0;</mtext><mtext>бүрт&#x000A0;ганц</mtext><mtext>&#x000A0;</mtext><mi>y</mi><mo>&#x0003D;</mo><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-53"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-53"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Mozaik: «функц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L53.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>3</mn><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><mo>&#x02212;</mo><mn>27</mn><mi>x</mi><mo>&#x0002B;</mo><mn>5</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>5</mn></mrow></math>⟧ байх x-үүд", "x = 0; ±3", "Олонлог 10, Дасгал 5 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>5</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧", "−1", "Олонлог 10, Дасгал 5 №2"]], "tb": [], "digital": true, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Амлалтдаа үнэнч»:** Функц оролт бүрт ганц гаралт өгдөг: нэг асуултад хоёр өөр хариу өгдөггүй. Хүн ч хэлсэн үгэндээ хүрч, нэг үгтэй байх нь итгэлийн үндэс. Асуулт: «Сүүлд өгсөн амлалтаа биелүүлсэн үү?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3·4 − 5; 2) (2; −1) цэг аль мөчөнд вэ?; 3) (−2)²", "**Холбоос (1 мин):** 8 дугаар ангид шугаман функцийг үзсэн (Олонлог 8, х. 6); №5–6-д функцийн ойлголттой танилцсан; өнөөдөр функцийг янз бүрийн аргаар өгнө."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Таксины төлбөрийг жолооч үгээр, програм томьёогоор, самбар хүснэгтээр, апп графикаар харуулдаг. Бүгд нэг функц мөн үү?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Функц: x бүрт ганц y харгалзана. Өгөх арга: томьёо (y = 2000 + 1000x), хүснэгт, график, үгээр («суулт 2000₮, км бүр 1000₮»), сумтай диаграмм.", "   Босоо шулууны шалгалт: график аль ч босоо шулуунтай 1-ээс олон цэгээр огтлолцохгүй бол функц. Тодорхойлогдох муж: √A-д A ≥ 0; 1 : A-д A ≠ 0.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): f(x) = 2x − 3: f(4) ба x = 0, 1, 2-ын хүснэгт", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): x: 1, 2, 3, 4; y: 3, 5, 7, 9-ийн томьёо", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x² + y² = 1 тойрог функц мөн үү?", "**3. Түгээмэл алдаа:** Нэг x-д хоёр y байхыг функц гэх; хүснэгтээс томьёо гаргахдаа зөвхөн нэг цэгээр шалгах; тодорхойлогдох мужид хуваарь 0 болохыг анзаарахгүй байх.", "**4. Шалгах цэг (3 мин):** 1) f(x) = x² − 1 бол f(3); 2) {(1; 2), (2; 3), (1; 4)} функц мөн үү?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 4 станц (5 минут тутам) — «Нэг функц, 4 дүр». 1 «Үг → томьёо»: Такси: суулт 2000₮, км бүр 1000₮. 2 «Томьёо → хүснэгт»: x = 0, 2, 4, 6 км. 3 «Хүснэгт → график»: тор бүхий цаасан дээр зурж, 3,5 км-ийн төлбөрийг графикаас унш. 4 «График → үг»: Цахилгааны тариф: 150 кВт·ц хүртэл 150₮/кВт·ц, түүнээс дээш 200₮/кВт·ц. 200 кВт·ц-ийн төлбөр?", "**Бүтээгдэхүүн:** 4 станцын хариуны карт ба график", "**Нэгж 13-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}}, "TOC": {"1": "Бүхэл тоон илтгэгчтэй зэрэг ба түүний чанар, хэрэглээ", "2": "n зэргийн язгуур ба n зэргийн арифметик язгуур, түүний чанар", "3": "Рационал тоон илтгэгчтэй зэрэг, түүний чанар, хэрэглээ", "4": "Тооны стандарт дүрс, стандарт дүрсээр бичсэн тоон дээрх үйлдэл", "5": "Бодит тооны үйлдэл, түүний чанарууд", "6": "Бүхэл ба рационал илтгэгчтэй алгебрын илэрхийлэл, алгебрын бутархайг хураах", "7": "Алгебрын илэрхийллийг үржигдэхүүн болгон задлах", "8": "Алгебрын бутархайг үржүүлэх, хуваах үйлдэл", "9": "Хуваарь нь шугаман эсвэл квадрат олон гишүүнт байх алгебрын бутархайг нэмэх, хасах үйлдэл", "10": "Функц, функцийн тодорхойлогдох ба утгын муж, дүр", "11": "Квадрат функцийн графикийг утгын хүснэгт ашиглан байгуулах, шилжүүлэх, оройн цэг ба ОХ тэнхлэгийг огтлох цэгүүдээр графикийг тоймлон зурах", "12": "y=ax^n хэлбэрийн функцийн графикийг утгын хүснэгт ашиглан байгуулах, энд 𝑎-рационал тоо ба 𝑛=−2,−1,0,1,2,3", "13": "y=a^x хэлбэрийн функцийн график, муруйн шүргэгч, шүргэгчийн налалт", "14": "Нэг хувьсагчтай шугаман тэнцэтгэл биш", "15": "Квадрат тэгшитгэлийг бүтэн квадрат ялгах аргаар бодох, ерөнхий томьёо гаргах, шийдийг шинжлэх", "16": "Квадрат тэгшитгэлд шилждэг биквадрат болон рационал тэгшитгэл бодох, хэрэглэх", "17": "Хоёр хувьсагчтай шугаман тэнцэтгэл биш зохиох, тэнцэтгэл бишийн системийг бодох, шийдийг координатын хавтгайд дүрслэх", "18": "Илтгэгч тэгшитгэлийг графикийн болон орлуулах аргаар бодох", "19": "Үнэлгээ — Явцын үнэлгээ", "20": "Хавтгайн тэгш өнцөгт координатын систем, цэгийн координатыг тодорхойлох", "21": "Хавтгайн тэгш өнцөгт координатын системд хоёр цэгийн хоорондох зай, хэрчмийн дундаж цэгийн координатыг олох", "22": "Координат нь өгсөн хоёр цэгийг дайрсан шулууны тэгшитгэл, шулууны налалт", "23": "Хавтгай дахь шулууны ерөнхий тэгшитгэл, координатын эх дээр төвтэй тойргийн тэгшитгэл", "24": "Векторыг нэмэх, ха   app.innerHTML=`<a class="small" href="#units">Нэгжүүд</a> <span class="mute small">/ Нэгж ${u.k}</span><h1>${esc(u.name.replace(/^Нэгж \d+\.\s*/,""))}</h1>
  <div class="card"><b>Гол санаа:</b> ${esc(u.big)}<h3>Гол асуулт</h3><ul>${u.eq.map(q=>`<li>${esc(q)}</li>`).join("")}</ul><h3>Нэгжийн эцэст би…</h3><ul>${u.out.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
  <h2>Хичээлүүд</h2><div class="card list">${u.ls.map(n=>`<a class="${d[n]?"done":""}" href="#l-${n}"><span class="no">№${n}</span><span>${esc(TOC[n])}</span></a>`).join("")}</div>`}
function vLesson(n,tab){n=+n;const t=TOC[n];if(!t)return vHome();nav("units");store.set("m10last",n);
  const u=unitOf(n),prev=TOC[n-1]?n-1:0,next=TOC[n+1]?n+1:0;
  const pager=`<div class="pager">${prev?`<a href="#l-${prev}">‹ №${prev}. ${esc(TOC[prev])}</a>`:"<span></span>"}${next?`<a href="#l-${next}" style="text-align:right">№${next}. ${esc(TOC[next])} ›</a>`:"<span></span>"}</div>`;
  if(ASSESS[n]){const r=ASSESS[n];const id=n===54?"final":"h"+n;
    app.innerHTML=`<div class="mute small">Хичээл №${n} · үнэлгээ</div><h1>${esc(t)}</h1><div class="card"><p>Хамрах хичээл: №${r[0]}–${r[1]}. Шалгалтын өмнө холимог давтлага хийгээрэй.</p><div class="row"><a class="btn p" href="legacy.html#test-${id}-a">А хувилбар</a><a class="btn" href="legacy.html#test-${id}-b">Б хувилбар</a><a class="btn" href="legacy.html#review">Давтлага</a></div></div>${pager}`;return}
  const d=NP[n];if(!d)return;
  const tabs=[["see","1. Үзэх"],["ex","2. Жишээ"],["ws","3. Дадлага"],["home","4. Гэрт"]];tab=tab||"see";
  app.innerHTML=`<a class="small" href="#u-${u.k}">${esc(u.name)}</a><div class="mute small" style="margin-top:6px">Хичээл №${n}${done()[n]?" · үзсэн":""}</div>
  <h1>${esc(t)}</h1><p class="mute">${md(d.goal)}</p>
  <details class="card"><summary><b>Өнөөдрийн зорилго — амжилтын шалгуур</b></summary><ol>${d.crit.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></details>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}</div><div id="tab"></div>${pager}`;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{history.replaceState(null,"",`#l-${n}-${b.dataset.t}`);vLesson(n,b.dataset.t)});
  const T=$("#tab"),pad=String(n).padStart(2,"0");
  if(tab==="see")T.innerHTML=`<video controls preload="none" src="video/${pad}.mp4"></video>
     <div class="card"><b>Түлхүүр үг:</b> ${md(d.words)}</div><h2>Гол томьёо</h2><div class="formula">${d.FM.join("")}</div><img class="fig" src="${d.fig}" alt="">
     <div class="row" style="margin-top:12px"><button class="btn" data-go="ex">Дараах: жишээ</button></div>`;
  if(tab==="ex")T.innerHTML=`<p class="mute">Эхлээд өөрөө бодоод, дараа нь хариугаа шалга.</p>${d.ex.map((e,i)=>`<div class="ex"><b>Жишээ ${i+1}.</b> ${md(e[0])}${ans(e[1])}</div>`).join("")}
     <h2>Шалгах цэг</h2><ol class="q">${d.ck.map(c=>`<li>${md(c[0])}${ans(c[1])}</li>`).join("")}</ol><div class="row"><button class="btn" data-go="ws">Дараах: дадлага</button></div>`;
  if(tab==="ws"){const A=key(n,"I. Ажлын");let k=0;
    T.innerHTML=`<p class="mute">Бодлого хөнгөнөөс хүнд рүү. Эхнээс нь эхэлж, аль болох хол яв. ★ тэмдэгтэй нь илүү хүнд.</p>${d.ws.map(w=>`<div class="lvl">${esc(w[0])}</div><ol class="q" start="${k+1}">${w[1].map(q=>`<li>${md(q)}${ans(A[k++])}</li>`).join("")}</ol>`).join("")}
     ${d.tb.length||d.ol.length?`<h2>Номын бодлого</h2><ol class="q">${[...d.tb,...d.ol].map(x=>`<li>${md(x[0])} <span class="mute small">(${esc(x[2])})</span>${ans(x[1])}</li>`).join("")}</ol>`:""}
     <div class="row"><button class="btn" data-go="home">Дараах: гэрийн даалгавар</button></div>`}
  if(tab==="home"){const H=key(n,"II. Гэрийн"),Q=key(n,"III. Гарах");
    T.innerHTML=`<h2>Гэрийн даалгавар</h2><div class="card">${md(d.hw[0])}<ol class="q">${d.hw.slice(1).map((h,i)=>`<li>${md(h)}${ans(H[i])}</li>`).join("")}</ol></div>
     <h2>Гарах тасалбар <span class="mute small">(өөрийгөө шалга)</span></h2><ol class="q">${d.quiz.map((q,i)=>`<li>${md(q)}${ans(Q[i])}</li>`).join("")}</ol>
     <h2>Нэмэлт нөөц</h2><div class="card list">${d.links.slice(2).map(x=>`<a href="${x[1]}" target="_blank" rel="noopener"><span class="no">—</span><span>${esc(x[0])}</span></a>`).join("")}</div>
     <div class="row"><button class="btn p" id="mark">${done()[n]?"Үзсэн гэж тэмдэглэсэн":"Энэ хичээлийг үзсэн гэж тэмдэглэх"}</button></div>`;
    $("#mark").onclick=()=>{const x=done();x[n]=1;store.set("m10done",x);vLesson(n,"home")}}
  T.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{history.replaceState(null,"",`#l-${n}-${b.dataset.go}`);vLesson(n,b.dataset.go);scrollTo(0,0)})}
function vTeacher(){nav("teacher");
  app.innerHTML=`<h1>Багшид</h1><div class="card"><p>Доорх хичээл дээр дарахад проектороор үзүүлэх слайд нээгдэнэ: үе шат, минут, цаг хэмжигч, жишээ, шалгах цэг, багийн даалгавар, тасалбар . Хариуг «Хариу» товч эсвэл space товчоор нээнэ, слайдыг ← → сумаар солино.</p>
  <p class="mute small">Ээлжит төлөвлөлт, ажлын хуудас, түлхүүр нь Word файлаар тусдаа. Хуучин сорил, түвшин тогтоох, давтлага: <a href="legacy.html">хуучин хувилбар</a>.</p></div>
  ${UNITS.map(u=>`<h3>${esc(u.name)}</h3><div class="card list">${u.ls.map(n=>`<a href="#t-${n}"><span class="no">№${n}</span><span>${esc(TOC[n])}</span></a>`).join("")}</div>`).join("")}`}
let tTimer=null;
function slides(n){const d=NP[n],S=d.stages,out=[],A=key(n,"I. Ажлын");
  d.teach.forEach((t,i)=>{const name=t[0],lines=t[1]||[];const body=`<ul>${lines.map(x=>`<li>${md(x.replace(/^•\s*/,""))}</li>`).join("")}</ul>`;
    if(i===0){out.push({s:0,h:`<div class="mute">Хичээл №${n}</div><h2 style="margin-top:6px">${esc(TOC[n])}</h2><p>${md(d.goal)}</p><h3>Амжилтын шалгуур</h3><ol>${d.crit.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`});return}
    if(/Гол санаа/.test(lines.join(" "))){out.push({s:i,h:`<h2>Гол санаа</h2><div class="formula">${d.FM.join("")}</div><img class="fig" src="${d.fig}" alt="">`});
      d.ex.forEach((e,k)=>out.push({s:i,rv:1,h:`<span class="mute">Жишээ ${k+1} · ${["Би хийнэ","Бид хийнэ","Та нар хийнэ"][k]||""}</span><h2 style="margin-top:12px">${md(e[0])}</h2><div class="rv rvbox"><b>${md(e[1])}</b></div>`}));
      out.push({s:i,rv:1,h:`<h2>Шалгах цэг</h2><ol>${d.ck.map(c=>`<li>${md(c[0])}<div class="rv rvbox">${md(c[1])}</div></li>`).join("")}</ol>`});return}
    if(/Бие даан/.test(name)){let k=0;out.push({s:i,rv:1,h:`<h2>Бие даан ажиллая</h2>${d.ws.map(w=>`<div class="lvl">${esc(w[0])}</div><ol start="${k+1}">${w[1].map(q=>`<li>${md(q)}<div class="rv rvbox">${md(A[k++]||"")}</div></li>`).join("")}</ol>`).join("")}`});return}
    if(/Дүгнэлт/.test(name)){const Q=key(n,"III. Гарах");out.push({s:i,rv:1,h:`<h2>Гарах тасалбар</h2><ol>${d.quiz.map((q,j)=>`<li>${md(q)}<div class="rv rvbox">${md(Q[j]||"")}</div></li>`).join("")}</ol>`});
      out.push({s:i,h:`<h2>Эргэцүүлэл ба гэрийн даалгавар</h2><p>«Өнөөдөр би юуг сайжруулсан бэ?»</p>${md(d.hw[0])}<ol>${d.hw.slice(1).map(h=>`<li>${md(h)}</li>`).join("")}</ol>`});return}
    const team=/даалгавар|уралдаан|зураглал|дүгнэлт гаргах|Станц|лаборатори|Хээрийн/i.test(name);
    out.push({s:i,rv:team?1:0,h:`<h2>${esc(name.replace(/^[IVX]+\.\s*/,""))}</h2>${body}${team?`<div class="rv rvbox"><b>Хариу:</b><ul>${key(n,"Багийн").map(x=>`<li>${md(x)}</li>`).join("")}</ul></div>`:""}`})});
  return out}
function vTeach(n){n=+n;const d=NP[n];if(!d)return vLesson(n);const S=d.stages,sl=slides(n);let cur=0,stage=-1,left=0,run=false,show=false;
  if(tTimer)clearInterval(tTimer);
  const fmt=s=>(s<0?"−":"")+Math.floor(Math.abs(s)/60)+":"+String(Math.abs(s)%60).padStart(2,"0");
  const draw=()=>{const s=sl[cur];if(s.s!==stage){stage=s.s;left=S[stage][1]*60;run=false}
    app.innerHTML=`<div class="tw"><div class="tbar"><span class="st">${esc(S[stage][0])}</span><span class="mute">· ${S[stage][1]} мин</span><span class="tm ${left<0?"over":""}" id="tm">${fmt(left)}</span>
     <button class="btn" id="pl">${run?"Зогсоох":"Цаг эхлүүлэх"}</button>${s.rv?'<button class="btn" id="rv">Хариу</button>':""}<span class="mute">${cur+1}/${sl.length}</span>
     <button class="btn" id="pv" ${cur?"":"disabled"}>‹ Өмнөх</button><button class="btn p" id="nx" ${cur<sl.length-1?"":"disabled"}>Дараах ›</button><a class="btn" href="#l-${n}">Хаах</a></div>
     <div class="tprog">${S.map((x,i)=>`<i class="${i<stage?"d":i===stage?"c":""}" style="flex:${x[1]}"></i>`).join("")}</div><div class="slide ${show?"show":""}">${s.h}</div></div>`;
    $("#pl").onclick=()=>{run=!run;draw()};$("#pv").onclick=()=>{cur--;show=false;draw()};$("#nx").onclick=()=>{cur++;show=false;draw()};if($("#rv"))$("#rv").onclick=()=>{show=!show;draw()}};
  tTimer=setInterval(()=>{if(run){left--;const e=$("#tm");if(e){e.textContent=fmt(left);e.classList.toggle("over",left<0)}}},1000);
  document.onkeydown=e=>{if(!location.hash.startsWith("#t-"))return;if(e.key==="ArrowRight"&&cur<sl.length-1){cur++;show=false;draw()}if(e.key==="ArrowLeft"&&cur>0){cur--;show=false;draw()}if(e.key===" "){show=!show;draw();e.preventDefault()}};
  draw()}
function route(){const h=(location.hash||"#home").slice(1);if(tTimer&&!h.startsWith("t-")){clearInterval(tTimer);tTimer=null}
  let m;if(h==="home"||!h)vHome();else if(h==="units")vUnits();else if(h==="teacher")vTeacher();
  else if(m=h.match(/^u-(\d+)$/))vUnit(m[1]);else if(m=h.match(/^l-(\d+)(?:-(\w+))?$/))vLesson(m[1],m[2]);else if(m=h.match(/^t-(\d+)$/))vTeach(m[1]);
  else if(m=h.match(/^(?:lesson|teach)-(\d+)$/))location.hash=(h.startsWith("teach")?"#t-":"#l-")+m[1];else vHome();
  if(!h.startsWith("t-")&&!h.match(/^l-\d+-/))scrollTo(0,0)}
addEventListener("hashchange",route);route();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
