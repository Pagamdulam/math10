−x + 3-ийн шийд мөн үү?", "x + y ≤ 6, x ≥ 0, y ≥ 0 мужийн оройнууд", "Хуушуур x, бууз y: 5x + 3y ≤ 300. (40; 40) хувилбар боломжтой юу?"], "key": [["III. Суурь сэргээх", ["1) (0; −1), (2; 3)", "2) 3·1 + 1 = 4 → тийм", "3) x > 2"]], ["Жишээ 1–3", ["Жишээ 1: (0; 1), (2; 4)-өөр тасархай шулуун; (0; 0): 0 > 1 худал → шулуунаас дээш будна", "Жишээ 2: 4 + 3 = 7 > 6 → үгүй", "Жишээ 3: (−1; 3), (2; 0), (2; 3) оройтой гурвалжин"]], ["Шалгах цэг", ["1) 4 ≤ 5 → тийм", "2) (6; 0), (0; 4)"]], ["I. Ажлын хуудас", ["№1: (3; 0), (0; 3)", "№2: 2 = 2 → шулуун дээр", "№3: 5 > 2 → тийм", "№4: бүтэн; 0 ≤ 1 үнэн → (0; 0)-тэй талыг будна", "№5: (4; 0), (0; 2)-оор бүтэн шулуун; (0; 0)-тэй талыг будна", "№6: (3; 1)", "№7: 13 ≥ 12, 33 ≤ 36, 3 < 10 → тийм", "№8: (0; 0), (5; 0), (0; 5); S = 12,5", "№9: 2x + y ≤ 40; 30 + 12 = 42 > 40 → боломжгүй"]], ["Багийн даалгавар", ["5x + 3y ≤ 300; муж — (0; 80), (0; 100), (30; 50) оройтой гурвалжин.", "(30; 50): 300 ≤ 300, 80 ≥ 80 → тохирно; (60; 20): 360 > 300 → мах хүрэхгүй.", "(10; 80): 290 ≤ 300, 90 ≥ 80 → тохирно."]], ["II. Гэрийн даалгавар", ["№1: тасархай шулуун (0; −1), (1; 1); 0 > −1 үнэн → (0; 0)-тэй тал", "№2: 4 + 9 = 13 > 12 → үгүй", "№3: (0; 0), (4; 0), (0; 4)", "№4: (2; 0), (0; 3)", "№5: x > 47/6 ба x < 6,5 → шийдгүй"]], ["III. Гарах тасалбар", ["№1: −3 > 3 худал → үгүй (шалгуур 1)", "№2: (0; 0), (6; 0), (0; 6) (шалгуур 2)", "№3: 200 + 120 = 320 > 300 → үгүй (шалгуур 3)"]]], "F": ["ax+by\\le c", "\\begin{cases}x+y\\le 6\\\\ x\\ge 0,\\ y\\ge 0\\end{cases}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mi>x</mi><mo>&#x0002B;</mo><mi>b</mi><mi>y</mi><mo>&#x02264;</mo><mi>c</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;</mo><mtable><mtr><mtd columnalign=\"left\"><mi>x</mi><mo>&#x0002B;</mo><mi>y</mi><mo>&#x02264;</mo><mn>6</mn></mtd></mtr><mtr><mtd columnalign=\"left\"><mi>x</mi><mo>&#x02265;</mo><mn>0</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>y</mi><mo>&#x02265;</mo><mn>0</mn></mtd></mtr></mtable></mrow></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-17"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-17"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Шулууны график (видео)", "https://youtu.be/qjVGjYAfGr4"], ["Mozaik: «тэнцэтгэл бишийн систем» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L17.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;</mo><mtable><mtr><mtd columnalign=\"left\"><mn>6</mn><mi>x</mi><mo>&#x02212;</mo><mn>7</mn><mo>&#x0003E;</mo><mn>40</mn></mtd></mtr><mtr><mtd columnalign=\"left\"><mn>5</mn><mo>&#x02212;</mo><mn>2</mn><mi>x</mi><mo>&#x0003E;</mo><mo>&#x02212;</mo><mn>8</mn></mtd></mtr></mtable></mrow></mrow></math>⟧", "x > 47/6 ба x < 6,5 → шийдгүй", "Олонлог 10, Дасгал 6 №5"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;</mo><mtable><mtr><mtd columnalign=\"left\"><mi>x</mi><mo>&#x0002B;</mo><mi>y</mi><mo>&#x0003D;</mo><mn>0</mn></mtd></mtr><mtr><mtd columnalign=\"left\"><mn>2</mn><mi>x</mi><mo>&#x0002B;</mo><mi>y</mi><mo>&#x0003D;</mo><mn>4</mn></mtd></mtr></mtable></mrow></mrow></math>⟧", "x = 4, y = −4", "Олонлог 10, Дасгал 6 №4"]], "tb": [], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хязгаар доторх сонголт»:** Тэнцэтгэл бишийн систем «боломжит шийдийн муж»-ийг өгдөг: хязгаар дотор олон зөв сонголт бий. Асуулт: «Өнөөдөр надад ямар сонголтын эрх, ямар хязгаар байна?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) y = 2x − 1 шулууны x = 0 ба x = 2 үеийн цэгүүд; 2) (1; 4) цэг y = 3x + 1 шулуун дээр оршдог уу?; 3) 2x + 3 > 7", "**Холбоос (1 мин):** 8 дугаар ангид шулууны график (Олонлог 8, х. 6), №14-т тэнцэтгэл бишийг бодсон; өнөөдөр хоёрыг хавтгай дээр нэгтгэнэ."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Ангийн наадамд 3 кг махаар хуушуур (50 г), бууз (30 г) хийнэ. Нийт 80-аас доошгүй ширхэг хэрэгтэй. Хэдэн хуушуур, хэдэн бууз хийх боломжтой вэ?", "**1. Гол санаа (самбарт):** ax + by ≤ c-ийн шийд — шулууны нэг талын хагас хавтгай. 1) Шулууныг зур (≤, ≥ — бүтэн; <, > — тасархай). 2) Шалгах цэг (ихэвчлэн (0; 0)) орлуулж аль талыг будахыг тогтооно.", "   Систем: тус бүрийн мужийг будаж, давхацсан хэсэг нь шийдийн муж. Мужийн оройг шулуунуудын огтлолцлоор олно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): y > 3/2·x + 1-ийн шийдийн мужийг дүрсэл", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (4; 3) цэг {x + y ≤ 6, x ≥ 0, y ≥ 0}-ийн шийд мөн үү?", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): {x + y ≥ 2, y ≤ 3, x ≤ 2}-ийн мужийг зурж оройг ол", "**3. Түгээмэл алдаа:** < үед бүтэн шулуун зурах (тасархай байх ёстой); шалгах цэггүйгээр будах; системд давхцаагүй хэсгийг будах.", "**4. Шалгах цэг (3 мин):** 1) (2; 2) цэг {x + y ≤ 5, x ≥ 0, y ≥ 0}-ийн шийд мөн үү?; 2) 2x + 3y ≤ 12-ийн шулууны OX, OY огтлох цэгүүд. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Наадмын хоол»: x хуушуур, y бууз. Мах: 50x + 30y ≤ 3000 (г), тоо: x + y ≥ 80, x ≥ 0, y ≥ 0. 1) Махны нөхцөлийг хялбарчил. 2) Шулуунуудыг график цаасан дээр зурж шийдийн мужийг буд. 3) Оройг ол. 4) (30; 50), (60; 20), (10; 80) хувилбарыг шалгаж зөвлөмж өг.", "**Бүтээгдэхүүн:** График цаасан дээрх шийдийн муж ба зөвлөмж (А3)", "**Нэгж 4-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "18": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Оюуны зураглал (багаар)", 16], ["VIII. Зураглал танилцуулах, нөхөх", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Илтгэгч тэгшитгэлийг ижил суурьт шилжүүлэх, орлуулах, графикийн аргаар бодох; «Тэгшитгэл, тэнцэтгэл биш» нэгжийн мэдлэгийг оюуны зураглалаар нэгтгэх.", "crit": ["Би 5²ˣ = 125 зэргийг ижил суурьт шилжүүлж бодож чадна.", "Би 4ˣ − 5·2ˣ + 4 = 0 зэргийг орлуулгаар бодож чадна.", "Би нэгжийн сэдвүүдийн холбоог оюуны зураглалаар тайлбарлаж чадна."], "words": "илтгэгч тэгшитгэл — хувьсагч илтгэгчид; ижил суурь; орлуулга — 3ˣ = t; графикийн арга — огтлолцлын цэг.", "ex": [["3^(x² + 2x) = 3^(x + 6)", "x² + x − 6 = 0 → x = 2; −3"], ["9ˣ − 4·3ˣ⁺¹ + 27 = 0", "t² − 12t + 27 = 0 → t = 3; 9 → x = 1; 2"], ["2ˣ = 6 − x-ийг графикаар бод", "x = 2 (2² = 4 = 6 − 2)"]], "ck": [["16ˣ = 8", "2⁴ˣ = 2³ → x = 3/4"], ["4ˣ − 3·2ˣ + 2 = 0", "t² − 3t + 2 = 0 → t = 1; 2 → x = 0; 1"]], "ws": [["Сэргээх", ["2⁵", "1/8-ыг 2-ын зэргээр бич"]], ["Дадлага 1", ["3ˣ⁺³ = 27", "2ˣ = 1/8"]], ["Дадлага 2", ["5²ˣ = 125", "2^(x − 1) = 16"]], ["★ Сорилт", ["3^(x² − x − 2) = 81", "(3/7)^(3x + 1) = (7/3)^(5x − 9)"]], ["Хэрэглээ", ["Бактери цаг тутам 2 дахин олширдог. 1 бактериас 32 болоход хэдэн цаг болох вэ?"]], ["Код унших (сонголттой)", ["Гаралт (2ˣ ≥ 100 байх хамгийн бага x):", "int p = 1, x = 0;", "while (p < 100) { p *= 2; x++; }  cout << x;"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "3ˣ − 1 = 0", "−4·2ˣ + 4 = 0", "2ˣ = 3ˣ", "9ˣ − 10·3ˣ + 9 = 0", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3</mn><mrow><mi>x</mi></mrow></msup><mo>&#x02212;</mo><mn>1</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mn>4</mn><mo>&#x000B7;</mo><msup><mn>2</mn><mrow><mi>x</mi></mrow></msup><mo>&#x0002B;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ __(Олонлог 10, Дасгал 6 №1)__"], "quiz": ["125 = 5^(x + 1)", "4ˣ − 5·2ˣ + 4 = 0", "2ˣ = 3 − x-ийг графикаар бодоход ямар 2 график зурах вэ? Шийд нь?"], "key": [["III. Суурь сэргээх", ["1) 2³", "2) 3⁻³", "3) t = 3; 9"]], ["Жишээ 1–3", ["Жишээ 1: x² + x − 6 = 0 → x = 2; −3", "Жишээ 2: t² − 12t + 27 = 0 → t = 3; 9 → x = 1; 2", "Жишээ 3: x = 2 (2² = 4 = 6 − 2)"]], ["Шалгах цэг", ["1) 2⁴ˣ = 2³ → x = 3/4", "2) t² − 3t + 2 = 0 → t = 1; 2 → x = 0; 1"]], ["I. Ажлын хуудас", ["№1: 32", "№2: 2⁻³", "№3: x + 3 = 3 → x = 0", "№4: x = −3", "№5: 2x = 3 → x = 3/2", "№6: x − 1 = 4 → x = 5", "№7: x² − x − 6 = 0 → x = 3; −2", "№8: (3/7)^(3x + 1) = (3/7)^(9 − 5x) → 3x + 1 = 9 − 5x → x = 1", "№9: 2ˣ = 32 = 2⁵ → 5 цаг", "№10: 7 (2⁷ = 128)"]], ["Багийн даалгавар", ["Шугаман тэнцэтгэл биш: сөрөг тоонд хуваахад тэмдэг эргэнэ.", "Гол холбоо: биквадрат, рационал, илтгэгч (орлуулга) тэгшитгэл бүгд квадрат тэгшитгэлд шилждэг; D = b² − 4ac.", "Хоёр хувьсагчтай: хагас хавтгай, шалгах цэг. Багуудын жишээг багш шалгана."]], ["II. Гэрийн даалгавар", ["№1: 3ˣ = 1 → x = 0", "№2: 2ˣ = 1 → x = 0", "№3: (2/3)ˣ = 1 → x = 0", "№4: t = 1; 9 → x = 0; 2", "№5: x = 0; x = 0"]], ["III. Гарах тасалбар", ["№1: x + 1 = 3 → x = 2 (шалгуур 1)", "№2: t = 1; 4 → x = 0; 2 (шалгуур 2)", "№3: y = 2ˣ, y = 3 − x; x = 1 (шалгуур 3)"]]], "F": ["a^{f(x)}=a^{g(x)}\\ \\Leftrightarrow\\ f(x)=g(x)", "2^{x}=8\\ \\Rightarrow\\ x=3"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></msup><mo>&#x0003D;</mo><msup><mi>a</mi><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></msup><mtext>&#x000A0;</mtext><mo>&#x021D4;</mo><mtext>&#x000A0;</mtext><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mi>x</mi></mrow></msup><mo>&#x0003D;</mo><mn>8</mn><mtext>&#x000A0;</mtext><mo>&#x021D2;</mo><mtext>&#x000A0;</mtext><mi>x</mi><mo>&#x0003D;</mo><mn>3</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-18"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-18"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Mozaik: «илтгэгч тэгшитгэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L18.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3</mn><mrow><mi>x</mi></mrow></msup><mo>&#x02212;</mo><mn>1</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mn>4</mn><mo>&#x000B7;</mo><msup><mn>2</mn><mrow><mi>x</mi></mrow></msup><mo>&#x0002B;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "x = 0; x = 0", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3</mn><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mi>x</mi><mo>&#x02212;</mo><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mn>81</mn></mrow></math>⟧", "x² − x − 6 = 0 → x = 3; −2", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>3</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msup><mo>&#x0003D;</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>5</mn><mi>x</mi><mo>&#x02212;</mo><mn>9</mn></mrow></msup></mrow></math>⟧", "3x + 1 = 9 − 5x → x = 1", "Олонлог 10, Дасгал 6 №1"]], "tb": [], "digital": true, "stype": "A", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Олон зам, нэг зорилго»:** Илтгэгч тэгшитгэлийг суурь тэнцүүлэх, орлуулах, графикаар — гурван аргаар бодож болно. Зорилгодоо хүрэх зам олон. Асуулт: «Нэг асуудлыг өөр аргаар шийдсэн тохиолдол надад байсан уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 8-ыг 2-ын зэргээр бич; 2) 1/27-г 3-ын зэргээр бич; 3) t² − 12t + 27 = 0", "**Холбоос (1 мин):** №1–3-т зэргийн чанар, №13-т y = aˣ графикийг үзсэн; өнөөдөр aˣ агуулсан тэгшитгэлийг 3 аргаар бодно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Бактери цаг тутам 2 дахин олширдог. 1 бактериас хэдэн цагийн дараа 32 болох вэ? 2ˣ = 32-ыг хэрхэн бодох вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** 1) Ижил суурь: a^f(x) = a^g(x) → f(x) = g(x) (a > 0, a ≠ 1). 2) Орлуулга: 9ˣ − 4·3ˣ⁺¹ + 27 = 0 → 3ˣ = t > 0 → t² − 12t + 27 = 0. 3) График: 2ˣ = 6 − x → y = 2ˣ ба y = 6 − x-ийн огтлолцлын x.", "   Санамж: aˣ > 0 тул t ≤ 0 шийдийг хаяна.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 3^(x² + 2x) = 3^(x + 6)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 9ˣ − 4·3ˣ⁺¹ + 27 = 0", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 2ˣ = 6 − x-ийг графикаар бод", "**3. Түгээмэл алдаа:** 2ˣ = 32-ыг x = 32 : 2 гэж бодох; суурийг тэнцүүлэлгүйгээр илтгэгчийг тэнцүүлэх (4ˣ = 8 → 2²ˣ = 2³ → x = 3/2); t < 0-ийг хаяхгүй байх.", "**4. Шалгах цэг (3 мин):** 1) 16ˣ = 8; 2) 4ˣ − 3·2ˣ + 2 = 0. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Оюуны зураглал (багаар)", ["**Оюуны зураглал (багаар):** «Тэгшитгэл, тэнцэтгэл биш» нэгжийн оюуны зураглал. А3 хуудасны төвд нэгжийн нэр, 5 салаа: шугаман тэнцэтгэл биш, квадрат тэгшитгэл, биквадрат ба рационал, хоёр хувьсагчтай тэнцэтгэл биш, илтгэгч тэгшитгэл. Салаа бүрт: тодорхойлолт, бодох алхам, өөрсдөө зохиож бодсон 1 жишээ, түгээмэл 1 алдаа. Сэдэв хоорондын холбоог сумаар зурна (жишээ: биквадрат → квадрат).", "**Бүтээгдэхүүн:** А3 оюуны зураглал", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "20": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн уралдаан", 16], ["VIII. Дүн гаргах, алдааг задлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хавтгайн тэгш өнцөгт координатын системд цэгийн байрлал, мөчийг тодорхойлох, тэнхлэг ба эх цэгийн хувьд тэгш хэмтэй цэгийг олох, газрын бүдүүвч зурагт хэрэглэх.", "crit": ["Би цэгийн мөчийг тэмдгээр нь тодорхойлж чадна.", "Би OX, OY, O-ийн хувьд тэгш хэмтэй цэгийг олж чадна.", "Би газрын бүдүүвч зураг дээр байршлыг координатаар тайлбарлаж чадна."], "words": "координатын хавтгай; абсцисс — x; ординат — y; мөч (I–IV); тэгш хэм.", "ex": [["(−6; 7) аль мөчид?", "II"], ["A(6; 4)-тэй OX-ийн хувьд тэгш хэмтэй цэг", "(6; −4)"], ["A(2; −3)-тай O цэгийн хувьд тэгш хэмтэй цэг", "(−2; 3)"]], "ck": [["A(−3; −7)-той OX-ийн хувьд тэгш хэмтэй цэг", "(−3; 7)"], ["(0; −4) аль мөчид?", "аль ч мөчид биш — OY тэнхлэг дээр"]], "ws": [["Сэргээх", ["Тооны шулуун дээр −4 ба 3-ын хоорондох зай", "B(−5; 0) цэг аль тэнхлэг дээр?"]], ["Дадлага 1", ["(7; −4) аль мөчид?", "(−2; −9) аль мөчид?"]], ["Дадлага 2", ["A(−4; 9)-тэй OY-ийн хувьд тэгш хэмтэй цэг", "B(5; −1)-тэй O-ийн хувьд тэгш хэмтэй цэг"]], ["★ Сорилт", ["A(a; 3) ба B(−5; b) нь OY-ийн хувьд тэгш хэмтэй. a, b?", "x < 0, y > 0 бол (x; y) аль мөчид? (−x; −y) аль мөчид?"]], ["Хэрэглээ", ["Бүдүүвч зураг: Арвайхээр (0; 0), 1 нэгж = 20 км, Хархорин (−1; 7). Хойд зүгт, баруун зүгт тус бүр хэдэн км вэ?"]], ["Код унших (сонголттой)", ["Гаралт:", "int x = -3, y = 2;", "if (x > 0 && y > 0) cout << \"I\"; else if (x < 0 && y > 0) cout << \"II\"; else cout << \"III/IV\";"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "(−3; 5), (4; −2), (0; 6) цэгүүд хаана байрлах вэ?", "A(−1; 5)-тай OX-ийн хувьд тэгш хэмтэй цэг", "A(4; −9)-тэй OY-ийн хувьд тэгш хэмтэй цэг", "Тэгш өнцөгтийн 3 орой (1; 1), (5; 1), (5; 4). 4 дэх орой", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ цэгийг тэмдэглэж, OX ба OY тэнхлэгийн хувьд тэгш хэмтэй цэгүүдийг бич __(Олонлог 10, Дасгал 9 №1-ийн өгөгдлөөр)__"], "quiz": ["(−7; −2) аль мөчид?", "A(3; −8)-тай O цэгийн хувьд тэгш хэмтэй цэг", "Хархорин (−1; 7) ба Хужирт (−2; 3)-ын аль нь Арвайхээрээс (0; 0) хойд зүгт хол вэ?"], "key": [["III. Суурь сэргээх", ["1) 5", "2) 3; −2", "3) II"]], ["Жишээ 1–3", ["Жишээ 1: II", "Жишээ 2: (6; −4)", "Жишээ 3: (−2; 3)"]], ["Шалгах цэг", ["1) (−3; 7)", "2) аль ч мөчид биш — OY тэнхлэг дээр"]], ["I. Ажлын хуудас", ["№1: 7", "№2: OX", "№3: IV", "№4: III", "№5: (4; 9)", "№6: (−5; 1)", "№7: a = 5, b = 3", "№8: II; IV", "№9: хойд 140 км, баруун 20 км", "№10: II"]], ["Багийн даалгавар", ["Хужирт (−2; 3), Хархорин (−1; 7) — II мөч.", "OY-ийн хувьд тэгш хэмтэй: (2; 3), (1; 7) — I мөч.", "Зөв хариу бүрт шатны оноо, засварласан хариуд хагас оноо."]], ["II. Гэрийн даалгавар", ["№1: II мөч; IV мөч; OY тэнхлэг дээр", "№2: (−1; −5)", "№3: (−4; −9)", "№4: (1; 4)", "№5: A: (−2; −4), (2; 4); B: (8; −6), (−8; 6)"]], ["III. Гарах тасалбар", ["№1: III (шалгуур 1)", "№2: (−3; 8) (шалгуур 2)", "№3: Хархорин (7 > 3) (шалгуур 3)"]]], "F": ["A(x;\\,y)", "\\text{OX}:\\ (x;\\,-y),\\quad \\text{OY}:\\ (-x;\\,y),\\quad O:\\ (-x;\\,-y)"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>OX</mtext><mi>:</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mtext>OY</mtext><mi>:</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>O</mi><mi>:</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-20"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-20"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «координатын систем» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L20.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ цэгийг тэмдэглэж, OX ба OY тэнхлэгийн хувьд тэгш хэмтэй цэгүүдийг бич", "A: (−2; −4), (2; 4); B: (8; −6), (−8; 6)", "Олонлог 10, Дасгал 9 №1-ийн өгөгдлөөр"]], "tb": [], "digital": false, "stype": "A", "mode": "уралдаан", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Байршлаа мэдэх»:** Цэгийн байрлалыг (x; y) хоёр тоо бүрэн тодорхойлдог. Хүн ч «Би одоо хаана байна, хаашаа явах вэ?» гэдгээ мэдэх хэрэгтэй. Асуулт: «Миний одоогийн түвшин ба 1 жилийн дараах зорилго юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) Тооны шулуун дээр −3 ба 2-ын хоорондох зай; 2) A(3; −2)-ын абсцисс ба ордиант; 3) (−4; 1) аль мөчид?", "**Холбоос (1 мин):** 6–8 дугаар ангид координатын хавтгайд цэг тэмдэглэхийг үзсэн; өнөөдөр тэгш хэм, газрын зурагтай холбоно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Өвөрхангайн бүдүүвч зураг дээр Арвайхээр эх цэг (0; 0), 1 нэгж = 20 км. Хархорин (−1; 7) хаана байх вэ, аль мөчид?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Цэг (x; y): x — абсцисс, y — ординат. Мөч: I (+; +), II (−; +), III (−; −), IV (+; −). Тэнхлэг дээрх цэг аль ч мөчид хамаарахгүй.", "   Тэгш хэм: OX-ийн хувьд (x; −y); OY-ийн хувьд (−x; y); O цэгийн хувьд (−x; −y).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): (−6; 7) аль мөчид?", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): A(6; 4)-тэй OX-ийн хувьд тэгш хэмтэй цэг", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): A(2; −3)-тай O цэгийн хувьд тэгш хэмтэй цэг", "**3. Түгээмэл алдаа:** Цэгийг (y; x) дарааллаар тэмдэглэх; (0; 5) зэрэг тэнхлэг дээрх цэгийг мөчид хамааруулах; OX ба OY тэгш хэмийг андуурах.", "**4. Шалгах цэг (3 мин):** 1) A(−3; −7)-той OX-ийн хувьд тэгш хэмтэй цэг; 2) (0; −4) аль мөчид?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн уралдаан", ["**Багийн уралдаан:** «Координатын уралдаан»: багш 3 шатны асуулт уншина, баг хариугаа самбар/цаасан дээр өргөнө. 1-р шат (1 оноо): 5 цэгийн мөч. 2-р шат (2 оноо): OX, OY, O-ийн хувьд тэгш хэмтэй цэг. 3-р шат (3 оноо): бүдүүвч зураг: Арвайхээр (0; 0), Хужирт (−2; 3), Хархорин (−1; 7), 1 нэгж = 20 км — зураг дээр тэмдэглэж, Хужирт ба Хархоринтой OY-ийн хувьд тэгш хэмтэй цэгийг олж, мөчийг хэлнэ.", "**Бүтээгдэхүүн:** Онооны самбар, тэмдэглэсэн бүдүүвч зураг", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Дүн гаргах, алдааг задлах", ["• Багуудын онооны самбарыг нэгтгэж, хамгийн олон алдсан даалгаврыг ангиар задлан шинжилнэ.", "• Баг бүр алдсан нэг даалгавраа засаж, засварын оноо авна (сайжруулалтыг урамшуулна)."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "21": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хавтгайн хоёр цэгийн хоорондох зай, хэрчмийн дундаж цэгийг томьёогоор олж, газрын зурагт масштабаар хэрэглэх.", "crit": ["Би хоёр цэгийн зайг томьёогоор олж чадна.", "Би хэрчмийн дундаж цэгийг олж чадна.", "Би газрын зурагт масштабаар бодит зайг тооцоолж чадна."], "words": "зай — хоёр цэгийн хоорондох урт; дундаж цэг; Пифагорын теорем; масштаб.", "ex": [["A(4; 4), B(7; 0) зай", "√(3² + (−4)²) = 5"], ["A(4; 4), B(7; 0) дундаж цэг", "(5,5; 2)"], ["A(−2; 4), B(8; 6) зай ба дундаж цэг", "√104 = 2√26 ≈ 10,2; M(3; 5)"]], "ck": [["A(−5; 3), B(3; −12) зай", "√(64 + 225) = 17"], ["A(−1; −4), B(−4; 1) дундаж цэг", "(−2,5; −1,5)"]], "ws": [["Сэргээх", ["Катет 5, 12 бол гипотенуз", "(−7 + 1)/2"]], ["Дадлага 1", ["A(0; 0), B(3; 4) зай", "A(2; 6), B(4; 8) дундаж цэг"]], ["Дадлага 2", ["A(−5; 1), B(4; −11) зай", "A(1; 4), B(−1; −6) дундаж цэг"]], ["★ Сорилт", ["M(3; 5) нь AB-ийн дундаж, A(1; 2). B-г ол.", "ABC-ийн AB, BC, AC талын дундаж цэгүүд M(−2; 3), N(5; −1), P(−4; −7). A, B, C-г ол."]], ["Хэрэглээ", ["Зураг: 1 нэгж = 100 м. Сургууль (−3; 2), гэр (3; 10). Шулуун зай хэдэн м вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "A(−2; 4), B(8; 6) зай", "A(−2; 4), B(8; 6) дундаж цэг", "A(−5; 1), B(−12; 25) зай", "A(0; 0), B(6; 0), C(0; 8) гурвалжны периметр", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧: хоёр цэгийн зай ба дундаж цэг __(Олонлог 10, Дасгал 9 №1)__"], "quiz": ["A(1; 1), B(4; 5) зай", "A(−3; 2), B(5; −6) дундаж цэг", "1 нэгж = 20 км. Хоёр хот (0; 0), (6; 8). Зай хэдэн км вэ?"], "key": [["III. Суурь сэргээх", ["1) 10", "2) 2", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: √(3² + (−4)²) = 5", "Жишээ 2: (5,5; 2)", "Жишээ 3: √104 = 2√26 ≈ 10,2; M(3; 5)"]], ["Шалгах цэг", ["1) √(64 + 225) = 17", "2) (−2,5; −1,5)"]], ["I. Ажлын хуудас", ["№1: 13", "№2: −3", "№3: 5", "№4: (3; 7)", "№5: √(81 + 144) = 15", "№6: (0; −1)", "№7: B(5; 8)", "№8: A(−11; −3), B(7; 9), C(3; −11)", "№9: √(36 + 64) = 10 нэгж = 1000 м"]], ["Багийн даалгавар", ["AB = √50 ≈ 7,07 → ≈ 141 км; AC = √13 ≈ 3,61 → ≈ 72 км; BC = √17 ≈ 4,12 → ≈ 82 км.", "AB-ийн дундаж (−0,5; 3,5): Арвайхээрээс ≈ 70 км.", "Периметр ≈ 295 км. Зам уул, гол тойрч явдаг тул шулуун зайнаас урт."]], ["II. Гэрийн даалгавар", ["№1: √104 = 2√26 ≈ 10,2", "№2: (3; 5)", "№3: √(49 + 576) = 25", "№4: 6 + 8 + 10 = 24", "№5: √104 = 2√26; (3; 5)"]], ["III. Гарах тасалбар", ["№1: 5 (шалгуур 1)", "№2: (1; −2) (шалгуур 2)", "№3: 10 нэгж = 200 км (шалгуур 3)"]]], "F": ["d=\\sqrt{(x_{2}-x_{1})^{2}+(y_{2}-y_{1})^{2}}", "M\\left(\\frac{x_{1}+x_{2}}{2};\\ \\frac{y_{1}+y_{2}}{2}\\right)"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>&#x0003D;</mo><msqrt><mrow><mo stretchy=\"false\">&#x00028;</mo><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mo stretchy=\"false\">&#x00028;</mo><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M</mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0002B;</mo><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mi>;</mi><mtext>&#x000A0;</mtext><mfrac><mrow><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0002B;</mo><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-21"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-21"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Хоёр цэгийн зай (видео)", "https://youtu.be/W4CHDN7l48E"], ["Mozaik: «хоёр цэгийн зай» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L21.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧: хоёр цэгийн зай ба дундаж цэг", "√104 = 2√26; (3; 5)", "Олонлог 10, Дасгал 9 №1"], ["Гурвалжны талуудын дундаж цэг ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>N</mi><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>P</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>4</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>7</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ бол оройнууд", "A(−11; −3), B(7; 9), C(3; −11)", "Олонлог 10, Дасгал 9 №2"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Дунд замаа олох»:** Хэрчмийн дундаж цэг хоёр төгсгөлөөс ижил зайтай. Маргаанд ч хоёр талыг сонсож «дунд цэг»-ийг олбол шударга. Асуулт: «Сүүлд хэнтэй буулт хийж тохиролцсон бэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) Катет 6 ба 8 бол гипотенуз; 2) (−3 + 7)/2; 3) √(9 + 16)", "**Холбоос (1 мин):** 8 дугаар ангид Пифагорын теорем, зай, дундаж цэгийг үзсэн (Олонлог 8, х. 6–7); өнөөдөр бодлогод хэрэглэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Бүдүүвч зураг дээр Арвайхээр (0; 0), Хархорин (−1; 7), 1 нэгж = 20 км. Шулуун зай хэд вэ? Хаана «тал хүрэх» вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** AB = √((x₂ − x₁)² + (y₂ − y₁)²): хэвтээ ба босоо зөрүү нь катет, AB нь гипотенуз. Дундаж цэг M((x₁ + x₂)/2; (y₁ + y₂)/2).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): A(4; 4), B(7; 0) зай", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): A(4; 4), B(7; 0) дундаж цэг", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): A(−2; 4), B(8; 6) зай ба дундаж цэг", "**3. Түгээмэл алдаа:** Ялгаврыг квадрат зэрэгт дэвшүүлэхээ мартах; ялгаврын оронд нийлбэр авах; дундаж цэгт 2-т хуваахаа мартах.", "**4. Шалгах цэг (3 мин):** 1) A(−5; 3), B(3; −12) зай; 2) A(−1; −4), B(−4; 1) дундаж цэг. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Тал хүрэх газар»: бүдүүвч зураг (1 нэгж = 20 км): Арвайхээр A(0; 0), Хархорин B(−1; 7), Хужирт C(−2; 3). 1) AB, AC, BC зайг км-ээр ол. 2) AB-ийн дундаж цэгийг олж, бодит зайгаар тайлбарла. 3) ABC гурвалжны периметр. 4) Замын бодит урт шулуун зайнаас яагаад урт байдаг вэ?", "**Бүтээгдэхүүн:** Тооцоо ба тайлбар бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "22": {"stages": [["I. Зохион байгуулалт, аюулгүй байдал", 3], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 5], ["IV. Даалгавар ба хэмжих арга (ангид)", 8], ["V. Хээрийн хэмжилт (сургуулийн талбайд)", 30], ["VI. Ангидаа тооцоолох", 15], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 10], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хоёр цэгээр шулууны налалтыг олж, цэг ба налалтаар, хоёр цэгээр шулууны тэгшитгэл бичих, параллель ба перпендикуляр шулууныг таних, замын налуугийн бодлогод хэрэглэх.", "crit": ["Би хоёр цэгээр шулууны налалтыг олж чадна.", "Би хоёр цэгийг дайрсан шулууны тэгшитгэлийг бичиж чадна.", "Би налалтыг замын налуутай холбож тайлбарлаж чадна."], "words": "налалт k = (y₂ − y₁)/(x₂ − x₁); шулууны тэгшитгэл y = kx + b; параллель — k ижил; перпендикуляр — k₁·k₂ = −1.", "ex": [["A(−2; 1), B(3; 4)-ийн налалт", "3/5"], ["A(5; −2)-ыг дайрсан k = −3 шулуун", "y + 2 = −3(x − 5) → y = −3x + 13"], ["A(−3; 4), B(7; −6)-г дайрсан шулуун", "k = −10/10 = −1; y − 4 = −(x + 3) → y = −x + 1"]], "ck": [["A(0; −3), B(−3; −1)-ийн налалт", "2/(−3) = −2/3"], ["A(1; 2), B(3; 6)-г дайрсан шулуун", "k = 2; y = 2x"]], "ws": [["Сэргээх", ["y = −2x + 5-ын налалт", "(−1 − 5)/(4 − 1)"]], ["Дадлага 1", ["A(1; −5), B(4; −11)-ийн налалт", "Налалт 2, b = −3 шулууны тэгшитгэл"]], ["Дадлага 2", ["(−2; 6)-г дайрсан k = 3 шулуун", "A(−4; 3), B(−5; −2)-ыг дайрсан шулуун"]], ["★ Сорилт", ["y = 2x + 1-тэй параллель, (1; 4)-ийг дайрсан шулуун", "y = 2x + 1-тэй перпендикуляр, (0; 3)-ыг дайрсан шулуун"]], ["Хэрэглээ", ["Зам 100 м хэвтээ явахад 10 м өгсдөг. Налалт ба налуу хувиар"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "A(−2; 4), B(8; 6)-ийн налалт", "A(−2; 4), B(8; 6)-г дайрсан шулуун", "k = 1/3, A(0; −1)-ийг дайрсан шулуун", "A(2; 7), B(6; −1)-ийн налалт ба шулуун", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-г дайрсан шулууны налалт ба тэгшитгэл __(Олонлог 10, Дасгал 9 №1)__"], "quiz": ["A(−3; −5), B(−1; −8)-ийн налалт", "A(2; 1), B(4; 5)-ыг дайрсан шулууны тэгшитгэл", "Нэг замын налалт 0,06, нөгөөгийнх −0,09. Аль нь илүү эгц, аль нь уруу вэ?"], "key": [["III. Суурь сэргээх", ["1) 3; −2", "2) 2", "3) 7"]], ["Жишээ 1–3", ["Жишээ 1: 3/5", "Жишээ 2: y + 2 = −3(x − 5) → y = −3x + 13", "Жишээ 3: k = −10/10 = −1; y − 4 = −(x + 3) → y = −x + 1"]], ["Шалгах цэг", ["1) 2/(−3) = −2/3", "2) k = 2; y = 2x"]], ["I. Ажлын хуудас", ["№1: −2", "№2: −2", "№3: −6/3 = −2", "№4: y = 2x − 3", "№5: y − 6 = 3(x + 2) → y = 3x + 12", "№6: k = 5; y = 5x + 23", "№7: y = 2x + 2", "№8: k = −1/2: y = −1/2·x + 3", "№9: 0,1 = 10%"]], ["Багийн даалгавар", ["Хариу хэмжилтээс хамаарна. Жишээ: x = 6 м, y = 0,6 м → k = 0,1 = 10% > 8% → пандус эгц, уртасгах шаардлагатай.", "Тэгшитгэл: y = kx (эхлэл (0; 0)).", "Шат: гишгүүрийн өндөр 15 см, гүн 25 см → k = 0,6 (60%) — тэргэнцэрт тохиромжгүй, тиймээс пандус хэрэгтэй."]], ["II. Гэрийн даалгавар", ["№1: 2/10 = 1/5", "№2: y = 1/5·x + 22/5", "№3: y = 1/3·x − 1", "№4: k = −2; y = −2x + 11", "№5: k = 1/5; y = x/5 + 22/5"]], ["III. Гарах тасалбар", ["№1: −3/2 (шалгуур 1)", "№2: k = 2; y = 2x − 3 (шалгуур 2)", "№3: −0,09 нь илүү эгц бөгөөд уруу (шалгуур 3)"]]], "F": ["k=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}", "y-y_{1}=k(x-x_{1})", "k_{1}=k_{2}\\ (\\parallel),\\quad k_{1}k_{2}=-1\\ (\\perp)"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k</mi><mo>&#x0003D;</mo><mfrac><mrow><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><mi>k</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>k</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>k</mi><mrow><mn>2</mn></mrow></msub><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02225;</mo><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>k</mi><mrow><mn>1</mn></mrow></msub><msub><mi>k</mi><mrow><mn>2</mn></mrow></msub><mo>&#x0003D;</mo><mo>&#x02212;</mo><mn>1</mn><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>&#x027C2;</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-22"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-22"], ["PhET «Graphing Lines»", "https://phet.colorado.edu/en/simulations/graphing-lines"], ["Шулууны өнцгийн коэффициент (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/126"], ["Mozaik: «шулууны тэгшитгэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L22.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>8</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-г дайрсан шулууны налалт ба тэгшитгэл", "k = 1/5; y = x/5 + 22/5", "Олонлог 10, Дасгал 9 №1"], ["Налалт ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m</mi><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mn>0</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ийг дайрсан шулууны ерөнхий тэгшитгэл", "x + 3y + 3 = 0", "Олонлог 10, Дасгал 9 №3"]], "tb": [], "digital": false, "stype": "F", "mode": "баг", "teach": [["I. Зохион байгуулалт, аюулгүй байдал", ["• Ирц бүртгэж, баг бүрдүүлнэ.", "**Аюулгүй байдал:** замын хөдөлгөөнөөс хол, багшийн харах хүрээнд ажиллах; багаж (метр, туузан хэмжүүр)-ийг зөв барих; цагийн дохиогоор цуглах."]], ["II. Ёс зүйн 1 минут", ["**«Тогтмол өгсөлт»:** Налалт нь «1 алхам урагшлахад хэр өгсөх вэ» гэдгийг заадаг. Сурлагад ч өдөр бүр бага ч гэсэн тогтмол өгсөх нь чухал. Асуулт: «Миний сурлагын «налалт» эерэг үү?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (2 мин):** 1) y = 3x − 2-ын налалт ба b; 2) (6 − 2)/(4 − 2); 3) y = 2x + 1-д x = 3", "**Холбоос (1 мин):** 8 дугаар ангид шулууны өнцгийн коэффициентийг үзсэн (Олонлог 8, х. 6); өнөөдөр хоёр цэгээр шулууны тэгшитгэл бичнэ."]], ["IV. Даалгавар ба хэмжих арга (ангид)", ["**Асуудал:** Давааны зам 100 м хэвтээ явахад 8 м өгсдөг. Энэ налууг тоогоор хэрхэн илэрхийлэх вэ? Замын шугамын тэгшитгэлийг бичиж болох уу?", "**Гол санаа:** k = (y₂ − y₁)/(x₂ − x₁). (x₁; y₁)-ийг дайрсан k налалттай шулуун: y − y₁ = k(x − x₁). Хоёр цэгээр: эхлээд k-г олоод орлуулна.", "   k > 0 — өсөх, k < 0 — буурах, k = 0 — хэвтээ. Параллель: k₁ = k₂; перпендикуляр: k₁·k₂ = −1.", "**Жишээ:** A(−2; 1), B(3; 4)-ийн налалт → 3/5", "• Хэмжилтийн хүснэгт, хэмжих дарааллыг тайлбарлана."]], ["V. Хээрийн хэмжилт (сургуулийн талбайд)", ["**Багийн гүйцэтгэлийн даалгавар:** «Сургуулийн пандус ба шат»: баг бүр нэг объект авна — 1) орох хаалганы пандус, 2) шат, 3) спорт талбайн налуу, 4) сургуулийн хашааны налуу зам (аюулгүй хэсэг). Хэвтээ урт x ба өндөр y-ийг туузан хэмжүүрээр 2 удаа хэмжиж дундажлана. Ангидаа: 1) налалт k = y/x ба налууг хувиар ол; 2) объектыг эхлэл нь (0; 0) шулуунаар дүрсэлж, тэгшитгэлийг бич; 3) пандусыг 8%-ийн жишигтэй харьцуулж, сургуульд нэг зөвлөмж бич.", "**Бүтээгдэхүүн:** Хэмжилтийн хүснэгт, бүдүүвч зураг, тооцоо, зөвлөмж (А3)", "**Нэгж 5-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна.", "• Хэмжилт бүрийг 2 удаа хийж дунджийг авна (хэмжилтийн алдааг багасгах)."]], ["VI. Ангидаа тооцоолох", ["• Багууд хэмжилтээ ашиглан тооцоо хийнэ.", "• Багш баг бүрийн тооцооны алхмыг шалгаж, алдааг асуултаар чиглүүлнэ.", "**Шалгах цэг:** 1) A(0; −3), B(−3; −1)-ийн налалт; 2) A(1; 2), B(3; 6)-г дайрсан шулуун"]], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "23": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: шулууны ерөнхий тэгшитгэл, тойргийн тэгшитгэл", 28], ["V. Хосын гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Хос солилцож шалгах, сайжруулах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Шулууны ерөнхий тэгшитгэлийг налалттай хэлбэрт шилжүүлж налалтыг олох, координатын эх дээр төвтэй тойргийн тэгшитгэлийг зайн томьёогоор гаргаж, цэгийн байрлалыг шалгах.", "crit": ["Би ax + by + c = 0-ээс налалтыг олж чадна.", "Би O төвтэй тойргийн тэгшитгэлийг бичиж, радиусыг олж чадна.", "Би цэг тойрог дотор, дээр, гадна байгааг шалгаж, хүрээний бодлогод хэрэглэж чадна."], "words": "ерөнхий тэгшитгэл — ax + by + c = 0; налалт k = −a/b; тойрог — x² + y² = r²; радиус.", "ex": [["5x + 2y + 8 = 0-ийн налалт", "y = −5/2·x − 4 → k = −5/2"], ["Төв нь O, радиус √23 тойргийн тэгшитгэл", "x² + y² = 23"], ["4x² + 4y² = 5 тойргийн радиус", "x² + y² = 5/4 → r = √5/2"]], "ck": [["3x − 2y − 3 = 0-ийн налалт", "3/2"], ["(8; 15) цэг x² + y² = 289 тойрог дээр байх уу?", "64 + 225 = 289 → тийм"]], "ws": [["Сэргээх", ["√9 ба √49", "y = 2x − 5-ыг ax + by + c = 0 хэлбэрт бич"]], ["Дадлага 1", ["x² + y² = 36 тойргийн радиус", "Төв нь O, радиус 7 тойргийн тэгшитгэл"]], ["Дадлага 2", ["(3; 4) цэг x² + y² = 25 дээр оршдог уу?", "4x + 5y − 10 = 0-ийн налалт"]], ["★ Сорилт", ["Төв нь O, A(−6; 8)-ыг дайрсан тойргийн тэгшитгэл", "5x² + 5y² − 20 = 0 тойргийн радиус"]], ["Хэрэглээ", ["Цамхгийн хүрээ x² + y² ≤ 25 (км). (3; 4) ба (6; 1) цэгт дохио хүрэх үү?"]], ["Код унших (сонголттой)", ["Гаралт (1 — тойрог дотор/дээр):", "int x = 3, y = 4, r = 5;", "cout << (x*x + y*y <= r*r);"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "x² + y² = 81 тойргийн радиус", "(5; 12) цэг x² + y² = 169 дээр оршдог уу?", "2x + 3y − 6 = 0-ийн налалт ба OY огтлох цэг", "Төв нь O, A(1; −2)-ыг дайрсан тойрог", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>O</mi><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ төвтэй, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ыг дайрсан тойрог __(Олонлог 10, Дасгал 9 №4)__"], "quiz": ["x² + y² = 49 тойргийн радиус", "6x − 3y + 1 = 0-ийн налалт", "Цамхгийн хүрээ 10 км. (6; 8) цэг хүрээнд байх уу?"], "key": [["III. Суурь сэргээх", ["1) 3x + y − 13 = 0", "2) 100", "3) √5/2"]], ["Жишээ 1–3", ["Жишээ 1: y = −5/2·x − 4 → k = −5/2", "Жишээ 2: x² + y² = 23", "Жишээ 3: x² + y² = 5/4 → r = √5/2"]], ["Шалгах цэг", ["1) 3/2", "2) 64 + 225 = 289 → тийм"]], ["I. Ажлын хуудас", ["№1: 3; 7", "№2: 2x − y − 5 = 0", "№3: 6", "№4: x² + y² = 49", "№5: 9 + 16 = 25 → тийм", "№6: −4/5", "№7: r² = 100: x² + y² = 100", "№8: x² + y² = 4 → r = 2", "№9: (3; 4): 25 → хил дээр, хүрнэ; (6; 1): 37 > 25 → хүрэхгүй", "№10: 1 (9 + 16 = 25 ≤ 25)"]], ["Багийн даалгавар", ["x² + y² = 900.", "A: 900 → тойрог дээр; B: 1025 > 900 → гадна; C: 900 → дээр; D: 882 < 900 → дотор.", "AC: k = 54/18 = 3; y = 3x − 30 → 3x − y − 30 = 0."]], ["II. Гэрийн даалгавар", ["№1: 9", "№2: 25 + 144 = 169 → тийм", "№3: k = −2/3; (0; 2)", "№4: x² + y² = 5", "№5: (x − 2)² + y² = 13"]], ["III. Гарах тасалбар", ["№1: 7 (шалгуур 1)", "№2: 2 (шалгуур 2)", "№3: 36 + 64 = 100 → хил дээр, хүрнэ (шалгуур 3)"]]], "F": ["Ax+By+C=0", "x^{2}+y^{2}=r^{2}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mi>x</mi><mo>&#x0002B;</mo><mi>B</mi><mi>y</mi><mo>&#x0002B;</mo><mi>C</mi><mo>&#x0003D;</mo><mn>0</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><msup><mi>r</mi><mrow><mn>2</mn></mrow></msup></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-23"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-23"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Mozaik: «тойргийн тэгшитгэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L23.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>O</mi><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ төвтэй, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ыг дайрсан тойрог", "(x − 2)² + y² = 13", "Олонлог 10, Дасгал 9 №4"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧; AB диаметртэй тойрог", "x² + (y − 3)² = 13", "Олонлог 10, Дасгал 9 №5"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn><mi>x</mi><mo>&#x0002B;</mo><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧-ийн төв, радиус", "(x − 2)² + y² = 4: төв (2; 0), r = 2", "Олонлог 10, Дасгал 9 №6"]], "tb": [], "digital": true, "stype": "B", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Нөлөөллийн хүрээ»:** x² + y² = r² тойрог — төвөөсөө ижил зайтай цэгүүд. Хүн бүр эргэн тойрондоо нөлөөллийн хүрээтэй: бидний үг, үйлдэл бусдад нөлөөлдөг. Асуулт: «Би ангидаа ямар эерэг нөлөө үзүүлж чадах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) y = −3x + 13-ыг ax + by + c = 0 хэлбэрт бич; 2) 6² + 8²; 3) √(5/4)", "**Холбоос (1 мин):** №21-д хоёр цэгийн зай, №22-т шулууны тэгшитгэлийг үзсэн; өнөөдөр зайн томьёогоор тойргийн тэгшитгэлийг гаргана."]], ["IV. Самбарын тайлбар: шулууны ерөнхий тэгшитгэл, тойргийн тэгшитгэл", ["**Асуудал:** Цамхаг (0; 0)-д байрлах ба 30 км хүрээнд дохио хүрдэг. (18; 24) км цэгт байгаа айлд дохио хүрэх үү?", "**1. Гол санаа (самбарт):** Шулууны ерөнхий тэгшитгэл ax + by + c = 0. b ≠ 0 үед y = −(a/b)x − c/b, тиймээс k = −a/b. x = a — босоо, y = b — хэвтээ шулуун.", "   Тойрог: (x; y)-ээс O(0; 0) хүртэлх зай r → √(x² + y²) = r → x² + y² = r². Цэг тойрог дээр: x² + y² = r²; дотор: < r²; гадна: > r².", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 5x + 2y + 8 = 0-ийн налалт", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Төв нь O, радиус √23 тойргийн тэгшитгэл", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 4x² + 4y² = 5 тойргийн радиус", "**3. Түгээмэл алдаа:** x² + y² = 16-ийн радиусыг 16 гэх (r = 4); ax + by + c = 0-ээс налалтыг a гэж авах (k = −a/b); x = 2 шулууныг хэвтээ гэх.", "**4. Шалгах цэг (3 мин):** 1) 3x − 2y − 3 = 0-ийн налалт; 2) (8; 15) цэг x² + y² = 289 тойрог дээр байх уу?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Цамхгийн хүрээ»: цамхаг O(0; 0), хүрээ 30 км. Айлууд (км): A(18; 24), B(−20; 25), C(0; −30), D(21; −21). 1) Хүрээний тойргийн тэгшитгэлийг бич. 2) Айл бүр хүрээн дотор, тойрог дээр, гадна байгааг шалга. 3) A ба C-г холбосон замын шулууны ерөнхий тэгшитгэлийг бич.", "**Бүтээгдэхүүн:** Шалгалтын хүснэгт ба тэгшитгэлүүд бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "24": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: векторын үйлдэл (зургаар)", 28], ["V. Багийн гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Векторыг нэмэх (гурвалжин, параллелограммын дүрэм), хасах, тоогоор үржүүлэх үйлдлийг зургаар гүйцэтгэж, коллинеар векторыг таних, хурд, хүчний бодлогод хэрэглэх.", "crit": ["Би AB⃗ + BC⃗ + CD⃗ зэргийг дүрмээр хялбарчилж чадна.", "Би векторын нийлбэр, ялгаврыг зургаар байгуулж, коллинеар эсэхийг тогтоож чадна.", "Би хурдны нийлбэрийг вектороор олж, тайлбарлаж чадна."], "words": "вектор — хэмжээ ба чиглэлтэй хэрчим; гурвалжны дүрэм; параллелограммын дүрэм; эсрэг вектор; коллинеар — параллель вектор.", "ex": [["AB⃗ + BC⃗ + CD⃗", "AD⃗"], ["AC⃗ − BC⃗", "AC⃗ + CB⃗ = AB⃗"], ["a⃗(2; −1), b⃗(−6; 3) коллинеар уу?", "b⃗ = −3a⃗ → тийм, эсрэг чиглэлтэй"]], "ck": [["AB⃗ − AC⃗", "CB⃗"], ["PQ⃗ + QR⃗ + RS⃗ + ST⃗ + TP⃗", "0⃗"]], "ws": [["Сэргээх", ["Масс, хурд, урт, хүчийг вектор ба скаляр гэж ангил", "|−5| + |3|"]], ["Дадлага 1", ["AB⃗ + BA⃗", "MN⃗ + NK⃗"]], ["Дадлага 2", ["AB⃗ + BC⃗ − AC⃗", "a⃗(2; 2) бол −2a⃗-ийн координат"]], ["★ Сорилт", ["ABCD параллелограмм. AB⃗ + AD⃗ = ?", "a⃗(4; 3) ба b⃗(12; 9) коллинеар уу? k хэд вэ?"]], ["Хэрэглээ", ["Сурагч зүүн тийш 300 м, дараа нь хойш 400 м алхав. Эхлэлээс хэдэн м зайд байна вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "PQ⃗ + QR⃗ + RS⃗", "AD⃗ − AB⃗", "a⃗(1; 3), b⃗(−2; −6) коллинеар уу?", "Завины өөрийн хурд 8 км/ц, урсгал 2 км/ц. Урсгал дагуу ба сөрж явах хурд", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>P</mi><mi>Q</mi></mrow><mo>&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>Q</mi><mi>R</mi></mrow><mo>&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>R</mi><mi>S</mi></mrow><mo>&#x02192;</mo></mover></mrow></math>⟧ __(Олонлог 10, Дасгал 11 №1)__"], "quiz": ["AB⃗ + BC⃗ + CA⃗", "a⃗(−5; −1) бол 3a⃗", "Дрон 40 км/ц, түүнд перпендикуляр салхи 30 км/ц. Бодит хурд"], "key": [["III. Суурь сэргээх", ["1) хүч, хурд", "2) 5", "3) 12"]], ["Жишээ 1–3", ["Жишээ 1: AD⃗", "Жишээ 2: AC⃗ + CB⃗ = AB⃗", "Жишээ 3: b⃗ = −3a⃗ → тийм, эсрэг чиглэлтэй"]], ["Шалгах цэг", ["1) CB⃗", "2) 0⃗"]], ["I. Ажлын хуудас", ["№1: вектор: хурд, хүч; скаляр: масс, урт", "№2: 8", "№3: 0⃗", "№4: MK⃗", "№5: 0⃗", "№6: (−4; −4)", "№7: AC⃗", "№8: b⃗ = 3a⃗ → тийм, k = 3", "№9: √(300² + 400²) = 500 м"]], ["Багийн даалгавар", ["|a⃗ + b⃗| = √(40² + 30²) = 50 км/ц, хойд-баруун зүг рүү.", "Салхи зүүн тийш бол мөн 50 км/ц, хойд-зүүн зүг рүү.", "2b⃗: √(40² + 60²) = √5200 ≈ 72,1 км/ц, баруун тийш илүү хазайна."]], ["II. Гэрийн даалгавар", ["№1: PS⃗", "№2: BD⃗", "№3: b⃗ = −2a⃗ → тийм", "№4: 10 км/ц; 6 км/ц", "№5: PS⃗"]], ["III. Гарах тасалбар", ["№1: 0⃗ (шалгуур 1)", "№2: (−15; −3) (шалгуур 2)", "№3: 50 км/ц (шалгуур 3)"]]], "F": ["\\vec{a}+\\vec{b}=\\vec{b}+\\vec{a}", "\\vec{b}=k\\vec{a}\\ \\Rightarrow\\ \\vec{a}\\parallel\\vec{b}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mro
