) = −1/(x + 1); x ≠ ±1", "№6: (x² + 4)/(x(x + 2)); x ≠ 0, x ≠ −2", "№7: (2a − 5)/((a − 2)(a − 3)); a ≠ 2, a ≠ 3", "№8: x = y = 1 үед 2 ≠ 1; зөв нь (x + y)/(xy)", "№9: 1/R = 1/3 + 1/6 = 1/2 → R = 2 Ом"]], ["Багийн даалгавар", ["1/x + 1/(x + 3) = (2x + 3)/(x(x + 3)).", "x = 6: 15/54 = 5/18; хамтдаа 18/5 = 3,6 цагт дүүргэнэ.", "Хоёуланд урвуу утгууд нэмэгддэг тул бүтэц нь ижил."]], ["II. Гэрийн даалгавар", ["№1: (15y − 14x)/(36xy)", "№2: a + b; a ≠ b", "№3: (2a − 6)/((a − 4)(a − 2))", "№4: (3 − (x − 4))/(x² − 16) = (7 − x)/(x² − 16)", "№5: 2/y; 2/a²"]], ["III. Гарах тасалбар", ["№1: 12/(x² − 36); x ≠ ±6 (шалгуур 1)", "№2: (2 + x − 2)/(x² − 4) = x/(x² − 4); x ≠ ±2 (шалгуур 2)", "№3: 1/3 + 1/6 = 1/2 → 2 цаг (шалгуур 3)"]]], "F": ["\\frac{a}{b}\\pm\\frac{c}{d}=\\frac{ad\\pm bc}{bd}", "\\frac{1}{x-1}-\\frac{1}{x+1}=\\frac{2}{x^{2}-1}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mi>&#x000B1;</mi><mfrac><mrow><mi>c</mi></mrow><mrow><mi>d</mi></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>a</mi><mi>d</mi><mi>&#x000B1;</mi><mi>b</mi><mi>c</mi></mrow><mrow><mi>b</mi><mi>d</mi></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>1</mn></mrow></mfrac><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>1</mn></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-9"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-9"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «алгебрын бутархай» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L09.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn><mi>y</mi></mrow></mfrac><mo>&#x0002B;</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn><mi>y</mi></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></math>⟧", "2/y; 2/a²", "Олонлог 10, Дасгал 4 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>a</mi><mo>&#x02212;</mo><mi>b</mi></mrow></mfrac><mo>&#x02212;</mo><mfrac><mrow><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>a</mi><mo>&#x02212;</mo><mi>b</mi></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></mfrac><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></mfrac></mrow></math>⟧", "a + b; y − 1", "Олонлог 10, Дасгал 4 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi><mo>&#x02212;</mo><mn>2</mn></mrow></mfrac><mo>&#x0002B;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧", "(2a − 5)/((a − 2)(a − 3))", "Олонлог 10, Дасгал 4 №8"]], "tb": [], "digital": true, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Нийтлэг суурь олох»:** Ялгаатай хуваарьтай бутархайг нэмэхийн тулд ерөнхий хуваарь (ХБЕХ) олдог. Хүмүүсийн санал зөрөхөд ч нийтлэг суурь хайвал тохиролцоонд хүрнэ. Асуулт: «Манай багийн нийтлэг зорилго юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3/4 − 2/3; 2) ХБЕХ(6; 8); 3) x² − 9-ийг задал", "**Холбоос (1 мин):** 6 дугаар ангийн «ерөнхий хуваарь = ХБЕХ» дүрэм: алгебрын бутархайд хуваариудыг задалж ХБЕХ-ийг олно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Нэг хүн хонины сүргийг x цагт, нөгөө нь (x + 2) цагт хяргадаг. Хамтдаа 1 цагт сүргийн ямар хэсгийг хяргах вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** 1) Хуваарь бүрийг задална. 2) Ерөнхий хуваарь = бүх өөр үржигдэхүүний үржвэр (ХБЕХ). 3) Нэмэлт үржигдэхүүнээр хүртвэрийг үржүүлж нэмнэ, хасна. 4) Хариуг хурааж, хуваарь ≠ 0 нөхцөлийг бичнэ.", "   Жишээ: x² − 4 = (x − 2)(x + 2) ба x + 2 бол ерөнхий хуваарь (x − 2)(x + 2).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 1/(x − 3) + 1/(x + 3)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 4/(x² − 4) − 1/(x + 2)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x/(x − 5) − 5/(x − 5)", "**3. Түгээмэл алдаа:** 1/2 + 1/3 = 2/5 гэж хүртвэр, хуваарийг шууд нэмэх; хасахын өмнөх хаалтыг задлахад тэмдэг өөрчлөхгүй байх: −(x − 2) = −x + 2.", "**4. Шалгах цэг (3 мин):** 1) 1/(x − 5) − 1/(x + 5); 2) 3/(x² − 9) + 1/(x − 3). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Хамтын ажил»: Худгийн нэг насос савыг x цагт, нөгөө нь (x + 3) цагт дүүргэдэг. 1) Хоёулаа 1 цагт савны ямар хэсгийг дүүргэхийг нэг бутархайгаар илэрхийл. 2) x = 6 үед утгыг ол. 3) Хамтдаа хэдэн цагт дүүргэх вэ? 4) 1/R = 1/R₁ + 1/R₂ томьёотой төстэй болохыг тайлбарла.", "**Бүтээгдэхүүн:** Бодолт ба тайлбар бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "10": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Функц, түүний тодорхойлогдох муж, утгын муж, дүрийн ойлголтыг томьёо, хүснэгт, график, бодит нөхцөлөөр гүнзгийрүүлж, мужийг олох, утгыг тооцоолох.", "crit": ["Би √(x + 2), 1/(x − 3) зэрэг функцийн тодорхойлогдох мужийг олж чадна.", "Би f(−2) зэрэг утгыг зөв тооцоолж чадна.", "Би бодит нөхцөлд D ба E-г тайлбарлаж чадна."], "words": "функц — x бүрт ганц y; тодорхойлогдох муж D — x-ийн утгууд; утгын муж E — y-ийн утгууд; дүр.", "ex": [["f(x) = √(x + 3)-ийн D(f)", "x + 3 ≥ 0 → x ≥ −3"], ["f(x) = 1/(x − 2) + √x-ийн D(f)", "x ≥ 0 ба x ≠ 2"], ["f(x) = x² + 4-ийн E(f)", "x² ≥ 0 тул y ≥ 4"]], "ck": [["f(x) = 5/(x + 1)-ийн D(f)", "x ≠ −1"], ["f(x) = 2x − 1, D = {0; 1; 2} бол дүр", "{−1; 1; 3}"]], "ws": [["Сэргээх", ["y = −2x + 5-д x = 3 үеийн y", "(−3)² − 4"]], ["Дадлага 1", ["f(x) = √(x − 5)-ийн D(f)", "f(x) = 1/(x − 3)-ийн D(f)"]], ["Дадлага 2", ["f(x) = x² + 2x + 1 бол f(−1) ба f(2)", "f(x) = (x − 1)² + 2-ийн E(f)"]], ["★ Сорилт", ["f(x) = √(4 − x) + 1/x-ийн D(f)", "f(x) = 3x − 2, D = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ бол E(f)"]], ["Хэрэглээ", ["Утасны багц: сард 15 000₮ суурь, 1 GB тутам 2 000₮. y-ийг x-ээр илэрхийлж, D ба E-г тайлбарла."]], ["Код унших (сонголттой)", ["Гаралт:", "double f(double x) { return x*x + 5*x - 2; }", "cout << f(2);"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "f(x) = √(5x + 1)-ийн D(f)", "f(x) = 4/(x − 3) бол f(−1)", "f(x) = x² − 3-ийн E(f)", "f(x) = 5x + 1, g(x) = 4/(x − 3) бол f(1) + g(−1)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>5</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002B;</mo><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ __(Олонлог 10, Дасгал 5 №2)__"], "quiz": ["f(x) = √(x + 2)-ийн D(f)", "f(x) = x² − 4x бол f(−2)", "Такси: y = 1200x + 3000. Төлбөр 2000₮ байж болох уу? Яагаад?"], "key": [["III. Суурь сэргээх", ["1) −7", "2) II мөч", "3) 16 + 8 = 24"]], ["Жишээ 1–3", ["Жишээ 1: x + 3 ≥ 0 → x ≥ −3", "Жишээ 2: x ≥ 0 ба x ≠ 2", "Жишээ 3: x² ≥ 0 тул y ≥ 4"]], ["Шалгах цэг", ["1) x ≠ −1", "2) {−1; 1; 3}"]], ["I. Ажлын хуудас", ["№1: −1", "№2: 5", "№3: x ≥ 5", "№4: x ≠ 3", "№5: 0 ба 9", "№6: y ≥ 2", "№7: x ≤ 4, x ≠ 0", "№8: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd></mtr><mtr><mtd><mn>10</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "№9: y = 2000x + 15 000; x ≥ 0; y ≥ 15 000", "№10: 12"]], ["Багийн даалгавар", ["1-р станц: 6 − 2x ≥ 0 → x ≤ 3; x² − 9 ≠ 0 → x ≠ ±3.", "2-р станц: 3000; 5400; 9000; 15 000₮. D: x ≥ 0 (зай сөрөг биш), E: y ≥ 3000.", "3-р станц: парабол, шулуун — функц; тойрог, x = y² — функц биш."]], ["II. Гэрийн даалгавар", ["№1: x ≥ −1/5", "№2: −1", "№3: y ≥ −3", "№4: 6 + (−1) = 5", "№5: 6 + (−1) = 5"]], ["III. Гарах тасалбар", ["№1: x ≥ −2 (шалгуур 1)", "№2: 4 + 8 = 12 (шалгуур 2)", "№3: Үгүй: x ≥ 0 тул y ≥ 3000 (шалгуур 3)"]]], "F": ["y=f(x):\\ x\\ \\text{бүрт ганц}\\ y", "f(x)=\\sqrt{x-2}\\ \\Rightarrow\\ D(f):\\ x\\ge 2", "f(x)=\\frac{1}{x-3}\\ \\Rightarrow\\ x\\ne 3"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mi>:</mi><mtext>&#x000A0;</mtext><mi>x</mi><mtext>&#x000A0;</mtext><mtext>бүрт&#x000A0;ганц</mtext><mtext>&#x000A0;</mtext><mi>y</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><msqrt><mrow><mi>x</mi><mo>&#x02212;</mo><mn>2</mn></mrow></msqrt><mtext>&#x000A0;</mtext><mo>&#x021D2;</mo><mtext>&#x000A0;</mtext><mi>D</mi><mo stretchy=\"false\">&#x00028;</mo><mi>f</mi><mo stretchy=\"false\">&#x00029;</mo><mi>:</mi><mtext>&#x000A0;</mtext><mi>x</mi><mo>&#x02265;</mo><mn>2</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac><mtext>&#x000A0;</mtext><mo>&#x021D2;</mo><mtext>&#x000A0;</mtext><mi>x</mi><mo>&#x02260;</mo><mn>3</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-10"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-10"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Mozaik: «функц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L10.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>5</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002B;</mo><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧", "6 + (−1) = 5", "Олонлог 10, Дасгал 5 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><msqrt><mrow><mn>5</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msqrt></mrow></math>⟧-ийн тодорхойлогдох муж", "x ≥ −1/5", "Олонлог 10, Дасгал 5 №5"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>3</mn><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><mo>&#x02212;</mo><mn>27</mn><mi>x</mi><mo>&#x0002B;</mo><mn>5</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧", "35; 5", "Олонлог 10, Дасгал 5 №3"]], "tb": [], "digital": false, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Нэг оролт — нэг гаралт»:** Функцэд x бүрт ганц y харгалздаг. Хүн ч хэлсэн үгэндээ тохирсон үйлдэл хийвэл итгэл төрдөг. Асуулт: «Би хэлсэн үгэндээ хүрдэг үү? Сүүлд хүрээгүй тохиолдол юу байв?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) y = 3x − 1-д x = −2 үеийн y; 2) A(−3; 2) цэг аль мөчид оршдог вэ?; 3) (−4)² − 2·(−4)", "**Холбоос (1 мин):** 8 дугаар ангид функцийн утга, графикийг үзсэн (Олонлог 8, х. 6); өнөөдөр функц хаана тодорхойлогдох, ямар утга авахыг судална."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Такси суурь 3000₮, км тутам 1200₮. Төлбөр зайнаас хэрхэн хамаарах вэ? Зай сөрөг, төлбөр 2000₮ байж болох уу?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Функц: x бүрт ганц y. D(f) — x-ийн авч болох утгууд (хуваарь ≠ 0, тэгш зэргийн язгуурын доорх ≥ 0). E(f) — y-ийн авах утгууд. Дүр — өгсөн x-үүдэд харгалзах y-уудын олонлог.", "   Функцийг томьёо, хүснэгт, график, үгээр өгнө. Босоо шулууны шалгуур: график аль нэг босоо шулуунтай 2 цэгт огтлолцвол функц биш.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): f(x) = √(x + 3)-ийн D(f)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): f(x) = 1/(x − 2) + √x-ийн D(f)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): f(x) = x² + 4-ийн E(f)", "**3. Түгээмэл алдаа:** √(x − 3)-ийн мужийг x > 3 гэх (зөв нь x ≥ 3); нэг x-д хоёр y харгалзахыг функц гэх; D ба E-г андуурах.", "**4. Шалгах цэг (3 мин):** 1) f(x) = 5/(x + 1)-ийн D(f); 2) f(x) = 2x − 1, D = {0; 1; 2} бол дүр. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 3 станц (5 минут тутам шилжинэ). 1-р станц «Томьёо»: f(x) = √(6 − 2x) ба g(x) = 3/(x² − 9)-ийн D-г ол. 2-р станц «Хүснэгт»: такси y = 1200x + 3000-ийн x = 0, 2, 5, 10 км үеийн утгыг бөглөж, D ба E-г бодит утгаар тайлбарла. 3-р станц «График»: парабол, тойрог, шулуун, x = y² муруйн аль нь функц болохыг босоо шулууны шалгуураар тогтоо.", "**Бүтээгдэхүүн:** Станц бүрийн хариу бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "11": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Квадрат функцийн графикийг утгын хүснэгтээр байгуулж, y = x² графикийг шилжүүлэх, оройн цэг, тэгш хэмийн тэнхлэг, тэнхлэгтэй огтлолцох цэгүүдээр тоймлон зурж, бодит хөдөлгөөнийг тайлбарлах.", "crit": ["Би y = a(x − p)² + q-ийн оройг шууд уншиж, салааны чиглэлийг тодорхойлж чадна.", "Би утгын хүснэгт гаргаж, орой ба огтлох цэгээр графикийг зурж чадна.", "Би сумны (бөмбөгний) замын хамгийн өндөр цэг, унах цэгийг тайлбарлаж чадна."], "words": "парабол; орой — хамгийн өндөр (намхан) цэг; тэгш хэмийн тэнхлэг; салаа; огтлох цэг.", "ex": [["y = x² − 4x + 3-ийн утгын хүснэгт (x = 0…4) гаргаж график зур", "y: 3; 0; −1; 0; 3; орой (2; −1)"], ["y = −(x + 1)² + 4-ийн орой, тэнхлэг, OX огтлох цэгүүд", "орой (−1; 4), x = −1; −(x + 1)² + 4 = 0 → x = 1, x = −3"], ["y = 2x²-ийн графикийг хэрхэн шилжүүлбэл y = 2(x − 3)² − 1 болох вэ?", "3 нэгж баруун, 1 нэгж доош"]], "ck": [["y = x² + 6x + 8-ийн оройн координат", "x₀ = −3, y₀ = −1 → (−3; −1)"], ["y = x² − 3x-ийн OX огтлох цэгүүд", "x(x − 3) = 0 → (0; 0), (3; 0)"]], "ws": [["Сэргээх", ["y = x² − 1-д x = −2; 0; 2 үеийн y", "x² − 5x + 6 = 0"]], ["Дадлага 1", ["y = 2(x + 2)² + 4-ийн орой", "y = −x² + 1-ийн салааны чиглэл ба орой"]], ["Дадлага 2", ["y = x² + 7x + 12-ийн OX огтлох цэгүүд", "y = x² − 2x − 3-ийн орой ба OY огтлох цэг"]], ["★ Сорилт", ["Орой нь (2; −3), (0; 1) цэгийг дайрах параболын тэгшитгэл", "y = x² + 4x + 1-ийг y = (x + a)² − b хэлбэрт оруулж оройг ол"]], ["Хэрэглээ", ["Бөмбөгний өндөр h = −5t² + 20t (м). Хэдэн секундэд хамгийн өндөрт, хэдэн м хүрэх вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "y = x² − 4x − 3-ийн орой", "y = −(x − 1)² + 9-ийн OX огтлох цэгүүд", "y = x² − 2x-ийн утгын хүснэгт (x = −1…3) гаргаж график зур", "y = 3(x + 1)² + 4-ийн орой ба салааны чиглэл", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mn>4</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></math>⟧ параболын оройн цэг (⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>a</mi><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mi>b</mi></mrow></math>⟧ хэлбэрт оруул) __(Олонлог 10, Дасгал 5 №1)__"], "quiz": ["y = −2(x − 3)² + 5-ийн орой ба салааны чиглэл", "y = x² + 8x − 4-ийн орой", "Сумны зам h = −0,05(x − 20)² + 22. Оройн цэг ямар утгатай вэ?"], "key": [["III. Суурь сэргээх", ["1) (x − 2)(x − 4) = 0 → 2; 4", "2) 9", "3) x² − 6x + 9"]], ["Жишээ 1–3", ["Жишээ 1: y: 3; 0; −1; 0; 3; орой (2; −1)", "Жишээ 2: орой (−1; 4), x = −1; −(x + 1)² + 4 = 0 → x = 1, x = −3", "Жишээ 3: 3 нэгж баруун, 1 нэгж доош"]], ["Шалгах цэг", ["1) x₀ = −3, y₀ = −1 → (−3; −1)", "2) x(x − 3) = 0 → (0; 0), (3; 0)"]], ["I. Ажлын хуудас", ["№1: 3; −1; 3", "№2: x = 2; x = 3", "№3: (−2; 4)", "№4: доош; (0; 1)", "№5: (−4; 0), (−3; 0)", "№6: (1; −4); (0; −3)", "№7: y = a(x − 2)² − 3; 1 = 4a − 3 → a = 1: y = (x − 2)² − 3", "№8: (x + 2)² − 3; орой (−2; −3)", "№9: t₀ = 2 с, h = 20 м"]], ["Багийн даалгавар", ["Хүснэгт: h(0) = 2; h(10) = 17; h(20) = 22; h(30) = 17; h(40) = 2.", "Орой (20; 22): сум 20 м зайд 22 м-ийн хамгийн өндөрт хүрнэ.", "h = 0: (x − 20)² = 440 → x ≈ 20 + 20,98 ≈ 41 м-т унана; h(0) = 2 м — харвагчийн гарын өндөр."]], ["II. Гэрийн даалгавар", ["№1: (2; −7)", "№2: x = 4, x = −2", "№3: y: 3; 0; −1; 0; 3; орой (1; −1)", "№4: (−1; 4), дээш", "№5: (x + 2)² − 3; орой (−2; −3)"]], ["III. Гарах тасалбар", ["№1: (3; 5), доош (шалгуур 1)", "№2: x₀ = −4, y₀ = −20 → (−4; −20) (шалгуур 2)", "№3: 20 м зайд сум 22 м өндөрт хүрнэ (шалгуур 3)"]]], "F": ["y=a(x-h)^{2}+k,\\quad \\text{орой}\\ (h;\\,k)", "x_{0}=-\\frac{b}{2a}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><mi>a</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><mi>h</mi><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mi>k</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><mtext>орой</mtext><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>h</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>k</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x</mi><mrow><mn>0</mn></mrow></msub><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-11"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-11"], ["PhET «Graphing Quadratics»", "https://phet.colorado.edu/en/simulations/graphing-quadratics"], ["Mozaik: «квадрат функц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L11.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mn>4</mn><mi>x</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></math>⟧ параболын оройн цэг (⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>a</mi><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mi>b</mi></mrow></math>⟧ хэлбэрт оруул)", "(x + 2)² − 3; орой (−2; −3)", "Олонлог 10, Дасгал 5 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></math>⟧: OY тэнхлэгтэй огтлолцох цэг ба функцийн хамгийн бага утга", "(0; −3); x = 2-т y = −7", "Олонлог 10, Дасгал 5 №4"]], "tb": [["График нь (2; −3) цэг дээр оройтой, (1; −2) цэгийг дайрсан параболын тэгшитгэл", "y = (x − 2)² − 3", "Математик X, §5.2 №34"], ["(0; 1), (1; 4), (4; 1) цэгийг дайрсан параболын тэгшитгэл", "y = −x² + 4x + 1", "Математик X, §5.2 №37"]], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Оргил ба уналт»:** Парабол оройн цэг дээрээ хамгийн өндөр (эсвэл намхан) утгатай байдаг. Амьдралд ч өсөлт, уналт ээлжилдэг; уналтын дараа дахин өсдөг. Асуулт: «Саяхан тулгарсан бэрхшээлээ яаж давсан бэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) x² − 6x + 8 = 0-ийг задлалаар бод; 2) y = x²-д x = −3 үеийн y; 3) (x − 3)²-ийг задал", "**Холбоос (1 мин):** 8 дугаар ангид y = x²-ийн графикийг үзсэн; өнөөдөр түүнийг шилжүүлж, оройн цэг ба огтлох цэгээр тоймлон зурна."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Сур харвааны сумны зам h(x) = −0,05(x − 20)² + 22 (м) байв. Сум хамгийн өндөрт хэд хүрэх вэ, хаана газарт унах вэ?", "**1. Гол санаа (самбарт):** y = a(x − p)² + q: орой (p; q), тэгш хэмийн тэнхлэг x = p; a > 0 — салаа дээш, a < 0 — доош. y = ax² + bx + c: x₀ = −b/(2a), y₀ = f(x₀); OY огтлох цэг (0; c); OX огтлох цэг — ax² + bx + c = 0-ийн шийдүүд.", "   Тоймлон зурах алгоритм: 1) салааны чиглэл; 2) орой; 3) тэнхлэг; 4) OY, OX огтлох цэг; 5) тэгш хэмээр нэмэлт цэг; 6) цэгүүдийг гөлгөр муруйгаар холбоно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): y = x² − 4x + 3-ийн утгын хүснэгт (x = 0…4) гаргаж график зур", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): y = −(x + 1)² + 4-ийн орой, тэнхлэг, OX огтлох цэгүүд", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): y = 2x²-ийн графикийг хэрхэн шилжүүлбэл y = 2(x − 3)² − 1 болох вэ?", "**3. Түгээмэл алдаа:** y = (x − 3)²-ийн оройг (−3; 0) гэх (зөв нь (3; 0)); a < 0 үед салааг дээш зурах; цэгүүдийг хугархай шулуунаар холбох (гөлгөр муруй байх ёстой).", "**4. Шалгах цэг (3 мин):** 1) y = x² + 6x + 8-ийн оройн координат; 2) y = x² − 3x-ийн OX огтлох цэгүүд. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Сур харвааны сум»: h(x) = −0,05(x − 20)² + 22 (x — хэвтээ зай, м; h — өндөр, м). 1) x = 0, 10, 20, 30, 40 үеийн утгын хүснэгт гарга. 2) График цаасан дээр (1 нүд = 5 м) зур. 3) Оройг тайлбарла. 4) Сум хаана газарт унахыг (h = 0) ол. 5) x = 0 үеийн утгыг тайлбарла.", "**Бүтээгдэхүүн:** График цаасан дээрх график, хүснэгт, тайлбар (А3)", "**Нэгж 3-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "12": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Дүгнэлтээ шалгах, батлах", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "y = axⁿ (a — рационал, n = −2, −1, 0, 1, 2, 3) функцийн графикийг утгын хүснэгтээр байгуулж, тэгш ба сондгой чанар, тодорхойлогдох муж, байрлах мөчийг харьцуулан дүгнэх.", "crit": ["Би y = 2x⁻² зэрэг функцийн утгыг олж, хүснэгт гаргаж чадна.", "Би y = axⁿ графикийн мөч, тэгш/сондгой чанарыг тодорхойлж чадна.", "Би урвуу ба кубын хамаарлыг бодит жишээгээр тайлбарлаж чадна."], "words": "гипербол; тэгш функц — f(−x) = f(x); сондгой функц — f(−x) = −f(x); мөч.", "ex": [["y = 1/2·x³-ийн утгын хүснэгт (x = −2…2)", "−4; −1/2; 0; 1/2; 4"], ["y = −6/x аль мөчид байрлах вэ?", "a < 0 тул II, IV мөч"], ["y = x⁻² тэгш үү, сондгой юу?", "(−x)⁻² = x⁻² тул тэгш"]], "ck": [["y = 2x⁻² бол x = −2 үеийн y", "2/4 = 1/2"], ["y = 4/x аль мөчүүдэд байрлах вэ?", "I ба III"]], "ws": [["Сэргээх", ["3⁻¹ ба 3⁻²", "y = 12/x-д x = 4"]], ["Дадлага 1", ["y = x⁻² үед x = 2 ба x = −2", "y = −3x³ үед x = −1"]], ["Дадлага 2", ["y = 4/x ба y = −4/x-ийн графикууд аль мөчид?", "y = x³ сондгой гэдгийг батал"]], ["★ Сорилт", ["y = a/x-ийн график A(2; −3) цэгийг дайрна. a хэд вэ?", "Кубын ирмэг 2 дахин ихсэхэд эзэлхүүн хэд дахин ихсэх вэ? y = x³-аар тайлбарла."]], ["Хэрэглээ", ["430 км замд t = 430/v. v = 43 ба 86 км/ц үеийн t хэд вэ? Хурд 2 дахин ихсэхэд t хэрхэн өөрчлөгдөх вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "y = 1/3·x² үед x = 3 ба −3", "y = −2/x аль мөчид?", "y = x⁻¹ тэгш үү, сондгой юу?", "y = 9/x²-ийн график (x; 1) цэгийг дайрна. x?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧; хаана тодорхойлогдохгүй вэ? __(Олонлог 10, Дасгал 5 №2)__"], "quiz": ["y = 2x⁻¹ үед x = −4", "y = −x² ба y = 5/x²-ийн аль нь III, IV мөчид байрлах вэ?", "Кубын ирмэгийг 3 дахин ихэсгэвэл эзэлхүүн хэд дахин ихсэх вэ?"], "key": [["III. Суурь сэргээх", ["1) 1/4", "2) −8", "3) −2"]], ["Жишээ 1–3", ["Жишээ 1: −4; −1/2; 0; 1/2; 4", "Жишээ 2: a < 0 тул II, IV мөч", "Жишээ 3: (−x)⁻² = x⁻² тул тэгш"]], ["Шалгах цэг", ["1) 2/4 = 1/2", "2) I ба III"]], ["I. Ажлын хуудас", ["№1: 1/3 ба 1/9", "№2: 3", "№3: 1/4 ба 1/4", "№4: 3", "№5: I, III ба II, IV", "№6: (−x)³ = −x³ = −f(x)", "№7: a = 2·(−3) = −6", "№8: (2a)³ = 8a³ → 8 дахин", "№9: 10 ц ба 5 ц; 2 дахин багасна"]], ["Багийн даалгавар", ["Тэгш: x², −x², 4/x²; сондгой: 2x, 1/2·x³, 4/x.", "x = 0-д тодорхойлогдохгүй: 4/x, 4/x².", "Мөч: 2x, 1/2·x³, 4/x — I, III; x², 4/x² — I, II; −x² — III, IV."]], ["II. Гэрийн даалгавар", ["№1: 3 ба 3", "№2: II, IV", "№3: сондгой", "№4: x² = 9 → x = ±3", "№5: −1; 2; x = 3"]], ["III. Гарах тасалбар", ["№1: −1/2 (шалгуур 1)", "№2: y = −x² (шалгуур 2)", "№3: 27 дахин (шалгуур 3)"]]], "F": ["y=ax^{n}", "y=\\frac{a}{x},\\quad x\\ne 0"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><mi>a</mi><msup><mi>x</mi><mrow><mi>n</mi></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>x</mi><mo>&#x02260;</mo><mn>0</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-12"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-12"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Урвуу пропорц, график (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/680"], ["Mozaik: «зэрэгт функц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L12.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>3</mn></mrow></mfrac></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧; хаана тодорхойлогдохгүй вэ?", "−1; 2; x = 3", "Олонлог 10, Дасгал 5 №2"]], "tb": [["OX тэнхлэгтэй (−2; 0), (4; 0) цэгээр огтлолцож, (5; 2)-ыг дайрсан параболын OY-тэй огтлолцох цэг", "y = (2/7)(x + 2)(x − 4) → (0; −16/7)", "Математик X, §5.3 №56"]], "digital": false, "stype": "C", "mode": "дүгнэлт", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Ижил төрөл, өөр онцлог»:** y = x² ба y = x³ хоёулаа зэрэгт функц ч график нь өөр: нэг нь тэгш, нөгөө нь сондгой. Нэг ангийн хүүхдүүд ч өөр өөр онцлогтой. Асуулт: «Хосын маань ямар онцлог надаас өөр, давуу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) 2⁻²; 2) (−2)³; 3) y = 6/x-д x = −3", "**Холбоос (1 мин):** 8 дугаар ангид урвуу пропорционал хамаарал y = k/x-ийг үзсэн (Олонлог 8, х. 5); өнөөдөр y = axⁿ (n = −2…3)-ийг бүгдийг харьцуулна."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Улаанбаатараас Арвайхээр 430 км. Хурдыг 2 дахин нэмэхэд хугацаа хэрхэн өөрчлөгдөх вэ? Кубын ирмэгийг 2 дахин томруулбал эзэлхүүн хэд дахин өсөх вэ?", "**1. Гол санаа (самбарт):** y = axⁿ: n = 0 — хэвтээ шулуун y = a (x ≠ 0); n = 1 — шулуун; n = 2 — парабол (тэгш); n = 3 — кубын парабол (сондгой); n = −1 — гипербол (a > 0 үед I, III мөч); n = −2 — a > 0 үед OX-ээс дээш, OY-ийн хувьд тэгш хэмтэй.", "   Тэгш функц: f(−x) = f(x) (график OY-ийн хувьд тэгш хэмтэй); сондгой: f(−x) = −f(x) (O цэгийн хувьд тэгш хэмтэй). n < 0 үед x ≠ 0, график тэнхлэгүүдтэй огтлолцохгүй.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): y = 1/2·x³-ийн утгын хүснэгт (x = −2…2)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): y = −6/x аль мөчид байрлах вэ?", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): y = x⁻² тэгш үү, сондгой юу?", "**3. Түгээмэл алдаа:** y = x³-ийг тэгш гэх; гиперболыг тэнхлэгтэй огтлолцуулж зурах; a > 0 үед y = ax⁻²-ийг III, IV мөчид зурах (y > 0 байна).", "**4. Шалгах цэг (3 мин):** 1) y = 2x⁻² бол x = −2 үеийн y; 2) y = 4/x аль мөчүүдэд байрлах вэ?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Ажиглаж оюун дүгнэлт гаргах:** «Зургаан функц»: хос бүрт нэг функц оноож өгнө: y = 2x, y = x², y = −x², y = 1/2·x³, y = 4/x, y = 4/x². x = −4, −2, −1, 1, 2, 4 (шаардлагатай бол 0, ±3) утгын хүснэгт гаргаж, график цаасан дээр зурна. Дараа нь самбарт бүх графикийг нэгтгэж, аль нь тэгш/сондгой, аль нь x = 0-д тодорхойлогдохгүй, аль мөчид байрлахыг хүснэгтэд дүгнэнэ.", "**Бүтээгдэхүүн:** Хосын график ба ангийн нэгтгэсэн хүснэгт", "• Хос ажиглалтаа хүснэгтэд бичиж, «Үргэлж … байна» гэсэн дүгнэлт (таамаглал) гаргана.", "• Багш «Энэ дүгнэлт бүх тохиолдолд үнэн үү? Яаж шалгах вэ?» гэж асууна."]], ["VI. Дүгнэлтээ шалгах, батлах", ["• 2–3 хос дүгнэлтээ самбарт бичнэ. Анги эсрэг жишээ хайж шалгана.", "• Багш дүгнэлтийг теорем/чанар болгон нэрлэж, үндэслэлийг товч харуулна."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "13": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: илтгэгч функц ба шүргэгчийн налалт", 28], ["V. Бие даасан гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Өөрийгөө шалгах, засварлах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "y = aˣ функцийн графикийг байгуулж, өсөх, буурах чанарыг тодорхойлох; муруйн шүргэгч ба түүний налалтыг өөрчлөлтийн хурд гэж ойлгож, ойр хоёр цэгээр ойролцоолох.", "crit": ["Би y = aˣ-ийн өсөх, буурахыг a-аар тодорхойлж, (0; 1) цэгийг дайрдгийг тайлбарлаж чадна.", "Би илтгэгч функцийн утгыг тооцоолж, графикийг зурж чадна.", "Би муруйн нэг цэг дэх налалтыг ойролцоолж, өсөлтийн хурдыг тайлбарлаж чадна."], "words": "илтгэгч функц — y = aˣ; өсөх, буурах; шүргэгч — муруйг нэг цэгт шүргэх шулуун; налалт — өөрчлөлтийн хурд.", "ex": [["y = 2ˣ ба y = (1/2)ˣ-ийн хүснэгт (x = −2…3)", "2ˣ: 1/4; 1/2; 1; 2; 4; 8 | (1/2)ˣ: 4; 2; 1; 1/2; 1/4; 1/8"], ["y = 2ˣ муруйн x = 1 цэг дэх шүргэгчийн налалтыг x = 1 ба x = 1,1 цэгээр ойролцоол", "(2^1,1 − 2)/0,1 ≈ (2,144 − 2)/0,1 ≈ 1,44"], ["y = x² муруйн (1; 1) цэг дэх шүргэгчийн налалт 2 бол шүргэгчийн тэгшитгэл", "y − 1 = 2(x − 1) → y = 2x − 1"]], "ck": [["y = 3ˣ үед x = −1; 2", "1/3; 9"], ["y = 0,5ˣ өсөх үү, буурах уу?", "буурна (0 < a < 1)"]], "ws": [["Сэргээх", ["2⁴ ба 2⁻¹", "A(0; 1), B(2; 5)-ын налалт"]], ["Дадлага 1", ["y = 4ˣ үед x = −1; 0; 1/2", "y = (1/3)ˣ өсөх үү, буурах уу? OY-г хаана огтлох вэ?"]], ["Дадлага 2", ["y = 2ˣ ба y = 2ˣ + 3-ийн графикийн ялгаа", "y = 2ˣ муруйн x = 2 цэг дэх налалтыг (2; 4) ба (2,1; ≈ 4,29) цэгээр ойролцоол"]], ["★ Сорилт", ["y = aˣ-ийн график (2; 9) цэгийг дайрна. a хэд вэ?", "y = x² муруйн (2; 4) цэг дэх шүргэгчийн налалт 4. Шүргэгчийн тэгшитгэл"]], ["Хэрэглээ", ["Хадгаламж жилд 10%-иар өсдөг: S = 1 000 000 · 1,1ᵗ. 2 ба 3 жилийн дараах дүн"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "y = 5ˣ үед x = −2; 0; 2", "y = (2/3)ˣ өсөх үү, буурах уу?", "y = 3ˣ муруйн x = 1 цэг дэх налалтыг (1; 3), (1,1; ≈ 3,35)-аар ойролцоол", "Бактери 2 цаг тутам 2 дахин олшордог. 1 бактериас 12 цагийн дараа", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>2</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>3</mn><mrow><mn>2</mn></mrow></msup></mrow></math>⟧ __(Олонлог 10, Дасгал 1 №2)__"], "quiz": ["y = 2ˣ ба y = (1/2)ˣ-ийн график хоёулаа ямар цэгийг дайрах вэ?", "y = 2ˣ үед x = −3", "N = 2ᵗ. t = 3-аас t = 4 хүртэлх дундаж өсөлтийн хурд (налалт)"], "key": [["III. Суурь сэргээх", ["1) 32", "2) 1/9", "3) (8 − 2)/(3 − 1) = 3"]], ["Жишээ 1–3", ["Жишээ 1: 2ˣ: 1/4; 1/2; 1; 2; 4; 8 | (1/2)ˣ: 4; 2; 1; 1/2; 1/4; 1/8", "Жишээ 2: (2^1,1 − 2)/0,1 ≈ (2,144 − 2)/0,1 ≈ 1,44", "Жишээ 3: y − 1 = 2(x − 1) → y = 2x − 1"]], ["Шалгах цэг", ["1) 1/3; 9", "2) буурна (0 < a < 1)"]], ["I. Ажлын хуудас", ["№1: 16 ба 1/2", "№2: 2", "№3: 1/4; 1; 2", "№4: буурна; (0; 1)", "№5: 3 нэгж дээш шилжинэ; E: y > 3", "№6: (4,29 − 4)/0,1 ≈ 2,9", "№7: a² = 9 → a = 3", "№8: y − 4 = 4(x − 2) → y = 4x − 4", "№9: 1 210 000₮; 1 331 000₮"]], ["Багийн даалгавар", ["Хүснэгт: 1; 2; 4; 8; 16; 32; 64.", "Налалт: t = 2 үед (8 − 4)/1 = 4; t = 4 үед (32 − 16)/1 = 16 — 4 дахин их.", "3 цаг = 9 үе: 2⁹ = 512. Налалт (хурд) өөрөө өсөж байгаа тул график эгцэрнэ."]], ["II. Гэрийн даалгавар", ["№1: 1/25; 1; 25", "№2: буурна", "№3: (3,35 − 3)/0,1 ≈ 3,5", "№4: 2⁶ = 64", "№5: 1; 1"]], ["III. Гарах тасалбар", ["№1: (0; 1) (шалгуур 1)", "№2: 1/8 (шалгуур 2)", "№3: (16 − 8)/1 = 8 (шалгуур 3)"]]], "F": ["y=a^{x}\\quad (a>0,\\ a\\ne 1)", "k=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x0003D;</mo><msup><mi>a</mi><mrow><mi>x</mi></mrow></msup><mspace width=\"1em\" /><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>a</mi><mo>&#x02260;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k</mi><mo>&#x0003D;</mo><mfrac><mrow><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-13"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-13"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Mozaik: «илтгэгч функц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L13.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>2</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>3</mn><mrow><mn>2</mn></mrow></msup></mrow></math>⟧", "1; 1", "Олонлог 10, Дасгал 1 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>6</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧", "200 000", "Олонлог 10, Дасгал 1 №2"]], "tb": [], "digital": false, "stype": "B", "mode": "ганцаар", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Өдөр бүр 1%»:** y = 1,01ˣ: өдөр бүр 1%-иар сайжирвал 365 хоногийн дараа 1,01³⁶⁵ ≈ 38 дахин; харин өдөр бүр 1%-иар муудвал 0,99³⁶⁵ ≈ 0,03 болно. Асуулт: «Би өдөр бүр юуг 1%-иар сайжруулах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) 2⁵; 2) 3⁻²; 3) A(1; 2), B(3; 8)-ыг дайрсан шулууны налалт", "**Холбоос (1 мин):** Шулууны налалтыг 8 дугаар ангид үзсэн (Олонлог 8, х. 6); өнөөдөр муруйн нэг цэг дэх «налалт»-ыг шүргэгчээр тодорхойлно."]], ["IV. Самбарын тайлбар: илтгэгч функц ба шүргэгчийн налалт", ["**Асуудал:** Айрагт нэг бактери 20 минут тутам 2 хуваагддаг. 3 цагийн дараа хэд болох вэ? Өсөлт яагаад улам хурдсах вэ?", "**1. Гол санаа (самбарт):** y = aˣ (a > 0, a ≠ 1): D = R, E = (0; +∞); (0; 1) цэгийг дайрна; a > 1 — өснө, 0 < a < 1 — буурна; OX тэнхлэгт ойртох ч огтлохгүй.", "   Шүргэгч — муруйг тухайн цэгт «шүргэх» шулуун. Налалтыг ойролцоогоор: ойр хоёр цэгийн хувьд k ≈ (f(x₂) − f(x₁))/(x₂ − x₁). Налалт — тухайн цэг дэх өөрчлөлтийн хурд. Шүргэгчийн тэгшитгэл: y − y₀ = k(x − x₀).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): y = 2ˣ ба y = (1/2)ˣ-ийн хүснэгт (x = −2…3)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): y = 2ˣ муруйн x = 1 цэг дэх шүргэгчийн налалтыг x = 1 ба x = 1,1 цэгээр ойролцоол", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): y = x² муруйн (1; 1) цэг дэх шүргэгчийн налалт 2 бол шүргэгчийн тэгшитгэл", "**3. Түгээмэл алдаа:** y = 2ˣ-ийг y = x²-тэй адил гэх; илтгэгч функцийг сөрөг утга авна гэж зурах; шүргэгчийг огтлогч шулуунтай андуурах.", "**4. Шалгах цэг (3 мин):** 1) y = 3ˣ үед x = −1; 2; 2) y = 0,5ˣ өсөх үү, буурах уу?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Бие даасан гүйцэтгэлийн даалгавар", ["**Бие даасан гүйцэтгэлийн даалгавар:** «Айрагны бактери»: N(t) = 2ᵗ (t — 20 минутын үе). 1) t = 0…6 хүснэгт гаргаж, график цаасан дээр зур. 2) t = 2 ба t = 4 цэгт (t; t + 1) хоёр цэгээр налалтыг ойролцоолж харьцуул. 3) 3 цагийн дараа хэдэн бактери болох вэ? 4) Өсөлт яагаад улам хурдсаж байгааг налалтаар тайлбарла.", "**Бүтээгдэхүүн:** Бие даасан график ба тайлбар (дэвтэрт)", "• Суралцагч бүр өөрийн бүтээгдэхүүнийг хийнэ; багш шалгуурын дагуу ажиглаж, хэрэгтэй хүнд чиглүүлэх асуулт тавина."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Өөрийгөө шалгах, засварлах", ["• Багш түлхүүрийг (эсвэл шалгуурын жишээ хариуг) үзүүлнэ.", "• Суралцагч бүр ажлаа шалгуураар өөрөө шалгаж, алдаагаа өөр өнгөөр засна. 2–3 суралцагч засварласан алхмаа тайлбарлана."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "14": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Нэг хувьсагчтай шугаман тэнцэтгэл биш ба тэдгээрийн системийг бодож, шийдийг тоон шулуун ба завсраар илэрхийлэх, төсөв, зайн бодлогод зохиож хэрэглэх.", "crit": ["Би −3x + 2 ≥ 11 зэрэг тэнцэтгэл бишийг тэмдгийн дүрмээр зөв бодож чадна.", "Би системийн шийдийг тоон шулуун дээр дүрсэлж, завсраар бичиж чадна.", "Би төсвийн бодлогоос тэнцэтгэл биш зохиож бодож чадна."], "words": "тэнцэтгэл биш; шийд; систем — хамт биелэх нөхцөл; огтлолцол — давхацсан хэсэг; завсар — (a; b].", "ex": [["−x − 7 > −10", "−x > −3 → x < 3; (−∞; 3)"], ["Систем: 2x − 1 > 3 ба x + 4 ≤ 9", "x > 2 ба x ≤ 5 → (2; 5]"], ["−2(x − 1) + 3(3 − 2x) < 3", "−8x + 11 < 3 → x > 1"]], "ck": [["5x − 6 < −26", "x < −4"], ["Систем: x > −3 ба x ≤ 2. Завсраар бич", "(−3; 2]"]], "ws": [["Сэргээх", ["2x + 7 = 1", "−3 < 1-ийн хоёр талыг −2-оор үржүүл"]], ["Дадлага 1", ["x + 13 > 15", "−4x ≥ 12"]], ["Дадлага 2", ["Систем: 2x + 3 > −3 ба x − 1 ≤ 4", "5x − 35 < 0-ийн хамгийн их бүхэл шийд"]], ["★ Сорилт", ["−3(x − 1) − 7 > 3", "(2x − 3)/4 − (x + 1)/5 > 2x/5 − 1"]], ["Хэрэглээ", ["Утасны багц: 15 000 + 2 000x ≤ 35 000. Хэдэн GB хэрэглэж болох вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "Систем: 6x − 7 > 40 ба 5 − 2x > −8", "−2(x − 1) + 2(3 − x) > 0", "Систем: 4x + 5 < 25 ба x + 3 > 15", "Систем: 1 < x ≤ 3 ба x ≥ 2", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x</mi><mo>&#x0002B;</mo><mn>13</mn><mo>&#x0003E;</mo><mn>15</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><mi>x</mi><mo>&#x0002B;</mo><mn>3</mn><mo>&#x0003E;</mo><mo>&#x02212;</mo><mn>3</mn></mrow></math>⟧ __(Олонлог 10, Дасгал 6 №2)__"], "quiz": ["−3x + 2 ≥ 11", "Систем: x − 2 > 0 ба 3x ≤ 15", "Аяллын автобус: суурь 30 000₮, 1 хүнд 12 000₮. Төсөв 150 000₮ бол хамгийн ихдээ хэдэн хүн явах вэ?"], "key": [["III. Суурь сэргээх", ["1) x = 5", "2) x = −4", "3) үнэн; 10 > 4 (тэмдэг эргэнэ)"]], ["Жишээ 1–3", ["Жишээ 1: −x > −3 → x < 3; (−∞; 3)", "Жишээ 2: x > 2 ба x ≤ 5 → (2; 5]", "Жишээ 3: −8x + 11 < 3 → x > 1"]], ["Шалгах цэг", ["1) x < −4", "2) (−3; 2]"]], ["I. Ажлын хуудас", ["№1: x = −3", "№2: 6 > −2", "№3: x > 2", "№4: x ≤ −3", "№5: x > −3 ба x ≤ 5 → (−3; 5]", "№6: x < 7 → 6", "№7: −3x − 4 > 3 → x < −7/3", "№8: 20-оор үржүүлбэл 6x − 19 > 8x − 20 → x < 1/2", "№9: 2000x ≤ 20 000 → x ≤ 10 GB"]], ["Багийн даалгавар", ["1 км-т 9·2600/100 = 234₮; зардал 234x.", "234x ≤ 40 000 → x ≤ 170,9 км.", "280 км: 65 520₮ > 40 000₮ тул буцах боломжгүй; систем: 140 ≤ x ≤ 170,9."]], ["II. Гэрийн даалгавар", ["№1: x > 47/6 ≈ 7,8 ба x < 6,5 → шийдгүй", "№2: −4x + 8 > 0 → x < 2", "№3: x < 5 ба x > 12 → шийдгүй", "№4: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "№5: x > 2; x > −3"]], ["III. Гарах тасалбар", ["№1: x ≤ −3 (шалгуур 1)", "№2: (2; 5] (шалгуур 2)", "№3: 30 000 + 12 000x ≤ 150 000 → x ≤ 10 (шалгуур 3)"]]], "F": ["ax+b>0", "-2x<6\\ \\Rightarrow\\ x>-3"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mi>x</mi><mo>&#x0002B;</mo><mi>b</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mn>2</mn><mi>x</mi><mo>&#x0003C;</mo><mn>6</mn><mtext>&#x000A0;</mtext><mo>&#x021D2;</mo><mtext>&#x000A0;</mtext><mi>x</mi><mo>&#x0003E;</mo><mo>&#x02212;</mo><mn>3</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-14"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-14"], ["Desmos", "https://www.desmos.com/calculator"], ["Тэнцэтгэл бишийн систем (видео)", "https://youtu.be/y7D8kPcLd1A"], ["Mozaik: «тэнцэтгэл биш» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L14.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x</mi><mo>&#x0002B;</mo><mn>13</mn><mo>&#x0003E;</mo><mn>15</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><mi>x</mi><mo>&#x0002B;</mo><mn>3</mn><mo>&#x0003E;</mo><mo>&#x02212;</mo><mn>3</mn></mrow></math>⟧", "x > 2; x > −3", "Олонлог 10, Дасгал 6 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mn>2</mn><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002B;</mo><mn>3</mn><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mo>&#x02212;</mo><mn>2</mn><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003C;</mo><mn>3</mn></mrow></math>⟧", "x > 1", "Олонлог 10, Дасгал 6 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mn>3</mn><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x02212;</mo><mn>7</mn><mo>&#x0003E;</mo><mn>3</mn></mrow></math>⟧", "x < −7/3", "Олонлог 10, Дасгал 6 №2"]], "tb": [], "digital": true, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хязгаараа мэдэх»:** Тэнцэтгэл биш нь «хүрэлцэх хязгаар»-ыг заадаг: төсөв, цаг, хүч хязгаартай. Асуулт: «Өдрийн 24 цагаасаа утсанд хэдээс илүүгүй цаг зарцуулах вэ? t ≤ … гэж бич.»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3x − 5 = 10; 2) −2x = 8; 3) −5 < −2 үнэн үү? Хоёр талыг −2-оор үржүүлбэл?", "**Холбоос (1 мин):** 8 дугаар ангид шугаман ба давхар тэнцэтгэл бишийг тоон шулуун дээр дүрсэлсэн (Олонлог 8, х. 3–4); өнөөдөр систем бодож, бодлогод хэрэглэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Утасны багц: 15 000₮ суурь, 1 GB тутам 2 000₮. 35 000₮-өөс хэтрүүлэхгүйн тулд хэдэн GB хэрэглэж болох вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Хоёр талд ижил тоо нэмж болно; эерэг тоогоор үржүүлж, хуваахад тэмдэг хэвээр, сөрөг тоогоор үржүүлж, хуваахад тэмдэг эсрэгээр эргэнэ.", "   Систем: тус бүрийг бодоод шийдүүдийн огтлолцлыг (давхацсан хэсэг) авна. ≤, ≥ — будсан цэг; <, > — хоосон цэг. Хариуг завсраар бичнэ: (2; 5], (−∞; 3).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): −x − 7 > −10", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Систем: 2x − 1 > 3 ба x + 4 ≤ 9", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): −2(x − 1) + 3(3 − 2x) < 3", "**3. Түгээмэл алдаа:** −2x > 6-г x > −3 гэж бодох (зөв нь x < −3); будсан, хоосон цэгийг андуурах; системийн шийдийг огтлолцлын оронд нэгдлээр авах.", "**4. Шалгах цэг (3 мин):** 1) 5x − 6 < −26; 2) Систем: x > −3 ба x ≤ 2. Завсраар бич. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Хархорин руу аялал»: Арвайхээрээс Хархорин ≈ 140 км. Машин 100 км-т 9 л шатахуун зарцуулдаг, 1 л = 2 600₮. 1) x км явахад зарцуулах мөнгийг илэрхийл. 2) 40 000₮-өөс хэтрүүлэхгүй байх тэнцэтгэл биш зохиож бод. 3) Хархорин очоод буцах (280 км) боломжтой юу? 4) «Зай ≥ 140 км, мөнгө ≤ 40 000₮» нөхцөлийг систем болгож, тоон шулуун дээр дүрсэл.", "**Бүтээгдэхүүн:** Тэнцэтгэл биш, тоон шулуун, дүгнэлт бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "15": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: бүтэн квадрат ялгаж томьёо гаргах", 28], ["V. Хосын гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Хос солилцож шалгах, сайжруулах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Квадрат тэгшитгэлийг бүтэн квадрат ялгах аргаар бодож, ерөнхий томьёог гаргах, дискриминантаар шийдийн тоог шинжилж, хэмжээний бодлогод хэрэглэх.", "crit": ["Би x² + 2x − 15 = 0 зэргийг бүтэн квадрат ялгаж бодож чадна.", "Би D-ээр шийдийн тоог тогтоож, томьёогоор бодож чадна.", "Би талбайн бодлогыг квадрат тэгшитгэлээр бодож, утгагүй шийдийг хаяж чадна."], "words": "бүтэн квадрат — (x + a)²; дискриминант D = b² − 4ac; шийд (язгуур); томьёо гаргах.", "ex": [["x² + 6x − 40 = 0-ийг бүтэн квадрат ялгаж бод", "(x + 3)² = 49 → x = 4; x = −10"], ["2x² + 5x + 2 = 0-ийг томьёогоор бод", "D = 9, x = (−5 ± 3)/4 → −1/2; −2"], ["x² − 4x + 7 = 0 хэдэн шийдтэй вэ?", "D = 16 − 28 = −12 < 0 → бодит шийдгүй"]], "ck": [["x² − 8x + 15 = 0-ийг бүтэн квадрат ялгаж бод", "(x − 4)² = 1 → x = 5; 3"], ["x² − 10x + 25 = 0-ийн D ба шийд", "D = 0, x = 5"]], "ws": [["Сэргээх", ["(x − 5)²", "x² = 9/4"]], ["Дадлага 1", ["x² + 4x + __ = (x + 2)²", "x² − 7x + 12 = 0"]], ["Дадлага 2", ["x² + 12x = 28-ыг бүтэн квадрат ялгаж бод", "2x² − 5x + 4 = 0-ийн D ба шийдийн тоо"]], ["★ Сорилт", ["x² + kx + 9 = 0 нэг шийдтэй байх k", "Алдааг ол: x² − 3x − 10 = 0, D = 9 − 40 = −31 тул шийдгүй"]], ["Хэрэглээ", ["Тэгш өнцөгт хашааны урт нь өргөнөөсөө 2 м илүү, талбай 24 м². Талуудыг ол."]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "x² − 7x + 12 = 0", "3a² − 6a = 0", "16y² − 9 = 0", "2x² − 5x + 4 = 0", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>7</mn><mi>x</mi><mo>&#x0002B;</mo><mn>12</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>6</mn><mi>a</mi><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ __(Олонлог 10, Дасгал 6 №1)__"], "quiz": ["x² + 2x − 15 = 0-ийг бүтэн квадрат ялгаж бод", "x² − 4x + 5 = 0-ийн D ба шийдийн тоо", "Талбайн урт өргөнөөсөө 3 м илүү, талбай 40 м². Өргөн нь хэд вэ?"], "key": [["III. Суурь сэргээх", ["1) x² + 6x + 9", "2) 25", "3) x = ±7"]], ["Жишээ 1–3", ["Жишээ 1: (x + 3)² = 49 → x = 4; x = −10", "Жишээ 2: D = 9, x = (−5 ± 3)/4 → −1/2; −2", "Жишээ 3: D = 16 − 28 = −12 < 0 → бодит шийдгүй"]], ["Шалгах цэг", ["1) (x − 4)² = 1 → x = 5; 3", "2) D = 0, x = 5"]], ["I. Ажлын хуудас", ["№1: x² − 10x + 25", "№2: x = ±3/2", "№3: 4", "№4: x = 3; 4", "№5: (x + 6)² = 64 → x = 2; −14", "№6: D = 25 − 32 = −7 → шийдгүй", "№7: k² − 36 = 0 → k = ±6", "№8: c = −10 тул D = 9 + 40 = 49; x = 5; −2", "№9: x(x + 2) = 24 → x = 4 (−6 тохирохгүй): 4 м, 6 м"]], ["Багийн даалгавар", ["(x − 3)² = 4 → x = 1; 5 (D = 16). (x − 3)² = 0 → x = 3 (D = 0). (x − 3)² = −4 → шийдгүй (D = −16).", "D = 36 − 4c: c < 9 — 2 шийд; c = 9 — 1 шийд; c > 9 — шийдгүй.", "Орой (3; c − 9): OX-ээс доор бол 2, OX дээр бол 1, дээр бол 0 огтлох цэг."]], ["II. Гэрийн даалгавар", ["№1: x = 3; 4", "№2: 3a(a − 2) = 0 → a = 0; 2", "№3: y = ±3/4", "№4: D = −7 < 0, шийдгүй", "№5: 3; 4 ба 0; 2"]], ["III. Гарах тасалбар", ["№1: (x + 1)² = 16 → x = 3; −5 (шалгуур 1)", "№2: D = −4, шийдгүй (шалгуур 2)", "№3: x(x + 3) = 40 → x = 5 м (шалгуур 3)"]]], "F": ["ax^{2}+bx+c=0", "D=b^{2}-4ac", "x_{1,2}=\\frac{-b\\pm\\sqrt{D}}{2a}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mi>b</mi><mi>x</mi><mo>&#x0002B;</mo><mi>c</mi><mo>&#x0003D;</mo><mn>0</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D</mi><mo>&#x0003D;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn><mi>a</mi><mi>c</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>x</mi><mrow><mn>1</mn><mo>&#x0002C;</mo><mn>2</mn></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mo>&#x02212;</mo><mi>b</mi><mi>&#x000B1;</mi><msqrt><mrow><mi>D</mi></mrow></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-15"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-15"], ["PhET «Graphing Quadratics»", "https://phet.colorado.edu/en/simulations/graphing-quadratics"], ["Квадрат тэгшитгэлийн томьёо (видео)", "https://youtu.be/-i9FCIdnKLo"], ["Mozaik: «квадрат тэгшитгэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L15.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>7</mn><mi>x</mi><mo>&#x0002B;</mo><mn>12</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>6</mn><mi>a</mi><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "3; 4 ба 0; 2", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16</mn><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>9</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "±3/4", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>5</mn><mi>x</mi><mo>&#x0002B;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "D = −7 < 0 → шийдгүй", "Олонлог 10, Дасгал 6 №1"]], "tb": [], "digital": false, "stype": "B", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Бүтэн болгох»:** Бүтэн квадрат ялгахдаа дутуу хэсгийг нэмж бүхэл болгодог. Багт ч бусдынхаа дутууг нөхөж байж бүхэл болно. Асуулт: «Би хосынхоо ямар дутууг нөхөж чадах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) (x + 3)²-ийг задал; 2) x² + 10x + __ = (x + 5)²; 3) x² = 49", "**Холбоос (1 мин):** 8 дугаар ангид квадрат тэгшитгэлийг томьёогоор бодсон (Олонлог 8, х. 3); өнөөдөр тэр томьёо хаанаас гардгийг гаргана."]], ["IV. Самбарын тайлбар: бүтэн квадрат ялгаж томьёо гаргах", ["**Асуудал:** Хашааны талбай x² + 6x = 40 м². x-ийг томьёогүйгээр хэрхэн олох вэ? Аль-Хорезми үүнийг 1200 жилийн өмнө квадратыг «нөхөж» бодсон.", "**1. Гол санаа (самбарт):** Бүтэн квадрат ялгах: x² + bx = (x + b/2)² − (b/2)². Жишээ: x² + 6x − 40 = 0 → (x + 3)² = 49 → x + 3 = ±7 → x = 4, x = −10.", "   Гаргалгаа (самбарт алхамчлан): ax² + bx + c = 0 → x² + (b/a)x = −c/a → (x + b/(2a))² = (b² − 4ac)/(4a²) → x = (−b ± √D)/(2a). D > 0 — 2 шийд, D = 0 — 1 шийд, D < 0 — бодит шийдгүй.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): x² + 6x − 40 = 0-ийг бүтэн квадрат ялгаж бод", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 2x² + 5x + 2 = 0-ийг томьёогоор бод", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x² − 4x + 7 = 0 хэдэн шийдтэй вэ?", "**3. Түгээмэл алдаа:** b сөрөг үед b²-ийг сөрөг гэх ((−5)² = 25); 2a-д хуваахаа мартах; бодлогын утгад тохирохгүй (сөрөг урт) шийдийг үлдээх.", "**4. Шалгах цэг (3 мин):** 1) x² − 8x + 15 = 0-ийг бүтэн квадрат ялгаж бод; 2) x² − 10x + 25 = 0-ийн D ба шийд. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Шийдийг шинжлэх»: x² − 6x + 5 = 0; x² − 6x + 9 = 0; x² − 6x + 13 = 0; x² − 6x + c = 0. 1) Эхний 3-ыг (x − 3)² = … хэлбэрт оруулж бод. 2) D-г олж шийдийн тоог тайлбарла. 3) c-ийн ямар утганд 2, 1, 0 шийдтэй вэ? 4) y = x² − 6x + c-ийн оройтой холбож тайлбарла.", "**Бүтээгдэхүүн:** Бодолт ба тайлбар бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "16": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Биквадрат ба рационал тэгшитгэлийг орлуулга, хуваарь арилгах замаар квадрат тэгшитгэлд шилжүүлж бодох, гаднын шийдийг илрүүлэх, ажлын бодлогод хэрэглэх.", "crit": ["Би x⁴ − 17x² + 16 = 0 зэргийг орлуулгаар бодож чадна.", "Би рационал тэгшитгэлийн гаднын шийдийг илрүүлж чадна.", "Би хамтын ажлын бодлогыг тэгшитгэлээр бодож чадна."], "words": "биквадрат тэгшитгэл — ax⁴ + bx² + c = 0; орлуулга — x² = t; рационал тэгшитгэл — хувьсагч хуваарьт; гаднын шийд — хуваарийг 0 болгодог шийд.", "ex": [["x⁴ − 7x² + 12 = 0", "t² − 7t + 12 = 0 → t = 3; 4 → x = ±√3; ±2"], ["x⁴ + 9x² + 18 = 0", "t = −3; −6 — сөрөг тул бодит шийдгүй"], ["x/(x − 2) − 8/(x² − 4) = 1", "x ≠ ±2; x(x + 2) − 8 = x² − 4 → x = 2 — гаднын шийд, тэгшитгэл шийдгүй"]], "ck": [["x⁴ − 5x² + 4 = 0", "t = 1; 4 → x = ±1; ±2"], ["x + 6/x = 5", "x² − 5x + 6 = 0 → x = 2; 3 (x ≠ 0)"]], "ws": [["Сэргээх", ["t² − 13t + 36 = 0", "x² = 5"]], ["Дадлага 1", ["x⁴ − 13x² + 36 = 0", "x⁴ − 16 = 0"]], ["Дадлага 2", ["(x + 5)/(x − 1) = x + 1", "y⁴ − y² − 2 = 0"]], ["★ Сорилт", ["2/(x − 2) + 1 = 8/(x² − 4)", "x⁴ − 3x² − 4 = 0"]], ["Хэрэглээ", ["Хоёр хоолой савыг хамтдаа 6 цагт дүүргэнэ. Нэг нь нөгөөгөөсөө 5 цагаар хурдан. Тус бүр хэдэн цагт дүүргэх вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "x⁴ − 10x² + 9 = 0", "x⁴ + x² − 20 = 0", "x + 12/x = 7", "(x² − 9)/(x − 3) = 2x", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><msup><mi>x</mi><mrow><mn>4</mn></mrow></msup><mo>&#x02212;</mo><mn>7</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧ __(Олонлог 10, Дасгал 6 №1)__"], "quiz": ["x⁴ − 17x² + 16 = 0", "(x² − 1)/(x + 1) = 3", "Тэгшитгэл бодоход x = 2 гарсан, харин хуваарь нь (x − 2). Хариу юу вэ?"], "key": [["III. Суурь сэргээх", ["1) t = 1; 4", "2) x = ±3", "3) x(x + 2)"]], ["Жишээ 1–3", ["Жишээ 1: t² − 7t + 12 = 0 → t = 3; 4 → x = ±√3; ±2", "Жишээ 2: t = −3; −6 — сөрөг тул бодит шийдгүй", "Жишээ 3: x ≠ ±2; x(x + 2) − 8 = x² − 4 → x = 2 — гаднын шийд, тэгшитгэл шийдгүй"]], ["Шалгах цэг", ["1) t = 1; 4 → x = ±1; ±2", "2) x² − 5x + 6 = 0 → x = 2; 3 (x ≠ 0)"]], ["I. Ажлын хуудас", ["№1: t = 4; 9", "№2: x = ±√5", "№3: x = ±2; ±3", "№4: x² = 4 (x² = −4 хаяна) → x = ±2", "№5: x + 5 = x² − 1 → x² − x − 6 = 0 → x = 3; −2 (x ≠ 1)", "№6: t = 2 (−1 хаяна) → y = ±√2", "№7: x² + 2x − 8 = 0 → x = 2 (гаднын) ба x = −4 → x = −4", "№8: t = 4 (−1 хаяна) → x = ±2", "№9: 1/x + 1/(x + 5) = 1/6 → x² − 7x − 30 = 0 → x = 10: 10 ба 15 цаг"]], ["Багийн даалгавар", ["1: 2t² − 7t − 4 = 0 → t = 4 (−1/2 хаяна) → x = ±2; (a² − 5)² = 0 → a = ±√5.", "2: x(x + 2)/(x + 2) = x = 4 (x ≠ −2); (x + 3) + (x − 3) = 6 → x = 3, гэвч x ≠ 3 → шийдгүй.", "3: 5x² − 14x − 24 = 0 → x = 4 (−1,2 хаяна): 4 ба 6 өдөр."]], ["II. Гэрийн даалгавар", ["№1: x = ±1; ±3", "№2: t = 4 (−5 хаяна) → x = ±2", "№3: x² − 7x + 12 = 0 → x = 3; 4", "№4: x + 3 = 2x → x = 3, гэвч x ≠ 3 → шийдгүй", "№5: t = 4 → x = ±2 (t = −1/2 тохирохгүй)"]], ["III. Гарах тасалбар", ["№1: x = ±1; ±4 (шалгуур 1)", "№2: x − 1 = 3 → x = 4 (x ≠ −1) (шалгуур 2)", "№3: x = 2 гаднын шийд тул хаяна (шалгуур 3)"]]], "F": ["x^{4}-5x^{2}+4=0,\\quad t=x^{2}\\ge 0", "\\frac{P(x)}{Q(x)}=0\\ \\Leftrightarrow\\ P(x)=0,\\ Q(x)\\ne 0"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>4</mn></mrow></msup><mo>&#x02212;</mo><mn>5</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>t</mi><mo>&#x0003D;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02265;</mo><mn>0</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>P</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow><mrow><mi>Q</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></mfrac><mo>&#x0003D;</mo><mn>0</mn><mtext>&#x000A0;</mtext><mo>&#x021D4;</mo><mtext>&#x000A0;</mtext><mi>P</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mn>0</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>Q</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x02260;</mo><mn>0</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-16"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-16"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Квадрат тэгшитгэлд шилжүүлэх (видео)", "https://youtu.be/v_eBNfOzEbQ"], ["Mozaik: «биквадрат тэгшитгэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L16.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><msup><mi>x</mi><mrow><mn>4</mn></mrow></msup><mo>&#x02212;</mo><mn>7</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "t = 4 → x = ±2 (t = −1/2 тохирохгүй)", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y</mi><mrow><mn>4</mn></mrow></msup><mo>&#x02212;</mo><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>2</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "y = ±√2", "Олонлог 10, Дасгал 6 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>4</mn></mrow></msup><mo>&#x0002B;</mo><mn>9</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mn>18</mn><mo>&#x0003D;</mo><mn>0</mn></mrow></math>⟧", "t = −3; −6 < 0 → шийдгүй", "Олонлог 10, Дасгал 6 №1"]], "tb": [], "digital": false, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Зорилгоо мартахгүй»:** x² = t орлуулгаар хэцүү тэгшитгэл энгийн болдог. Гэхдээ эцэст нь x руу буцахаа мартвал бодлого дуусахгүй. Асуулт: «Өнөөдрийн миний гол зорилго юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) t² − 5t + 4 = 0; 2) x² = 9; 3) 1/x + 1/(x + 2)-ийн ерөнхий хуваарь", "**Холбоос (1 мин):** 8 дугаар ангид хялбар рационал тэгшитгэл (Олонлог 8, х. 3), №15-д квадрат тэгшитгэл бодсон; өнөөдөр хоёрыг холбоно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Нэг бригад гэрийг нөгөөгөөсөө 2 өдрөөр хурдан барьдаг. Хамтдаа 2,4 өдөрт барьдаг. Тус тусдаа хэдэн өдөрт барих вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Биквадрат: ax⁴ + bx² + c = 0 → x² = t (t ≥ 0) → at² + bt + c = 0 → x = ±√t. Сөрөг t-ийг хаяна.", "   Рационал: 1) хуваарь ≠ 0 нөхцөл; 2) ерөнхий хуваариар үржүүлж хуваарийг арилгана; 3) гарсан тэгшитгэлийг бодно; 4) нөхцөлөөр шалгаж гаднын шийдийг хаяна.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): x⁴ − 7x² + 12 = 0", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): x⁴ + 9x² + 18 = 0", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x/(x − 2) − 8/(x² − 4) = 1", "**3. Түгээмэл алдаа:** t-г олоод x руу буцахаа мартах; сөрөг t-ээс язгуур гаргах; гаднын шийдийг шалгалгүй үлдээх.", "**4. Шалгах цэг (3 мин):** 1) x⁴ − 5x² + 4 = 0; 2) x + 6/x = 5. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 3 станц (6 минут тутам шилжинэ). 1 «Биквадрат»: 2x⁴ − 7x² − 4 = 0; a⁴ − 10a² + 25 = 0. 2 «Гаднын шийд»: (x² + 2x)/(x + 2) = 4; 1/(x − 3) + 1/(x + 3) = 6/(x² − 9). 3 «Ажлын бодлого»: бригадын бодлогыг 1/x + 1/(x + 2) = 1/2,4 тэгшитгэлээр бод.", "**Бүтээгдэхүүн:** Станц бүрийн бодолт бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "17": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Бодит нөхцөлөөс хоёр хувьсагчтай шугаман тэнцэтгэл биш зохиож, тэдгээрийн системийн шийдийн мужийг координатын хавтгайд байгуулах, оройг олох, хувилбарыг шалгах.", "crit": ["Би цэг тэнцэтгэл бишийн шийд мөн эсэхийг шалгаж чадна.", "Би системийн шийдийн мужийг зурж, оройг олж чадна.", "Би бодит нөхцөлөөс систем зохиож, хувилбарыг үнэлж чадна."], "words": "хагас хавтгай — шулууны нэг тал; шийдийн муж; тасархай шулуун (<, >); бүтэн шулуун (≤, ≥); шалгах цэг.", "ex": [["y > 3/2·x + 1-ийн шийдийн мужийг дүрсэл", "(0; 1), (2; 4)-өөр тасархай шулуун; (0; 0): 0 > 1 худал → шулуунаас дээш будна"], ["(4; 3) цэг {x + y ≤ 6, x ≥ 0, y ≥ 0}-ийн шийд мөн үү?", "4 + 3 = 7 > 6 → үгүй"], ["{x + y ≥ 2, y ≤ 3, x ≤ 2}-ийн мужийг зурж оройг ол", "(−1; 3), (2; 0), (2; 3) оройтой гурвалжин"]], "ck": [["(2; 2) цэг {x + y ≤ 5, x ≥ 0, y ≥ 0}-ийн шийд мөн үү?", "4 ≤ 5 → тийм"], ["2x + 3y ≤ 12-ийн шулууны OX, OY огтлох цэгүүд", "(6; 0), (0; 4)"]], "ws": [["Сэргээх", ["y = −x + 3 шулууны OX, OY огтлох цэгүүд", "(−1; 2) цэгийг y = 2x + 4-д орлуулж шалга"]], ["Дадлага 1", ["(1; 5) цэг y > 2x-ийн шийд мөн үү?", "y ≤ x + 1-ийн шулуун бүтэн үү, тасархай юу? (0; 0) аль талд?"]], ["Дадлага 2", ["x + 2y ≤ 4-ийн шийдийн мужийг дүрсэл", "(3; 1) ба (1; 3) цэгийн аль нь {x + y ≤ 4, y ≤ 2}-ийн шийд вэ?"]], ["★ Сорилт", ["(3; 10) цэг {x + y ≥ 12, x + 3y ≤ 36, x < y}-ийн шийд мөн үү?", "x ≥ 0, y ≥ 0, x + y ≤ 5 мужийн оройнууд ба талбай"]], ["Хэрэглээ", ["Ширээ (x) 2 цаг, сандал (y) 1 цаг шаарддаг; 7 хоногт 40 цаг. Тэнцэтгэл биш бичиж, (15; 12)-ыг шалга."]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "y > 2x − 1-ийн мужийг дүрсэл", "(2; 3) цэг {2x + 3y ≤ 12, x ≥ 0, y ≥ 0}-ийн шийд мөн үү?", "{x ≥ 0, y ≥ 0, x + y ≤ 4} мужийн оройнууд", "3x + 2y ≤ 6-ийн шулууны огтлох цэгүүд", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x0007B;</mo><mtable><mtr><mtd columnalign=\"left\"><mn>6</mn><mi>x</mi><mo>&#x02212;</mo><mn>7</mn><mo>&#x0003E;</mo><mn>40</mn></mtd></mtr><mtr><mtd columnalign=\"left\"><mn>5</mn><mo>&#x02212;</mo><mn>2</mn><mi>x</mi><mo>&#x0003E;</mo><mo>&#x02212;</mo><mn>8</mn></mtd></mtr></mtable></mrow></mrow></math>⟧ __(Олонлог 10, Дасгал 6 №5)__"], "quiz": ["(0; −3) цэг y >
