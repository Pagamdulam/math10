<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математик X: 54 хичээл ба тестийн сан</title>
<style>
:root{
  /* Layout: sticky top nav; home = four entry tiles + 13 units of lesson cards; lesson, level-check,
     assessment and teacher views share one centered column. Exponents in burnt orange, accent in deep blue. */
  --paper:#f3f5f2; --surface:#ffffff; --ink:#1b2735; --muted:#5b6876; --line:#d5dbd7;
  --accent:#0a5f8a; --accent-soft:#e2eef5; --exp:#c2410c;
  --good:#2f7d3a; --good-soft:#e4f2e6; --warn:#a15c00; --warn-soft:#fbf0dc; --bad:#b42323; --bad-soft:#fae8e8;
  --grid:rgba(10,95,138,.055);
  --display:"Rubik","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111920; --surface:#19242e; --ink:#e6ecf1; --muted:#9db0bf; --line:#2b3946;
  --accent:#62b4dd; --accent-soft:#17303f; --exp:#fb923c;
  --good:#6cc47a; --good-soft:#163022; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#f07a7a; --bad-soft:#3a1c1e;
  --grid:rgba(98,180,221,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111920; --surface:#19242e; --ink:#e6ecf1; --muted:#9db0bf; --line:#2b3946;
  --accent:#62b4dd; --accent-soft:#17303f; --exp:#fb923c;
  --good:#6cc47a; --good-soft:#163022; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#f07a7a; --bad-soft:#3a1c1e;
  --grid:rgba(98,180,221,.05); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
sup{color:var(--exp);font-weight:700;font-size:.68em;line-height:0}
.rad{white-space:nowrap}.rad .rc{display:inline-block;line-height:1;border-top:.07em solid currentColor;padding:.1em .1em 0 .05em;margin-left:.01em}
.vec{position:relative;display:inline-block;padding-top:.15em}.vec::before{content:"→";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);font-size:.7em;line-height:1}
.mat{font-variant-numeric:tabular-nums;white-space:nowrap}
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px max(16px,3vw)}
.brand{font-family:var(--display);font-size:18px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;background:var(--accent);color:var(--surface);border-radius:8px;padding:2px 8px;font-size:15px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav a{border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tchip{font-size:12.5px;border-radius:999px;padding:3px 9px;background:var(--warn-soft);color:var(--warn);font-weight:600}
main{max-width:1120px;margin:0 auto;padding:22px max(16px,3vw) 60px}
.lead{color:var(--muted);max-width:70ch;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 28px}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}
.tile b{font-family:var(--display);font-size:18px;font-weight:500;display:block;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14.5px}
.tile:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lc{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.lc:hover{border-color:var(--accent)}
.lc .no{font-family:var(--display);font-size:15px;min-width:2.2em;height:2.2em;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lc.as .no{background:var(--warn-soft);color:var(--warn)}
.lc .t{font-size:14.5px;line-height:1.35}
.lc .c{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-left:4px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stack{display:grid;gap:14px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted)}
.pill{display:inline-block;font-size:13px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.note{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:15px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.s{font-size:14px;padding:5px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.items{display:grid;gap:12px;counter-reset:q}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:9px}
.item.ok{border-left-color:var(--good)} .item.no{border-left-color:var(--bad)}
.q{font-size:17.5px;font-variant-numeric:tabular-nums}
.q .n{color:var(--muted);margin-right:.35em;font-size:.9em}
.q .src{font-size:12px;color:var(--muted);margin-left:.5em}
.in{flex:0 1 200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;text-align:left}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-size:14.5px} .fb.g{color:var(--good)} .fb.b{color:var(--bad)}
.sol{font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.sol b{color:var(--accent)}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:600}
.scroll{overflow-x:auto}
.score{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.big{font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums}
.lv{font-weight:700;border-radius:8px;padding:4px 10px}
.lv.A{background:var(--good-soft);color:var(--good)} .lv.B{background:var(--warn-soft);color:var(--warn)} .lv.C{background:var(--bad-soft);color:var(--bad)}
.alist{display:grid;gap:8px}
.arow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.arow b{font-weight:600}
.arow small{color:var(--muted)}
.muted{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
textarea.copy{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:50;padding:16px}
.dlg.on{display:grid}
.dlg .card{max-width:380px;width:100%}

.h1{font-size:27px;margin:6px 0 4px}
.sec{font-size:20px;margin:26px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400}
.st{font-size:15px;line-height:1;margin-left:auto;flex:none}
.st.m{color:#d99a00;font-weight:700} .st.p{color:var(--accent)} .st.n{color:var(--line)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch;margin-bottom:6px}
.hero h1{font-size:30px}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14.5px}
.stats b{font-family:var(--display);color:var(--accent)}
.cont{display:flex;flex-direction:column;gap:4px;justify-content:center;background:var(--accent);color:var(--surface);border-radius:14px;padding:18px 20px;text-decoration:none}
.cont small{opacity:.85}
.cont b{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.25}
.cont span{font-weight:600;margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fc{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--exp);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:14.5px}
.fc span:not(.st){flex:1}
.fc:hover{border-color:var(--exp)}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
details.unit[open]{padding-bottom:14px}
details.unit summary{cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 0;list-style:none}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.unit[open] summary::before{transform:rotate(90deg)}
.uh{font-family:var(--display);font-size:17px;flex:1}
.bar{width:90px;height:7px;border-radius:9px;background:var(--accent-soft);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:#d99a00}
details.unit summary small{color:var(--muted);min-width:3.2em;text-align:right}
.hook{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.lhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.stepper{display:flex;gap:6px;margin:14px 0;overflow-x:auto;position:sticky;top:57px;z-index:5;background:var(--paper);padding:6px 0}
.stepper button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;white-space:nowrap;font-size:15px}
.stepper button span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.stepper button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stepper button.on span{background:var(--accent);color:var(--surface)}
.prose p,.prose ul{margin:.4em 0} .prose ul{padding-left:1.2em}
.prose code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:17px;font-variant-numeric:tabular-nums}
.steps li{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exans{color:var(--good);font-size:16px}
.twin{border-top:1px dashed var(--line);padding-top:10px}
.twh{font-weight:600;margin-bottom:6px;color:var(--exp)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dots i.g{background:var(--good);border-color:var(--good)} .dots i.b{background:var(--bad);border-color:var(--bad)}
.celebrate{margin-top:12px;background:#fff6dc;border:2px solid #d99a00;color:#5a4100;border-radius:12px;padding:14px;display:grid;gap:10px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.warnbox{margin-top:12px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px}
.okbox{margin-top:12px;background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 12px}
.tkey{font-size:14px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin-top:6px}
.codebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.codebox.col{flex-direction:column;align-items:stretch;background:none;padding:0}
textarea.copy.small{min-height:44px;flex:1 1 220px;font-size:12px}
.chk{display:flex;gap:5px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.cycle{padding-left:1.2em;display:grid;gap:6px;max-width:80ch}
/* widgets */
.wg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.wtitle{font-family:var(--display);font-size:17px;margin-bottom:8px}
.wbody{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:16px;align-items:start}
.wfig.full{grid-column:1/-1}
.wsvg{width:100%;height:auto;display:block;background:var(--paper);border-radius:10px;touch-action:pan-y}
.wsvg.wide{max-width:none}
.wgr{stroke:var(--line);stroke-width:.6} .wax{stroke:var(--muted);stroke-width:1.2}
.wlbl{fill:var(--ink);font-size:13px;font-family:var(--body)} .wtick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.wc1{stroke:var(--accent);stroke-width:2.6;fill:none} .wc2{stroke:var(--exp);stroke-width:2.6;fill:none} .wc3{stroke:var(--good);stroke-width:2;fill:none}
.dash{stroke-dasharray:6 5} .thick{stroke-width:5} .nofill{fill:none}
.wd1{fill:var(--accent)} .wd2{fill:var(--exp)}
.wv1{stroke:var(--accent);stroke-width:3} .wv2{stroke:var(--exp);stroke-width:3} .wv3{stroke:var(--good);stroke-width:3.4}
.wv1f{fill:var(--accent)} .wv2f{fill:var(--exp)} .wv3f{fill:var(--good)}
.wfill{fill:var(--accent);opacity:.14}
.wpoly0{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2}
.wpoly1{fill:var(--exp);fill-opacity:.25;stroke:var(--exp);stroke-width:2}
.wside{display:grid;gap:10px}
.wsl{display:grid;gap:2px;font-size:14.5px}
.wsl input{width:100%;accent-color:var(--accent)}
.wsl b{font-family:var(--display);color:var(--exp)}
.wbtns{display:flex;flex-wrap:wrap;gap:6px}
.wbtns .on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.wout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6}
.k2{color:var(--exp);font-weight:700} .k3{color:var(--good);font-weight:700}

.teach{display:grid;gap:10px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;position:sticky;top:0;z-index:5}
.tstage{flex:1;min-width:200px}
.ttime{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
.ttime.big{font-size:44px;text-align:left}
.ttime.over{color:var(--bad)}
.tcount{color:var(--muted);font-size:14px}
.tprog{display:flex;gap:3px;height:6px}
.tprog i{border-radius:4px;background:var(--line)} .tprog i.d{background:var(--good)} .tprog i.c{background:var(--accent)}
.tslide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 30px;min-height:68vh;font-size:clamp(18px,2.1vw,26px);line-height:1.5}
.th{font-size:clamp(26px,3.2vw,42px);margin:8px 0 12px}
.th small{font-family:var(--body);font-size:.45em;color:var(--muted);font-weight:400}
.tl{font-size:1em} .tl.big{font-size:1.2em}
.tslide h3{font-size:.95em;margin:16px 0 6px;color:var(--accent)}
.crit{margin:0;padding-left:1.3em} .tq{padding-left:1.3em;display:grid;gap:14px}
.tq .rv{color:var(--good);font-size:.85em;margin-top:4px}
.steps.big{font-size:1.1em;gap:10px}
.q2{font-family:var(--body);font-weight:400}
.mist li{margin:8px 0}
.url{color:var(--accent);word-break:break-all}
.lvbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tslide .wg{font-size:16px}
.tstrip{margin:4px 0 6px;gap:8px}
#pick{place-items:center}
.pickcard{background:var(--surface);border-radius:20px;padding:30px 40px;display:grid;gap:16px;text-align:center;min-width:min(90vw,460px)}
.pname{font-family:var(--display);font-size:clamp(36px,6vw,64px);color:var(--muted)}
.pname.final{color:var(--accent);animation:pop .4s ease}
.btn.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* board */
.boardmode .top{display:none}
.board{display:grid;gap:18px;min-height:85vh;align-content:start}
.bq{font-size:clamp(26px,4.2vw,48px);line-height:1.35;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 30px;font-variant-numeric:tabular-nums}
.bn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:var(--surface);font-size:.6em;margin-right:.5em;vertical-align:middle}
.bopts{display:flex;flex-wrap:wrap;gap:12px 30px;font-size:.8em;margin-top:14px}
.bans{font-size:clamp(20px,3vw,34px);background:var(--good-soft);border-radius:14px;padding:16px 22px}
.bsol{font-size:.8em}
.bctl .btn{font-size:20px;padding:10px 22px}
@media (max-width:720px){.h1{font-size:22px}.hero h1{font-size:25px}.lead{font-size:15px}.note{line-height:1.85}.hero{grid-template-columns:1fr}.wbody{grid-template-columns:1fr}.stepper{top:0}.top{position:static}.q{font-size:17px}.bar{width:50px}}

@media print{.top,.pager,.noprint{display:none!important} body{background:#fff}}
@media (max-width:640px){.nav{margin-left:0}.big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.item,.card{transition:border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><i>X</i>Математик · 1-р курс</a>
  <nav class="nav" aria-label="Үндсэн цэс">
    <a href="#home" data-v="home">Нүүр</a>
    <a href="#lessons" data-v="lessons">Хичээлүүд</a>
    <a href="#review" data-v="review">Давтлага</a>
    <a href="#level" data-v="level">Түвшин</a>
    <a href="#assess" data-v="assess">Сорил</a>
    <a href="#teacher" data-v="teacher">Багшид</a>
  </nav>
  <span class="tchip" id="tchip" hidden>Багшийн горим</span>
</header>
<main id="app"></main>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <form class="card stack" id="dlgF">
    <h2 id="dlgT" style="font-size:20px">Багшийн горим</h2>
    <p class="muted" style="margin:0">Бодолт, хариуны түлхүүрийг харахын тулд багшийн кодыг оруулна уу.</p>

<script>
/* ===== Math 10 question bank: generators with exact answers and worked solutions ===== */
const M = (() => {
"use strict";
/* --- seeded rng --- */
function rng(seed){let a=seed>>>0;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  f.int=(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)); f.pick=a=>a[Math.floor(f()*a.length)];
  f.nz=(lo,hi)=>{let v;do{v=f.int(lo,hi)}while(v===0);return v};
  f.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  return f;}
/* --- rationals --- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function Q(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const add=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d), sub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d),
  mul=(a,b)=>Q(a.n*b.n,a.d*b.d), div=(a,b)=>Q(a.n*b.d,a.d*b.n);
function qpow(a,e){if(e===0)return Q(1);if(e<0)return qpow(Q(a.d,a.n),-e);return Q(a.n**e,a.d**e)}
const val=q=>q.n/q.d;
const mn=x=>String(x).replace("-","−");
function qs(q){return q.d===1?mn(q.n):`${mn(q.n)}/${q.d}`}
function qsp(q){return(q.d!==1||q.n<0)?`(${qs(q)})`:qs(q)}  // parenthesised for bases
const S=e=>`<sup>${mn(e)}</sup>`;
const sgn=(k,first)=>k<0?(first?"−":" − ")+Math.abs(k):(first?""+k:" + "+k);
function lin(a,b,v="x"){ // a·x + b
  let s=a===1?v:a===-1?"−"+v:mn(a)+v; if(b) s+=sgn(b); return s}
function poly2(a,b,c,v="x"){let s=(a===1?"":a===-1?"−":mn(a))+v+"²";
  if(b) s+=(b<0?" − ":" + ")+(Math.abs(b)===1?"":Math.abs(b))+v; if(c) s+=sgn(c); return s}
/* --- item builders --- */
function num(q,ans,sol,hint){return{type:"num",q,ans:typeof ans==="number"?ans:val(ans),ansText:typeof ans==="number"?mn(ans):qs(ans),sol,hint}}
function mc(r,q,right,wrongs,sol){const set=[right];for(const w of wrongs){if(!set.includes(w)&&set.length<4)set.push(w)}
  const opts=r.shuffle(set);return{type:"mc",q,opts,c:opts.indexOf(right),ansText:right,sol}}
const sq=n=>Math.round(Math.sqrt(n))**2===n;
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
const RT=n=>n===2?"√":`<sup>${n}</sup>√`;

/* ===================== generators by lesson ===================== */
const G={};
// 1 integer exponents
G[1]=[
 r=>{const a=r.pick([2,3,4,5,10]),n=r.int(-3,0);const v=qpow(Q(a),n);
   return num(`${a}${S(n)}`,v,n===0?`Тэгээс ялгаатай тооны 0 зэрэг 1: ${a}⁰ = 1`:`${a}${S(n)} = 1/${a}${S(-n)} = ${qs(v)}`,"a⁻ⁿ = 1/aⁿ, a⁰ = 1")},
 r=>{const a=r.pick([2,3,5]);let m,n,k,e;do{m=r.int(-4,5);n=r.int(-4,5);k=r.int(-4,5);e=m+n-k}while(e<-3||e>3);
   const v=qpow(Q(a),e);return num(`${a}${S(m)} · ${a}${S(n)} : ${a}${S(k)}`,v,`Илтгэгч: ${mn(m)} + ${n<0?"("+mn(n)+")":n} − ${k<0?"("+mn(k)+")":k} = ${mn(e)}, тэгэхээр ${a}${S(e)} = ${qs(v)}`,"Үржихэд илтгэгч нэмэгдэж, хуваахад хасагдана")},
 r=>{let p,q;do{p=r.int(1,4);q=r.int(2,6)}while(p>=q||gcd(p,q)>1);const n=r.int(1,3);const v=qpow(Q(q,p),n);
   return num(`(${p}/${q})${S(-n)}`,v,`(${p}/${q})${S(-n)} = (${q}/${p})${S(n)} = ${qs(v)}`,"(a/b)⁻ⁿ = (b/a)ⁿ")},
 r=>{const a=r.pick([2,3,4,5]),b=r.pick([2,3,4,6]),c=r.int(2,9);const v=add(add(Q(1,a),Q(1,b)),Q(1));
   return num(`${a}${S(-1)} + ${b}${S(-1)} + ${c}${S(0)}`,v,`1/${a} + 1/${b} + 1 = ${qs(v)}`,"Гишүүн бүрийг тусад нь ол")},
 r=>{const a=r.pick([2,3]),m=r.int(2,4),n=r.int(-3,-1);const e=m*n;const v=qpow(Q(a),e);
   return num(`(${a}${S(m)})${S(n)}`,v,`(${a}${S(m)})${S(n)} = ${a}${S(e)} = ${qs(v)}`,"(aᵐ)ⁿ = aᵐⁿ")}
];
// 2 n-th roots
G[2]=[
 r=>{const n=r.pick([3,4,5]);const b=n===3?r.int(2,5):r.int(2,3);return num(`${RT(n)}${b**n}`,b,`${b}${S(n)} = ${b**n} тул ${RT(n)}${b**n} = ${b}`,"Аль тоог n зэрэгт дэвшүүлэхэд гарах вэ?")},
 r=>{const m=r.pick([2,3,5]),s=r.int(1,4),t=r.int(1,4);return num(`√${m*s*s} · √${m*t*t}`,m*s*t,`√(${m*s*s}·${m*t*t}) = √${m*m*s*s*t*t} = ${m*s*t}`,"√a · √b = √(ab)")},
 r=>{const [a,b,c]=r.pick([[2,4,2],[3,9,3],[5,25,5],[4,16,4],[2,32,4]]);return num(`∛${a} · ∛${b}`,c,`∛(${a}·${b}) = ∛${a*b} = ${c}`,"ⁿ√a · ⁿ√b = ⁿ√(ab)")},
 r=>{const k=r.int(2,6),m=r.pick([2,3,5,6,7]);return mc(r,`√${k*k*m}-ийг хялбарчил`,`${k}√${m}`,[`${m}√${k}`,`${k*k}√${m}`,`${k}√${k*m}`,`${k+m}√${m}`],`√${k*k*m} = √(${k*k}·${m}) = ${k}√${m}`)},
 r=>{const n=r.pick([3,4]);const a=2,b=r.pick([3,5]);return num(`${RT(n)}(${a**n}·${b**n})`,a*b,`${RT(n)}(${a}${S(n)}·${b}${S(n)}) = ${a}·${b} = ${a*b}`,"ⁿ√(aⁿbⁿ) = ab")}
];
// 3 rational exponents
G[3]=[
 r=>{const q=r.pick([2,3]);const b=q===2?r.int(2,9):r.int(2,5);const p=r.pick([1,2,-1,-2]);const v=qpow(Q(b),p);
   return num(`${b**q}${S(p+"/"+q)}`,v,`${b**q} = ${b}${S(q)} тул ${b**q}${S(p+"/"+q)} = ${b}${S(p)} = ${qs(v)}`,"a^(p/q) = (q√a)^p")},
 r=>{const a=r.pick([2,3,5,7]),m=r.int(1,4),n=r.pick([3,4,5]);return mc(r,`${a}${S(m+"/"+n)}-ийг язгуураар бич`,`${RT(n)}${a}${S(m)}`,[`${RT(m)}${a}${S(n)}`,`${RT(n)}${a*m}`,`${a}${S(m)}/${n}`],`a${S("m/n")} = ${RT("n")}a${S("m")} тул ${RT(n)}${a}${S(m)}`)},
 r=>{const b=r.int(2,7);const [p1,p2]=r.pick([[1,3],[3,5],[1,1]]);const e=(p1+p2)/2;return num(`${b}${S(p1+"/2")} · ${b}${S(p2+"/2")}`,b**e,`Илтгэгч: ${p1}/2 + ${p2}/2 = ${e}, тэгэхээр ${b}${S(e)} = ${b**e}`,"aᵐ · aⁿ = aᵐ⁺ⁿ")},
 r=>{const b=r.int(2,9);return num(`(${b}${S("2/3")})${S("3/2")}`,b,`Илтгэгч: 2/3 · 3/2 = 1, тэгэхээр ${b}`,"(aᵐ)ⁿ = aᵐⁿ")}
];
// 4 standard form
function decStr(a10,k){ // a10 = a*10 (int 10..99), value = a*10^k
  let digits=String(a10);let exp=k-1;
  if(exp>=0) return digits+"0".repeat(exp);
  const pos=digits.length+exp; if(pos>0) return digits.slice(0,pos)+","+digits.slice(pos);
  return "0,"+"0".repeat(-pos)+digits;}
G[4]=[
 r=>{let a10;do{a10=r.int(11,99)}while(a10%10===0);let k;do{k=r.int(-6,7)}while(k===0);const s=decStr(a10,k);
   return num(`${s} тоог a · 10ⁿ (1 ≤ a < 10) хэлбэрт бичихэд n хэд вэ?`,k,`${s} = ${String(a10/10).replace(".",",")} · 10${S(k)}`,"Таслалыг хэдэн орон шилжүүлэхийг тоол")},
 r=>{const [a,b]=r.pick([[2,3],[2,4],[3,3],[1.5,4],[2,2.5],[1.2,5]]);const m=r.int(-5,6),n=r.int(-5,6);const p=a*b;const e=m+n;
   const std=p>=10?`${String(p/10).replace(".",",")} · 10${S(e+1)}`:`${String(p).replace(".",",")} · 10${S(e)}`;
   return num(`(${String(a).replace(".",",")} · 10${S(m)}) · (${String(b).replace(".",",")} · 10${S(n)})`,p*10**e,p>=10?`${String(p).replace(".",",")} · 10${S(e)} = ${std}`:std,"Тоонуудыг хооронд нь, 10-ын зэргүүдийг хооронд нь үржүүл")},
 r=>{const b=r.pick([2,3,4]),q=r.int(2,4);const a=b*q>9?b:b*q;const qq=a/b;const m=r.int(-4,6),n=r.int(-6,4);const e=m-n;
   return num(`(${a} · 10${S(m)}) : (${b} · 10${S(n)})`,qq*10**e,`${a}:${b} = ${qq}, 10${S(m)}:10${S(n)} = 10${S(e)} тул ${qq} · 10${S(e)}`,"10ᵐ : 10ⁿ = 10ᵐ⁻ⁿ")}
];
// 5 real numbers
G[5]=[
 r=>{const items=[["−7","Бүхэл (натурал биш)"],["0","Бүхэл (натурал биш)"],["3/4","Рационал (бүхэл биш)"],["0,25","Рационал (бүхэл биш)"],["√2","Иррационал"],["π","Иррационал"],["√16","Натурал"],["12","Натурал"],["√5","Иррационал"],["−2/3","Рационал (бүхэл биш)"]];
   const [x,c]=r.pick(items);return mc(r,`${x} тоо аль ангилалд хамгийн нарийн тохирох вэ?`,c,["Натурал","Бүхэл (натурал биш)","Рационал (бүхэл биш)","Иррационал"].filter(z=>z!==c),`${x}: ${c}. N ⊂ Z ⊂ Q ⊂ R`)},
 r=>{const k=r.int(12,99),a=r.int(11,89);const b=100-a;return num(`${k} · ${a} + ${k} · ${b}`,k*100,`${k}·(${a} + ${b}) = ${k}·100 = ${k*100}`,"Хаалтаас ерөнхий үржигдэхүүн гарга")},
 r=>{let n;do{n=r.int(5,99)}while(sq(n));const lo=Math.floor(Math.sqrt(n));return mc(r,`√${n} аль хоёр дараалсан бүхэл тооны хооронд оршдог вэ?`,`${lo} ба ${lo+1}`,[`${lo-1} ба ${lo}`,`${lo+1} ба ${lo+2}`,`${lo+2} ба ${lo+3}`],`${lo}² = ${lo*lo} < ${n} < ${(lo+1)**2} = ${lo+1}²`)},
 r=>{const a=r.int(2,9),b=r.int(2,9);return num(`(√${a} + √${b})(√${a} − √${b})`,a-b,`(√${a})² − (√${b})² = ${a} − ${b} = ${mn(a-b)}`,"(x+y)(x−y) = x² − y²")}
];
// 6 algebraic expressions
G[6]=[
 r=>{const a=r.nz(-6,6);const s=a<0?"−":"+";const A=Math.abs(a);return mc(r,`(x ${s} ${A})²-ийг задал`,poly2(1,2*a,a*a),[poly2(1,0,a*a),poly2(1,a,a*a),poly2(1,2*a,-a*a),poly2(1,-2*a,a*a)],`(x ${s} ${A})² = x² ${s} 2·${A}·x + ${A*A}`)},
 r=>{const a=r.int(2,9);return mc(r,`(x − ${a})(x + ${a})-ийг хялбарчил`,poly2(1,0,-a*a),[poly2(1,0,a*a),poly2(1,-2*a,a*a),poly2(1,2*a,-a*a)],`(x − ${a})(x + ${a}) = x² − ${a*a}`)},
 r=>{const a=r.int(1,6),c=r.nz(-5,5);return num(`x = ${mn(c)} үед (x + ${a})² − (x − ${a})²-ийн утгыг ол`,4*a*c,`Хялбарчилбал 4·${a}·x = ${4*a}x; x = ${mn(c)} үед ${mn(4*a*c)}`,"Эхлээд хялбарчил")},
 r=>{const a=r.int(2,9);return mc(r,`(x² − ${a*a}) / (x + ${a})-ийг хураа`,lin(1,-a),[lin(1,a),lin(1,-a*a),"x² − "+a],`x² − ${a*a} = (x − ${a})(x + ${a}) тул x − ${a}`)},
 r=>{const a=r.int(2,5),m=r.int(2,4),n=r.int(2,4);return mc(r,`x${S(m+"/2")} · x${S(n+"/2")} · x${S(-1)}-ийг хялбарчил`,`x${S((m+n)/2-1)}`,[`x${S(m*n/4)}`,`x${S((m+n)/2+1)}`,`x${S(m+n-1)}`],`Илтгэгч: ${m}/2 + ${n}/2 − 1 = ${(m+n)/2-1}`)}
];
// 7 factoring
G[7]=[
 r=>{const k=r.int(2,6),a=r.int(1,5),b=r.int(1,7);if(gcd(a,b)>1)return G[7][1](r);return mc(r,`${k*a}x + ${k*b}-ийг үржигдэхүүнд задал`,`${k}(${a===1?"":a}x + ${b})`,[`${k*a}(x + ${b})`,`${k}(${a===1?"":a}x + ${k*b})`,`${k}(${a===1?"":a}x − ${b})`],`Ерөнхий үржигдэхүүн ${k}: ${k}(${a===1?"":a}x + ${b})`)},
 r=>{const a=r.int(2,9);return mc(r,`x² − ${a*a}-ийг задал`,`(x − ${a})(x + ${a})`,[`(x − ${a})²`,`(x + ${a})²`,`(x − ${a*a})(x + 1)`],`a² − b² = (a − b)(a + b)`)},
 r=>{let p,q;do{p=r.nz(-6,6);q=r.nz(-6,6)}while(p===q||p===-q);const f=v=>v<0?`(x − ${-v})`:`(x + ${v})`;
   return mc(r,`${poly2(1,p+q,p*q)}-ийг задал`,`${f(p)}${f(q)}`,[`${f(-p)}${f(-q)}`,`${f(p)}${f(-q)}`,`${f(p+q)}(x + 1)`],`Нийлбэр нь ${mn(p+q)}, үржвэр нь ${mn(p*q)} хоёр тоо: ${mn(p)}, ${mn(q)}`)},
 r=>{const a=r.int(1,4);return mc(r,`x³ − ${a**3}-ийг задал`,`(x − ${a})(x² + ${a===1?"":a}x + ${a*a})`,[`(x − ${a})(x² − ${a===1?"":a}x + ${a*a})`,`(x + ${a})(x² − ${a===1?"":a}x + ${a*a})`,`(x − ${a})³`],`a³ − b³ = (a − b)(a² + ab + b²)`)}
];
// 8 algebraic fractions × ÷
G[8]=[
 r=>{const a=r.int(2,7),b=r.int(1,9);return mc(r,`(x² − ${a*a})/(x + ${b}) · (x + ${b})/(x − ${a})`,lin(1,a),[lin(1,-a),lin(1,b),"1"],`(x − ${a})(x + ${a})/(x + ${b}) · (x + ${b})/(x − ${a}) = x + ${a}`)},
 r=>{const a=r.int(2,7);return mc(r,`(x² − ${a*a})/x : (x + ${a})/x²`,`x(x − ${a})`,[`(x − ${a})/x`,`x(x + ${a})`,`x − ${a}`],`(x − ${a})(x + ${a})/x · x²/(x + ${a}) = x(x − ${a})`)},
 r=>{const a=r.int(2,6),c=r.int(a+1,a+6);return num(`x = ${c} үед (x² − ${a*a})/(x − ${a})-ийн утгыг ол`,c+a,`Хураавал x + ${a}; x = ${c} үед ${c+a}`,"Эхлээд хураа")},
 r=>{const k=r.int(2,6);return mc(r,`${k}x²y / (${k*k}xy²)-ийг хураа`,`x/(${k}y)`,[`${k}x/y`,`x/y`,`${k}y/x`],`${k}/${k*k} = 1/${k}, x²/x = x, y/y² = 1/y`)}
];
// 9 algebraic fractions + −
G[9]=[
 r=>{const a=r.int(1,6);return mc(r,`1/(x − ${a}) + 1/(x + ${a})`,`2x/(x² − ${a*a})`,[`2/(x² − ${a*a})`,`2x/(x² + ${a*a})`,`${2*a}/(x² − ${a*a})`],`((x + ${a}) + (x − ${a}))/((x − ${a})(x + ${a})) = 2x/(x² − ${a*a})`)},
 r=>{const a=r.int(1,6);return mc(r,`1/(x − ${a}) − 1/(x + ${a})`,`${2*a}/(x² − ${a*a})`,[`2x/(x² − ${a*a})`,`0`,`${a}/(x² − ${a*a})`],`((x + ${a}) − (x − ${a}))/(x² − ${a*a}) = ${2*a}/(x² − ${a*a})`)},
 r=>{const a=r.int(2,9),b=r.int(2,9),c=r.int(2,5);return num(`x = ${c} үед ${a}/x + ${b}/x-ийн утгыг ол`,Q(a+b,c),`(${a} + ${b})/x = ${a+b}/${c}`,"Ижил хуваарьтай бол хүртвэрийг нэм")},
 r=>{const a=r.int(2,5);return mc(r,`x/(x − ${a}) − ${a}/(x − ${a})`,"1",[`(x + ${a})/(x − ${a})`,"0",`x − ${a}`],`(x − ${a})/(x − ${a}) = 1`)}
];
// 10 functions
G[10]=[
 r=>{const a=r.nz(-6,6);return mc(r,`f(x) = √(x ${a<0?"+ "+(-a):"− "+a})-ийн тодорхойлогдох муж`,`x ≥ ${mn(a)}`,[`x > ${mn(a)}`,`x ≤ ${mn(a)}`,`x ≠ ${mn(a)}`],`Язгуурын доорх илэрхийлэл ≥ 0: x ${a<0?"+ "+(-a):"− "+a} ≥ 0 → x ≥ ${mn(a)}`)},
 r=>{const a=r.nz(-6,6);return mc(r,`f(x) = 1/(x ${a<0?"+ "+(-a):"− "+a})-ийн тодорхойлогдох муж`,`x ≠ ${mn(a)}`,[`x > ${mn(a)}`,`x ≥ ${mn(a)}`,`бүх бодит тоо`],`Хуваарь 0 биш: x ≠ ${mn(a)}`)},
 r=>{const b=r.int(-5,5),c=r.int(-6,6),k=r.int(-3,4);return num(`f(x) = ${poly2(1,b,c)} бол f(${mn(k)})-ийг ол`,k*k+b*k+c,`f(${mn(k)}) = ${k<0?"("+mn(k)+")":k}² ${b<0?"−":"+"} ${Math.abs(b)}·${k<0?"("+mn(k)+")":k} ${c<0?"−":"+"} ${Math.abs(c)} = ${mn(k*k+b*k+c)}`,"x-ийн оронд тоог орлуул")},
 r=>{const a=r.int(1,5);return mc(r,`f(x) = x² + ${a}-ийн утгын муж`,`y ≥ ${a}`,[`y > ${a}`,`бүх бодит тоо`,`y ≥ 0`],`x² ≥ 0 тул x² + ${a} ≥ ${a}`)}
];
// 11 quadratic function

function itemsFrom(lessons,count,seed){const r=rng(seed);const out=[];let i=0;const pool=lessons.filter(l=>G[l]);
  while(out.length<count){const l=pool[i%pool.length];const g=G[l][Math.floor(r()*G[l].length)];const it=g(r);it.lesson=l;out.push(it);i++}return out}
function lessonItems(l,count,seed){const r=rng(seed);const gs=G[l]||[];const out=[];for(let i=0;i<count;i++){const it=gs[i%gs.length](r);it.lesson=l;out.push(it)}return out}
function diagItems(count,seed){const r=rng(seed);const order=r.shuffle(D.map((_,i)=>i));const out=[];for(let i=0;i<count;i++){const it=D[order[i%D.length]](r);it.lesson=0;out.push(it)}return out}

, "it": "Эзэлхүүн, гэрлийн эрчим (1/r²) зэрэг функцээр загварчлагдана."}, "13": {"m": "1 бактери 20 минут тутамд 2 хуваагдана. 3 цагийн дараа хэд болох вэ?", "a": "3 цагт 9 удаа хуваагдана: 2⁹ = 512. y = 2ˣ хурдан өсөлт.", "x": ["y = 2ˣ-ийг y = x²-тэй адилхан гэж үзэх", "Илтгэгч функцийг сөрөг утга авна гэж зурах (үргэлж y > 0)"], "it": "Вирус тархалт, хүүгийн нийлмэл өсөлт, алгоритмын 2ⁿ хугацаа."}, "14": {"m": "Утасны багц сард 15 000₮ суурьтай, GB тутамд 2 000₮. 35 000₮-өөс хэтрүүлэхгүйн тулд хэдэн GB хэрэглэж болох вэ?", "a": "15000 + 2000x ≤ 35000 → x ≤ 10 GB.", "x": ["−2x > 6-г x > −3 гэж бодох (сөрөг тоонд хуваахад тэмдэг эргэнэ: x < −3)", "Шийдийг тооны шулуун дээр дугуй цэгийг буруу тэмдэглэх (≤ бол будсан)"], "it": "Программ дахь if (x <= 10) нөхцөл."}, "15": {"m": "Талбай нь 24 м², урт нь өргөнөөсөө 2 м илүү тэгш өнцөгт талбайн хэмжээг ол.", "a": "x(x + 2) = 24 → x² + 2x − 24 = 0 → x = 4 (x = −6 тохирохгүй). 4 × 6 м.", "x": ["D = b² − 4ac-д b сөрөг үед b²-ийг сөрөг гэж үзэх ((−5)² = 25)", "Бодлогын утгад тохирохгүй (сөрөг урт) шийдийг үлдээх"], "it": "Квадрат тэгшитгэл: шидэлтийн хугацаа, талбайн бодлого."}, "16": {"m": "x⁴ − 13x² + 36 = 0 тэгшитгэлийг квадрат тэгшитгэл болгож чадах уу?", "a": "x² = t → t² − 13t + 36 = 0 → t = 4; 9 → x = ±2; ±3.", "x": ["t-г олоод x руу буцаж шилжихээ мартах", "Рационал тэгшитгэлд хуваарийг 0 болгох гаднын шийдийг шалгахгүй байх"], "it": "Орлуулга (хувьсагч солих) — программд ч, математикт ч гол арга."}, "17": {"m": "Цехэд A бүтээгдэхүүн 2 цаг, B 3 цаг шаарддаг, өдөрт 12 цагаас хэтрэхгүй. Боломжит бүх хослолыг графикаар яаж харуулах вэ?", "a": "2x + 3y ≤ 12, x ≥ 0, y ≥ 0 — гурвалжин муж.", "x": ["< үед шулууныг бүтэн зураасаар зурах (тасархай байх ёстой)", "Аль хагас хавтгайг будахаа шалгах цэггүйгээр таах"], "it": "Шугаман програмчлал: үйлдвэрлэлийн төлөвлөлт, оновчлол."}, "18": {"m": "Хуримтлал жил бүр 2 дахин өсдөг бол 1 саяас хэдэн жилийн дараа 32 сая болох вэ?", "a": "2ˣ = 32 = 2⁵ → x = 5 жил.", "x": ["2ˣ = 32-ыг x = 32 : 2 гэж бодох", "4ˣ = 8-ыг ижил суурьт шилжүүлэхгүй таах (2²ˣ = 2³ → x = 3/2)"], "it": "Хоёртын хайлт: 2ˣ = n → алхмын тоо."}, "20": {"m": "Компьютерийн дэлгэц дээр хулганы байрлалыг (x; y)-ээр өгдөг. Тоглоомын дүр (3; −2) цэгт байвал хаана байна вэ?", "a": "Эхээс 3 нэгж баруун, 2 нэгж доош — IV мөч.", "x": ["Цэгийг (y; x) дарааллаар уншиж тэмдэглэх", "Тэнхлэг дээрх цэгийг (0; 5) аль нэг мөчид хамааруулах"], "it": "Дэлгэцийн координат: y тэнхлэг доош чиглэдэг нь сонирхолтой ялгаа."}, "21": {"m": "Газрын зураг дээр сургууль (1; 2), гэр (7; 10) цэгт. Шулуун замаар хэр хол вэ? (1 нэгж = 100 м)", "a": "√(6² + 8²) = 10 нэгж = 1 км.", "x": ["Зайны томьёонд ялгаврыг квадрат зэрэгт дэвшүүлэхээ мартах", "Дундаж цэгт 2-т хуваахын оронд хасах"], "it": "GPS, тоглоомд хоёр объектын зай (мөргөлдөөн шалгах)."}, "22": {"m": "Уулын замын налуу 10% гэдэг юу гэсэн үг вэ? Налалт нь хоёр цэгээс хэрхэн тооцогдох вэ?", "a": "100 м хэвтээ явахад 10 м өгсөнө: k = 10/100 = 0,1.", "x": ["k = (x₂ − x₁)/(y₂ − y₁) гэж урвуу бичих", "Перпендикуляр шулууны налалтыг зөвхөн тэмдгийг өөрчилж олох (зөв нь −1/k)"], "it": "Excel-ийн SLOPE() функц, графикийн чиг хандлага."}, "23": {"m": "Радио станц эх цэгээс 5 км радиуст цацдаг. (3; 4) цэгт байгаа хүн дохио авах уу? (6; 1)?", "a": "x² + y² ≤ 25: (3; 4) → 25 авна; (6; 1) → 37 авахгүй.", "x": ["x² + y² = 16 тойргийн радиусыг 16 гэж үзэх (r = 4)", "ax + by + c = 0-ээс налалтыг a гэж авах (k = −a/b)"], "it": "Утасны антенны хамрах хүрээ, тоглоомд тойрог мөргөлдөөн."}, "24": {"m": "Онгоц хойд зүг 300 км/ц, салхи зүүнээс 40 км/ц үлээвэл онгоцны жинхэнэ хөдөлгөөн ямар байх вэ?", "a": "Хоёр хурдыг вектороор нэмнэ — чиглэл, хэмжээ хоёулаа чухал.", "x": ["Векторыг зөвхөн уртаар нь (тоо мэт) нэмэх", "AB⃗ ба BA⃗-г адил гэж үзэх (эсрэг вектор)"], "it": "Тоглоомын хөдөлгүүр: байрлал + хурд вектор."}, "25": {"m": "Робот «3 алхам баруун, 4 алхам дээш» гэсэн командаар хөдөлнө. Үүнийг нэг вектороор хэрхэн бичих вэ?", "a": "a⃗ = (3; 4) = 3i⃗ + 4j⃗, урт |a⃗| = 5.", "x": ["AB⃗-ийн координатыг эхлэл − төгсгөл гэж бодох (зөв нь төгсгөл − эхлэл)", "|a⃗| = x + y гэж бодох"], "it": "Робот, дрон программчлал: (dx, dy) хөдөлгөөн."}, "26": {"m": "Хоёр хүч F₁(3; 2), F₂(−1; 4) нэг биед үйлчилбэл нийлбэр хүч ямар вэ?", "a": "F⃗ = (2; 6). Координатаар нь нэмнэ.", "x": ["ka⃗-д зөвхөн x координатыг үржүүлэх", "Коллинеар нөхцөлийг x₁/y₁ = x₂/y₂ гэж зөв бичих ч тэгээр хуваах"], "it": "Физикийн хүчний нийлбэр, графикийн шилжилт."}, "27": {"m": "Ачаа 10 Н хүчээр 60° өнцгөөр 5 м чирэхэд хийсэн ажил хэд вэ?", "a": "A = F·s·cos 60° = 10·5·0,5 = 25 Ж — скаляр үржвэр.", "x": ["Скаляр үржвэрийн хариуг вектор гэж бичих (тоо гарна)", "a⃗·b⃗ = 0 бол векторын аль нэг нь 0 гэж дүгнэх (перпендикуляр байж болно)"], "it": "Компьютер графикт гэрэлтүүлэг (cos φ) тооцох."}, "28": {"m": "Гурван дэлгүүрийн 2 сарын борлуулалтыг хүснэгтээр өгвөл нийт борлуулалтыг хэрхэн хурдан олох вэ?", "a": "Ижил хэмжээтэй хоёр матрицыг элементээр нь нэмнэ.", "x": ["2×3 ба 3×2 матрицыг нэмэх", "kA-д зөвхөн эхний мөрийг үржүүлэх"], "it": "Excel хүснэгт, зургийн пикселийн матриц."}, "29": {"m": "Кафе 3 төрлийн хоолны тоо ширхэг ба үнийн хүснэгтээс нийт орлогыг нэг үйлдлээр олох боломжтой юу?", "a": "Тоо ширхгийн мөр × үнийн багана = орлого: матрицын үржвэр.", "x": ["Элементийг харгалзах байрлалаар нь үржүүлэх (мөр × багана биш)", "AB = BA гэж үзэх"], "it": "Нейрон сүлжээ, 3D графикт матрицын үржвэр."}, "30": {"m": "Ямар матриц ямар ч матрицыг үржүүлэхэд өөрчлөхгүй вэ? (Тоонд 1 шиг)", "a": "Нэгж матриц E: AE = EA = A.", "x": ["det[a b; c d] = ab − cd гэж бодох (зөв нь ad − bc)", "Тэг матриц ба нэгж матрицыг андуурах"], "it": "Тодорхойлогч: талбайн өөрчлөлт, тэгшитгэлийн систем шийдтэй эсэх."}, "31": {"m": "Нууц үгийг матрицаар шифрлэсэн бол буцааж тайлахын тулд юу хэрэгтэй вэ?", "a": "Урвуу матриц: A⁻¹·(AX) = X.", "x": ["A⁻¹ = [1/a 1/b; 1/c 1/d] гэж бодох", "det A = 0 үед урвуу матриц олох гэж оролдох"], "it": "Hill шифр, криптограф."}, "32": {"m": "Зураг засварын программ «томруулах», «толин тусгал» хийхэд пиксел бүрийн координатыг яаж өөрчилдөг вэ?", "a": "(x′; y′) = M·(x; y) — хувиргалтын матриц.", "x": ["Матрицыг координатаар үржүүлэхдээ дарааллыг солих", "Баганыг (1; 0)-ийн дүрс гэдгийг анзаарахгүй байх"], "it": "CSS transform: matrix(a, b, c, d, e, f)."}, "33": {"m": "Толинд харагдах дүрс ба биет хоёрын координат хэрхэн холбоотой вэ?", "a": "OY тэнхлэгийн тэгш хэм: (x; y) → (−x; y).", "x": ["OX ба OY тэнхлэгийн тэгш хэмийг андуурах", "y = x шулууны тэгш хэмд тэмдэг өөрчлөх (зөв нь (y; x))"], "it": "Тэгш хэмтэй лого, тоглоомын дүрсийг толин тусгалаар үүсгэх."}, "34": {"m": "Тоглоомын дүр 5 нэгж баруун, 2 нэгж доош шилжвэл бүх цэгийн координат яаж өөрчлөгдөх вэ?", "a": "(x; y) → (x + 5; y − 2): a⃗(5; −2) вектороор зөөлт.", "x": ["Доош шилжүүлэхэд y-д нэмэх", "Зөөлтөөр дүрсийн хэмжээ өөрчлөгдөнө гэж үзэх"], "it": "Анимаци: кадр бүрт байрлалд хурдны вектор нэмэх."}, "35": {"m": "Утасны зургийг 90° эргүүлэхэд (2; 1) цэг хаана очих вэ? Зургийг 2 дахин томруулбал?", "a": "90°: (−1; 2); 2 дахин гомотет: (4; 2).", "x": ["Эргүүлэлтийн чиглэлийг (цагийн зүүний эсрэг) буруу авах", "k < 0 гомотетийг томруулалт гэж үзэх (эсрэг талд гарна)"], "it": "Зургийн эргүүлэлт, масштаб — график программ."}, "37": {"m": "Ангийн 30 сурагчийн өндрийг бүлэглэсэн хүснэгтээс дундаж өндрийг хэрхэн олох вэ?", "a": "Бүлгийн дундаж утгыг давтамжаар үржүүлж нэмээд нийтэд хуваана.", "x": ["Бүлгийн хилийн утгыг дундаж утга гэж авах", "Давтамжийн нийлбэрийн оронд бүлгийн тоонд хуваах"], "it": "Өгөгдөл боловсруулалт, Excel-ийн SUMPRODUCT."}, "38": {"m": "Сурагчдын хичээл давтсан цаг ба шалгалтын дүн хоорондоо холбоотой юу? Цэгэн диаграмм юу харуулах вэ?", "a": "Цэгүүд дээшээ чиглэвэл эерэг корреляц.", "x": ["Корреляцыг шалтгаан гэж дүгнэх", "Тэнцүү биш өргөнтэй гистограммд баганын өндрийг давтамж гэж авах"], "it": "Өгөгдлийн шинжилгээ, машин сургалтын шугаман регресс."}, "39": {"m": "Цалингийн өгөгдөлд хэт өндөр утга байвал дундаж уу, медиан уу аль нь бодит байдлыг сайн харуулах вэ?", "a": "Медиан ба квартил хэт утгад мэдрэг биш.", "x": ["Медианыг эрэмбэлэлгүй өгөгдлөөс авах", "IQR = Q₃ + Q₁ гэж бодох"], "it": "Box plot — өгөгдлийн тархалтын дүрслэл."}, "40": {"m": "Налуу дээврийн өнцөг 120° бол түүний sin, cos-ийг 60°-аар яаж олох вэ?", "a": "sin 120° = sin 60° = √3/2, cos 120° = −cos 60° = −1/2.", "x": ["Мохоо өнцгийн sin-ийг сөрөг гэж үзэх", "cos 120°-ийг cos 60°-тэй тэнцүү гэж бичих"], "it": "Дэлгэцийн эргэлт, дуу авианы долгион sin функцээр."}, "41": {"m": "Гурвалжин хэлбэрийн газрын хоёр тал 40 м, 30 м, хоорондох өнцөг 30°. Талбайг өндрийг хэмжихгүйгээр олох уу?", "a": "S = ½·40·30·sin 30° = 300 м².", "x": ["S = ½ab·sin C-д C нь a, b-гийн хоорондох өнцөг биш байх", "sin 30°-ийг √3/2 гэж авах"], "it": "Газрын хэмжилт, CAD программ."}, "42": {"m": "Голын хоёр эргийн хоорондох зайг гатлахгүйгээр хэрхэн олох вэ?", "a": "Хоёр өнцөг, нэг талаас синусын теоремоор.", "x": ["Косинусын теоремд −2ab·cos C-ийн тэмдгийг алдах", "Синусын теоремд тал ба өнцгийг харгалзуулахгүй байх"], "it": "Геодези, GPS триангуляци."}, "44": {"m": "Театрын тайзыг тойргийн нум дээрх ямар ч суудлаас ижил өнцгөөр харах уу?", "a": "Ижил нумд тулсан багтсан өнцгүүд тэнцүү.", "x": ["Багтсан өнцгийг төв өнцөгтэй тэнцүү гэж үзэх (хагас нь)", "Диаметрт тулсан өнцгийг 180° гэж бодох (90°)"], "it": "Камер байршуулалт, харах өнцөг."}, "45": {"m": "Дугуйн радиус 30 см, тэнхлэгээс 50 см зайтай цэгээс шүргэгчийн урт хэд вэ?", "a": "t = √(50² − 30²) = 40 см (шүргэгч ⟂ радиус).", "x": ["Огтлолцох хөвчид AE·EB = CE·ED-ийн оронд нийлбэрийг тэнцүүлэх", "Шүргэгч ба радиусын перпендикулярыг ашиглахгүй байх"], "it": "Араа, туузан дамжуулга."}, "46": {"m": "Гурвалжин талбайд тойрог хэлбэрийн хамгийн том цэцэрлэг төлөвлөе. Төвийг хаана байрлуулах вэ?", "a": "Биссектрисуудын огтлолцол — багтсан тойргийн төв.", "x": ["Багтсан ба багтаасан тойргийн төвийг андуурах", "Тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгийн нийлбэрийг 360° гэж үзэх"], "it": "Цэгийн геометр байр — роботын замын төлөвлөлт."}, "47": {"m": "Пицца 8 хэсэг, диаметр 32 см. Нэг хэсгийн талбай ба ирмэгийн урт хэд вэ?", "a": "Сектор 45°: S = π·16²/8 = 32π ≈ 100 см², нум = 4π ≈ 12,6 см.", "x": ["Радиус ба диаметрийг андуурах", "Градусыг 360-д биш 180-д хуваах (талбайд)"], "it": "Дугуй диаграм (pie chart)."}, "48": {"m": "Майхан (пирамид) ба тэвш (призм) хоёрын суурь, өндөр ижил бол аль нь хэд дахин их агаар багтаах вэ?", "a": "Пирамид призмийн 1/3.", "x": ["Пирамидын эзэлхүүнд 1/3-ийг мартах", "Хажуугийн ирмэгийг өндөр гэж авах"], "it": "Савлагаа, барилгын материалын тооцоо."}, "49": {"m": "Ундааны лааз (цилиндр) ба зайрмагны конус: ижил радиус, өндөртэй бол аль нь их багтаамжтай вэ?", "a": "Конус = цилиндрийн 1/3.", "x": ["Конусын хажуугийн талбайд өндрийг налуу өндрийн оронд авах", "Диаметрийг радиус гэж орлуулах"], "it": "Савны багтаамж, 3D хэвлэлийн материал."}, "50": {"m": "Хөл бөмбөгийн радиус 11 см. Түүнийг бүрэх арьс, доторх агаар хэд вэ?", "a": "S = 4π·121 ≈ 1521 см², V = 4/3·π·1331 ≈ 5575 см³.", "x": ["Бөмбөрцгийн эзэлхүүнд r²-ийг авах (r³)", "Талбайд 4/3 коэффициент хэрэглэх"], "it": "Дэлхийн гадаргуу, бөмбөлөгний хий."}, "51": {"m": "Талхыг янз бүрээр зүсэхэд ямар дүрс гардаг вэ? Цилиндр хэлбэрийн хиамыг хөндлөн, налуу зүсвэл?", "a": "Хөндлөн — дугуй, налуу — эллипс, дагуу — тэгш өнцөгт.", "x": ["Конусын тэнхлэгийн огтлолыг тойрог гэж үзэх (гурвалжин)", "Огтлолын дүрсийг огтлох хавтгайн байрлалаас хамааруулахгүй байх"], "it": "Анагаахын CT зураг — биеийн хавтгай огтлол."}, "52": {"m": "Бөмбөрцгийг төвөөс 3 см-т огтлоход радиус 5 см бол огтлолын талбай?", "a": "r = √(25 − 9) = 4, S = 16π см².", "x": ["Огтлолын радиусыг R − d гэж бодох", "Тэнхлэгийн огтлолын талбайд 2r-ийн оронд r авах (цилиндр)"], "it": "3D загварчлал, CT скан."}, "53": {"m": "Ус халах үйл явцыг үгээр, хүснэгтээр, графикаар, томьёогоор хэрхэн өгөх вэ? Аль нь хамгийн ойлгомжтой вэ?", "a": "Ижил функцийн 4 дүрслэл; зорилгоосоо хамаарч сонгоно.", "x": ["Хүснэгтээс томьёо гаргахдаа нэг цэгээр шалгах", "Графикийн тэнхлэ   if((s.match(/(\d+(?:\.\d+)?)\^/g)||[]).some(p=>p!=="10^")) return "pow";
  let i=0;
  const num=()=>{const m=s.slice(i).match(/^\d+(?:\.\d+)?|^\.\d+/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const atom=()=>{if(s[i]==="-"){i++;return -atom()}if(s[i]==="+"){i++;return atom()}
    let v;if(s[i]==="("){i++;v=expr();if(s[i]!==")")throw 0;i++}else v=num();
    if(s[i]==="^"){i++;let sg=1;if(s[i]==="-"){sg=-1;i++}else if(s[i]==="+")i++;v=Math.pow(v,sg*num())}return v};
  const term=()=>{let v=atom();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=atom();v=o==="*"?v*r:v/r}return v};
  const expr=()=>{let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v};
  try{const v=expr();return i===s.length&&isFinite(v)?v:null}catch(e){return null}
}
const same=(a,b)=>Math.abs(a-b)<=1e-9*Math.abs(b)||Math.abs(a-b)<1e-12;

  if(v===null)return{err:"Хариугаа 7, −3/4, 0,25 гэх мэт хэлбэрээр бич."};return{ok:same(v,it.ans)}}

const SUPMAP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","−":"⁻","+":"⁺","n":"ⁿ","x":"ˣ","(":"⁽",")":"⁾","=":"⁼"};
function plain(html){let s=String(html).replace(/<sup>(.*?)<\/sup>/g,(m,t)=>{t=t.replace(/<[^>]+>/g,"");return [...t].every(c=>SUPMAP[c])?[...t].map(c=>SUPMAP[c]).join(""):"^("+t+")"});
  return s.replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&")}
function splitTop(s,sep){const out=[];let d=0,cur="",tag=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==="<")tag=true;if(c===">")tag=false;
  if(!tag&&(c==="("||c==="["))d++;if(!tag&&(c===")"||c==="]"))d--;
  if(d<=0&&!tag&&s.startsWith(sep,i)){out.push(cur);cur="";i+=sep.length-1;continue}cur+=c}out.push(cur);return out.filter(x=>x.trim()!=="")}

/* ---------- lesson-plan items (identical to the printed plans) ---------- */
function lpItems(n){const g=(M.G[n]||[]).length;if(!g)return null;const b=hash("lp"+n);
  const one=(gi,seed)=>{const it=M.G[n][gi%g](M.rng(seed));it.lesson=n;return it};
  return{pre:(PRE[n]||[]).map((f,i)=>M.foundItems(f,1,b+i)[0]),examples:[0,1,2].map(i=>one(i,b+100+i)),check:[0,1,2].map(i=>one(i+(g>3?1:0),b+200+i)),
    exit:[0,1,2].map(i=>one((i*2+1)%g,b+400+i)),hw:[0,1,2,3].map(i=>one(i,b+500+i))}}
const STAGES=[["I. Зохион байгуулалт",2],["II. Ёс зүйн 1 минут",1],["III. Өмнөх мэдлэг сэргээх",7],["IV. Сэдэлжүүлэх, зорилго",6],["V. Шинэ мэдлэг",25],["VI. Бататгах, бие даан ажиллах",27],["VII. Дүгнэлт, эргэцүүлэл",12]];
const ASTAGES=[["I. Зохион байгуулалт",2],["II. Ёс зүйн 1 минут",1],["III. Давтлага",12],["IV. Шалгалт",45],["V. Өөрийгөө үнэлэх",15],["VI. Дүгнэлт",5]];
const qList=(items,withAns)=>`<ol class="tq">${items.map(it=>`<li>${it.q}${it.type==="mc"?`<div class="bopts">${it.opts.map((o,j)=>`<span>${"АБВГ"[j]}) ${o}</span>`).join("")}</div>`:""}${withAns?`<div class="rv" hidden>→ <b>${it.ansText}</b> <span class="bsol">${it.sol}</span></div>`:""}</li>`).join("")}</ol>`;
const siteUrl=()=>{const u=store.get("m10url","");if(u)return u;const h=location.href.split("#")[0];return /^https?:/.test(h)&&!/claude/.test(location.host)?h:"багшийн өгсөн сайтын хаяг"};

/* random student picker */
function pickStudent(){const names=store.get("m10names",[]);const ov=$("#pick");
  if(!names.length){ov.innerHTML=`<div class="card stack" style="max-width:420px"><b>Сурагчдын нэрсийн жагсаалт алга.</b><span class="muted">«Багшид» хуудасны «Сурагчдын нэрс» хэсэгт нэг удаа оруулна.</span><button class="btn" type="button" data-x>Хаах</button></div>`;ov.classList.add("on");ov.querySelector("[data-x]").onclick=()=>ov.classList.remove("on");return}
  let used=store.get("m10used",[]).filter(x=>names.includes(x));if(used.length>=names.length)used=[];
  const left=names.filter(x=>!used.includes(x));const pick=left[Math.floor(Math.random()*left.length)];used.push(pick);store.set("m10used",used);
  ov.innerHTML=`<div class="pickcard"><div class="pname" id="pname"></div><div class="row" style="justify-content:center"><button class="btn p" type="button" data-again>Дахин</button><button class="btn" type="button" data-x>Хаах</button></div><small class="muted">${left.length-1} сурагч сонгогдоогүй үлдлээ</small></div>`;ov.classList.add("on");
  const el=$("#pname");let k=0;const spin=setInterval(()=>{el.textContent=names[Math.floor(Math.random()*names.length)];if(++k>14){clearInterval(spin);el.textContent=pick;el.classList.add("final")}},70);
  ov.querySelector("[data-x]").onclick=()=>ov.classList.remove("on");ov.querySelector("[data-again]").onclick=pickStudent}

/* teach (facilitation) mode */

function vTeach(n){

  let slides,stages;
  if(l.assess){stages=ASTAGES;const ls=l.assess.ls.filter(x=>M.G[x]);const rev=M.itemsFrom(ls,6,hash("rev"+n));const id=n===54?"final":"h"+n;
    slides=[{s:0,h:`<span class="pill">Хичээл №${n}</span><h1 class="th">${esc(l.title)}: хичээл ${l.assess.ls[0]}–${l.assess.ls[l.assess.ls.length-1]}</h1><p class="tl">${esc(l.goal)}</p><div class="lvbox"><span class="lv A">80–100% А</span><span class="lv B">50–79% Б</span><span class="lv C">0–49% В</span></div>`},
      {s:1,h:`<h2 class="th">«Үнэнч шударга байдал»</h2><p class="tl">Шалгалт бол чамайг шийтгэх биш, юуг нөхөхөө мэдэх боломж. Өөрийнхөө жинхэнэ түвшинг харуулъя.</p>`},
      {s:2,h:`<h2 class="th">Давтлага: холимог бодлого</h2>${qList(rev,true)}`,rv:true},
      {s:3,h:`<h2 class="th">Шалгалт — 45 минут</h2><ul class="tl"><li>А, Б хувилбарыг эгнээгээр ээлжлэн тараана.</li><li>Бодолтоо алхамчлан бичнэ.</li><li>Цахимаар өгөх бол: <b>${esc(siteUrl())}</b> → Сорил → ${esc(TESTS[id].title)}</li></ul>`},
      {s:4,h:`<h2 class="th">Өөрийгөө үнэлэх</h2><ul class="tl"><li>Хариуг тулгаж, алдсан бодлогын хичээлийн дугаарыг бич.</li><li>Цахимаар өгсөн бол <b>M10.</b> кодоо ангийн группт илгээ.</li></ul>`},
      {s:5,h:`<h2 class="th">Дүгнэлт</h2><p class="tl">Ангиараа хамгийн их алдсан сэдвийг дараагийн давтлагын цагт давтана. Шинэ сэдэв үзэхгүй.</p>`}];
  }else{stages=STAGES;const it=lpItems(n);
    const exSlides=it.examples.map((ex,k)=>({s:4,ex,k:k+1,role:["Багш загварчилна — «Би хийнэ»","Анги хамтдаа — «Бид хийнэ»","Хосоороо — «Та нар хийнэ»"][k]}));
    slides=[{s:0,h:`<span class="pill">Хичээл №${n}</span> <span class="muted">${esc(u?u.name:"")}</span><h1 class="th">${esc(l.title)}</h1><p class="tl">${pretty(l.goal)}</p><h3>Амжилтын шалгуур</h3>${crit}`},
      {s:1,h:`<span class="pill">Ёс зүйн 1 минут</span><h2 class="th">«${esc(eth[0])}»</h2><p class="tl big">${esc(eth[1])}</p>`},
      {s:2,h:`<h2 class="th">Сууриа шалгая <small>4 мин · дэвтэртээ бие даан</small></h2>${qList(it.pre,true)}<p class="muted">Алдсан бол: давтлагын цагт «Суурь мэдлэг» → ${(PRE[n]||[]).map(f=>esc(FBY[f].t)).join(", ")}</p>`,rv:true},
      {s:3,h:`<h2 class="th">Асуудал</h2><p class="tl big">${esc(lp.m||"")}</p><div class="rv" hidden><p class="tl">💡 ${esc(lp.a||"")}</p></div><h3>Өнөөдрийн зорилго</h3>${crit}<p class="muted">Дэвтрийнхээ захад хувийн зорилгоо бич: «Өнөөдөр ★ авна».</p>`,rv:true},
      {s:4,h:`<h2 class="th">Гол санаа</h2><div class="note tl">${l.note||""}</div><div id="twg"></div>`,w:WID[n]},
      ...exSlides,
      {s:4,h:`<h2 class="th">Алдааг ол! <small>Яагаад буруу вэ?</small></h2><ul class="tl mist">${(lp.x||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`},
      {s:4,h:`<h2 class="th">Шалгах цэг <small>3 мин · хариугаа өргө</small></h2>${qList(it.check,true)}${lp.it?`<p class="muted">💻 ${esc(lp.it)}</p>`:""}`,rv:true},
      {s:5,h:`<h2 class="th">Бие даан ажиллая</h2><ol class="tl"><li>Ажлын хуудас: өөрийн түвшнээс эхэл (0-Эхлэл → Суурь → Дунд → Ахисан).</li><li>Утсаараа: <b class="url">${esc(siteUrl())}</b> → Хичээл №${n} → <b>Дадлага</b>: 6-аас 5 зөв → ★</li><li>★ авсан бол сурах бичиг: <b>${tp.c?"№"+tp.c:"жишээнүүд"}</b></li><li>А бүлэг: <b>${tp.a?"№"+tp.a:""}${tp.r?" · "+esc(tp.r):""}</b> → дуусгаад бусдад туслах</li></ol><p class="muted">Хариуг сурах бичгийн х. 206–211-ээс өөрөө шалга.</p>`},

  }

      <div class="tprog">${stages.map((s,i)=>`<i class="${i<stage?"d":i===stage?"c":""}" style="flex:${s[1]}" title="${esc(s[0])}"></i>`).join("")}</div>
      <div class="tslide" id="tslide"></div></div>`;
    const box=$("#tslide");
    if(sl.ex){const st=[];splitTop(String(sl.ex.sol),"; ").forEach(p=>{const b=/ тул |, /.test(p)?[p]:splitTop(p," = ");st.push(b[0]);for(let i=1;i<b.length;i++)st.push("= "+b[i])});
      box.innerHTML=`<span class="pill">Жишээ ${sl.k}</span> <span class="muted">${sl.role}</span><div class="th q2">${sl.ex.q}</div><ol class="steps big" id="tst"></ol><div class="row"><button class="btn" type="button" id="tstep">Дараагийн алхам ▸</button></div><div class="exans" id="tans" hidden>Хариу: <b>${sl.ex.ansText}</b></div>`;
      let i=0;$("#tstep").onclick=()=>{if(i<st.length){const li=document.createElement("li");li.innerHTML=st[i++];$("#tst").appendChild(li)}if(i>=st.length){$("#tstep").hidden=true;$("#tans").hidden=false}}}
    else box.innerHTML=sl.h;
    if(sl.w){W.mount($("#twg"),sl.w[0],sl.w[1])}
    $("#tprev").onclick=()=>{if(cur>0){cur--;render()}};$("#tnext").onclick=()=>{if(cur<slides.length-1){cur++;render()}};
    $("#tpick").onclick=pickStudent;const rv=$("#trv");if(rv)rv.onclick=()=>box.querySelectorAll(".rv").forEach(e=>e.hidden=!e.hidden);
    $("#tplay").onclick=()=>{running=!running;$("#tplay").textContent=running?"❚❚ Зогсоох":"▶ Цаг"}};
  const fmtT=s=>{const a=Math.abs(s);return (s<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0")};
  tTimer=setInterval(()=>{if(!location.hash.startsWith("#teach-")){clearInterval(tTimer);tTimer=null;return}if(running){left--;const t=$("#ttime");if(t){t.textContent=fmtT(left);t.classList.toggle("over",left<0)}}},1000);
  document.onkeydown=e=>{if(!location.hash.startsWith("#teach-"))return;if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();$("#tnext")&&$("#tnext").click()}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();$("#tprev")&&$("#tprev").click()}};
  render();
}

/* warm-up: 5 quick foundation questions, 60 s each */
function vWarm(){const fs=M.rng(Date.now()%1e6).shuffle(FOUND.map(f=>f.id)).slice(0,5);const items=fs.map((f,i)=>M.foundItems(f,1,Date.now()%1e5+i)[0]);let k=0,left=60,iv=null;
  const show=()=>{const it=items[k];left=60;app.innerHTML=`<div class="board"><div class="row" style="justify-content:space-between"><span class="muted">Өдрийн 5 бодлого · суурь мэдлэг · ${k+1}/5</span><span class="row"><button class="btn s" type="button" id="wpick">🎲 Сурагч</button><a class="btn s" href="#review">Гарах</a></span></div>
    <div class="ttime big" id="wt">1:00</div><div class="bq"><span class="bn">${k+1}</span>${it.q}${it.type==="mc"?`<div class="bopts">${it.opts.map((o,j)=>`<span>${"АБВГ"[j]}) ${o}</span>`).join("")}</div>`:""}</div><div class="bans" id="wa" hidden></div>
    <div class="row bctl"><button class="btn" type="button" id="wshow">Хариу</button><button class="btn p" type="button" id="wnext">${k<4?"Дараах →":"Дуусгах"}</button></div></div>`;
    $("#wpick").onclick=pickStudent;$("#wshow").onclick=()=>{$("#wa").hidden=false;$("#wa").innerHTML=`Хариу: <b>${it.ansText}</b><br><span class="bsol">${it.sol}</span>`};
    $("#wnext").onclick=()=>{if(k<4){k++;show()}else{clearInterval(iv);location.hash="review"}}};
  if(iv)clearInterval(iv);iv=setInterval(()=>{if(location.hash!=="#warm"){clearInterval(iv);return}left--;const t=$("#wt");if(t){t.textContent=left>=0?`0:${String(left).padStart(2,"0")}`:"0:00";t.classList.toggle("over",left<=10)}},1000);
  show()}

/* student exit ticket step */
function sExit(st,n){const it=lpItems(n);if(!it){st.innerHTML="";return}
  st.innerHTML=`<div class="card"><b>Гарах тасалбар.</b> Хичээлийн төгсгөлд 3 бодлогыг бие даан бодоод, кодоо багшдаа илгээ.</div><div class="items" id="qitems" style="margin-top:12px"></div><div class="row" style="margin-top:12px"><button class="btn p" type="button" id="finish">Илгээх</button></div><div id="result"></div>`;
  runQuiz(it.exit,{onFinish:(ok,T)=>{const msg=ok===3?"Гайхалтай! Дараагийн сэдэвт бэлэн байна.":ok===2?"Сайн байна. Гэрийн даалгавраар бататгаарай.":"Давтлагын цагт багштайгаа энэ сэдвийг давтъя.";
    $("#result").innerHTML=`<div class="card stack" style="margin-top:12px"><div class="score"><span class="big">${ok}/3</span><span>${msg}</span></div><div class="row"><span>Өөрийгөө үнэл:</span><button class="btn s" type="button" data-sa="Бие даан чадна">Бие даан чадна</button><button class="btn s" type="button" data-sa="Жишээ харж чадна">Жишээ харж чадна</button><button class="btn s" type="button" data-sa="Тусламж хэрэгтэй">Тусламж хэрэгтэй</button></div><div id="ec"></div></div>`;
    const mk=sa=>askName(nm=>{$("#ec").innerHTML=codeBox(enc({k:"e",n:nm,l:n,s:ok,T,sa,d:new Date().toISOString().slice(0,10)}));wireCopy($("#ec"))});
    $("#result").querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{$("#result").querySelectorAll("[data-sa]").forEach(x=>x.classList.remove("on"));b.classList.add("on");mk(b.dataset.sa)});
    $("#result").scrollIntoView({behavior:"smooth",block:"start"})}})}

function exitSummary(cd){const by={};Object.entries(cd.e||{}).forEach(([nm,o])=>Object.entries(o).forEach(([l,r])=>{(by[l]=by[l]||[]).push([nm,r])}));
  const ls=Object.keys(by).map(Number).sort((a,b)=>b-a);if(!ls.length)return"";
  return `<h3 style="margin:18px 0 8px;font-size:17px">Гарах тасалбар (хичээлээр)</h3><div class="scroll"><table class="tbl"><thead><tr><th>Хичээл</th><th>3/3</th><th>2/3</th><th>0–1/3 — давтлагад</th><th>«Тусламж хэрэгтэй»</th></tr></thead><tbody>${ls.map(l=>{const a=by[l];const g=a.filter(x=>x[1].s>=3).length,b=a.filter(x=>x[1].s===2).length;const c=a.filter(x=>x[1].s<=1).map(x=>esc(x[0]));const h=a.filter(x=>x[1].sa==="Тусламж хэрэгтэй").map(x=>esc(x[0]));
    return `<tr><td><a href="#lesson-${l}">№${l}</a> ${esc((LBY[l]||{}).title||"")}</td><td>${g}</td><td>${b}</td><td>${c.length?c.join(", "):"—"}</td><td>${h.length?h.join(", "):"—"}</td></tr>`}).join("")}</tbody></table></div>`}

/* ---------- router ---------- */
function route(){const h=(location.hash||"#home").slice(1);let m;window.scrollTo(0,0);document.body.classList.toggle("boardmode",/^(board-|teach-|warm)/.test(h));
  if(h==="lessons"){setNav("lessons");return vLessons()}
  if((m=h.match(/^lesson-(\d+)$/))){setNav("lessons");return vLesson(+m[1])}
  if((m=h.match(/^found-(f\d+)$/))){setNav("lessons");return vFound(m[1])}
  if(h==="assess"){setNav("assess");return vAssess()}
  if((m=h.match(/^test-([a-z0-9]+)-(a|b)$/))){setNav("assess");return vTest(m[1],m[2])}
  if(h==="level"){setNav("level");return vLevel()}
  if((m=h.match(/^level-([a-z0-9]+)$/))){setNav("level");return vLevel(m[1])}
  if(h==="review"){setNav("review");return vReview()}
  if((m=h.match(/^board-([a-z0-9]+)$/))){setNav("");return vBoard(m[1])}
  if(h==="teacher"){setNav("teacher");return vTeacher()}
  if((m=h.match(/^teach-(\d+)$/))){setNav("");return vTeach(+m[1])}
  if(h==="warm"){setNav("");return vWarm()}
  setNav("home");vHome()}
function openDlg(){$("#dlg").classList.add("on");$("#dlgE").hidden=true;$("#code").value="";setTimeout(()=>$("#code").focus(),0)}
$("#dlgC").onclick=()=>$("#dlg").classList.remove("on");
$("#dlgF").addEventListener("submit",e=>{e.preventDefault();if($("#code").value.trim()===TEACHER_CODE){teacher=true;store.set("m10t",true);$("#dlg").classList.remove("on");route()}else $("#dlgE").hidden=false});
/* radicals: draw the bar over the radicand */
const RAD=/√(\([^()]*\)|\d+(?:[.,]\d+)?|[a-zA-Z])/g;
function radify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.indexOf("√")>=0&&!(n.parentNode&&n.parentNode.closest&&n.parentNode.closest(".rad,textarea,input,script,style,svg"))?1:3});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const s=n.nodeValue;RAD.lastIndex=0;if(!RAD.test(s))return;RAD.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;
    while((m=RAD.exec(s))){f.append(s.slice(last,m.index));let inner=m[1];if(inner[0]==="(")inner=inner.slice(1,-1);const sp=document.createElement("span");sp.className="rad";sp.append("√");const rc=document.createElement("span");rc.className="rc";rc.textContent=inner;sp.append(rc);f.append(sp);last=m.index+m[0].length}
    f.append(s.slice(last));n.replaceWith(f)})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(x=>{if(x.nodeType===1)radify(x);else if(x.nodeType===3&&x.parentNode)radify(x.parentNode)}))).observe(document.body,{childList:true,subtree:true});
window.addEventListener("hashchange",route);
route();
})();
