mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>4</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ийн дүр", "(8; 1)", "Олонлог 8, Сорил 1 №15"]], "tb": [], "digital": false, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Өөрөөрөө байх»:** Параллел зөөлтөөр дүрс бүхэлдээ шилжсэн ч хэлбэр, чиглэлээ хадгалдаг. Шинэ орчинд очсон ч өөрийнхөөрөө байх нь чухал. Асуулт: «Шинэ орчинд би юугаа хадгалах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) (2; −3) + (4; 5); 2) A(1; 2), B(4; 6) бол AB⃗; 3) −3 + (−4)", "**Холбоос (1 мин):** №25–26-д векторын координатыг, №32–33-д хувиргалтыг үзсэн; өнөөдөр вектороор дүрсийг шилжүүлнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Дээлийн энгэрийн хээний нэг хэсэг тор дээр (0; 0)-ээс (2; 1) хүртэл байна. Бүтэн хүрээ хийхэд хээг хэрхэн шилжүүлэх вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a⃗(a; b) вектороор зөөлт: (x; y) → (x + a; y + b). Урт, өнцөг, чиглэл хадгалагдана.", "   Зөөлтийн вектор: a⃗ = (x′ − x; y′ − y). Зөөлт 2×2 матрицаар бус, вектор нэмэх замаар илэрхийлэгдэнэ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): A(6; 0)-ийг a⃗(2; 1)-ээр зөө", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (−3; 0)-ийн дүр (1; 2) бол (4; −1)-ийн дүр", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): A(0; 0), B(2; 0), C(1; 3)-ыг a⃗(−3; 2)-оор зөө", "**3. Түгээмэл алдаа:** Доош шилжүүлэхэд y-д нэмэх; зөөлтөөр дүрсийн хэмжээ өөрчлөгдөнө гэж үзэх; дүрээс эх цэгийг хасахын оронд нэмэх.", "**4. Шалгах цэг (3 мин):** 1) A(−3; −3)-ыг a⃗(−1; −1)-ээр зөө; 2) (x; y) → (x − 2; y + 2) бол (−1; 2)-ын дүр. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 3 станц (6 минут тутам). 1 «Цэг»: (0; 0), (3; −1), (−2; 4), (5; 5)-ыг a⃗(−4; 2)-оор зөө. 2 «Вектор олох»: A(2; 1) → A′(−1; 5) бол зөөлтийн вектор ба тэр зөөлтөөр B(0; −2)-ын дүр. 3 «Хээний хүрээ»: тор бүхий цаасан дээр хээний хэсэг (0; 0), (1; 2), (2; 0)-ийг a⃗(2; 0)-оор 4 удаа зөөж хүрээ хийнэ, дараа нь хүрээг a⃗(0; −3)-аар зөөж 2 дахь эгнээ гаргана.", "**Бүтээгдэхүүн:** Станцын хариу ба хээний хүрээ", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "35": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Зураглал танилцуулах, нөхөх", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "O цэгийг тойруулсан эргүүлэлт ба O төвтэй гомотетийг томьёо, матрицаар гүйцэтгэж, урт, талбайн өөрчлөлтийг тайлбарлах; «Геометрийн хувиргалт» нэгжийг оюуны зураглалаар нэгтгэх.", "crit": ["Би цэгийг O-г тойруулан 90°, 180° эргүүлж чадна.", "Би гомотетоор цэг хувиргаж, урт, талбайн өөрчлөлтийг олж чадна.", "Би нэгжийн бүх хувиргалтыг оюуны зураглалаар харьцуулж чадна."], "words": "эргүүлэлт — төвийг тойруулан өнцгөөр эргүүлэх; 90°: (x; y) → (−y; x); гомотет — (kx; ky), k — масштаб; оюуны зураглал.", "ex": [["A(3; 4)-ийг O-г тойруулан 90° эргүүл", "(−4; 3)"], ["k = 0,5 гомотетоор A(−2; −5)", "(−1; −2,5)"], ["k = −2 гомотетоор 3 см² дүрсийн талбай", "k² = 4 → 12 см²"]], "ck": [["A(−6; −1)-ийг 90° эргүүл", "(1; −6)"], ["k = −2 гомотетоор A(0; 4)", "(0; −8)"]], "ws": [["Сэргээх", ["Масштаб 1:50 бол зураг дээрх 4 см бодитоор", "(−2; 7)-той O-ийн хувьд тэгш хэмтэй цэг"]], ["Дадлага 1", ["A(5; −2)-ыг 90° эргүүл", "k = 3 гомотетоор A(1; −2)"]], ["Дадлага 2", ["A(4; 1)-ийг 180° эргүүл", "k = 1/2 гомотетоор 8 см талтай квадрат"]], ["★ Сорилт", ["A(2; 3)-ыг цагийн зүүний дагуу 90° эргүүл", "Гомотетоор A(2; −1) → A′(−6; 3). k ба B(−1; 4)-ийн дүр"]], ["Хэрэглээ", ["Хөшөөний загвар 1:20, загварын өндөр 50 см. Бодит өндөр"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "A(−1; 6)-г 90° эргүүл", "k = 2 гомотетоор A(−3; 2)", "A(6; 6)-г 180° эргүүл", "k = 3 гомотетоор 5 см² дүрсийн талбай", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ төвтэй ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ эргүүлэлтээр ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ын дүр __(Олонлог 10, Дасгал 12 №2-ын санаагаар)__"], "quiz": ["A(5; −2)-ыг 90° эргүүлсэн цэг: А) (2; 5) Б) (−2; −5) В) (−5; 2) Г) (−2; 5)", "k = 0,5 гомотетоор A(6; −4)", "Ямар хувиргалт 2×2 матрицаар илэрхийлэгдэхгүй вэ?"], "key": [["III. Суурь сэргээх", ["1) (−3; −4)", "2) 300 см = 3 м", "3) (−5; 2)"]], ["Жишээ 1–3", ["Жишээ 1: (−4; 3)", "Жишээ 2: (−1; −2,5)", "Жишээ 3: k² = 4 → 12 см²"]], ["Шалгах цэг", ["1) (1; −6)", "2) (0; −8)"]], ["I. Ажлын хуудас", ["№1: 200 см = 2 м", "№2: (2; −7)", "№3: (2; 5)", "№4: (3; −6)", "№5: (−4; −1)", "№6: 4 см тал, талбай 16 см²", "№7: (3; −2)", "№8: k = −3; (3; −12)", "№9: 1000 см = 10 м"]], ["Багийн даалгавар", ["Урт хадгалах: тэгш хэм, эргүүлэлт, зөөлт; гомотет — урт |k|, талбай k² дахин.", "Тэгш хэм, эргүүлэлт, гомотет — 2×2 матриц; параллел зөөлт — вектор нэмэх (матрицаар биш).", "Багуудын жишээг багш шалгана."]], ["II. Гэрийн даалгавар", ["№1: (−6; −1)", "№2: (−6; 4)", "№3: (−6; −6)", "№4: 45 см²", "№5: (−5; −1)"]], ["III. Гарах тасалбар", ["№1: А (шалгуур 1)", "№2: (3; −2) (шалгуур 2)", "№3: параллел зөөлт (шалгуур 3)"]]], "F": ["R_{90^{\\circ}}:\\ (x;\\,y)\\to(-y;\\,x)", "H_{k}:\\ (x;\\,y)\\to(kx;\\,ky),\\quad S^{\\prime}=k^{2}S"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>R</mi><mrow><msup><mn>90</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></msub><mi>:</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x02192;</mo><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mi>y</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>x</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>H</mi><mrow><mi>k</mi></mrow></msub><mi>:</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x02192;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>k</mi><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>k</mi><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><msup><mi>S</mi><mrow><mi>&#x02032;</mi></mrow></msup><mo>&#x0003D;</mo><msup><mi>k</mi><mrow><mn>2</mn></mrow></msup><mi>S</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-35"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-35"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Гомотет хувиргалт (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/1184"], ["Mozaik: «эргүүлэлт, гомотет» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L35.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ төвтэй ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ эргүүлэлтээр ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ын дүр", "(−5; −1)", "Олонлог 10, Дасгал 12 №2-ын санаагаар"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>5</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>5</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧-ээр ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>4</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ын дүр ба хувиргалтын нэр", "(2; −1); k = −0,5 гомотет", "Олонлог 10, Дасгал 12 №4"]], "tb": [], "digital": true, "stype": "C", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хэлбэрээ хадгалах»:** Гомотетоор дүрс томорч, жижгэрдэг ч хэлбэрээ хадгалдаг. Амжилтад онгирохгүй, бүтэлгүйтэлд шантрахгүй байх нь «хэлбэрээ хадгалах». Асуулт: «Амжилт, бүтэлгүйтлийн аль алинд би өөрөөрөө байж чаддаг уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) (3; 4)-тэй O-ийн хувьд тэгш хэмтэй цэг; 2) Масштаб 1:100 бол зураг дээрх 3 см бодитоор; 3) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·(2; 5)", "**Холбоос (1 мин):** 8 дугаар ангид гомотет, масштабыг үзсэн (Олонлог 8, х. 8–9); №32–34-д бусад хувиргалтыг үзсэн; өнөөдөр бүгдийг нэгтгэнэ."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Хөшөөний загвар 1:20 масштабтай. Загварын өндөр 50 см бол бодит өндөр хэд вэ? Энэ ямар хувиргалт вэ?", "**1. Гол санаа (самбарт):** O-г тойруулан цагийн зүүний эсрэг 90°: (x; y) → (−y; x), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧; 180°: (−x; −y); цагийн зүүний дагуу 90°: (y; −x).", "   O төвтэй k коэффициенттэй гомотет: (x; y) → (kx; ky), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>k</mi></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mi>k</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧. |k| > 1 томруулна, |k| < 1 жижгэрүүлнэ, k < 0 эсрэг талд. Урт |k| дахин, талбай k² дахин өөрчлөгдөнө.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): A(3; 4)-ийг O-г тойруулан 90° эргүүл", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): k = 0,5 гомотетоор A(−2; −5)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): k = −2 гомотетоор 3 см² дүрсийн талбай", "**3. Түгээмэл алдаа:** Эргүүлэлтийн чиглэлийг буруу авах; k < 0 гомотетийг зөвхөн томруулалт гэх (эсрэг талд гарна); талбайг k дахин гэж бодох (зөв нь k²).", "**4. Шалгах цэг (3 мин):** 1) A(−6; −1)-ийг 90° эргүүл; 2) k = −2 гомотетоор A(0; 4). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Оюуны зураглал (багаар):** «Геометрийн хувиргалт» нэгжийн оюуны зураглал: төвд «Хувиргалт»; 6 салаа — цэгийн тэгш хэм, тэнхлэгийн тэгш хэм, эргүүлэлт, параллел зөөлт, гомотет, хувиргалтын матриц. Салаа бүрт: томьёо (x; y) → …, матриц (байвал), юу хадгалагдах (урт, өнцөг, талбай), нэг жишээ, амьдралын жишээ (хээ, толь, хүрд, хүрээ, масштаб). Доор нь «Ямар хувиргалт матрицаар илэрхийлэгдэхгүй вэ?» асуултад хариулна.", "**Бүтээгдэхүүн:** А3 оюуны зураглал", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "37": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Тэнцүү ба тэнцүү биш завсраар бүлэглэсэн өгөгдлийн арифметик дундаж, моод бүлэг, медианыг тооцоолж, бодит мэдээллийг тайлбарлах.", "crit": ["Би завсрын дунд утгыг олж, дунджийг тооцоолж чадна.", "Би моод бүлэг ба медианыг олж чадна (тэнцүү биш завсарт нягтаар).", "Би үр дүнгээр бодит мэдээллийг тайлбарлаж чадна."], "words": "бүлэглэсэн өгөгдөл; завсар, завсрын дунд утга x; давтамж f; моод бүлэг; медиан бүлэг; давтамжийн нягт = f : завсрын өргөн.", "ex": [["100–110: 4, 110–120: 7, 120–130: 10, 130–140: 6, 140–150: 3 (N = 30). Дундаж", "Σf·x = 420 + 805 + 1250 + 810 + 435 = 3720; x̄ = 124 кВт·ц"], ["Мөн хүснэгтийн моод бүлэг ба медиан", "моод бүлэг 120–130; хуримтлагдсан 4, 11, 21 → Me = 120 + (15 − 11) : 10 · 10 = 124"], ["Нас: 0–10: 5, 10–20: 15, 20–40: 20, 40–70: 10. Моод бүлэг", "нягт 0,5; 1,5; 1; 0,33 → 10–20 (20–40 биш!)"]], "ck": [["0–10: 2, 10–20: 5, 20–30: 3. Дундаж", "(10 + 75 + 75) : 10 = 16"], ["Мөн хүснэгтийн медиан бүлэг", "5 дахь утга → 10–20"]], "ws": [["Сэргээх", ["2, 4, 6, 8-ын дундаж", "3, 7, 1, 9, 5-ын медиан"]], ["Дадлага 1", ["20–30 завсрын дунд утга", "0–10: 3, 10–20: 8, 20–30: 5. Моод бүлэг"]], ["Дадлага 2", ["0–10: 3, 10–20: 8, 20–30: 5, 30–40: 4 (N = 20). Дундаж", "Мөн хүснэгтийн медиан"]], ["★ Сорилт", ["0–10: 10, 10–20: 20, 20–40: 20. Нягтаар моод бүлэг ба дундаж", "Бүх утгыг 5-аар нэмэгдүүлбэл дундаж хэрхэн өөрчлөгдөх вэ?"]], ["Хэрэглээ", ["20 сурагчийн утсаар өнгөрүүлэх цаг: 0–2: 4, 2–4: 9, 4–6: 5, 6–8: 2. Дундаж"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "150–160 завсрын дунд утга", "0–4: 2, 4–8: 6, 8–12: 2. Дундаж", "Мөн хүснэгтийн медиан", "0–10: 6, 10–15: 6, 15–30: 9. Нягтаар моод бүлэг", "Нэг моодтой 6, 13, 14, x, 4, 6 өгөгдлийн моод x бол x __(Олонлог 10, Дасгал 14 №1)__"], "quiz": ["40–50 завсрын дунд утга", "0–10: 2, 10–20: 5, 20–30: 3. Дундаж", "Тэнцүү биш завсарт яагаад давтамжийн нягтыг хэрэглэдэг вэ?"], "key": [["III. Суурь сэргээх", ["1) 7", "2) 5", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: Σf·x = 420 + 805 + 1250 + 810 + 435 = 3720; x̄ = 124 кВт·ц", "Жишээ 2: моод бүлэг 120–130; хуримтлагдсан 4, 11, 21 → Me = 120 + (15 − 11) : 10 · 10 = 124", "Жишээ 3: нягт 0,5; 1,5; 1; 0,33 → 10–20 (20–40 биш!)"]], ["Шалгах цэг", ["1) (10 + 75 + 75) : 10 = 16", "2) 5 дахь утга → 10–20"]], ["I. Ажлын хуудас", ["№1: 5", "№2: 5", "№3: 25", "№4: 10–20", "№5: (15 + 120 + 125 + 140) : 20 = 20", "№6: 10 + (10 − 3) : 8 · 10 = 18,75", "№7: нягт 1; 2; 1 → 10–20; x̄ = (50 + 300 + 600) : 50 = 19", "№8: 5-аар ихэснэ", "№9: (4 + 27 + 25 + 14) : 20 = 3,5 цаг"]], ["Багийн даалгавар", ["x̄ = 3720 : 30 = 124 кВт·ц; моод бүлэг 120–130; Me = 124.", "Төлбөр ≈ 124 · 200 = 24 800₮.", "Үгүй: медиан 124 тул айлын тал нь 124-өөс бага, тал нь их хэрэглэдэг."]], ["II. Гэрийн даалгавар", ["№1: 155", "№2: (4 + 36 + 20) : 10 = 6", "№3: 4 + (5 − 2) : 6 · 4 = 6", "№4: нягт 0,6; 1,2; 0,6 → 10–15", "№5: 6"]], ["III. Гарах тасалбар", ["№1: 45 (шалгуур 1)", "№2: 16 (шалгуур 2)", "№3: завсрын өргөн ялгаатай тул давтамжийг өргөнд хувааж харьцуулна (шалгуур 3)"]]], "F": ["\\bar{x}=\\frac{\\sum f\\,x}{\\sum f}", "Me=L+\\frac{\\frac{N}{2}-F}{f}\\cdot h", "\\text{нягт}=\\frac{f}{\\text{өргөн}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>x</mi></mrow><mo stretchy=\"true\">&#x000AF;</mo></mover><mo>&#x0003D;</mo><mfrac><mrow><mo>&#x02211;</mo><mi>f</mi><mspace width=\"0.167em\" /><mi>x</mi></mrow><mrow><mo>&#x02211;</mo><mi>f</mi></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M</mi><mi>e</mi><mo>&#x0003D;</mo><mi>L</mi><mo>&#x0002B;</mo><mfrac><mrow><mfrac><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#x02212;</mo><mi>F</mi></mrow><mrow><mi>f</mi></mrow></mfrac><mo>&#x000B7;</mo><mi>h</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>нягт</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>f</mi></mrow><mrow><mtext>өргөн</mtext></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-37"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-37"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Бүлэглэсэн өгөгдлийн дунджууд (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/10354"], ["Mozaik: «статистик» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L37.png", "ol": [["Нэг моодтой 6, 13, 14, x, 4, 6 өгөгдлийн моод x бол x", "6", "Олонлог 10, Дасгал 14 №1"], ["Завсар [0; 3[ — 3, [3; 6[ — 12, [6; 9[ — 6, [9; 12[ — 9. Арифметик дундаж ба моод бүлэг", "x̄ = 198 : 30 = 6,6; моод бүлэг [3; 6[", "Олонлог 10, Дасгал 14 №2"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Үнэн мэдээлэл»:** Статистикийг зориуд гуйвуулж (жишээ нь зөвхөн тохирох тоог сонгож) хүмүүсийг төөрөгдүүлж болно. Шударга хүн тоог үнэнээр нь харуулдаг. Асуулт: «Би сүлжээнд тараасан тоо баримтаа шалгадаг уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 4, 6, 8, 10-ын дундаж; 2) 3, 9, 1, 7, 5-ын медиан; 3) 2, 5, 5, 7, 9-ийн моод", "**Холбоос (1 мин):** 6–8 дугаар ангид цөөн тоонд дундаж, медиан, моод олсон (Олонлог 8, х. 9); өнөөдөр олон тоог бүлэглэсэн үед олно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** 30 айлын цахилгааны хэрэглээг нэг бүрчлэн биш, бүлгээр нь (100–110, 110–120, …) өгчээ. Нэг айл дунджаар хэдэн кВт·ц хэрэглэдэг вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Завсрын дунд утга: (доод + дээд) : 2. Дундаж x̄ = Σf·x : Σf. Моод бүлэг — давтамж хамгийн их бүлэг; завсар тэнцүү биш бол давтамжийн нягт (f : өргөн) хамгийн их бүлэг.", "   Медиан: N/2 дахь утга орох бүлгийг хуримтлагдсан давтамжаар олно; Me = L + (N/2 − F) : f · h (L — бүлгийн доод хил, F — өмнөх бүлгүүдийн нийт давтамж, f — бүлгийн давтамж, h — өргөн).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 100–110: 4, 110–120: 7, 120–130: 10, 130–140: 6, 140–150: 3 (N = 30). Дундаж", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Мөн хүснэгтийн моод бүлэг ба медиан", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): Нас: 0–10: 5, 10–20: 15, 20–40: 20, 40–70: 10. Моод бүлэг", "**3. Түгээмэл алдаа:** Дунджийг тооцоолохдоо завсрын дунд утгын оронд хилийг авах; Σf·x-ийг завсрын тоонд хуваах; тэнцүү биш завсарт давтамжаар моод сонгох.", "**4. Шалгах цэг (3 мин):** 1) 0–10: 2, 10–20: 5, 20–30: 3. Дундаж; 2) Мөн хүснэгтийн медиан бүлэг. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Манай айлын цахилгаан»: дээрх 30 айлын хүснэгтээр 1) завсрын дунд утга, f·x баганыг нөхөж дунджийг ол. 2) Моод бүлэг ба медианыг ол. 3) Нэг айл 1 кВт·ц-д 200₮ төлдөг бол дундаж айлын сарын төлбөр хэд вэ? 4) «Ихэнх айл 124-өөс бага хэрэглэдэг» гэдэг үнэн үү? Медианаар тайлбарла.", "**Бүтээгдэхүүн:** Нөхсөн хүснэгт ба 3 өгүүлбэр тайлбар", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "38": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Тэнцүү ба тэнцүү биш завсартай гистограммыг унших, байгуулах; цэгэн диаграмм зурж, дундаж цэгээр хандлагын шулуун татах, корреляцийн төрлийг тодорхойлж таамаглал хийх.", "crit": ["Би гистограммыг зөв (нягтаар) байгуулж уншиж чадна.", "Би цэгэн диаграмм зурж, хандлагын шулууны тэгшитгэлийг бичиж чадна.", "Би корреляцийн төрлийг тодорхойлж, таамаглалыг тайлбарлаж чадна."], "words": "гистограмм; давтамжийн нягт; цэгэн диаграмм; хандлагын шулуун; корреляц — эерэг, сөрөг, байхгүй.", "ex": [["Температур x: 10, 14, 18, 22, 26; зайрмаг y: 20, 28, 35, 45, 52. Дундаж цэг", "(18; 36)"], ["Дундаж цэг ба (10; 20)-оор хандлагын шулуун; 30°C-т таамаглал", "k = 16 : 8 = 2 → y = 2x; y(30) = 60"], ["20–40 завсарт f = 30 бол гистограммын өндөр", "нягт 30 : 20 = 1,5"]], "ck": [["Хичээлд зарцуулсан цаг ↑, дүн ↑ — ямар корреляц?", "эерэг"], ["y = 2x бол 25°C-т зайрмаг", "50"]], "ws": [["Сэргээх", ["5 + 8 + 6", "x: 1, 2, 3; y: 2, 4, 6 бол y = ?"]], ["Дадлага 1", ["Тэнцүү завсарт 10–20: f = 8 бол баганын өндөр", "Хичээлд суусан цаг ↑, дүн ↑"]], ["Дадлага 2", ["0–10: f = 5 ба 10–30: f = 30-ийн нягт", "(1; 3), (3; 5), (5; 10)-ын дундаж цэг"]], ["★ Сорилт", ["(2; 5), (6; 13)-аар дайрах хандлагын шулуун", "Мөн шулуунаар x = 10 үеийн таамаглал"]], ["Хэрэглээ", ["Утсаар тоглох цаг ↑, нойр ↓. Корреляц ба y = −0,5x + 9 бол x = 4 цагт нойр"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "Өндөр ба гутлын размер", "15–25 завсарт f = 20 бол нягт", "(0; 4), (5; 14)-өөр хандлагын шулуун", "Мөн шулуунаар x = 8", "Завсар [0; 3[ — 3, [3; 6[ — 12, [6; 9[ — 6, [9; 12[ — 9. Гистограммын хамгийн өндөр багана __(Олонлог 10, Дасгал 14 №2)__"], "quiz": ["Агаарын температур ба зайрмагийн борлуулалт", "y = 2x бол x = 30-д", "Корреляц нь шалтгааныг баталдаг уу?"], "key": [["III. Суурь сэргээх", ["1) 2", "2) 10–20", "3) 9"]], ["Жишээ 1–3", ["Жишээ 1: (18; 36)", "Жишээ 2: k = 16 : 8 = 2 → y = 2x; y(30) = 60", "Жишээ 3: нягт 30 : 20 = 1,5"]], ["Шалгах цэг", ["1) эерэг", "2) 50"]], ["I. Ажлын хуудас", ["№1: 19", "№2: y = 2x", "№3: 8", "№4: эерэг корреляц", "№5: 0,5 ба 1,5", "№6: (3; 6)", "№7: k = 2; y = 2x + 1", "№8: 21", "№9: сөрөг; 7 цаг"]], ["Багийн даалгавар", ["Дундаж цэг (18; 36); y = 2x; 30°C-т ≈ 60 зайрмаг; эерэг корреляц.", "Өндөр ба алд: эерэг корреляц, ихэвчлэн y ≈ x (алд ≈ өндөр).", "Хэмжилтийн тоо багт өөр; дүгнэлтийн логикийг үнэлнэ."]], ["II. Гэрийн даалгавар", ["№1: эерэг корреляц", "№2: 2", "№3: y = 2x + 4", "№4: 20", "№5: [3; 6[ (12)"]], ["III. Гарах тасалбар", ["№1: эерэг корреляц (шалгуур 1)", "№2: 60 (шалгуур 2)", "№3: Үгүй: хамт өөрчлөгдөх нь шалтгаан гэсэн үг биш (шалгуур 3)"]]], "F": ["\\text{нягт}=\\frac{f}{\\text{өргөн}}", "y-\\bar{y}=k(x-\\bar{x})"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mtext>нягт</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>f</mi></mrow><mrow><mtext>өргөн</mtext></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y</mi><mo>&#x02212;</mo><mover><mrow><mi>y</mi></mrow><mo stretchy=\"true\">&#x000AF;</mo></mover><mo>&#x0003D;</mo><mi>k</mi><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x02212;</mo><mover><mrow><mi>x</mi></mrow><mo stretchy=\"true\">&#x000AF;</mo></mover><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-38"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-38"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Гистограмм (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/811"], ["Mozaik: «гистограмм» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L38.png", "ol": [["Завсар [0; 3[ — 3, [3; 6[ — 12, [6; 9[ — 6, [9; 12[ — 9. Гистограммын хамгийн өндөр багана", "[3; 6[ (12)", "Олонлог 10, Дасгал 14 №2"]], "tb": [["Автобусны 40 зорчигчийн нас: 6, 70, 5, 32, 19, 44, 25, 18, 56, 24, 30, 54, 57, 21, 43, 54, 35, 36, 47, 33, 33, 48, 25, 20, 32, 35, 29, 54, 69, 42, 21, 49, 63, 52, 47, 28, 48, 24, 54, 39. 10 жилийн завсраар бүлэглэж гистограмм байгуул", "0–9: 2, 10–19: 2, 20–29: 9, 30–39: 9, 40–49: 8, 50–59: 7, 60–69: 2, 70–79: 1", "Математик X, §12.2 №10"]], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хамаарал ба шалтгаан»:** Хоёр зүйл хамт өсөх нь нэг нь нөгөөгийн шалтгаан гэсэн үг биш. Яаран дүгнэлт хийхгүй, нотолгоо хайх нь шударга сэтгэлгээ. Асуулт: «Би бусдын талаар яаран дүгнэлт хийдэг үү?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) (0; 1), (2; 5)-аар дайрах шулууны налалт; 2) 10–20: f = 8, 20–30: f = 5. Аль нь өндөр багана вэ?; 3) y = 2x + 1, x = 4 бол y", "**Холбоос (1 мин):** №22-т шулууны тэгшитгэл, №37-д бүлэглэсэн өгөгдлийг үзсэн; өнөөдөр өгөгдлийг графикаар харуулж хандлагыг олно."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Зуны халуун өдөр зайрмаг илүү зарагддаг уу? 30°C-т хэд зарагдахыг урьдчилан хэлж болох уу?", "**1. Гол санаа (самбарт):** Гистограмм: завсар тэнцүү бол баганын өндөр = давтамж; тэнцүү биш бол өндөр = давтамжийн нягт (f : өргөн).", "   Цэгэн диаграмм — (x; y) хосууд. Хандлагын шулуун дундаж цэг (x̄; ȳ)-г дайрч, цэгүүдийн «голоор» явна. x өсөхөд y өсвөл эерэг, буурвал сөрөг корреляц. Корреляц ≠ шалтгаан.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): Температур x: 10, 14, 18, 22, 26; зайрмаг y: 20, 28, 35, 45, 52. Дундаж цэг", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Дундаж цэг ба (10; 20)-оор хандлагын шулуун; 30°C-т таамаглал", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 20–40 завсарт f = 30 бол гистограммын өндөр", "**3. Түгээмэл алдаа:** Тэнцүү биш завсарт өндрийг давтамжаар авах; хандлагын шулууныг зөвхөн эхний ба сүүлийн цэгээр татах; корреляцийг шалтгаан гэж дүгнэх.", "**4. Шалгах цэг (3 мин):** 1) Хичээлд зарцуулсан цаг ↑, дүн ↑ — ямар корреляц?; 2) y = 2x бол 25°C-т зайрмаг. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Хамаарлыг хэмжье»: 1) Зайрмагийн өгөгдлөөр цэгэн диаграмм зурж, дундаж цэг, хандлагын шулуун, 30°C-ийн таамаглалыг ол. 2) Багийн 4 гишүүн ба хөрш багийн 4 хүний өндөр (x) ба алд (y)-ыг см-ээр хэмжиж цэгэн диаграмм зурна. 3) Ямар корреляц байна? Өндөр ба алдын хооронд ямар дүгнэлт гарах вэ?", "**Бүтээгдэхүүн:** Хоёр цэгэн диаграмм ба дүгнэлт", "**Нэгж 9-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "39": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Зураглал танилцуулах, нөхөх", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хуримтлагдсан давтамжийн хүснэгт ба график байгуулж, графикаас медиан, квартил, квартил хоорондын далайцыг олох, хоёр өгөгдлийн тархалтыг харьцуулах; «Өгөгдлийн шинжилгээ» нэгжийг оюуны зураглалаар нэгтгэх.", "crit": ["Би хуримтлагдсан давтамжийн хүснэгт, графикийг байгуулж чадна.", "Би графикаас (жагсаалтаас) Q₁, Q₂, Q₃, IQR-ыг олж чадна.", "Би нэгжийн ойлголтуудыг оюуны зураглалаар холбож чадна."], "words": "хуримтлагдсан давтамж; квартил Q₁, Q₂ (медиан), Q₃; квартил хоорондын далайц IQR = Q₃ − Q₁; оюуны зураглал.", "ex": [["Оноо: 0–20: 4, 20–40: 6, 40–60: 10, 60–80: 10, 80–100: 10. Хуримтлагдсан давтамж", "4, 10, 20, 30, 40"], ["Q₁, Q₂, Q₃ ба IQR", "10, 20, 30 дахь утга → 40, 60, 80; IQR = 40"], ["2, 4, 6, 8, 10, 12, 14-ийн Q₁, Q₃", "Q₂ = 8; Q₁ = 4, Q₃ = 12"]], "ck": [["N = 60 бол Q₃ хэд дэх утга вэ?", "45 дахь"], ["Q₁ = 40, Q₃ = 75 бол IQR", "35"]], "ws": [["Сэргээх", ["2, 5, 3-ын хуримтлагдсан давтамж", "1, 3, 5, 7, 9-ийн медиан"]], ["Дадлага 1", ["2, 4, 6, 8, 10, 12, 14-ийн Q₁ ба Q₃", "Мөн өгөгдлийн IQR"]], ["Дадлага 2", ["0–10, 10–20, 20–30, 30–40 давтамж 10, 10, 10, 10. Хуримтлагдсан давтамж", "Мөн өгөгдлийн Q₁, Q₂, Q₃ ба IQR"]], ["★ Сорилт", ["0–2: 2, 2–4: 6, 4–6: 8, 6–8: 4 (N = 20). Медиан", "Мөн өгөгдлийн Q₁"]], ["Хэрэглээ", ["А ангийн IQR = 10, Б ангийн IQR = 25. Аль ангийн дүн жигд вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "4, 6, 10-ын хуримтлагдсан давтамж", "3, 5, 7, 9, 11, 13, 15, 17-ийн медиан", "Мөн өгөгдлийн Q₁, Q₃ ба IQR", "N = 40 бол Q₃ хэд дэх утга вэ?", "Хөл бөмбөгийн багийн оноо: 1 0 2 4 0 1 1 1 2 5 3 0 1 2 2 2. Дундаж, медиан, моод, далайц __(Олонлог 10, Дасгал 14 №4)__"], "quiz": ["1, 2, 3, 4, 5, 6, 7-гийн Q₁", "Q₁ = 40, Q₃ = 75 бол IQR", "N = 60 бол медиан хэд дэх утга вэ?"], "key": [["III. Суурь сэргээх", ["1) 3, 8, 10", "2) 5", "3) 10"]], ["Жишээ 1–3", ["Жишээ 1: 4, 10, 20, 30, 40", "Жишээ 2: 10, 20, 30 дахь утга → 40, 60, 80; IQR = 40", "Жишээ 3: Q₂ = 8; Q₁ = 4, Q₃ = 12"]], ["Шалгах цэг", ["1) 45 дахь", "2) 35"]], ["I. Ажлын хуудас", ["№1: 2, 7, 10", "№2: 5", "№3: 4 ба 12", "№4: 8", "№5: 10, 20, 30, 40", "№6: 10, 20, 30; IQR = 20", "№7: 4 + (10 − 8) : 8 · 2 = 4,5", "№8: 2 + (5 − 2) : 6 · 2 = 3", "№9: А анги (тархалт бага)"]], ["Багийн даалгавар", ["Q₁ = 40, Q₂ = 60, Q₃ = 80, IQR = 40.", "70 оноо: 60–80 бүлгийн дунд → хуримтлагдсан ≈ 20 + 5 = 25 сурагч бага авсан.", "Зураглалын агуулгыг багш шалгуураар үнэлнэ."]], ["II. Гэрийн даалгавар", ["№1: 4, 10, 20", "№2: 10", "№3: 6, 14; IQR = 8", "№4: 30 дахь", "№5: 27/16 ≈ 1,69; 1,5; 1 ба 2; 5"]], ["III. Гарах тасалбар", ["№1: 2 (шалгуур 1)", "№2: 35 (шалгуур 2)", "№3: 30 дахь (шалгуур 3)"]]], "F": ["Q_{1}:\\ \\frac{N}{4},\\quad Q_{2}:\\ \\frac{N}{2},\\quad Q_{3}:\\ \\frac{3N}{4}", "IQR=Q_{3}-Q_{1}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>Q</mi><mrow><mn>1</mn></mrow></msub><mi>:</mi><mtext>&#x000A0;</mtext><mfrac><mrow><mi>N</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>Q</mi><mrow><mn>2</mn></mrow></msub><mi>:</mi><mtext>&#x000A0;</mtext><mfrac><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#x0002C;</mo><mspace width=\"1em\" /><msub><mi>Q</mi><mrow><mn>3</mn></mrow></msub><mi>:</mi><mtext>&#x000A0;</mtext><mfrac><mrow><mn>3</mn><mi>N</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi><mi>Q</mi><mi>R</mi><mo>&#x0003D;</mo><msub><mi>Q</mi><mrow><mn>3</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>Q</mi><mrow><mn>1</mn></mrow></msub></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-39"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-39"], ["GeoGebra график", "https://www.geogebra.org/graphing"], ["Өгөгдөл цуглуулах (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/538"], ["Mozaik: «квартил» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L39.png", "ol": [["Хөл бөмбөгийн багийн оноо: 1 0 2 4 0 1 1 1 2 5 3 0 1 2 2 2. Дундаж, медиан, моод, далайц", "27/16 ≈ 1,69; 1,5; 1 ба 2; 5", "Олонлог 10, Дасгал 14 №4"], ["Мөн өгөгдлийн ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>Q</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><msub><mi>Q</mi><mrow><mn>3</mn></mrow></msub></mrow></math>⟧ ба IQR", "Q₁ = 1, Q₃ = 2, IQR = 1", "Олонлог 10, Дасгал 14 №4"]], "tb": [], "digital": true, "stype": "C", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хүн бүрийг тооцох»:** Дундаж «сайн» байхад ч доод 25%-д байгаа хүмүүс мартагддаг. Квартил тэднийг харуулдаг. Сайн хамт олон хамгийн хоцорсон гишүүнээ ч тооцдог. Асуулт: «Ангид хэн тусламж хэрэгтэй байна?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) 3, 5, 2-ын хуримтлагдсан давтамж; 2) 1, 3, 5, 7, 9-ийн медиан; 3) 40-ийн 25%", "**Холбоос (1 мин):** №37–38-д медиан, гистограммыг үзсэн; өнөөдөр өгөгдлийг 4 тэнцүү хэсэгт хуваана."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Чи шалгалтад 70 оноо авлаа. Энэ сайн уу? Ангийн хэдэн хувь чамаас бага авсныг яаж мэдэх вэ?", "**1. Гол санаа (самбарт):** Хуримтлагдсан давтамж — тухайн бүлгийн дээд хил хүртэлх нийт давтамж. Графикт (дээд хил; хуримтлагдсан давтамж) цэгүүдийг гөлгөр муруйгаар холбоно.", "   Q₁ — N/4, Q₂ — N/2, Q₃ — 3N/4 дахь утга: босоо тэнхлэгээс хэвтээ шугам татаж, муруйтай огтлолцсон цэгээс доош бууна. IQR = Q₃ − Q₁ — дунд 50%-ийн тархалт; бага бол жигд.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): Оноо: 0–20: 4, 20–40: 6, 40–60: 10, 60–80: 10, 80–100: 10. Хуримтлагдсан давтамж", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): Q₁, Q₂, Q₃ ба IQR", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 2, 4, 6, 8, 10, 12, 14-ийн Q₁, Q₃", "**3. Түгээмэл алдаа:** Давтамжийг хуримтлуулахгүйгээр зурах; цэгийг завсрын дунд утгад тавих (зөв нь дээд хил); Q₁-ийг N/4 биш 25 гэж авах.", "**4. Шалгах цэг (3 мин):** 1) N = 60 бол Q₃ хэд дэх утга вэ?; 2) Q₁ = 40, Q₃ = 75 бол IQR. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Оюуны зураглал (багаар):** 1-р хэсэг (15 мин): Дээрх 40 сурагчийн онооны хуримтлагдсан давтамжийн графикийг зурж, Q₁, Q₂, Q₃-ийг графикаас уншина. «70 оноо авсан сурагчаас ангийн хэдэн хүн бага авсан бэ?» 2-р хэсэг: «Өгөгдлийн шинжилгээ» нэгжийн оюуны зураглал — төвд «Өгөгдөл»; салаа: төв хандлага (дундаж, медиан, моод), бүлэглэсэн өгөгдөл, график (гистограмм, цэгэн диаграмм, хуримтлагдсан), тархалт (далайц, квартил, IQR), хамаарал (корреляц, хандлага). Салаа бүрт томьёо, жишээ, амьдралын хэрэглээ.", "**Бүтээгдэхүүн:** График ба А3 оюуны зураглал", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "40": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: нэгж тойрог ба 0°–180° өнцгийн тригонометр харьцаа", 28], ["V. Хосын гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Хос солилцож шалгах, сайжруулах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Нэгж тойргоор 0°–180° өнцгийн sin, cos, tg-ийг тодорхойлж, 180° − α томьёо ба sin²α + cos²α = 1-ийг хэрэглэж утгыг олох.", "crit": ["Би нэгж тойргоор sin, cos, tg-ийн утга ба тэмдгийг тодорхойлж чадна.", "Би 180° − α томьёогоор мохоо өнцгийн утгыг олж чадна.", "Би нэг харьцаагаар бусад харьцааг олж чадна."], "words": "нэгж тойрог (r = 1); sin α = y, cos α = x, tg α = y : x; мохоо өнцөг: sin > 0, cos < 0, tg < 0; sin(180° − α) = sin α.", "ex": [["sin 120°", "sin(180° − 60°) = sin 60° = √3/2"], ["cos 135° ба tg 150°", "−cos 45° = −√2/2; −tg 30° = −√3/3"], ["cos α = −3/5, 90° < α < 180° бол sin α, tg α", "sin α = 4/5; tg α = −4/3"]], "ck": [["cos 150°", "−√3/2"], ["sin α = 1/2, 0° ≤ α ≤ 180° бол α", "30° эсвэл 150°"]], "ws": [["Сэргээх", ["sin 30°", "cos 60°"]], ["Дадлага 1", ["sin 150°", "cos 135°"]], ["Дадлага 2", ["tg 120°", "sin²120° + cos²120°"]], ["★ Сорилт", ["cos α = −3/5, α мохоо бол sin α ба tg α", "sin α = 1/2, 0° ≤ α ≤ 180° бол α"]], ["Хэрэглээ", ["1 м радиустай дугуйн цэг 150°-аар эргэв. Төвөөс хэдэн м дээш байх вэ?"]], ["Код унших (сонголттой)", ["cout << sin(30 * M_PI / 180) << \" \" << sin(30);  — яагаад хоёр өөр вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "cos 120°", "sin 135°", "tg 150°", "sin α = 3/5, α мохоо бол cos α", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>44</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003D;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>69</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>136</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧; ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>75</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003D;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>96</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>105</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ __(Олонлог 10, Дасгал 8 №8)__"], "quiz": ["sin 120°", "cos 150°", "cos α < 0 бол α ямар өнцөг вэ?"], "key": [["III. Суурь сэргээх", ["1) 1/2", "2) √2/2", "3) 5"]], ["Жишээ 1–3", ["Жишээ 1: sin(180° − 60°) = sin 60° = √3/2", "Жишээ 2: −cos 45° = −√2/2; −tg 30° = −√3/3", "Жишээ 3: sin α = 4/5; tg α = −4/3"]], ["Шалгах цэг", ["1) −√3/2", "2) 30° эсвэл 150°"]], ["I. Ажлын хуудас", ["№1: 1/2", "№2: 1/2", "№3: 1/2", "№4: −√2/2", "№5: −√3", "№6: 1", "№7: 4/5; −4/3", "№8: 30° эсвэл 150°", "№9: sin 150° = 0,5 м", "№10: 0.5 ба −0.988: sin() радианаар тооцдог"]], ["Багийн даалгавар", ["sin: 0, 1/2, √2/2, √3/2, 1, √3/2, √2/2, 1/2, 0; cos: 1, √3/2, √2/2, 1/2, 0, −1/2, −√2/2, −√3/2, −1.", "sin α = sin(180° − α); cos 90°-аас хойш сөрөг.", "Жишээ: sin²120° + cos²120° = 3/4 + 1/4 = 1."]], ["II. Гэрийн даалгавар", ["№1: −1/2", "№2: √2/2", "№3: −√3/3", "№4: −4/5", "№5: 0,69; 0,96"]], ["III. Гарах тасалбар", ["№1: √3/2 (шалгуур 1)", "№2: −√3/2 (шалгуур 2)", "№3: мохоо (90° < α ≤ 180°) (шалгуур 3)"]]], "F": ["\\sin\\alpha=y,\\quad \\cos\\alpha=x,\\quad \\tan\\alpha=\\frac{y}{x}", "\\sin(180^{\\circ}-\\alpha)=\\sin\\alpha,\\quad \\cos(180^{\\circ}-\\alpha)=-\\cos\\alpha", "\\sin^{2}\\alpha+\\cos^{2}\\alpha=1"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><mi>&#x003B1;</mi><mo>&#x0003D;</mo><mi>y</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>cos</mi><mi>&#x003B1;</mi><mo>&#x0003D;</mo><mi>x</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>tan</mi><mi>&#x003B1;</mi><mo>&#x0003D;</mo><mfrac><mrow><mi>y</mi></mrow><mrow><mi>x</mi></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><mo stretchy=\"false\">&#x00028;</mo><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x02212;</mo><mi>&#x003B1;</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>sin</mi><mi>&#x003B1;</mi><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>cos</mi><mo stretchy=\"false\">&#x00028;</mo><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x02212;</mo><mi>&#x003B1;</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mo>&#x02212;</mo><mi>cos</mi><mi>&#x003B1;</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>sin</mi><mrow><mn>2</mn></mrow></msup><mi>&#x003B1;</mi><mo>&#x0002B;</mo><msup><mi>cos</mi><mrow><mn>2</mn></mrow></msup><mi>&#x003B1;</mi><mo>&#x0003D;</mo><mn>1</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-40"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-40"], ["PhET «Trig Tour»", "https://phet.colorado.edu/en/simulations/trig-tour"], ["Mozaik: «тригонометр» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L40.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>44</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003D;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>69</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>136</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧; ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>75</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003D;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>96</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>sin</mi><msup><mn>105</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧", "0,69; 0,96", "Олонлог 10, Дасгал 8 №8"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos</mi><msup><mn>166</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003D;</mo><mo>&#x02212;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>97</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos</mi><msup><mn>14</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧", "0,97", "Олонлог 10, Дасгал 8 №8"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><mi>sin</mi><msup><mn>150</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2</mn><mi>cos</mi><msup><mn>150</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧", "1,5; −√3 ≈ −1,73", "Олонлог 10, Дасгал 8 №1, №2"]], "tb": [], "digital": false, "stype": "B", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хоёр талыг харах»:** sin 30° = sin 150°: өөр өнцөг атлаа ижил утга. Нэг асуудлыг хоёр талаас нь харвал хоёулаа зөв байж болдог. Асуулт: «Маргаанд нөгөө хүний талаас харж чадсан уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) sin 30°; 2) cos 45°; 3) Катетууд 3, 4 бол гипотенуз", "**Холбоос (1 мин):** 8–9 дүгээр ангид тэгш өнцөгт гурвалжинд хурц өнцгийн sin, cos-ийг үзсэн; өнөөдөр мохоо өнцөгт өргөтгөнө."]], ["IV. Самбарын тайлбар: нэгж тойрог ба 0°–180° өнцгийн тригонометр харьцаа", ["**Асуудал:** Гурвалжинд мохоо өнцөг байж болно. Гэтэл тэгш өнцөгт гурвалжинд мохоо өнцөг байхгүй. sin 120°-ийг яаж тодорхойлох вэ?", "**1. Гол санаа (самбарт):** Нэгж тойрог дээр OX-ээс α өнцгөөр эргүүлсэн цэг P(x; y): sin α = y, cos α = x, tg α = y : x (x ≠ 0). sin²α + cos²α = 1.", "   sin(180° − α) = sin α, cos(180° − α) = −cos α, tg(180° − α) = −tg α. Мохоо өнцөгт sin > 0, cos < 0. sin 90° = 1, cos 90° = 0, cos 180° = −1, tg 90° тодорхойгүй.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): sin 120°", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): cos 135° ба tg 150°", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): cos α = −3/5, 90° < α < 180° бол sin α, tg α", "**3. Түгээмэл алдаа:** cos 120° = cos 60° гэх (тэмдэг алдах); sin-ийг x, cos-ийг y гэж андуурах; мохоо өнцөгт sin-ийг сөрөг гэх.", "**4. Шалгах цэг (3 мин):** 1) cos 150°; 2) sin α = 1/2, 0° ≤ α ≤ 180° бол α. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Нэгж тойргийн хүснэгт»: 0°, 30°, 45°, 60°, 90°, 120°, 135°, 150°, 180° өнцгийн sin, cos-ийг нэгж тойргийн зургаас нөхнө. Хосоороо 3 асуултад хариулна: 1) sin ямар өнцөгт ижил утгатай вэ? 2) cos-ийн тэмдэг хаана солигдох вэ? 3) sin² + cos²-ийг 2 өнцөгт шалга.", "**Бүтээгдэхүүн:** Нөхсөн хүснэгт ба 3 дүгнэлт", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "41": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хоёр тал ба хоорондох өнцгөөр гурвалжин, параллелограммын талбайг тооцоолж, талбайгаар өнцөг олох, газрын талбайн бодлогод хэрэглэх.", "crit": ["Би хоёр тал ба хоорондох өнцгөөр гурвалжны талбайг олж чадна.", "Би параллелограммын талбай ба талбайгаар өнцгийг олж чадна.", "Би газрын талбайн бодлогод хэрэглэж чадна."], "words": "гурвалжны талбай S = ½·a·b·sin C; параллелограммын талбай S = a·b·sin α; хоёр тал ба хоорондох өнцөг.", "ex": [["a = 6, b = 8, C = 30°", "S = ½·6·8·½ = 12"], ["a = 5, b = 4, C = 150°", "S = ½·20·½ = 5"], ["Параллелограмм 6 ба 10, өнцөг 60°", "S = 60·√3/2 = 30√3"]], "ck": [["a = 4, b = 10, C = 30°", "10"], ["a = 4, b = 6, C = 60°", "6√3"]], "ws": [["Сэргээх", ["½·6·4", "sin 30°"]], ["Дадлага 1", ["a = 4, b = 10, C = 30°", "a = 6, b = 6, C = 90°"]], ["Дадлага 2", ["a = 8, b = 5, C = 150°", "a = 4, b = 6, C = 60°"]], ["★ Сорилт", ["S = 15, a = 6, b = 10 бол C", "Параллелограмм 8 ба 5, өнцөг 45°"]], ["Хэрэглээ", ["Талбай 40 м, 50 м, өнцөг 120° (√3 ≈ 1,73)"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "a = 10, b = 12, C = 30°", "a = 7, b = 4, C = 90°", "a = 6, b = 8, C = 120°", "Параллелограмм 4 ба 9, өнцөг 150°", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><mi>sin</mi><msup><mn>150</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ __(Олонлог 10, Дасгал 8 №1)__"], "quiz": ["a = 6, b = 5, C = 30°", "4 талтай зөв гурвалжны талбай", "S = 12, a = 6, b = 8 бол sin C"], "key": [["III. Суурь сэргээх", ["1) 20", "2) 1/2", "3) √3/2"]], ["Жишээ 1–3", ["Жишээ 1: S = ½·6·8·½ = 12", "Жишээ 2: S = ½·20·½ = 5", "Жишээ 3: S = 60·√3/2 = 30√3"]], ["Шалгах цэг", ["1) 10", "2) 6√3"]], ["I. Ажлын хуудас", ["№1: 12", "№2: 1/2", "№3: 10", "№4: 18", "№5: 10", "№6: 6√3", "№7: 30° эсвэл 150°", "№8: 20√2", "№9: 500√3 ≈ 865 м²"]], ["Багийн даалгавар", ["1: 10; 18.", "2: sin C = 1/2 → C = 30° эсвэл 150°; 20√2 ≈ 28,3.", "3: S = 500√3 ≈ 865 м²; үр ≈ 173 кг."]], ["II. Гэрийн даалгавар", ["№1: 30", "№2: 14", "№3: 12√3", "№4: 18", "№5: 1,5"]], ["III. Гарах тасалбар", ["№1: 7,5 (шалгуур 1)", "№2: 4√3 (шалгуур 2)", "№3: 1/2 (шалгуур 3)"]]], "F": ["S=\\frac{1}{2}ab\\sin C", "S_{\\text{парал.}}=ab\\sin\\alpha"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>a</mi><mi>b</mi><mi>sin</mi><mi>C</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>S</mi><mrow><mtext>парал.</mtext></mrow></msub><mo>&#x0003D;</mo><mi>a</mi><mi>b</mi><mi>sin</mi><mi>&#x003B1;</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-41"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-41"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Пифагорын теорем (видео)", "https://youtu.be/A9VnTyb6Ivw"], ["Mozaik: «гурвалжны талбай» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L41.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3</mn><mi>sin</mi><msup><mn>150</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧", "1,5", "Олонлог 10, Дасгал 8 №1"]], "tb": [["Гурвалжны хоёр тал 20 м, 21 м, хоорондох өнцгийн синус 0,6 бол талбай", "S = ½·20·21·0,6 = 126 м²", "Математик X, §8.2 №26-ийн өгөгдлөөр"], ["Квадратын тал бүрийг 3 дахин ихэсгэвэл талбай хэрхэн өөрчлөгдөх вэ?", "9 дахин ихэснэ", "Математик X, §8.3 №51"]], "digital": false, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хамтын хувь нэмэр»:** Талбай хоёр тал ба өнцгөөс хамаардаг: нэг нь ч дутвал талбай гарахгүй. Багийн үр дүн ч гишүүн бүрийн хувь нэмрээс бүрддэг. Асуулт: «Өнөөдөр баг/хосдоо би юу нэмэр болсон бэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) Суурь 10, өндөр 4 гурвалжны талбай; 2) sin 150°; 3) sin 60°", "**Холбоос (1 мин):** 6–8 дугаар ангид S = ah/2-ыг үзсэн; №40-д мохоо өнцгийн sin-ийг үзсэн; өнөөдөр өндөргүйгээр талбай олно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Гурвалжин талбайн хоёр тал 40 м, 50 м, хоорондох өнцөг 120°. Өндрийг хэмжих боломжгүй. Талбайг яаж олох вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** C өнцгийн эсрэг оройгоос өндөр h = b·sin C тул S = ½·a·h = ½·a·b·sin C (C — a, b талын хоорондох өнцөг).", "   Параллелограмм: S = a·b·sin α. sin(180° − α) = sin α тул талбайгаар өнцөг олоход 2 хариу (α ба 180° − α) гарч болно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): a = 6, b = 8, C = 30°", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): a = 5, b = 4, C = 150°", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): Параллелограмм 6 ба 10, өнцөг 60°", "**3. Түгээмэл алдаа:** Хоорондох биш өнцгийг авах; ½-ийг мартах; sin C = 1/2 үед зөвхөн 30° гэж хариулах (150° ч болно).", "**4. Шалгах цэг (3 мин):** 1) a = 4, b = 10, C = 30°; 2) a = 4, b = 6, C = 60°. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 3 станц (7 минут тутам). 1 «Гурвалжин»: a = 8, b = 5, C = 150° ба a = 6, b = 6, C = 90°-ийн талбай. 2 «Урвуу бодлого»: S = 15, a = 6, b = 10 бол C-г ол; параллелограмм 8 ба 5, өнцөг 45°-ийн талбай. 3 «Тариалан»: 40 м, 50 м, 120° гурвалжин талбай; 1 м²-д 0,2 кг үр шаардлагатай бол хэдэн кг үр хэрэгтэй вэ? (√3 ≈ 1,73)", "**Бүтээгдэхүүн:** Станцын хариуны карт", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "42": {"stages": [["I. Зохион байгуулалт, аюулгүй байдал", 3], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 5], ["IV. Даалгавар ба хэмжих арга (ангид)", 8], ["V. Хээрийн хэмжилт (сургуулийн талбайд)", 30], ["VI. Ангидаа тооцоолох", 15], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 10], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Косинусын ба синусын теоремыг ашиглан гурвалжны үл мэдэгдэх тал, өнцгийг олж, сургуулийн талбайд шууд хэмжих боломжгүй зайг бодит хэмжилтээр тооцоолох.", "crit": ["Би косинусын теоремоор тал ба өнцгийг олж чадна.", "Би синусын теоремоор тал, өнцөг, R-ийг олж чадна.", "Би бодит хэмжилтээр шууд хэмжих боломжгүй зайг тооцоолж чадна."], "words": "косинусын теорем a² = b² + c² − 2bc·cos A; синусын теорем a : sin A = b : sin B = c : sin C = 2R; шууд хэмжих боломжгүй зай.", "ex": [["b = 5, c = 8, A = 60° бол a", "a² = 25 + 64 − 40 = 49 → a = 7"], ["3, 5, 7 талтай гурвалжны хамгийн их өнцөг", "cos = (9 + 25 − 49) : 30 = −1/2 → 120°"], ["a = 10, A = 30°, B = 45° бол b", "b = 10·sin 45° : sin 30° = 10√2 ≈ 14,1"]], "ck": [["b = 3, c = 8, A = 60° бол a", "7"], ["a = 6, A = 30° бол R", "2R = 12 → R = 6"]], "ws": [["Сэргээх", ["cos 60°", "3² + 4²"]], ["Дадлага 1", ["b = 3, c = 8, A = 60° бол a", "a = 6, A = 30°, B = 90° бол b"]], ["Дадлага 2", ["5, 7, 8 талтай гурвалжинд 7-гийн эсрэг өнцөг", "a = 8, A = 45°, B = 30° бол b"]], ["★ Сорилт", ["7, 8, 13 талтай гурвалжны хамгийн их өнцөг", "a = 6, A = 30° бол багтаасан тойргийн R"]], ["Хэрэглээ", ["CA = 30 м, CB = 40 м, C = 60° бол AB"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "b = 5, c = 3, A = 120° бол a", "a = 12, A = 30° бол R", "3, 5, 7 талтай гурвалжны хамгийн их өнцөг", "a = 10, A = 45°, B = 60° бол b", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>b</mi><mo>&#x0003D;</mo><mn>14</mn><mrow><mo>&#x0002C;</mo></mrow><mn>6</mn></mrow></math>⟧ см, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>A</mi><mi>B</mi><mi>C</mi><mo>&#x0003D;</mo><msup><mn>65</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>B</mi><mi>A</mi><mi>C</mi></mrow></math>⟧ __(Олонлог 10, Дасгал 8 №7)__"], "quiz": ["b = 8, c = 3, A = 60° бол a", "a = 5, A = 30° бол R", "Хэзээ косинусын, хэзээ синусын теорем хэрэглэх вэ?"], "key": [["III. Суурь сэргээх", ["1) 1/2", "2) −1/2", "3) 7"]], ["Жишээ 1–3", ["Жишээ 1: a² = 25 + 64 − 40 = 49 → a = 7", "Жишээ 2: cos = (9 + 25 − 49) : 30 = −1/2 → 120°", "Жишээ 3: b = 10·sin 45° : sin 30° = 10√2 ≈ 14,1"]], ["Шалгах цэг", ["1) 7", "2) 2R = 12 → R = 6"]], ["I. Ажлын хуудас", ["№1: 1/2", "№2: 25", "№3: 7", "№4: 12", "№5: cos = (25 + 64 − 49) : 80 = 1/2 → 60°", "№6: 4√2", "№7: cos = (49 + 64 − 169) : 112 = −1/2 → 120°", "№8: 6", "№9: √1300 ≈ 36,1 м"]], ["Багийн даалгавар", ["Жишээ: AB² = 900 + 1600 − 2·30·40·½ = 1300 → AB ≈ 36,1 м.", "Багуудын хэмжилт өөр; өнцгийн 1°-ын алдаа зайг ≈ 0,5 м өөрчилнө.", "Алдааны шалтгаан: олс суларсан, өнцөг хэмжигч, цэгийг буруу тэмдэглэх."]], ["II. Гэрийн даалгавар", ["№1: a² = 25 + 9 + 15 = 49 → 7", "№2: 12", "№3: 120°", "№4: 5√6 ≈ 12,2", "№5: 65° (a = b тул ∠A = ∠B)"]], ["III. Гарах тасалбар", ["№1: 7 (шалгуур 1)", "№2: 5 (шалгуур 2)", "№3: 2 тал + хоорондох өнцөг эсвэл 3 тал → косинус; тал + 2 өнцөг → синус (шалгуур 3)"]]], "F": ["a^{2}=b^{2}+c^{2}-2bc\\cos A", "\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><msup><mi>c</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>2</mn><mi>b</mi><mi>c</mi><mi>cos</mi><mi>A</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>sin</mi><mi>A</mi></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mi>sin</mi><mi>B</mi></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mi>sin</mi><mi>C</mi></mrow></mfrac><mo>&#x0003D;</mo><mn>2</mn><mi>R</mi></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-42"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-42"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Пифагорын теорем (видео)", "https://youtu.be/A9VnTyb6Ivw"], ["Mozaik: «косинусын теорем» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L42.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>b</mi><mo>&#x0003D;</mo><mn>14</mn><mrow><mo>&#x0002C;</mo></mrow><mn>6</mn></mrow></math>⟧ см, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>A</mi><mi>B</mi><mi>C</mi><mo>&#x0003D;</mo><msup><mn>65</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>B</mi><mi>A</mi><mi>C</mi></mrow></math>⟧", "65° (a = b тул ∠A = ∠B)", "Олонлог 10, Дасгал 8 №7"]], "tb": [["Хөл бөмбөгийн хаалга 5 м өргөн. Тоглогч нэг шонгоос 21 м, нөгөөгөөс 19 м зайтай. Хаалга ямар өнцгөөр харагдах вэ?", "cos = 777/798 ≈ 0,974 → ≈ 13°", "Математик X, §8.2 №14"], ["Цэцэрлэгийн ажилтан P-ээс Q (175 м), Q-ээс R (63 м) явдаг, ∠PQR = 112°. PR шулуун зам", "≈ 207 м", "Математик X, §8.2 №15"], ["Гурвалжны хоёр тал 20 м, 21 м, хоорондох өнцгийн синус 0,6 бол гурав дахь тал", "cos = ±0,8 → 13 м эсвэл ≈ 38,9 м", "Математик X, §8.2 №26"]], "digital": true, "stype": "F", "mode": "баг", "teach": [["I. Зохион байгуулалт, аюулгүй байдал", ["• Ирц бүртгэж, баг бүрдүүлнэ.", "**Аюулгүй байдал:** замын хөдөлгөөнөөс хол, багшийн харах хүрээнд ажиллах; багаж (метр, туузан хэмжүүр)-ийг зөв барих; цагийн дохиогоор цуглах."]], ["II. Ёс зүйн 1 минут", ["**«Нарийвчлал ба хариуцлага»:** Хэмжилтийн жижиг алдаа ч эцсийн хариуг ихээр өөрчилдөг. Инженер, барилгачин нарийн хэмжиж, хоёр дахин шалгадаг. Асуулт: «Би ажлаа хоёр дахин шалгадаг уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (2 мин):** 1) cos 60°; 2) cos 120°; 3) √49", "**Холбоос (1 мин):** 8 дугаар ангид Пифагорын теоремыг үзсэн (A = 90° үед косинусын теорем Пифагор болно); №40–41-д sin, cos-ийг үзсэн."]], ["IV. Даалгавар ба хэмжих арга (ангид)", ["**Асуудал:** Сургуулийн барилгын хоёр булангийн хооронд (эсвэл хашааны цаадах цэг хүртэл) шулуун туузан хэмжүүр тавих боломжгүй. Зайг яаж олох вэ?", "**Гол санаа:** Косинусын теорем: a² = b² + c² − 2bc·cos A (A — b, c талын хоорондох өнцөг). Өнцөг олох: cos A = (b² + c² − a²) : (2bc). A = 90° бол Пифагор.", "   Синусын теорем: a : sin A = b : sin B = c : sin C = 2R (R — багтаасан тойргийн радиус). Хоёр тал + хоорондох өнцөг эсвэл гурван тал → косинус; тал + хоёр өнцөг → синус.", "**Жишээ:** b = 5, c = 8, A = 60° бол a → a² = 25 + 64 − 40 = 49 → a = 7", "• Хэмжилтийн хүснэгт, хэмжих дарааллыг тайлбарлана."]], ["V. Хээрийн хэмжилт (сургуулийн талбайд)", ["**Багийн гүйцэтгэлийн даалгавар:** «Шууд хэмжиж болохгүй зай» (талбайд 35 мин). 1) C цэг сонгоно (A ба B — хоорондоо шууд хэмжих боломжгүй цэгүүд: барилгын хоёр булан, хашааны цаадах мод г.м.). CA ба CB-г туузан хэмжүүрээр хэмжинэ. 2) C өнцгийг картон өнцөг хэмжигчээр 2 удаа хэмжинэ. 3) Ангидаа косинусын теоремоор AB-г тооцоолно. 4) Боломжтой бол AB-г тойруу замаар хэмжиж харьцуулна. Жишээ: CA = 30 м, CB = 40 м, C = 60°.", "**Бүтээгдэхүүн:** Хэмжилтийн хүснэгт, тооцоо, алдааны дүгнэлт", "**Нэгж 10-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна.", "• Хэмжилт бүрийг 2 удаа хийж дунджийг авна (хэмжилтийн алдааг багасгах)."]], ["VI. Ангидаа тооцоолох", ["• Багууд хэмжилтээ ашиглан тооцоо хийнэ.", "• Багш баг бүрийн тооцооны алхмыг шалгаж, алдааг асуултаар чиглүүлнэ.", "**Шалгах цэг:** 1) b = 3, c = 8, A = 60° бол a; 2) a = 6, A = 30° бол R"]], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "44": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Дүгнэлтээ шалгах, батлах", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хэмжилт, туршилтаар багтсан ба төв өнцгийн хамаарлыг өөрсдөө илрүүлж дүгнэлт гаргах, багтсан өнцгийн чанар, тойрогт багтсан дөрвөн өнцөгтийн чанарыг бодлогод хэрэглэх.", "crit": ["Би хэмжилтээр багтсан ба төв өнцгийн хамаарлыг дүгнэж чадна.", "Би багтсан өнцгийн чанараар өнцөг олж чадна.", "Би багтсан дөрвөн өнцөгтийн чанарыг хэрэглэж, тайлбарлаж чадна."], "words": "төв өнцөг — орой нь төвд; багтсан өнцөг — орой нь тойрог дээр; нум; багтсан өнцөг = төв өнцгийн хагас; диаметрт тулсан өнцөг = 90°.", "ex": [["Төв өнцөг 100° бол тэр нумд тулсан багтсан өнцөг", "50°"], ["AB — диаметр, ∠CAB = 35° бол ∠ABC", "∠ACB = 90° → ∠ABC = 55°"], ["ABCD тойрогт багтсан, ∠A = 70° бол ∠C", "110°"]], "ck": [["Нум 80° бол багтсан өнцөг", "40°"], ["Тойрогт багтсан тэгш өнцөгт гурвалжны гипотенуз юу вэ?", "диаметр"]], "ws": [["Сэргээх", ["Гурвалжны 2 өнцөг 45°, 75° бол 3 дахь", "Адил хажуут гурвалжны оройн өнцөг 80° бол суурийн өнцөг"]], ["Дадлага 1", ["Төв өнцөг 120° бол багтсан өнцөг", "Нум 80° бол багтсан өнцөг"]], ["Дадлага 2", ["AB — диаметр, ∠CAB = 35° бол ∠ABC", "ABCD тойрогт багтсан, ∠A = 85° бол ∠C"]], ["★ Сорилт", ["Багтсан өнцөг 3x, нэг нумд тулсан төв өнцөг 4x + 20° бол багтсан өнцөг", "Нэг нумд тулсан багтсан өнцгүүд 2x + 10° ба 50° бол x"]], ["Хэрэглээ", ["Тайзыг нуман эгнээний нэг суудлаас 40° өнцгөөр харж байна. Мөн эгнээний өөр суудлаас?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "Төв өнцөг 140° бол багтсан өнцөг", "Нум 200° бол багтсан өнцөг", "Диаметрт тулсан багтсан өнцөг", "ABCD тойрогт багтсан, ∠B = 100° бол ∠D", "Адил хажуут гурвалжны суурьд буулгасан өндөр 10, хажуу талд буулгасан өндөр 12 бол талбай __(Математик X, §7.1 №7)__"], "quiz": ["Төв өнцөг 90° бол багтсан өнцөг", "Тойрогт багтсан тэгш өнцөгт гурвалжны гипотенуз юу вэ?", "ABCD тойрогт багтсан, ∠A = 60° бол ∠C"], "key": [["III. Суурь сэргээх", ["1) 70°", "2) 100°", "3) 360°"]], ["Жишээ 1–3", ["Жишээ 1: 50°", "Жишээ 2: ∠ACB = 90° → ∠ABC = 55°", "Жишээ 3: 110°"]], ["Шалгах цэг", ["1) 40°", "2) диаметр"]], ["I. Ажлын хуудас", ["№1: 60°", "№2: 50°", "№3: 60°", "№4: 40°", "№5: 55°", "№6: 95°", "№7: 6x = 4x + 20 → x = 10 → 30°", "№8: 20", "№9: 40° (нэг нумд тулсан)"]], ["Багийн даалгавар", ["∠ACB = ∠ADB = ∠AEB = ½∠AOB.", "AB диаметр бол багтсан өнцөг бүр 90°.", "Багтсан дөрвөн өнцөгт: ∠A + ∠C = ∠B + ∠D = 180°."]], ["II. Гэрийн даалгавар", ["№1: 70°", "№2: 100°", "№3: 90°", "№4: 80°", "№5: 75 (суурь 15, хажуу 12,5)"]], ["III. Гарах тасалбар", ["№1: 45° (шалгуур 1)", "№2: диаметр (шалгуур 2)", "№3: 120° (шалгуур 3)"]]], "F": ["\\angle ACB=\\frac{1}{2}\\angle AOB", "\\angle A+\\angle C=180^{\\circ}\\ \\text{(багтсан 4 өнцөгт)}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>A</mi><mi>C</mi><mi>B</mi><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#x02220;</mo><mi>A</mi><mi>O</mi><mi>B</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;</mo><mi>A</mi><mo>&#x0002B;</mo><mo>&#x02220;</mo><mi>C</mi><mo>&#x0003D;</mo><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup><mtext>&#x000A0;</mtext><mtext>(багтсан&#x000A0;4&#x000A0;өнцөгт)</mtext></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-44"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-44"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «багтсан өнцөг» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L44.png", "ol": [], "tb": [["Адил хажуут гурвалжны суурьд буулгасан өндөр 10, хажуу талд буулгасан өндөр 12 бол талбай", "75 (суурь 15, хажуу 12,5)", "Математик X, §7.1 №7"]], "digital": false, "stype": "C", "mode": "дүгнэлт", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Тууштай байдал»:** Нэг нумд тулсан багтсан өнцөг тойргийн аль ч цэгээс харахад ижил хэвээр байдаг. Сайн хүн ч хаана, хэнтэй байхаас үл хамааран ижил зарчимтай байдаг. Асуулт: «Би багшийн дэргэд ба байхгүй үед ижилхэн байдаг уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) Гурвалжны 2 өнцөг 50°, 60° бол 3 дахь; 2) Адил хажуут гурвалжны суурийн өнцөг 40° бол оройн өнцөг; 3) Бүтэн өнцөг", "**Холбоос (1 мин):** 6–8 дугаар ангид гурвалжны өнцөг, тойргийн элементийг үзсэн; өнөөдөр тойрог доторх өнцгийг судална."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Театрын нуман эгнээний аль суудлаас тайз «илүү өргөн» харагдах вэ? Хариу нь гайхалтай: бүгдээс нь ижил!", "**1. Гол санаа (самбарт):** Төв өнцөг (орой нь O-д) тулсан нумтайгаа тэнцүү. Багтсан өнцөг (орой нь тойрог дээр) = тулсан нумын хагас = төв өнцгийн хагас.", "   Үр дүн: нэг нумд тулсан багтсан өнцгүүд тэнцүү; диаметрт тулсан багтсан өнцөг 90°; тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгүүдийн нийлбэр 180°.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): Төв өнцөг 100° бол тэр нумд тулсан багтсан өнцөг", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): AB — диаметр, ∠CAB = 35° бол ∠ABC", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ABCD тойрогт багтсан, ∠A = 70° бол ∠C", "**3. Түгээмэл алдаа:** Багтсан өнцгийг төв өнцөгтэй тэнцүү гэх; хагасын оронд 2 дахин авах; эсрэг биш, хөрш өнцгийн нийлбэрийг 180° гэх.", "**4. Шалгах цэг (3 мин):** 1) Нум 80° бол багтсан өнцөг; 2) Тойрогт багтсан тэгш өнцөгт гурвалжны гипотенуз юу вэ?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Ажиглаж оюун дүгнэлт гаргах:** «Өнцгийн нууц»: 1) r = 5 см тойрог зурж, AB нумыг сонгоно. ∠AOB-ийг хэмжинэ. 2) Тойрог дээр C, D, E гурван цэг (AB нумаас гадна) авч ∠ACB, ∠ADB, ∠AEB-г хэмжинэ. 3) Хүснэгтэд бичиж «Багтсан өнцөг төв өнцөгтэй ямар холбоотой вэ?» дүгнэлт гаргана. 4) AB-г диаметр болгож давтана. 5) Тойрогт багтсан дөрвөн өнцөгт зурж, эсрэг өнцгүүдийг нэмж дүгнэнэ.", "**Бүтээгдэхүүн:** Хэмжилтийн хүснэгт ба 3 дүгнэлт", "• Хос ажиглалтаа хүснэгтэд бичиж, «Үргэлж … байна» гэсэн дүгнэлт (таамаглал) гаргана.", "• Багш «Энэ дүгнэлт бүх тохиолдолд үнэн үү? Яаж шалгах вэ?» гэж асууна."]], ["VI. Дүгнэлтээ шалгах, батлах", ["• 2–3 хос дүгнэлтээ самбарт бичнэ. Анги эсрэг жишээ хайж шалгана.", "• Багш дүгнэлтийг теорем/чанар болгон нэрлэж, үндэслэлийг товч харуулна."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "45": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хөвч, шүргэгч, огтлогчийн чанаруудыг (огтлолцсон хөвч, шүргэгч ба огтлогч, хоёр огтлогч) бодлогод хэрэглэж, нуман гүүрийн радиус, тэнгэрийн хаяа хүртэлх зайг тооцоолох.", "crit": ["Би шүргэгч ба хөвчийн чанарыг Пифагорын теоремтой хослуулж чадна.", "Би огтлолцсон хөвч, шүргэгч ба огтлогчийн чанарыг хэрэглэж чадна.", "Би бодит бодлогод чанарыг тайлбарлаж хэрэглэж чадна."], "words": "хөвч; шүргэгч — тойрогтой 1 цэгээр шүргэнэ; огтлогч — 2 цэгээр огтолно; шүргэгч ⟂ радиус; AE·EB = CE·ED; PT² = PA·PB.", "ex": [["AE = 4, EB = 6, CE = 3 бол ED", "24 = 3·ED → ED = 8"], ["OP = 13, r = 5 бол шүргэгч PT", "√(169 − 25) = 12"], ["PA = 4, PB = 9 (огтлогч) бол шүргэгч PT", "PT² = 36 → PT = 6"]], "ck": [["AE = 2, EB = 9, CE = 3 бол ED", "6"], ["r = 10, хөвч 16 бол төвөөс хөвч хүртэлх зай", "√(100 − 64) = 6"]], "ws": [["Сэргээх", ["6² + 8²", "4x = 36 бол x"]], ["Дадлага 1", ["AE = 2, EB = 9, CE = 3 бол ED", "OP = 10, r = 6 бол шүргэгч PT"]], ["Дадлага 2", ["r = 10, хөвч 16 бол төвөөс хөвч хүртэлх зай", "P-ээс татсан шүргэгчүүд PA = 7 бол PB"]], ["★ Сорилт", ["Шүргэгч PT = 6, огтлогч PA = 3 бол PB", "Огтлогчид PA = 4, PB = 10, PC = 5 бол PD"]], ["Хэрэглээ", ["Нуман хаалганы хөвч 16 м, өндөр 4 м. Радиус"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "AE = 3, EB = 8, CE = 4 бол ED", "OP = 17, r = 8 бол шүргэгч", "r = 13, хөвч 24 бол төвөөс хөвч хүртэлх зай", "Шүргэгч PT = 8, PA = 4 бол PB", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>R</mi><mo>&#x0003D;</mo><mn>3</mn></mrow></math>⟧ см тойргийн төвөөс ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>O</mi><mi>K</mi><mo>&#x0003D;</mo><mn>5</mn></mrow></math>⟧ см зайтай K цэгээс татсан шүргэгч __(Олонлог 10, Дасгал 10 №9)__"], "quiz": ["Шүргэгч ба шүргэлтийн цэгт татсан радиусын хоорондох өнцөг", "AE = 5, EB = 4, CE = 2 бол ED", "P-ээс татсан 2 шүргэгч PA = 9 бол PB"], "key": [["III. Суурь сэргээх", ["1) 169", "2) 13", "3) 8"]], ["Жишээ 1–3", ["Жишээ 1: 24 = 3·ED → ED = 8", "Жишээ 2: √(169 − 25) = 12", "Жишээ 3: PT² = 36 → PT = 6"]], ["Шалгах цэг", ["1) 6", "2) √(100 − 64) = 6"]], ["I. Ажлын хуудас", ["№1: 100", "№2: 9", "№3: 6", "№4: 8", "№5: 6", "№6: 7", "№7: 36 = 3·PB → 12", "№8: 40 = 5·PD → 8", "№9: 8·8 = 4(2R − 4) → R = 10 м"]], ["Багийн даалгавар", ["64 = 8R − 16 → R = 10 м.", "d² = 4·12 804 = 51 216 → d ≈ 226 км.", "d² = 0,03·12 800,03 ≈ 384 → d ≈ 19,6 км."]], ["II. Гэрийн даалгавар", ["№1: 6", "№2: 15", "№3: 5", "№4: 16", "№5: 4 см"]], ["III. Гарах тасалбар", ["№1: 90° (шалгуур 1)", "№2: 10 (шалгуур 2)", "№3: 9 (шалгуур 3)"]]], "F": ["AE\\cdot EB=CE\\cdot ED", "PT^{2}=PA\\cdot PB", "OP^{2}=r^{2}+PT^{2}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mi>E</mi><mo>&#x000B7;</mo><mi>E</mi><mi>B</mi><mo>&#x0003D;</mo><mi>C</mi><mi>E</mi><mo>&#x000B7;</mo><mi>E</mi><mi>D</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P</mi><msup><mi>T</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mi>P</mi><mi>A</mi><mo>&#x000B7;</mo><mi>P</mi><mi>B</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>O</mi><msup><mi>P</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><msup><mi>r</mi><mrow><mn>
