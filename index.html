  if(!names.length){ov.innerHTML=`<div class="card stack" style="max-width:420px"><b>Сурагчдын нэрсийн жагсаалт алга.</b><span class="muted">«Багшид» хуудасны «Сурагчдын нэрс» хэсэгт нэг удаа оруулна.</span><button class="btn" type="button" data-x>Хаах</button></div>`;ov.classList.add("on");ov.querySelector("[data-x]").onclick=()=>ov.classList.remove("on");return}
  let used=store.get("m10used",[]).filter(x=>names.includes(x));if(used.length>=names.length)used=[];
  const left=names.filter(x=>!used.includes(x));const pick=left[Math.floor(Math.random()*left.length)];used.push(pick);store.set("m10used",used);
  ov.innerHTML=`<div class="pickcard"><div class="pname" id="pname"></div><div class="row" style="justify-content:center"><button class="btn p" type="button" data-again>Дахин</button><button class="btn" type="button" data-x>Хаах</button></div><small class="muted">${left.length-1} сурагч сонгогдоогүй үлдлээ</small></div>`;ov.classList.add("on");
  const el=$("#pname");let k=0;const spin=setInterval(()=>{el.textContent=names[Math.floor(Math.random()*names.length)];if(++k>14){clearInterval(spin);el.textContent=pick;el.classList.add("final")}},70);
  ov.querySelector("[data-x]").onclick=()=>ov.classList.remove("on");ov.querySelector("[data-again]").onclick=pickStudent}

/* teach (facilitation) mode */
let tTimer=null;
function vTeach(n){
  const l=LBY[n];if(!l)return vHome();const lp=LP.C[n]||{},tp=LP.T[n]||{},eth=LP.E[(n-1)%LP.E.length];const u=unitOf(n);
  const crit=`<ol class="crit">${(LP.S&&LP.S[n]?LP.S[n]:["Би өнөөдрийн гол томьёо, ойлголтыг өөрийн үгээр тайлбарлаж чадна.","Би энэ сэдвийн бодлогыг алхамчлан бодож, цахим дадлагад авна.","Би өнөөдрийн сэдвийг бодит жишээнд хэрэглэж, түгээмэл алдааг тайлбарлаж чадна."]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  let slides,stages;
  if(l.assess){stages=ASTAGES;const ls=l.assess.ls.filter(x=>M.G[x]);const rev=M.itemsFrom(ls,6,hash("rev"+n));const id=n===54?"final":"h"+n;
    slides=[{s:0,h:`<span class="pill">Хичээл №${n}</span><h1 class="th">${esc(l.title)}: хичээл ${l.assess.ls[0]}–${l.assess.ls[l.assess.ls.length-1]}</h1><p class="tl">${esc(l.goal)}</p><div class="lvbox"><span class="lv A">80–100% А</span><span class="lv B">50–79% Б</span><span class="lv C">0–49% В</span></div>`},
      {s:1,h:`<h2 class="th">«Үнэнч шударга байдал»</h2><p class="tl">Шалгалт бол чамайг шийтгэх биш, юуг нөхөхөө мэдэх боломж. Өөрийнхөө жинхэнэ түвшинг харуулъя.</p>`},
      {s:2,h:`<h2 class="th">Давтлага: холимог бодлого</h2>${qList(rev,true)}`,rv:true},
      {s:3,h:`<h2 class="th">Шалгалт — 45 минут</h2><ul class="tl"><li>А, Б хувилбарыг эгнээгээр ээлжлэн тараана.</li><li>Бодолтоо алхамчлан бичнэ.</li><li>Цахимаар өгөх бол: <b>${esc(siteUrl())}</b> → Сорил → ${esc(TESTS[id].title)}</li></ul>`},
      {s:4,h:`<h2 class="th">Өөрийгөө үнэлэх</h2><ul class="tl"><li>Хариуг тулгаж, алдсан бодлогын хичээлийн дугаарыг бич.</li><li>Цахимаар өгсөн бол <b>M10.</b> кодоо ангийн группт илгээ.</li></ul>`},
      {s:5,h:`<h2 class="th">Дүгнэлт</h2><p class="tl">Ангиараа хамгийн их алдсан сэдвийг дараагийн давтлагын цагт давтана. Шинэ сэдэв үзэхгүй.</p>`}];
  }else if(NP[n]){stages=NP[n].stages;slides=npSlides(n);}else{stages=STAGES;const it=lpItems(n);
    const exSlides=it.examples.map((ex,k)=>({s:4,ex,k:k+1,role:["Багш загварчилна — «Би хийнэ»","Анги хамтдаа — «Бид хийнэ»","Хосоороо — «Та нар хийнэ»"][k]}));
    slides=[{s:0,h:`<span class="pill">Хичээл №${n}</span> <span class="muted">${esc(u?u.name:"")}</span><h1 class="th">${esc(l.title)}</h1><p class="tl">${pretty(l.goal)}</p><h3>Амжилтын шалгуур</h3>${crit}`},
      {s:1,h:`<span class="pill">Ёс зүйн 1 минут</span><h2 class="th">«${esc(eth[0])}»</h2><p class="tl big">${esc(eth[1])}</p>`},
      {s:2,h:`<h2 class="th">Сууриа шалгая <small>4 мин · дэвтэртээ бие даан</small></h2>${qList(it.pre,true)}<p class="muted">Алдсан бол: давтлагын цагт «Суурь мэдлэг» → ${(PRE[n]||[]).map(f=>esc(FBY[f].t)).join(", ")}</p>`,rv:true},
      {s:3,h:`<h2 class="th">Асуудал</h2><p class="tl big">${esc(lp.m||"")}</p><div class="rv" hidden><p class="tl">${esc(lp.a||"")}</p></div><h3>Өнөөдрийн зорилго</h3>${crit}<p class="muted">Дэвтрийнхээ захад хувийн зорилгоо бич: «Өнөөдөр авна».</p>`,rv:true},
      {s:4,h:`<h2 class="th">Гол санаа</h2><div class="note tl">${l.note||""}</div><div id="twg"></div>`,w:WID[n]},
      ...exSlides,
      {s:4,h:`<h2 class="th">Алдааг ол! <small>Яагаад буруу вэ?</small></h2><ul class="tl mist">${(lp.x||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`},
      {s:4,h:`<h2 class="th">Шалгах цэг <small>3 мин · хариугаа өргө</small></h2>${qList(it.check,true)}${lp.it?`<p class="muted">${esc(lp.it)}</p>`:""}`,rv:true},
      {s:5,h:`<h2 class="th">Бие даан ажиллая</h2><ol class="tl"><li>Тараах материал №${n} (ажлын хуудас): өөрийн түвшнээс эхэл (0-Эхлэл → Суурь → Дунд → Ахисан).</li><li>Утсаараа: <b class="url">${esc(siteUrl())}</b> → Хичээл №${n} → <b>Дадлага</b>: 6-аас 5 зөв → </li><li>авсан бол сурах бичиг: <b>${tp.c?"№"+tp.c:"жишээнүүд"}</b></li><li>А бүлэг: <b>${tp.a?"№"+tp.a:""}${tp.r?" · "+esc(tp.r):""}</b> → дуусгаад бусдад туслах</li></ol><p class="muted">Хариуг сурах бичгийн х. 206–211-ээс өөрөө шалга.</p>`},
      {s:6,h:`<h2 class="th">Гарах тасалбар <small>5 мин</small></h2>${qList(it.exit,true)}<p class="muted">Цахимаар: Хичээл №${n} → «Гарах тасалбар» → кодоо группт илгээ.</p>`,rv:true},
      {s:6,h:`<h2 class="th">Эргэцүүлэл</h2><ul class="tl big"><li>Өнөөдөр юу сурсан бэ?</li><li>Юу хэцүү байсан бэ?</li><li>Дараагийн удаа юуг өөрөөр хийх вэ?</li></ul><h3>Гэрийн даалгавар</h3><p class="tl">Ажлын хуудасны II хэсэг · Сурах бичиг: ${tp.h?"№"+tp.h:""}${tp.a?" · А бүлэг №"+tp.a:""} · аваагүй бол цахим дадлагаа дуусга.</p>`}];
  }
  let cur=0,stage=-1,left=0,running=false;
  if(tTimer){clearInterval(tTimer);tTimer=null}
  const render=()=>{const sl=slides[cur];if(sl.s!==stage){stage=sl.s;left=stages[stage][1]*60;running=false}
    app.innerHTML=`<div class="teach"><div class="tbar"><div class="tstage"><b>${stages[stage][0]}</b><span class="muted"> · ${stages[stage][1]} мин</span></div>
      <div class="ttime ${left<0?"over":""}" id="ttime">${fmtT(left)}</div><button class="btn s" type="button" id="tplay">${running?"Зогсоох":"▶ Цаг"}</button>
      <button class="btn s" type="button" id="tpick">Сурагч</button>${VIDS[n]?`<a class="btn s" href="#l-${n}" title="Видео хичээл">Видео</a>`:""}${sl.rv?'<button class="btn s" type="button" id="trv">Хариу</button>':""}
      <span class="tcount">${cur+1}/${slides.length}</span><button class="btn s" type="button" id="tprev" ${cur?"":"disabled"}>◀</button><button class="btn p s" type="button" id="tnext" ${cur<slides.length-1?"":"disabled"}>▶</button><a class="btn s" href="#lesson-${n}"></a></div>
      <div class="tprog">${stages.map((s,i)=>`<i class="${i<stage?"d":i===stage?"c":""}" style="flex:${s[1]}" title="${esc(s[0])}"></i>`).join("")}</div>
      <div class="tslide" id="tslide"></div></div>`;
    const box=$("#tslide");setTimeout(()=>npMath(box),0);
    if(sl.ex){const st=[];splitTop(String(sl.ex.sol),"; ").forEach(p=>{const b=/ тул |, /.test(p)?[p]:splitTop(p," = ");st.push(b[0]);for(let i=1;i<b.length;i++)st.push("= "+b[i])});
      box.innerHTML=`<span class="pill">Жишээ ${sl.k}</span> <span class="muted">${sl.role}</span><div class="th q2">${sl.ex.q}</div><ol class="steps big" id="tst"></ol><div class="row"><button class="btn" type="button" id="tstep">Дараагийн алхам ▸</button></div><div class="exans" id="tans" hidden>Хариу: <b>${sl.ex.ansText}</b></div>`;
      let i=0;$("#tstep").onclick=()=>{if(i<st.length){const li=document.createElement("li");li.innerHTML=st[i++];$("#tst").appendChild(li)}if(i>=st.length){$("#tstep").hidden=true;$("#tans").hidden=false}}}
    else box.innerHTML=sl.h;
    if(sl.w){W.mount($("#twg"),sl.w[0],sl.w[1])}
    $("#tprev").onclick=()=>{if(cur>0){cur--;render()}};$("#tnext").onclick=()=>{if(cur<slides.length-1){cur++;render()}};
    $("#tpick").onclick=pickStudent;const rv=$("#trv");if(rv)rv.onclick=()=>box.querySelectorAll(".rv").forEach(e=>e.hidden=!e.hidden);
    $("#tplay").onclick=()=>{running=!running;$("#tplay").textContent=running?"Зогсоох":"▶ Цаг"}};
  const fmtT=s=>{const a=Math.abs(s);return (s<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0")};
  tTimer=setInterval(()=>{if(!location.hash.startsWith("#teach-")){clearInterval(tTimer);tTimer=null;return}if(running){left--;const t=$("#ttime");if(t){t.textContent=fmtT(left);t.classList.toggle("over",left<0)}}},1000);
  document.onkeydown=e=>{if(!location.hash.startsWith("#teach-"))return;if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();$("#tnext")&&$("#tnext").click()}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();$("#tprev")&&$("#tprev").click()}};
  render();
}

/* warm-up: 5 quick foundation questions, 60 s each */
function vWarm(){const fs=M.rng(Date.now()%1e6).shuffle(FOUND.map(f=>f.id)).slice(0,5);const items=fs.map((f,i)=>M.foundItems(f,1,Date.now()%1e5+i)[0]);let k=0,left=60,iv=null;
  const show=()=>{const it=items[k];left=60;app.innerHTML=`<div class="board"><div class="row" style="justify-content:space-between"><span class="muted">Өдрийн 5 бодлого · суурь мэдлэг · ${k+1}/5</span><span class="row"><button class="btn s" type="button" id="wpick">Сурагч</button><a class="btn s" href="#review">Гарах</a></span></div>
    <div class="ttime big" id="wt">1:00</div><div class="bq"><span class="bn">${k+1}</span>${it.q}${it.type==="mc"?`<div class="bopts">${it.opts.map((o,j)=>`<span>${"АБВГ"[j]}) ${o}</span>`).join("")}</div>`:""}</div><div class="bans" id="wa" hidden></div>
    <div class="row bctl"><button class="btn" type="button" id="wshow">Хариу</button><button class="btn p" type="button" id="wnext">${k<4?"Дараах →":"Дуусгах"}</button></div></div>`;
    $("#wpick").onclick=pickStudent;$("#wshow").onclick=()=>{$("#wa").hidden=false;$("#wa").innerHTML=`Хариу: <b>${it.ansText}</b><br><span class="bsol">${it.sol}</span>`};
    $("#wnext").onclick=()=>{if(k<4){k++;show()}else{clearInterval(iv);location.hash="review"}}};
  if(iv)clearInterval(iv);iv=setInterval(()=>{if(location.hash!=="#warm"){clearInterval(iv);return}left--;const t=$("#wt");if(t){t.textContent=left>=0?`0:${String(left).padStart(2,"0")}`:"0:00";t.classList.toggle("over",left<=10)}},1000);
  show()}

/* student exit ticket step */
function sExit(st,n){const it=lpItems(n);if(!it){st.innerHTML="";return}
  st.innerHTML=`<div class="card"><b>Гарах тасалбар.</b> Хичээлийн төгсгөлд 3 бодлогыг бие даан бодоод, кодоо багшдаа илгээ.</div><div class="items" id="qitems" style="margin-top:12px"></div><div class="row" style="margin-top:12px"><button class="btn p" type="button" id="finish">Илгээх</button></div><div id="result"></div>`;
  runQuiz(it.exit,{onFinish:(ok,T)=>{const msg=ok===3?"Гайхалтай! Дараагийн сэдэвт бэлэн байна.":ok===2?"Сайн байна. Гэрийн даалгавраар бататгаарай.":"Давтлагын цагт багштайгаа энэ сэдвийг давтъя.";
    $("#result").innerHTML=`<div class="card stack" style="margin-top:12px"><div class="score"><span class="big">${ok}/3</span><span>${msg}</span></div><div class="row"><span>Өөрийгөө үнэл:</span><button class="btn s" type="button" data-sa="Бие даан чадна">Бие даан чадна</button><button class="btn s" type="button" data-sa="Жишээ харж чадна">Жишээ харж чадна</button><button class="btn s" type="button" data-sa="Тусламж хэрэгтэй">Тусламж хэрэгтэй</button></div><div id="ec"></div></div>`;
    const mk=sa=>askName(nm=>{$("#ec").innerHTML=codeBox(enc({k:"e",n:nm,l:n,s:ok,T,sa,d:new Date().toISOString().slice(0,10)}));wireCopy($("#ec"))});
    $("#result").querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{$("#result").querySelectorAll("[data-sa]").forEach(x=>x.classList.remove("on"));b.classList.add("on");mk(b.dataset.sa)});
    $("#result").scrollIntoView({behavior:"smooth",block:"start"})}})}

function exitSummary(cd){const by={};Object.entries(cd.e||{}).forEach(([nm,o])=>Object.entries(o).forEach(([l,r])=>{(by[l]=by[l]||[]).push([nm,r])}));
  const ls=Object.keys(by).map(Number).sort((a,b)=>b-a);if(!ls.length)return"";
  return `<h3 style="margin:18px 0 8px;font-size:17px">Гарах тасалбар (хичээлээр)</h3><div class="scroll"><table class="tbl"><thead><tr><th>Хичээл</th><th>3/3</th><th>2/3</th><th>0–1/3 — давтлагад</th><th>«Тусламж хэрэгтэй»</th></tr></thead><tbody>${ls.map(l=>{const a=by[l];const g=a.filter(x=>x[1].s>=3).length,b=a.filter(x=>x[1].s===2).length;const c=a.filter(x=>x[1].s<=1).map(x=>esc(x[0]));const h=a.filter(x=>x[1].sa==="Тусламж хэрэгтэй").map(x=>esc(x[0]));
    return `<tr><td><a href="#lesson-${l}">№${l}</a> ${esc((LBY[l]||{}).title||"")}</td><td>${g}</td><td>${b}</td><td>${c.length?c.join(", "):"—"}</td><td>${h.length?h.join(", "):"—"}</td></tr>`}).join("")}</tbody></table></div>`}

/* ---------- router ---------- */
function route(){const h=(location.hash||"#home").slice(1);let m;window.scrollTo(0,0);document.body.classList.toggle("boardmode",/^(board-|teach-|warm)/.test(h));
  if(h==="lessons"){setNav("lessons");return vLessons()}
  if((m=h.match(/^lesson-(\d+)$/))){setNav("lessons");return vLesson(+m[1])}
  if((m=h.match(/^found-(f\d+)$/))){setNav("lessons");return vFound(m[1])}
  if(h==="videos"){setNav("videos");return vVideos()}
  if(h==="help"||h==="help-s"||h==="help-t"){setNav("help");return vHelp(h.slice(5))}
  if((m=h.match(/^video-(\d+)$/))){setNav("videos");return vVideo(+m[1])}
  if(h==="assess"){setNav("assess");return vAssess()}
  if((m=h.match(/^test-([a-z0-9]+)-(a|b)$/))){setNav("assess");return vTest(m[1],m[2])}
  if(h==="level"){setNav("level");return vLevel()}
  if((m=h.match(/^level-([a-z0-9]+)$/))){setNav("level");return vLevel(m[1])}
  if(h==="review"){setNav("review");return vReview()}
  if((m=h.match(/^board-([a-z0-9]+)$/))){setNav("");return vBoard(m[1])}
  if(h==="scores"){setNav("teacher");return vTeacher()}
  if((m=h.match(/^teach-(\d+)$/))){setNav("");return vTeach(+m[1])}
  if(h==="warm"){setNav("");return vWarm()}
  setNav("home");vHome()}
function openDlg(){$("#dlg").classList.add("on");$("#dlgE").hidden=true;$("#code").value="";setTimeout(()=>$("#code").focus(),0)}
$("#dlgC").onclick=()=>$("#dlg").classList.remove("on");
$("#dlgF").addEventListener("submit",e=>{e.preventDefault();if($("#code").value.trim()===TEACHER_CODE){teacher=true;store.set("m10t",true);$("#dlg").classList.remove("on");route()}else $("#dlgE").hidden=false});
/* radicals: draw the bar over the radicand */
const RAD=/√(\([^()]*\)|\d+(?:[.,]\d+)?|[a-zA-Z])/g;
function radify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.indexOf("√")>=0&&!(n.parentNode&&n.parentNode.closest&&n.parentNode.closest(".rad,textarea,input,script,style,svg"))?1:3});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(n=>{const s=n.nodeValue;RAD.lastIndex=0;if(!RAD.test(s))return;RAD.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;
    while((m=RAD.exec(s))){f.append(s.slice(last,m.index));let inner=m[1];if(inner[0]==="(")inner=inner.slice(1,-1);const sp=document.createElement("span");sp.className="rad";sp.append("√");const rc=document.createElement("span");rc.className="rc";rc.textContent=inner;sp.append(rc);f.append(sp);last=m.index+m[0].length}
    f.append(s.slice(last));n.replaceWith(f)})}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(x=>{if(x.nodeType===1)radify(x);else if(x.nodeType===3&&x.parentNode)radify(x.parentNode)}))).observe(document.body,{childList:true,subtree:true});
window.doInstall=doInstall;window.LEG={route};
})();

<script>
const DATA={"NP": {"1": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн гүйцэтгэлийн даалгавар", 16], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Натурал илтгэгчтэй зэргийн ойлголтыг тэг ба сөрөг бүхэл илтгэгч рүү өргөтгөж, бүхэл илтгэгчтэй зэргийн чанараар тоон ба алгебрын илэрхийлэл хялбарчлах, бичил ертөнцийн хэмжээг харьцуулахад хэрэглэх.", "crit": ["Би 2⁻³, 5⁰ зэрэг зэргийн утгыг олж чадна.", "Би зэргийн чанараар илэрхийлэл хялбарчилж чадна.", "Би сөрөг илтгэгчтэй зэргийг бодит хэмжээ харьцуулахад хэрэглэж, алдааг тайлбарлаж чадна."], "words": "зэрэг — тоог давтан үржүүлэх; илтгэгч — хэдэн удаа үржүүлэх; суурь — үржигдэх тоо; сөрөг илтгэгч — урвуу тоо (a⁻ⁿ = 1/aⁿ).", "ex": [["2⁻³ + (3/4)⁻² − (−5)⁰", "1/8 + 16/9 − 1 = 65/72"], ["(9⁻² · 27³) / 3⁻²", "3⁻⁴ · 3⁹ / 3⁻² = 3⁷ = 2187"], ["((3a⁻²b⁴) / (6a³b⁻¹))⁻²", "(a⁻⁵b⁵/2)⁻² = 4a¹⁰/b¹⁰"]], "ck": [["5⁰ + 4⁻¹", "1 + 1/4 = 5/4"], ["(1/3)⁻²", "3² = 9"]], "ws": [["Сэргээх", ["5⁰", "2⁻³"]], ["Дадлага 1", ["10⁻²", "(1/2)⁻¹ · 3⁰"]], ["Дадлага 2", ["(2/5)⁻² − 4⁻¹ + 2026⁰", "(8⁻² · 16³) / (4⁻¹ · 2⁴)"]], ["★ Сорилт", ["(a⁻¹ − b⁻¹) / (a⁻² − b⁻²) хялбарчил (a ≠ 0, b ≠ 0, a ≠ ±b)", "Алдааг ол, зас: 2⁻² · 2⁵ = 2⁻¹⁰"]], ["Хэрэглээ", ["Транзистор 5·10⁻⁹ м, үсний голч 5·10⁻⁵ м. Үс транзистороос хэд дахин өргөн бэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "3⁻² + (1/2)⁻³ − 7⁰", "(25⁻² · 125³) / 5³", "((2x⁻³y²) / (6x²y⁻¹))⁻²", "Нэг бактерийн масс 2·10⁻¹² г. 5·10⁶ бактерийн масс хэд вэ?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><msup><mo stretchy=\"false\" etchy=\"false\">&#x00028;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>5</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mi>a</mi><mrow><mn>4</mn></mrow></msup><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup></mrow></math>⟧", "x¹³; a¹⁴", "Олонлог 10, Дасгал 1 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mn>2</mn><mrow><mn>5</mn></mrow></msup><mo>&#x000B7;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mn>2</mn><mrow><mn>3</mn></mrow></msup><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mn>2</mn><mrow><mn>13</mn></mrow></msup></mrow></mfrac></mrow></math>⟧", "2⁴ = 16", "Олонлог 10, Дасгал 1 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>22</mn></mrow></msup><mo>&#x02212;</mo><mn>9</mn><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>21</mn></mrow></msup><mo stretchy=\"false\">&#x00029;</mo><mi>:</mi><msup><mn>5</mn><mrow><mn>21</mn></mrow></msup></mrow></math>⟧", "(10 − 9)·5²¹ : 5²¹ = 1", "Олонлог 10, Дасгал 1 №4"]], "tb": [], "digital": false, "stype": "A", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Нэг алхмын үнэ цэнэ»:** Сөрөг илтгэгчийн нэг «−» тэмдэг 10⁶-г 10⁻⁶ болгож, сая дахин том тоог сая дахин жижиг болгодог. Жижиг алдаа том үр дагавартай. Асуулт: «Миний өдөр тутмын ямар жижиг дадал том үр дагавартай вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 2³ · 2²; 2) 5⁴ : 5²; 3) (3²)³", "**Холбоос (1 мин):** 2³ = 8, 2² = 4, 2¹ = 2 — зүй тогтлоор 2⁰ ба 2⁻¹ хэд байх вэ?"]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Хүний цусны улаан эсийн диаметр 7·10⁻⁶ м, томуугийн вирус 7·10⁻⁸ м. Улаан эс вирусээс хэд дахин том вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a⁰ = 1, a⁻ⁿ = 1/aⁿ, (a/b)⁻ⁿ = (b/a)ⁿ (a, b ≠ 0). Яагаад a ≠ 0 байх ёстойг (0-д хуваахгүй) тайлбарлана.", "   Чанар (m, n бүхэл): aᵐ·aⁿ = aᵐ⁺ⁿ;  aᵐ : aⁿ = aᵐ⁻ⁿ;  (aᵐ)ⁿ = aᵐⁿ;  (ab)ⁿ = aⁿbⁿ;  (a/b)ⁿ = aⁿ/bⁿ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 2⁻³ + (3/4)⁻² − (−5)⁰", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (9⁻² · 27³) / 3⁻²", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ((3a⁻²b⁴) / (6a³b⁻¹))⁻²", "**3. Түгээмэл алдаа:** 3⁻² = −9 гэж бичих (зөв нь 1/9); −2⁴ = 16 гэж бичих (−2⁴ = −16, (−2)⁴ = 16); (a + b)⁻¹ = a⁻¹ + b⁻¹ гэж бичих.", "**4. Шалгах цэг (3 мин):** 1) 5⁰ + 4⁻¹; 2) (1/3)⁻². Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Бичил ертөнцийн хэмжээний шат»: транзистор 5·10⁻⁹ м, вирус 1·10⁻⁷ м, бактери 2·10⁻⁶ м, улаан эс 7·10⁻⁶ м, хүний үсний голч 5·10⁻⁵ м. Жижгээс том руу эрэмбэлж, хөрш хоёр бүрийн харьцааг (хэд дахин) зэргийн чанараар алхамчлан олж, шат хэлбэрийн зураг хийнэ.", "**Бүтээгдэхүүн:** Хэмжээний шат (зураг) ба харьцааны тооцоо бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "2": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Квадрат язгуурын ойлголтыг n зэргийн язгуур болгон өргөтгөж, тэгш ба сондгой зэргийн язгуурын ялгааг тайлбарлах, язгуурын чанараар илэрхийлэл хялбарчилж, хэмжээний бодлогод хэрэглэх.", "crit": ["Би ∛(−8) бодит тоо, √(−9) бодит биш гэдгийг тайлбарлаж чадна.", "Би √72 зэрэг язгуурыг хялбарчилж чадна.", "Би талбай, эзэлхүүнээс тал, ирмэгийн уртыг язгуураар олж чадна."], "words": "язгуур — зэрэг дэвшүүлэхийн урвуу үйлдэл; арифметик язгуур — сөрөг биш утга; тэгш, сондгой зэрэг; хялбарчлах.", "ex": [["⁴√81", "3, учир нь 3⁴ = 81"], ["∛(−125) ба √(−125)-ийн аль нь бодит тоо вэ?", "∛(−125) = −5; √(−125) бодит тоонд байхгүй (тэгш зэргийн язгуур)"], ["√48-ийг хялбарчил", "√(16·3) = 4√3"]], "ck": [["∛4 · ∛16", "∛64 = 4"], ["√75-ыг хялбарчил", "√(25·3) = 5√3"]], "ws": [["Сэргээх", ["(−2)⁵", "Квадрат нь 144 байх бүх тоо"]], ["Дадлага 1", ["⁴√16 + ∛27", "√45 · √5"]], ["Дадлага 2", ["√98-ийг хялбарчил", "∛54 : ∛2"]], ["★ Сорилт", ["∛(−27) бодит тоо мөн, харин ⁴√(−16) бодит тоо биш. Яагаад? Тайлбарла.", "Аль нь их вэ: 2√7 эсвэл 3√3? (Үржигдэхүүнийг язгуур дор оруулж харьцуул.)"]], ["Хэрэглээ", ["Дэлгэцийн өргөн 48 см, өндөр 36 см. Диагональ = √(48² + 36²) хэд вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "∛(−64) + ⁴√81", "√12 · √3", "√200-ийг хялбарчил", "Шоо савны эзэлхүүн 343 л бол ирмэгийн урт хэд вэ?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>81</mn></mrow><mn>4</mn></mroot></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>32</mn></mrow><mn>5</mn></mroot></mrow></math>⟧ __(Олонлог 10, Дасгал 3 №1)__"], "quiz": ["√(−9) ба ∛(−8)-ийн аль нь бодит тоо вэ? Утгыг нь ол.", "√72-ийг хялбарчил", "Квадрат талбайн талбай 18 м² бол талын урт хэд вэ? (хялбарчилсан язгуураар)"], "key": [["III. Суурь сэргээх", ["1) −27", "2) 32", "3) 9 ба −9"]], ["Жишээ 1–3", ["Жишээ 1: 3, учир нь 3⁴ = 81", "Жишээ 2: ∛(−125) = −5; √(−125) бодит тоонд байхгүй (тэгш зэргийн язгуур)", "Жишээ 3: √(16·3) = 4√3"]], ["Шалгах цэг", ["1) ∛64 = 4", "2) √(25·3) = 5√3"]], ["I. Ажлын хуудас", ["№1: −32", "№2: 12 ба −12", "№3: 2 + 3 = 5", "№4: √225 = 15", "№5: √(49·2) = 7√2", "№6: ∛27 = 3", "№7: (−3)³ = −27 тул ∛(−27) = −3; ямар ч бодит тооны 4 зэрэг сөрөг биш тул ⁴√(−16) байхгүй", "№8: 2√7 = √28, 3√3 = √27 тул 2√7 их", "№9: √(2304 + 1296) = √3600 = 60 см"]], ["Багийн даалгавар", ["Ирмэг: ∛27 = 3 дм, ∛125 = 5 дм, ∛1000 = 10 дм (1 л = 1 дм³).", "Тал: √50 = 5√2 ≈ 7,1 м; √72 = 6√2 ≈ 8,5 м; √200 = 10√2 ≈ 14,1 м.", "Талбай 2 дахин ихсэхэд тал √2 ≈ 1,41 дахин ихэснэ: √(2S) = √2 · √S (жишээ: 100 м² → 10 м, 200 м² → 10√2 м)."]], ["II. Гэрийн даалгавар", ["№1: −4 + 3 = −1", "№2: √36 = 6", "№3: √(100·2) = 10√2", "№4: ∛343 = 7 дм", "№5: 3; 2"]], ["III. Гарах тасалбар", ["№1: ∛(−8) = −2; √(−9) бодит тоо биш (шалгуур 1)", "№2: √(36·2) = 6√2 (шалгуур 2)", "№3: √18 = 3√2 м ≈ 4,2 м (шалгуур 3)"]]], "F": ["\\sqrt[n]{a^{n}}=|a|\\ (n\\ \\text{тэгш}),\\quad \\sqrt[n]{a^{n}}=a\\ (n\\ \\text{сондгой})", "\\sqrt[n]{ab}=\\sqrt[n]{a}\\cdot\\sqrt[n]{b}", "\\sqrt[3]{-8}=-2"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><msup><mi>a</mi><mrow><mi>n</mi></mrow></msup></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x0007C;</mo><mi>a</mi><mo stretchy=\"false\">&#x0007C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mtext>&#x000A0;</mtext><mtext>тэгш</mtext><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mroot><mrow><msup><mi>a</mi><mrow><mi>n</mi></mrow></msup></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mi>a</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mtext>&#x000A0;</mtext><mtext>сондгой</mtext><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mi>a</mi><mi>b</mi></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mroot><mrow><mi>a</mi></mrow><mi>n</mi></mroot><mo>&#x000B7;</mo><mroot><mrow><mi>b</mi></mrow><mi>n</mi></mroot></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mo>&#x02212;</mo><mn>8</mn></mrow><mn>3</mn></mroot><mo>&#x0003D;</mo><mo>&#x02212;</mo><mn>2</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-2"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-2"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «язгуур» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L02.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>81</mn></mrow><mn>4</mn></mroot></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>32</mn></mrow><mn>5</mn></mroot></mrow></math>⟧", "3; 2", "Олонлог 10, Дасгал 3 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mn>113</mn><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mn>112</mn><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mn>25</mn><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mn>24</mn><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>⟧", "√225 = 15; √49 = 7", "Олонлог 10, Дасгал 3 №2"]], "tb": [["a = 16, n = 4 ба a = 1024, n = 5 бол a тооны n зэргийн язгуур", "±2; 4", "Математик X, §1.3 №27"]], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Үндсээ мэдэх»:** Язгуур гэдэг үг «үндэс» гэсэн утгатай. Мод үндсээрээ тогтдог шиг хүн ч өдөр бүрийн дадал, зарчмаараа тогтдог. Асуулт: «Миний сурлагын үндэс юу вэ — өдөр бүрийн бага давтлага уу, шалгалтын өмнөх шахалт уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) (−3)³; 2) 2⁵; 3) Квадрат нь 81 байх бүх тоо", "**Холбоос (1 мин):** «Ямар тоог 3 удаа өөрөөр нь үржүүлэхэд 64 гарах вэ?» — өнөөдөр зэрэг дэвшүүлэхийн урвуу үйлдлийг судална."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Шоо хэлбэрийн савны эзэлхүүн 64 дм³, квадрат талбайн талбай 81 м². Савны ирмэг, талбайн тал хэд вэ? ∛(−8) гэж бичиж болох уу?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** bⁿ = a бол b нь a-ийн n зэргийн язгуур. n сондгой: язгуур ганц, a сөрөг байж болно (∛(−8) = −2). n тэгш: a ≥ 0 байх ёстой; сөрөг биш утгыг арифметик язгуур гэнэ (√81 = 9).", "   Чанар (a, b ≥ 0): ⁿ√a · ⁿ√b = ⁿ√(ab);  ⁿ√a : ⁿ√b = ⁿ√(a/b);  (ⁿ√a)ⁿ = a.  Үржигдэхүүн гаргах: √48 = √(16·3) = 4√3.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⁴√81", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ∛(−125) ба √(−125)-ийн аль нь бодит тоо вэ?", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): √48-ийг хялбарчил", "**3. Түгээмэл алдаа:** √(a + b) = √a + √b гэж бичих (√(9 + 16) = 5, харин √9 + √16 = 7); √81 = ±9 гэж бичих (арифметик язгуур нь 9).", "**4. Шалгах цэг (3 мин):** 1) ∛4 · ∛16; 2) √75-ыг хялбарчил. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Малчин өрхийн аж ахуй»: Өвөрхангайн малчин өрх шоо хэлбэрийн 3 усны савтай — эзэлхүүн 27 л, 125 л, 1000 л; Арвайхээрт квадрат хэлбэрийн 3 хашаа — 50 м², 72 м², 200 м². Савны ирмэг, хашааны талыг (хялбарчилсан язгуур ба 0,1 хүртэл ойролцоо утгаар) олж хүснэгт хийнэ. «Талбай 2 дахин ихсэхэд тал хэд дахин ихсэх вэ?» гэдэгт тооцоогоор үндэслэж хариулна.", "**Бүтээгдэхүүн:** Хүснэгт ба 2–3 өгүүлбэр дүгнэлт бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "3": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: рационал илтгэгчийг язгуураас гаргах", 28], ["V. Багийн гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "n зэргийн язгуурыг ашиглан рационал илтгэгчтэй зэргийн тодорхойлолтыг гаргаж, зэргийн чанараар тооцоолох, хялбарчлах, өсөлтийн бодлогод хэрэглэх.", "crit": ["Би 125^(2/3) зэрэг утгыг язгуураар тайлбарлан олж чадна.", "Би x^(2/3) · x^(1/6) зэрэг илэрхийллийг хялбарчилж чадна.", "Би өсөлтийн бодлогод рационал илтгэгч хэрэглэж чадна."], "words": "рационал илтгэгч — бутархай илтгэгч m/n; хуваарь n — язгуурын зэрэг; хүртвэр m — зэрэг.", "ex": [["125^(2/3)", "(∛125)² = 5² = 25"], ["16^(−3/4)", "1 / (⁴√16)³ = 1/2³ = 1/8"], ["x^(1/2) · x^(1/3)-ийг язгуураар бич", "x^(5/6) = ⁶√(x⁵)"]], "ck": [["27^(2/3)", "(∛27)² = 9"], ["6^(3/2) · 6^(5/2)", "6^(8/2) = 6⁴ = 1296"]], "ws": [["Сэргээх", ["∛64", "(√3)²"]], ["Дадлага 1", ["25^(1/2)", "7^(4/5)-ийг язгуураар бич"]], ["Дадлага 2", ["64^(−2/3)", "(9^(2/3))^(3/2)"]], ["★ Сорилт", ["2^(1/2) · 4^(1/4) · 8^(1/6)", "Алдааг ол, зас: 8^(2/3) = 16/3"]], ["Хэрэглээ", ["Мөнгө жилд 1,21 дахин өсдөг. Хагас жилд хэд дахин өсөх вэ? Хувиар илэрхийл."]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "49^(1/2) + 27^(1/3)", "32^(3/5)", "a^(2/3) · a^(1/3) : a^(1/2)", "16^(0,75)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>y</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo>&#x02212;</mo><mn>3</mn></mrow></msup></mrow></math>⟧ __(Олонлог 10, Дасгал 2 №1)__"], "quiz": ["81^(1/4)-ийг язгуураар бичиж утгыг ол", "x^(2/3) · x^(1/6)", "Үнэ жилд 1,44 дахин өссөн. Хагас жилд хэд дахин (хэдэн хувиар) өссөн бэ?"], "key": [["III. Суурь сэргээх", ["1) 2", "2) 7", "3) 2⁶ = 64"]], ["Жишээ 1–3", ["Жишээ 1: (∛125)² = 5² = 25", "Жишээ 2: 1 / (⁴√16)³ = 1/2³ = 1/8", "Жишээ 3: x^(5/6) = ⁶√(x⁵)"]], ["Шалгах цэг", ["1) (∛27)² = 9", "2) 6^(8/2) = 6⁴ = 1296"]], ["I. Ажлын хуудас", ["№1: 4", "№2: 3", "№3: √25 = 5", "№4: ⁵√(7⁴)", "№5: 1 / (∛64)² = 1/16", "№6: 9^(2/3 · 3/2) = 9¹ = 9", "№7: 2^(1/2) · 2^(1/2) · 2^(1/2) = 2^(3/2) = 2√2", "№8: Үржүүлж болохгүй: 8^(2/3) = (∛8)² = 4", "№9: (1,21)^(1/2) = √1,21 = 1,1 → 10%"]], ["Багийн даалгавар", ["4 хагас ая: 440 · 2^(1/3) ≈ 440 · 1,26 ≈ 554,4 Гц.", "6 хагас ая: 440 · 2^(1/2) = 440√2 ≈ 622,3 Гц.", "12 хагас ая: 440 · 2¹ = 880 Гц. 2^(1/2) · 2^(1/2) = 2^(1/2 + 1/2) = 2.", "Морин хуур: 2^(5/12) ≈ 1,335 ≈ 4/3 (1,333)."]], ["II. Гэрийн даалгавар", ["№1: 7 + 3 = 10", "№2: (⁵√32)³ = 2³ = 8", "№3: a^(1 − 1/2) = a^(1/2) = √a", "№4: 16^(3/4) = (⁴√16)³ = 8", "№5: y^(5/3); y^(12/5)"]], ["III. Гарах тасалбар", ["№1: ⁴√81 = 3 (шалгуур 1)", "№2: x^(4/6 + 1/6) = x^(5/6) (шалгуур 2)", "№3: (1,44)^(1/2) = 1,2 → 20% (шалгуур 3)"]]], "F": ["a^{\\frac{m}{n}}=\\sqrt[n]{a^{m}}\\quad (a>0)", "8^{\\frac{2}{3}}=\\left(\\sqrt[3]{8}\\right)^{2}=4", "a^{-\\frac{1}{2}}=\\frac{1}{\\sqrt{a}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mfrac><mrow><mi>m</mi></mrow><mrow><mi>n</mi></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><mroot><mrow><msup><mi>a</mi><mrow><mi>m</mi></mrow></msup></mrow><mi>n</mi></mroot><mspace width=\"1em\" /><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>8</mn><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mroot><mrow><mn>8</mn></mrow><mn>3</mn></mroot><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mn>4</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mrow><mi>a</mi></mrow></msqrt></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-3"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-3"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «зэрэг» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L03.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>y</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo>&#x02212;</mo><mn>3</mn></mrow></msup></mrow></math>⟧", "y^(5/3); y^(12/5)", "Олонлог 10, Дасгал 2 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>3</mn></mrow></msup></mrow></math>⟧", "xy²", "Олонлог 10, Дасгал 2 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mn>64</mn><msup><mi>p</mi><mrow><mn>12</mn></mrow></msup><msup><mi>q</mi><mrow><mo>&#x02212;</mo><mn>6</mn></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></msup></mrow></math>⟧", "32p¹⁰q⁻⁵", "Олонлог 10, Дасгал 2 №2"]], "tb": [], "digital": false, "stype": "B", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хэсэг ба бүхэл»:** 8^(1/3) гэдэг нь 8-ын «гуравны нэг хэсэг» биш, 3 удаа үржихэд 8 болох тоо. Багт ч хүн бүрийн хувь нэмэр үржигдэж бүхэл болдог. Асуулт: «Өнөөдөр би багтаа ямар хувь нэмэр оруулах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) ∛8; 2) √49; 3) (2³)²", "**Холбоос (1 мин):** (√5)² = 5. Хэрэв 5ˣ · 5ˣ = 5¹ бол x хэд байх ёстой вэ? (2x = 1 → x = 1/2)"]], ["IV. Самбарын тайлбар: рационал илтгэгчийг язгуураас гаргах", ["**Асуудал:** Банк мөнгийг жилд 1,21 дахин өсгөдөг. Хагас жилд хэд дахин өсөх вэ? (1,21)^(1/2) гэж юу гэсэн үг вэ?", "**1. Гол санаа (самбарт):** (a^(1/n))ⁿ = a^((1/n)·n) = a¹ = a тул a^(1/n) нь a-ийн n зэргийн язгуур: a^(1/n) = ⁿ√a. Үүнээс a^(m/n) = (a^(1/n))ᵐ = (ⁿ√a)ᵐ = ⁿ√(aᵐ), a > 0.", "   Дүрэм: эхлээд язгуурыг (жижиг тоо), дараа нь зэргийг олбол тооцоо хялбар: 8^(2/3) = (∛8)² = 2² = 4. Сөрөг илтгэгч: a^(−m/n) = 1 / a^(m/n).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 125^(2/3)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 16^(−3/4)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x^(1/2) · x^(1/3)-ийг язгуураар бич", "**3. Түгээмэл алдаа:** 8^(2/3)-ийг 8 · 2/3 гэж үржүүлэх (зөв нь (∛8)² = 4); a^(−1/2)-ийг −√a гэж бичих (зөв нь 1/√a).", "**4. Шалгах цэг (3 мин):** 1) 27^(2/3); 2) 6^(3/2) · 6^(5/2). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Морин хуурын ая»: Октавын 12 хагас аяны хагас ая бүрт давтамж 2^(1/12) дахин өсдөг. «Ла» нот 440 Гц. 4, 6, 12 хагас аяны дараах давтамжийг 440 · 2^(k/12) хэлбэрээр бичиж, илтгэгчийг хялбарчлаад, тооны машинаар 0,1 Гц хүртэл тооцоолж хүснэгт хийнэ. «6 + 6 хагас ая нь яагаад 2 дахин өсөлт болдог вэ?» гэдгийг зэргийн чанараар тайлбарлана. Нэмэлт: морин хуурын 2 утасны давтамжийн харьцаа 2^(5/12)-ийг тооцоолж 4/3-тай харьцуулна.", "**Бүтээгдэхүүн:** Хүснэгт ба зэргийн чанарын тайлбар бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "4": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Маш их, маш бага тоог стандарт дүрсээр бичиж, тэдгээр дээр үйлдэл гүйцэтгэх, шинжлэх ухаан ба технологийн тооцоонд хэрэглэх.", "crit": ["Би 0,00045 зэрэг тоог стандарт дүрсээр бичиж чадна.", "Би стандарт дүрсээр бичсэн тоог үржүүлж, хувааж, хариуг зөв хэлбэрт оруулж чадна.", "Би бодит бодлогыг стандарт дүрсээр бодож, хариуг тайлбарлаж чадна."], "words": "стандарт дүрс — a·10ⁿ (1 ≤ a < 10); таслал шилжүүлэх; их тоо — n эерэг; бага тоо — n сөрөг.", "ex": [["4 280 000-ыг стандарт дүрсээр бич", "4,28·10⁶"], ["0,00071-ийг стандарт дүрсээр бич", "7,1·10⁻⁴"], ["(8·10⁵) · (5·10⁻²)", "40·10³ = 4·10⁴"]], "ck": [["0,0032-ыг стандарт дүрсээр бич", "3,2·10⁻³"], ["(6·10⁸) : (3·10⁻²)", "2·10¹⁰"]], "ws": [["Сэргээх", ["5,6 · 100", "0,3 : 1000"]], ["Дадлага 1", ["52 000-ыг стандарт дүрсээр бич", "0,0009-ийг стандарт дүрсээр бич"]], ["Дадлага 2", ["(2,5·10⁻³) · (4·10⁷)", "(9·10⁴) : (3·10⁻²)"]], ["★ Сорилт", ["7·10³ + 5·10²", "(6·10⁴)(5·10³) = 30·10⁷ гэсэн хариу стандарт дүрс мөн үү? Зас."]], ["Хэрэглээ (бүх бүлэг)", ["Нэг зураг ≈ 3·10⁶ байт. 6,4·10¹⁰ байтын санах ойд хэдэн зураг багтах вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "3 700 000-ыг стандарт дүрсээр бич", "0,00058-ыг стандарт дүрсээр бич", "(1,2·10⁵) · (3·10⁻²)", "(4,8·10⁶) : (1,2·10⁹)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>6</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧-ыг стандарт хэлбэрээр бич __(Олонлог 10, Дасгал 1 №2)__"], "quiz": ["0,00045-ыг стандарт дүрсээр бич", "(5·10⁶) · (4·10⁻⁹)", "Нэг бактерийн масс 2·10⁻¹² г. 1 г-д хэдэн бактери байх вэ?"], "key": [["III. Суурь сэргээх", ["1) 32", "2) 5", "3) 10⁻²"]], ["Жишээ 1–3", ["Жишээ 1: 4,28·10⁶", "Жишээ 2: 7,1·10⁻⁴", "Жишээ 3: 40·10³ = 4·10⁴"]], ["Шалгах цэг", ["1) 3,2·10⁻³", "2) 2·10¹⁰"]], ["I. Ажлын хуудас", ["№1: 560", "№2: 0,0003", "№3: 5,2·10⁴", "№4: 9·10⁻⁴", "№5: 10·10⁴ = 1·10⁵", "№6: 3·10⁶", "№7: 7·10³ + 0,5·10³ = 7,5·10³", "№8: Үгүй (30 ≥ 10): 3·10⁸", "№9: 6,4·10¹⁰ : (3·10⁶) ≈ 2,1·10⁴ ≈ 21 000 зураг"]], ["Багийн даалгавар", ["Сар: 3,84·10⁵ : (3·10⁵) = 1,28 с.", "Нар: 1,5·10⁸ : (3·10⁵) = 0,5·10³ = 5·10² с = 500 с ≈ 8,3 мин.", "Харьцаа: 1,5·10⁸ : (3,84·10⁵) ≈ 0,39·10³ = 3,9·10² ≈ 390 дахин.", "Тойрог зам: 3,5·10² : (3·10⁵) ≈ 1,17·10⁻³ с."]], ["II. Гэрийн даалгавар", ["№1: 3,7·10⁶", "№2: 5,8·10⁻⁴", "№3: 3,6·10³", "№4: 4·10⁻³", "№5: 2·10⁵; 2·10³"]], ["III. Гарах тасалбар", ["№1: 4,5·10⁻⁴ (шалгуур 1)", "№2: 20·10⁻³ = 2·10⁻² (шалгуур 2)", "№3: 1 : (2·10⁻¹²) = 0,5·10¹² = 5·10¹¹ (шалгуур 3)"]]], "F": ["a\\cdot 10^{n},\\quad 1\\le a<10", "(a\\cdot 10^{m})(b\\cdot 10^{n})=ab\\cdot 10^{m+n}", "\\frac{6{,}4\\cdot 10^{10}}{3\\cdot 10^{6}}\\approx 2{,}1\\cdot 10^{4}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>n</mi></mrow></msup><mo>&#x0002C;</mo><mspace width=\"1em\" /><mn>1</mn><mo>&#x02264;</mo><mi>a</mi><mo>&#x0003C;</mo><mn>10</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>m</mi></mrow></msup><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>b</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>n</mi></mrow></msup><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>a</mi><mi>b</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>m</mi><mo>&#x0002B;</mo><mi>n</mi></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>6</mn><mrow><mo>&#x0002C;</mo></mrow><mn>4</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>10</mn></mrow></msup></mrow><mrow><mn>3</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>6</mn></mrow></msup></mrow></mfrac><mo>&#x02248;</mo><mn>2</mn><mrow><mo>&#x0002C;</mo></mrow><mn>1</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>4</mn></mrow></msup></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-4"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-4"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «стандарт хэлбэр» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L04.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>6</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧-ыг стандарт хэлбэрээр бич", "2·10⁵; 2·10³", "Олонлог 10, Дасгал 1 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><msup><mn>1</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧", "0,1 = 1·10⁻¹", "Олонлог 10, Дасгал 1 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mn>25</mn><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>14</mn><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>49</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>6</mn></mrow></msup></mrow></mfrac></mrow></math>⟧-ийг стандарт хэлбэрээр бич", "1/16 = 6,25·10⁻²", "Олонлог 10, Дасгал 1 №5"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Жижиг ч гэсэн үржигддэг»:** Өдөрт 10 минут цаг алдах нь жилд 10·365 ≈ 3,65·10³ минут буюу 60 гаруй цаг болдог. Жижиг зүйл 10ⁿ дахин томордог. Асуулт: «Би өдөр бүр 10 минутыг юунд зарцуулбал жилийн дараа том үр дүн гарах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3,2 · 10; 2) 0,05 · 100; 3) 10³ · 10⁻⁵", "**Холбоос (1 мин):** 10-аар үржүүлэхэд таслал баруун тийш 1 орон, 10-д хуваахад зүүн тийш 1 орон шилждэг — стандарт дүрс үүн дээр тулгуурлана."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Нэг зураг ≈ 3·10⁶ байт, утасны санах ой 64 GB ≈ 6,4·10¹⁰ байт. Хэдэн зураг багтах вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a·10ⁿ, 1 ≤ a < 10, n бүхэл. Таслалыг k орон зүүн тийш шилжүүлбэл n = k, баруун тийш шилжүүлбэл n = −k.", "   (a·10ᵐ)(b·10ⁿ) = ab·10ᵐ⁺ⁿ; (a·10ᵐ):(b·10ⁿ) = (a:b)·10ᵐ⁻ⁿ. ab ≥ 10 эсвэл a:b < 1 бол дахин стандарт дүрсэд оруулна. Нэмэхдээ эхлээд 10-ын зэргийг ижил болгоно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 4 280 000-ыг стандарт дүрсээр бич", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 0,00071-ийг стандарт дүрсээр бич", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): (8·10⁵) · (5·10⁻²)", "**3. Түгээмэл алдаа:** 35·10⁴-ийг стандарт дүрс гэх (1 ≤ a < 10 биш; зөв нь 3,5·10⁵); 10⁻³ · 10⁻⁴ = 10¹² гэж илтгэгчийг үржүүлэх (зөв нь 10⁻⁷).", "**4. Шалгах цэг (3 мин):** 1) 0,0032-ыг стандарт дүрсээр бич; 2) (6·10⁸) : (3·10⁻²). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Гэрлийн аялал»: Дэлхий–Сар 3,84·10⁵ км, Дэлхий–Нар 1,5·10⁸ км, гэрлийн хурд 3·10⁵ км/с. Гэрэл Сар ба Нараас Дэлхийд хүрэх хугацааг (секунд, минут) олж, Нар Сараас хэд дахин хол болохыг стандарт дүрсээр тооцоолно. Нэмэлт: Ж.Гүррагчаагийн нисэх үеийн тойрог замын өндөр ≈ 3,5·10² км бол радио долгион (гэрлийн хурдтай) энэ зайг хэдэн секундэд туулах вэ? Бүх алхмыг стандарт дүрсээр бичнэ.", "**Бүтээгдэхүүн:** Тооцоо ба 2 өгүүлбэр дүгнэлт бүхий хосын хуудас", "**Нэгж 1-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "5": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн гүйцэтгэлийн даалгавар", 16], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Бодит тоог натурал, бүхэл, рационал, иррационал тоонд ангилж, тооны шулуун дээр байршуулах, үйлдлийн чанараар тооцоог хялбарчлах.", "crit": ["Би тоог N, Z, Q, иррационал гэж зөв ангилж чадна.", "Би тараах чанараар хялбар тооцоолж, √30 зэрэг язгуурыг хоёр бүхэл тооны хооронд байршуулж чадна.", "Би тоонуудыг тооны шулуун дээр эрэмбэлж, үндэслэж чадна."], "words": "рационал — бутархайгаар бичигддэг; иррационал — үегүй, төгсгөлгүй бутархай (√2, π); тараах чанар — a(b + c) = ab + ac.", "ex": [["{−3; 0; 2/5; √9; √7; 0,(6); π}-ийг ангил", "N: √9; Z: −3, 0, √9; Q: −3, 0, 2/5, √9, 0,(6); иррационал: √7, π"], ["19·52 + 19·48", "19·(52 + 48) = 1900"], ["√35 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "25 < 35 < 36 тул 5 ба 6"]], "ck": [["53·70 + 53·30", "53·100 = 5300"], ["√95 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "81 < 95 < 100 тул 9 ба 10"]], "ws": [["Сэргээх", ["0,6-г энгийн бутархайгаар бич", "2/9-ийг аравтын бутархайгаар бич"]], ["Дадлага 1", ["√49 ба √50-ийн аль нь иррационал вэ?", "25·4·7-г хялбар аргаар бод"]], ["Дадлага 2", ["0,(4)-ийг энгийн бутархайгаар бич", "(√8 + √2)(√8 − √2)"]], ["★ Сорилт", ["√2 + (−√2) = 0. Хоёр иррационал тооны нийлбэр үргэлж иррационал байх уу? Тайлбарла.", "3 ба 4-ийн хооронд орших 2 иррационал тоо бич"]], ["Хэрэглээ", ["Квадрат талбайн талбай 2 м². Талын уртыг 0,01 нарийвчлалтай ол (1,41² ба 1,42²-ийг харьцуул)."]], ["Код унших (сонголттой)", ["Код уншаад гаралтыг таамагла:", "cout << (0.1 + 0.2 == 0.3);"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "√25; −7; √3; 1,5 тоог ангил", "0,(7)-г энгийн бутархайгаар бич", "37·45 + 63·45", "√60 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x02212;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x0002B;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ __(Олонлог 10, Дасгал 3 №3)__"], "quiz": ["0,(3) рационал уу? Энгийн бутархайгаар бич.", "48·25 + 52·25", "−√3; 1,7; 7/4-ийг өсөхөөр эрэмбэл"], "key": [["III. Суурь сэргээх", ["1) 3/4", "2) 0,333… = 0,(3)", "3) 4"]], ["Жишээ 1–3", ["Жишээ 1: N: √9; Z: −3, 0, √9; Q: −3, 0, 2/5, √9, 0,(6); иррационал: √7, π", "Жишээ 2: 19·(52 + 48) = 1900", "Жишээ 3: 25 < 35 < 36 тул 5 ба 6"]], ["Шалгах цэг", ["1) 53·100 = 5300", "2) 81 < 95 < 100 тул 9 ба 10"]], ["I. Ажлын хуудас", ["№1: 3/5", "№2: 0,(2)", "№3: √50 (√49 = 7)", "№4: (25·4)·7 = 700", "№5: 4/9", "№6: 8 − 2 = 6", "№7: Үгүй: нийлбэр 0 нь рационал", "№8: Жишээ нь √10, √15 эсвэл π", "№9: 1,41² = 1,9881 < 2 < 2,0164 = 1,42² тул ≈ 1,41 м", "№10: 0 (худал): 0,1 ба 0,2 хоёртын системд яг бичигдэхгүй"]], ["Багийн даалгавар", ["Эрэмбэ: −√5 (≈ −2,24) < −1,5 < −2/3 < 0,(3) < √2 (≈ 1,41) < 7/3 (≈ 2,33) < π (≈ 3,14) < √16 = 4.", "N ба Z: √16; Q: −1,5; −2/3; 0,(3); 7/3; √16; иррационал: −√5, √2, π.", "Үндэслэл: 1,4² = 1,96 < 2 < 2,25 = 1,5²; 2,2² = 4,84 < 5 < 5,29 = 2,3²."]], ["II. Гэрийн даалгавар", ["№1: √25 = 5 натурал; −7 бүхэл; √3 иррационал; 1,5 рационал", "№2: 7/9", "№3: 45·100 = 4500", "№4: 49 < 60 < 64 тул 7 ба 8", "№5: x − 9"]], ["III. Гарах тасалбар", ["№1: Тийм, 1/3 (шалгуур 1)", "№2: 25·100 = 2500 (шалгуур 2)", "№3: −√3 < 1,7 < 7/4 (√3 ≈ 1,73) (шалгуур 3)"]]], "F": ["\\mathbb{N}\\subset\\mathbb{Z}\\subset\\mathbb{Q}\\subset\\mathbb{R}", "a(b+c)=ab+ac", "|a|\\cdot|b|=|ab|"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02115;</mi><mo>&#x02282;</mo><mi>&#x02124;</mi><mo>&#x02282;</mo><mi>&#x0211A;</mi><mo>&#x02282;</mo><mi>&#x0211D;</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo stretchy=\"false\">&#x00028;</mo><mi>b</mi><mo>&#x0002B;</mo><mi>c</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><mi>a</mi><mi>c</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mi>a</mi><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x000B7;</mo><mo stretchy=\"false\">&#x0007C;</mo><mi>b</mi><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x0007C;</mo><mi>a</mi><mi>b</mi><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-5"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-5"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «бодит тоо» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L05.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x02212;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x0002B;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧", "x − 9", "Олонлог 10, Дасгал 3 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>3</mn><msqrt><mrow><mn>5</mn></mrow></msqrt><mo>&#x000B7;</mo><msqrt><mrow><mn>2</mn></mrow></msqrt></mrow><mrow><msqrt><mrow><mn>90</mn></mrow></msqrt></mrow></mfrac></mrow></math>⟧", "1", "Олонлог 10, Дасгал 3 №4"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msqrt><mrow><mn>6</mn></mrow></msqrt><mo>&#x02212;</mo><msqrt><mrow><mn>5</mn></mrow></msqrt></mrow><mrow><msqrt><mrow><mn>6</mn></mrow></msqrt><mo>&#x0002B;</mo><msqrt><mrow><mn>5</mn></mrow></msqrt></mrow></mfrac></mrow></math>⟧ — хуваарийг язгуураас чөлөөл", "11 − 2√30", "Олонлог 10, Дасгал 3 №5"]], "tb": [], "digital": true, "stype": "A", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хүн бүр өөрийн байртай»:** Тооны шулуун дээр рационал, иррационал тоо бүр өөрийн цор ганц байртай; нэг ч тоо илүүц биш. Багт ч хүн бүр өөр давуу талтай. Асуулт: «Багийн гишүүн бүрийн давуу тал юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 0,75-ыг энгийн бутархайгаар бич; 2) 1/3-ийг аравтын бутархайгаар бич; 3) √16", "**Холбоос (1 мин):** Бүх тоог бутархайгаар бичиж болох уу? Өнөөдөр бүх тооны «гэр бүл»-ийг ангилна."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Талбай нь 2 м² квадратын тал √2 м. Үүнийг бутархайгаар яг бичиж болох уу? π-г 3,14 гэж бичихэд яагаад «ойролцоо» гэдэг вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** N ⊂ Z ⊂ Q ⊂ R. Рационал тоо m/n нь төгсгөлөг эсвэл үет бутархай; иррационал (√2, √7, π) нь төгсгөлгүй, үегүй бутархай.", "   Чанар: a + b = b + a, ab = ba; (a + b) + c = a + (b + c); тараах: a(b + c) = ab + ac. Язгуурыг үнэлэх: 5² = 25 < 35 < 36 = 6² тул 5 < √35 < 6.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): {−3; 0; 2/5; √9; √7; 0,(6); π}-ийг ангил", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 19·52 + 19·48", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): √35 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "**3. Түгээмэл алдаа:** Бүх язгуурыг иррационал гэх (√9 = 3 рационал); 0,(3)-ийг иррационал гэх (= 1/3 рационал).", "**4. Шалгах цэг (3 мин):** 1) 53·70 + 53·30; 2) √95 аль хоёр дараалсан бүхэл тооны хооронд вэ?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Тооны шулуун»: Баг бүрт 8 карт: −1,5; √2; 7/3; −√5; π; 0,(3); √16; −2/3. Тоо бүрийг ангилж (N, Z, Q, иррационал), А3 хуудсан дээрх тооны шулуунд өсөхөөр наана. √2 ба −√5-ийн байрлалыг квадратаар харьцуулж үндэслэнэ (жишээ: 1,4² = 1,96 < 2 < 2,25 = 1,5²).", "**Бүтээгдэхүүн:** Тооны шулуун ба ангиллын хүснэгт бүхий А3 хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "6": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хураангуй үржүүлэхийн томьёо ба зэргийн чанарыг рационал илтгэгчтэй алгебрын илэрхийлэлд хэрэглэж хялбарчлах, алгебрын бутархайг хураах.", "crit": ["Би (x^(1/2) − 1)(x^(1/2) + 1) зэрэг илэрхийллийг томьёогоор хялбарчилж чадна.", "Би (x² − 9)/(x² + 3x) зэрэг бутархайг хураагаад нөхцөлийг бичиж чадна.", "Би талбайн өөрчлөлтийг илэрхийллээр загварчилж, алдааг илрүүлж чадна."], "words": "төстэй гишүүн — үсэг, зэрэг нь ижил; хураах — ерөнхий үржигдэхүүнд хуваах; нөхцөл — хуваарь ≠ 0.", "ex": [["(x − 3)²", "x² − 6x + 9"], ["(3x^(1/3) − 2)²", "9x^(2/3) − 12x^(1/3) + 4"], ["(x² − 9)/(x² + 3x)-ийг хураа", "(x − 3)(x + 3)/(x(x + 3)) = (x − 3)/x; x ≠ 0, x ≠ −3"]], "ck": [["(√a − √b)(√a + √b)", "a − b"], ["(x² − 4x)/(x² − 16)-г хураа", "x(x − 4)/((x − 4)(x + 4)) = x/(x + 4); x ≠ ±4"]], "ws": [["Сэргээх", ["(x + 2)(x + 5)", "3x² − 5x + x² + 2x"]], ["Дадлага 1", ["(x + 4)²", "(2x − 1)(2x + 1)"]], ["Дадлага 2", ["(x^(1/2) + 3)(x^(1/2) − 3)", "(x² − 25)/(x² − 5x)-ийг хураа"]], ["★ Сорилт", ["(a^(1/2) + b^(1/2))² − 2(ab)^(1/2)", "Алдааг ол: (x² + 9)/(x + 3) = x + 3"]], ["Хэрэглээ", ["Квадрат хашааны тал x м. Нэг талыг 3 м уртасгаж, нөгөөг 3 м богиносговол талбай хэрхэн өөрчлөгдөх вэ?"]], ["Код унших (сонголттой)", ["Excel: A1 = 3, B1-д =(A1+5)^2-(A1-5)^2, C1-д =20*A1. B1, C1-д юу гарах вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "(x − 5)²", "(3a + 2)(3a − 2)", "(m^(1/2) − 1)(m^(1/2) + 1)", "(y + 6)/(y² − 36)-г хураа", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>6</mn></mrow><mrow><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>36</mn></mrow></mfrac></mrow></math>⟧-г хураа __(Олонлог 10, Дасгал 4 №3)__"], "quiz": ["(x − 7)(x + 7)", "(x² − 6x)/(x² − 36)-г хураа", "(x + 5)² = x² + 25 гэсэн бодолтод ямар алдаа байна вэ?"], "key": [["III. Суурь сэргээх", ["1) x² + x − 6", "2) 2x² − 8x", "3) x⁷"]], ["Жишээ 1–3", ["Жишээ 1: x² − 6x + 9", "Жишээ 2: 9x^(2/3) − 12x^(1/3) + 4", "Жишээ 3: (x − 3)(x + 3)/(x(x + 3)) = (x − 3)/x; x ≠ 0, x ≠ −3"]], ["Шалгах цэг", ["1) a − b", "2) x(x − 4)/((x − 4)(x + 4)) = x/(x + 4); x ≠ ±4"]], ["I. Ажлын хуудас", ["№1: x² + 7x + 10", "№2: 4x² − 3x", "№3: x² + 8x + 16", "№4: 4x² − 1", "№5: x − 9", "№6: (x + 5)/x; x ≠ 0, x ≠ 5", "№7: a + 2(ab)^(1/2) + b − 2(ab)^(1/2) = a + b", "№8: x² + 9 задрахгүй тул хураахгүй; (x + 3)² = x² + 6x + 9 ≠ x² + 9", "№9: (x + 3)(x − 3) = x² − 9: 9 м²-аар багасна", "№10: 60 ба 60 — (x + 5)² − (x − 5)² = 20x"]], ["Багийн даалгавар", ["S₁ − S₂ = (x² + 10x + 25) − (x² − 10x + 25) = 20x.", "x = 20: 625 − 225 = 400; томьёогоор 20·20 = 400.", "Хялбарчилсан томьёо цөөн үйлдэлтэй тул хурдан, алдаа бага."]], ["II. Гэрийн даалгавар", ["№1: x² − 10x + 25", "№2: 9a² − 4", "№3: m − 1", "№4: 1/(y − 6); y ≠ ±6", "№5: x + 5; 1/(y − 6)"]], ["III. Гарах тасалбар", ["№1: x² − 49 (шалгуур 1)", "№2: x/(x + 6); x ≠ ±6 (шалгуур 2)", "№3: Дунд гишүүн 10x орхигдсон: x² + 10x + 25 (шалгуур 3)"]]], "F": ["(a\\pm b)^{2}=a^{2}\\pm 2ab+b^{2}", "\\frac{x^{2}-9}{x+3}=x-3,\\quad x\\ne -3"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>&#x000B1;</mi><mi>b</mi><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mi>&#x000B1;</mi><mn>2</mn><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>9</mn></mrow><mrow><mi>x</mi><mo>&#x0002B;</mo><mn>3</mn></mrow></mfrac><mo>&#x0003D;</mo><mi>x</mi><mo>&#x02212;</mo><mn>3</mn><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>x</mi><mo>&#x02260;</mo><mo>&#x02212;</mo><mn>3</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-6"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-6"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «алгебрын илэрхийлэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L06.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>6</mn></mrow><mrow><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>36</mn></mrow></mfrac></mrow></math>⟧-г хураа", "x + 5; 1/(y − 6)", "Олонлог 10, Дасгал 4 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x</mi><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧-г хураа", "√x + 5", "Олонлог 10, Дасгал 4 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>28</mn><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><msup><mi>y</mi><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>14</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><msup><mi>y</mi><mrow><mn>3</mn></mrow></msup></mrow></mfrac></mrow></math>⟧-г хураа", "2x", "Олонлог 10, Дасгал 4 №7"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Төстэй ба ялгаатай»:** Зөвхөн төстэй гишүүдийг нэгтгэж болдог: x² ба x-ийг нэмэхгүй. Харин хүмүүс ялгаатай ч нэг зорилгоор хамтарч чаддаг. Асуулт: «Надаас өөр давуу талтай хүнтэй хамтрахын ашиг юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) (x + 3)(x − 2); 2) 2x(x − 4); 3) x³ · x⁴", "**Холбоос (1 мин):** 8 дугаар ангид үзсэн хураангуй үржүүлэхийн томьёог (Олонлог 8, х. 2) сэргээж, рационал илтгэгчтэй илэрхийлэлд хэрэглэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Квадрат хашааны тал x м. Нэг талыг 3 м уртасгаж, нөгөөг 3 м богиносговол талбай нь өөрчлөгдөх үү? (x + 3)(x − 3) = ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** (a ± b)² = a² ± 2ab + b²; (a − b)(a + b) = a² − b². a, b нь x^(1/2), x^(1/3) зэрэг байж болно: (x^(1/2) − 1)(x^(1/2) + 1) = x − 1.", "   Бутархай хураах: хүртвэр, хуваарийг үржигдэхүүнд задлаад ерөнхий үржигдэхүүнээр хуваана; хуваарь ≠ 0 нөхцөлийг бичнэ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): (x − 3)²", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (3x^(1/3) − 2)²", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): (x² − 9)/(x² + 3x)-ийг хураа", "**3. Түгээмэл алдаа:** (a + b)² = a² + b² гэж бичих (2ab орхигдоно); x⁻¹ ба x-ийг төстэй гишүүн гэж нэмэх; (x + 3)/3 = x гэж нэмэгдэхүүнийг хураах.", "**4. Шалгах цэг (3 мин):** 1) (√a − √b)(√a + √b); 2) (x² − 4x)/(x² − 16)-г хураа. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Хашааны талбай»: Хоёр квадрат хашааны талбай S₁ = (x + 5)² ба S₂ = (x − 5)². 1) S₁ − S₂-ийг хялбарчил. 2) x = 20 м үед ялгаврыг хоёр аргаар (шууд орлуулж ба хялбарчилсан томьёогоор) тооцоолж харьцуул. 3) Аль арга хурдан, яагаад вэ?", "**Бүтээгдэхүүн:** Хоёр аргын тооцоо ба дүгнэлт бүхий хосын хуудас", "**Нэгж 2-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "7": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн уралдаан", 16], ["VIII. Дүн гаргах, алдааг задлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Алгебрын илэрхийллийг ерөнхий үржигдэхүүн гаргах, бүлэглэх, томьёо, x₁, x₂-ээр задлах 4 аргаар үржигдэхүүнд задалж, тэгшитгэл бодох, тооцоо хялбарчлахад хэрэглэх.", "crit": ["Би x² − 81, x³ − 8 зэргийг томьёогоор задалж чадна.", "Би x² + 2x − 8, xy + 2x + 3y + 6 зэргийг задалж, буцааж үржүүлж шалгаж чадна.", "Би x² + 16 яагаад задрахгүйг тайлбарлаж, задаргааг тэгшитгэлд хэрэглэж чадна."], "words": "үржигдэхүүнд задлах — үржвэр хэлбэрт бичих; ерөнхий үржигдэхүүн; бүлэглэх; бүрэн задлах.", "ex": [["3x² − 12", "3(x² − 4) = 3(x − 2)(x + 2)"], ["x³ − 2x² + 5x − 10 (бүлэглэ)", "x²(x − 2) + 5(x − 2) = (x − 2)(x² + 5)"], ["x² − 2x − 15", "(x − 5)(x + 3)"]], "ck": [["x³ − 8", "(x − 2)(x² + 2x + 4)"], ["ab − 3a + 2b − 6", "a(b − 3) + 2(b − 3) = (b − 3)(a + 2)"]], "ws": [["Сэргээх", ["ХИЕХ(15; 25)", "(x − 4)(x + 4)"]], ["Дадлага 1", ["10x + 14", "x² − 36"]], ["Дадлага 2", ["x² − 8x + 12", "xy + 2x + 3y + 6 (бүлэглэ)"]], ["★ Сорилт", ["2x³ − 50x", "99² − 1-ийг задлалаар толгойгоор бод"]], ["Хэрэглээ", ["x² − 49 = 0 тэгшитгэлийг задлалаар бод"]], ["Код унших (сонголттой)", ["Гаралт:", "int n = 84;", "for (int d = 2; n > 1; d++) while (n % d == 0) { cout << d << \" \"; n /= d; }"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "13a² − 26a", "x² − 9x + 20", "8x³ − 1", "2ax − 6a + bx − 3b", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>26</mn><mi>a</mi></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>15</mn><mi>x</mi></mrow></math>⟧-ийг задал __(Олонлог 10, Дасгал 4 №4)__"], "quiz": ["x² − 81", "x² + 2x − 8", "x² + 16 = (x + 4)(x − 4) гэсэн задаргаа зөв үү? Тайлбарла."], "key": [["III. Суурь сэргээх", ["1) 2²·3·7", "2) 6", "3) x² − 3x − 10"]], ["Жишээ 1–3", ["Жишээ 1: 3(x² − 4) = 3(x − 2)(x + 2)", "Жишээ 2: x²(x − 2) + 5(x − 2) = (x − 2)(x² + 5)", "Жишээ 3: (x − 5)(x + 3)"]], ["Шалгах цэг", ["1) (x − 2)(x² + 2x + 4)", "2) a(b − 3) + 2(b − 3) = (b − 3)(a + 2)"]], ["I. Ажлын хуудас", ["№1: 5", "№2: x² − 16", "№3: 2(5x + 7)", "№4: (x − 6)(x + 6)", "№5: (x − 6)(x − 2)", "№6: x(y + 2) + 3(y + 2) = (y + 2)(x + 3)", "№7: 2x(x² − 25) = 2x(x − 5)(x + 5)", "№8: (99 − 1)(99 + 1) = 98·100 = 9800", "№9: (x − 7)(x + 7) = 0 → x = ±7", "№10: 2 2 3 7 (84 = 2²·3·7)"]], ["Багийн даалгавар", ["(x − 8)(x + 8); 5x(x + 2); (x + 4)².", "(x − 4)(x + 3); 2(x − 3)(x + 3); (y + 3)(y² − 3y + 9).", "(x + 3)(x − 2)(x + 2); (a² + 4)(a − 2)(a + 2); (x − 3 − y)(x − 3 + y)."]], ["II. Гэрийн даалгавар", ["№1: 13a(a − 2)", "№2: (x − 4)(x − 5)", "№3: (2x − 1)(4x² + 2x + 1)", "№4: 2a(x − 3) + b(x − 3) = (x − 3)(2a + b)", "№5: 13a(a − 2); 5x(x − 3)"]], ["III. Гарах тасалбар", ["№1: (x − 9)(x + 9) (шалгуур 1)", "№2: (x + 4)(x − 2) (шалгуур 2)", "№3: Буруу: (x + 4)(x − 4) = x² − 16; x² + 16 бодит тоонд задрахгүй (шалгуур 3)"]]], "F": ["a^{2}-b^{2}=(a-b)(a+b)", "x^{2}+(p+q)x+pq=(x+p)(x+q)", "a^{3}\\pm b^{3}=(a\\pm b)(a^{2}\\mp ab+b^{2})"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x02212;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x0002B;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>p</mi><mo>&#x0002B;</mo><mi>q</mi><mo stretchy=\"false\">&#x00029;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>p</mi><mi>q</mi><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>p</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>q</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mn>3</mn></mrow></msup><mi>&#x000B1;</mi><msup><mi>b</mi><mrow><mn>3</mn></mrow></msup><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>&#x000B1;</mi><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02213;</mo><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-7"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-7"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «үржигдэхүүнд задлах» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L07.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>26</mn><mi>a</mi></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>15</mn><mi>x</mi></mrow></math>⟧-ийг задал", "13a(a − 2); 5x(x − 3)", "Олонлог 10, Дасгал 4 №4"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>14</mn><mo>&#x02212;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup></mrow></math>⟧-ийг задал", "(x − 2)(x + 2); (√14 − x)(√14 + x)", "Олонлог 10, Дасгал 4 №6"]], "tb": [], "digital": false, "stype": "A", "mode": "уралдаан", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Том ажлыг задлах»:** Олон гишүүнтийг үржигдэхүүнд задлахад хэцүү илэрхийлэл энгийн хэсгүүдэд хуваагддаг. Том ажил ч жижиг алхамд задрахаар амархан болдог. Асуулт: «Миний хийх нэг том ажлыг ямар 3 алхамд задлах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", [
