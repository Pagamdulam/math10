асах: a⃗ − b⃗ = a⃗ + (−b⃗), AC⃗ − AB⃗ = BC⃗. ka⃗: урт нь |k|·|a⃗|, k < 0 бол эсрэг чиглэл. Коллинеар ⇔ b⃗ = ka⃗.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): AB⃗ + BC⃗ + CD⃗", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): AC⃗ − BC⃗", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): a⃗(2; −1), b⃗(−6; 3) коллинеар уу?", "**3. Түгээмэл алдаа:** Векторыг уртаар нь тоо мэт нэмэх; AB⃗ ба BA⃗-г адил гэх; 0⃗-ийг 0 тоогоор бичих.", "**4. Шалгах цэг (3 мин):** 1) AB⃗ − AC⃗; 2) PQ⃗ + QR⃗ + RS⃗ + ST⃗ + TP⃗. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Дроны нислэг»: тор бүхий цаасан дээр (1 нүд = 10 км/ц) дроны хурд a⃗ = 40 км/ц хойд зүг, салхи b⃗ = 30 км/ц баруун тийш зурна. 1) a⃗ + b⃗-г гурвалжин ба параллелограммын дүрмээр байгуул. 2) Бодит хурдыг Пифагорын теоремоор ол. 3) Салхи эсрэг (зүүн тийш) үлээвэл? 4) Салхи 2 дахин хүчтэй (2b⃗) болбол үр дүнгийн вектор хэрхэн өөрчлөгдөх вэ?", "**Бүтээгдэхүүн:** Векторын зураг ба тооцоо бүхий багийн хуудас", "**Нэгж 6-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "25": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Координатын хавтгай дахь векторын координат, урт, суурь нэгж вектор, радиус векторыг олж, векторыг хэвтээ, босоо бүрэлдэхүүнд задлах, маршрутын бодлогод хэрэглэх.", "crit": ["Би хоёр цэгээр векторын координатыг олж чадна.", "Би векторын уртыг олж, i⃗, j⃗-ээр задалж чадна.", "Би маршрутыг вектороор илэрхийлж тайлбарлаж чадна."], "words": "векторын координат — (төгсгөл − эхлэл); суурь нэгж вектор i⃗(1; 0), j⃗(0; 1); радиус вектор — эхээс цэг рүү; урт |a⃗|.", "ex": [["A(6; −3), B(−3; 0) бол AB⃗", "(−9; 3)"], ["a⃗(3; −4)-ийн урт", "√(9 + 16) = 5"], ["a⃗ = −3i⃗ + j⃗-ийн координат", "(−3; 1)"]], "ck": [["A(6; −1), B(−4; −2) бол AB⃗", "(−10; −1)"], ["a⃗(−5; 12)-ийн урт", "13"]], "ws": [["Сэргээх", ["A(2; 5), B(7; 1): x₂ − x₁ ба y₂ − y₁", "√(36 + 64)"]], ["Дадлага 1", ["A(2; −3), B(5; 1) бол AB⃗", "a⃗(8; 15)-ийн урт"]], ["Дадлага 2", ["a⃗ = 4i⃗ − 2j⃗-ийн координат ба урт", "A(−1; 4) цэгийн радиус вектор"]], ["★ Сорилт", ["AB⃗(3; −2), B(5; 1) бол A-г ол", "a⃗(x; 4), |a⃗| = 5 бол x"]], ["Хэрэглээ", ["Робот (1; 2)-оос (4; 6) рүү шилжив (1 нэгж = 1 м). Шилжилтийн вектор ба зай"]], ["Код унших (сонголттой)", ["Робот (0; 0)-оос: x += 2; y += 3; x -= 1;  cout << x << \";\" << y;"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "A(3; −1), B(−2; 4) бол AB⃗", "a⃗(7; 24)-ийн урт", "a⃗ = 2i⃗ + 5j⃗-ийн координат", "A(4; −3), B(1; 1): AB⃗ ба |AB⃗|", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x02212;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mn>3</mn><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mn>5</mn><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover></mrow></math>⟧ __(Олонлог 10, Дасгал 11 №3)__"], "quiz": ["a⃗(6; 8)-ийн урт", "A(4; 1), B(0; 1) бол AB⃗", "a⃗ = 4i⃗ + j⃗-ийн координат"], "key": [["III. Суурь сэргээх", ["1) −9", "2) 5", "3) 2"]], ["Жишээ 1–3", ["Жишээ 1: (−9; 3)", "Жишээ 2: √(9 + 16) = 5", "Жишээ 3: (−3; 1)"]], ["Шалгах цэг", ["1) (−10; −1)", "2) 13"]], ["I. Ажлын хуудас", ["№1: 5; −4", "№2: 10", "№3: (3; 4)", "№4: 17", "№5: (4; −2); √20 = 2√5", "№6: OA⃗ = (−1; 4) = −i⃗ + 4j⃗", "№7: A(2; 3)", "№8: x² + 16 = 25 → x = ±3", "№9: (3; 4); 5 м", "№10: 1;3"]], ["Багийн даалгавар", ["SN⃗(3; 4) → 500 м; NE⃗(−5; 1) → √26 ≈ 5,1 → ≈ 510 м; SZ⃗(6; −8) → 1000 м.", "SN⃗ + NE⃗ = (−2; 5) = SE⃗.", "SZ⃗ = 6i⃗ − 8j⃗: 600 м зүүн тийш, 800 м урагш."]], ["II. Гэрийн даалгавар", ["№1: (−5; 5)", "№2: 25", "№3: (2; 5)", "№4: (−3; 4); 5", "№5: (1; 7); (−3; −1); (7; 29)"]], ["III. Гарах тасалбар", ["№1: 10 (шалгуур 1)", "№2: (−4; 0) (шалгуур 2)", "№3: (4; 1) (шалгуур 3)"]]], "F": ["\\vec{c}=m\\vec{a}+n\\vec{b}", "\\overrightarrow{AB}=(x_{2}-x_{1};\\ y_{2}-y_{1})"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mi>m</mi><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mi>n</mi><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>A</mi><mi>B</mi></mrow><mo>&#x02192;</mo></mover><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub><mi>;</mi><mtext>&#x000A0;</mtext><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-25"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-25"], ["PhET «Vector Addition»", "https://phet.colorado.edu/en/simulations/vector-addition"], ["Mozaik: «вектор задлах» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L25.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x02212;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mn>3</mn><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mn>5</mn><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover></mrow></math>⟧", "(1; 7); (−3; −1); (7; 29)", "Олонлог 10, Дасгал 11 №3"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Алхам алхмаар»:** Вектор = x алхам хэвтээ + y алхам босоо: a⃗ = xi⃗ + yj⃗. Хэцүү замыг ч жижиг алхмуудад задалбал туулж болно. Асуулт: «Миний өнөөдрийн 2 жижиг алхам юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) B(−3; 0) ба A(6; −3)-ын x-ийн ялгавар (B − A); 2) √(9 + 16); 3) A(2; 5) цэгийн абсцисс", "**Холбоос (1 мин):** №21-д хоёр цэгийн зай, №24-т векторын үйлдлийг зургаар үзсэн; өнөөдөр векторыг тоогоор (координатаар) илэрхийлнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Робот (1; 2)-оос (4; 6) рүү шилжив. Энэ хөдөлгөөнийг 2 тоогоор хэрхэн илэрхийлэх вэ? Хэдэн метр явсан бэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** A(x₁; y₁), B(x₂; y₂) бол AB⃗ = (x₂ − x₁; y₂ − y₁) (төгсгөл − эхлэл). |a⃗| = √(x² + y²). Суурь вектор i⃗(1; 0), j⃗(0; 1): a⃗(x; y) = xi⃗ + yj⃗.", "   Радиус вектор OA⃗ = A цэгийн координат. Векторыг хоёр чиглэлийн дагуу задлах: a⃗ = xi⃗ + yj⃗ (хэвтээ ба босоо бүрэлдэхүүн).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): A(6; −3), B(−3; 0) бол AB⃗", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): a⃗(3; −4)-ийн урт", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): a⃗ = −3i⃗ + j⃗-ийн координат", "**3. Түгээмэл алдаа:** AB⃗-ийг эхлэл − төгсгөл гэж бодох (зөв нь төгсгөл − эхлэл); |a⃗| = x + y гэж бодох; i⃗, j⃗-ийг андуурах.", "**4. Шалгах цэг (3 мин):** 1) A(6; −1), B(−4; −2) бол AB⃗; 2) a⃗(−5; 12)-ийн урт. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Хотын маршрут»: Арвайхээрийн торон зураг (1 нүд = 100 м): сургууль S(0; 0), номын сан N(3; 4), эмнэлэг E(−2; 5), зах Z(6; −8). 1) SN⃗, NE⃗, SZ⃗-ийн координат, уртыг (м) ол. 2) SN⃗ + NE⃗ = SE⃗ болохыг координатаар шалга. 3) SZ⃗-ийг i⃗, j⃗-ээр задалж, «хэдэн метр зүүн/баруун, хойд/урд» гэж үгээр тайлбарла.", "**Бүтээгдэхүүн:** Координат, урт, тайлбар бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "26": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Векторыг координатаар нэмэх, хасах, тоогоор үржүүлэх, коллинеар эсэхийг шалгаж, хүчний нийлбэр ба тэнцвэрийн бодлогод хэрэглэх.", "crit": ["Би векторыг координатаар нэмж, хасаж, тоогоор үржүүлж чадна.", "Би коллинеар байх нөхцөлөөр үл мэдэгдэгчийг олж чадна.", "Би хүчний нийлбэр ба тэнцвэрийн хүчийг олж чадна."], "words": "векторын нийлбэр — координатыг нэмнэ; ka⃗ — координат бүрийг k-аар үржүүлнэ; коллинеар — x₁/x₂ = y₁/y₂; тэнцвэр — нийлбэр 0⃗.", "ex": [["a⃗(−1; 4), b⃗(3; 5) бол a⃗ − b⃗", "(−4; −1)"], ["a⃗(3; 2), b⃗(6; m) коллинеар бол m", "6/3 = m/2 → m = 4"], ["a⃗(1; −5), b⃗(−2; 0) бол a⃗ + 2b⃗", "(−3; −5)"]], "ck": [["a⃗(−3; −4), b⃗(−5; 3) бол a⃗ − b⃗", "(2; −7)"], ["a⃗(3; 4), b⃗(6; m) коллинеар бол m", "8"]], "ws": [["Сэргээх", ["−4 + (−1)·5", "8/4 = m/3 бол m"]], ["Дадлага 1", ["a⃗(2; −1), b⃗(4; 5): a⃗ + b⃗", "a⃗(−2; 3) бол −3a⃗"]], ["Дадлага 2", ["a⃗(1; 2), b⃗(3; −1): 2a⃗ − b⃗", "a⃗(2; 1), b⃗(m; 3) коллинеар бол m"]], ["★ Сорилт", ["a⃗(4; −2) ба b⃗(−6; 3) коллинеар уу? Чиглэл ижил үү?", "a⃗ + b⃗ = (5; 1), a⃗ − b⃗ = (1; 3) бол a⃗, b⃗"]], ["Хэрэглээ", ["Хоёр бөх (4; 1) ба (−4; −1) хүчээр түлхэлцэнэ. Нийт хүч? Юу болох вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "a⃗(5; 2), b⃗(−3; 4): a⃗ − b⃗", "a⃗(−2; 2), b⃗(0; 2): |3a⃗ + b⃗|", "a⃗(2; 1) ба b⃗(m; −1) коллинеар бол m", "F₁⃗(2; 6), F₂⃗(−1; −2): нийт хүч", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>A</mi><mi>B</mi></mrow><mo>&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>⟧ __(Олонлог 10, Дасгал 11 №7)__"], "quiz": ["a⃗(3; −1), b⃗(−1; 4): a⃗ + 2b⃗", "a⃗(2; 4), b⃗(3; m) коллинеар бол m", "F₁⃗(1; 2), F₂⃗(3; −5) бол тэнцвэржүүлэх F₃⃗"], "key": [["III. Суурь сэргээх", ["1) 2", "2) 4", "3) √17"]], ["Жишээ 1–3", ["Жишээ 1: (−4; −1)", "Жишээ 2: 6/3 = m/2 → m = 4", "Жишээ 3: (−3; −5)"]], ["Шалгах цэг", ["1) (2; −7)", "2) 8"]], ["I. Ажлын хуудас", ["№1: −9", "№2: 6", "№3: (6; 4)", "№4: (6; −9)", "№5: (−1; 5)", "№6: m/2 = 3/1 → m = 6", "№7: b⃗ = −3/2·a⃗ → коллинеар, эсрэг чиглэлтэй", "№8: a⃗(3; 2), b⃗(2; −1)", "№9: (0; 0) → тэнцвэртэй, хөдлөхгүй"]], ["Багийн даалгавар", ["1: (1; 7); (−3; −1); (−3; 9); (10; 20); (7; 29).", "2: b⃗ + c⃗ = (1; −3); x/1 = 1/(−3) → x = −1/3.", "3: F⃗ = (8; 2), |F⃗| = √68 ≈ 8,2; F₃⃗ = (−8; −2)."]], ["II. Гэрийн даалгавар", ["№1: (8; −2)", "№2: (−6; 8) → 10", "№3: m = −2", "№4: (1; 4)", "№5: √41; √5"]], ["III. Гарах тасалбар", ["№1: (1; 7) (шалгуур 1)", "№2: 6 (шалгуур 2)", "№3: (−4; 3) (шалгуур 3)"]]], "F": ["\\vec{a}\\pm\\vec{b}=(x_{1}\\pm x_{2};\\ y_{1}\\pm y_{2})", "k\\vec{a}=(kx;\\ ky),\\quad |\\vec{a}|=\\sqrt{x^{2}+y^{2}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mi>&#x000B1;</mi><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><msub><mi>x</mi><mrow><mn>1</mn></mrow></msub><mi>&#x000B1;</mi><msub><mi>x</mi><mrow><mn>2</mn></mrow></msub><mi>;</mi><mtext>&#x000A0;</mtext><msub><mi>y</mi><mrow><mn>1</mn></mrow></msub><mi>&#x000B1;</mi><msub><mi>y</mi><mrow><mn>2</mn></mrow></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k</mi><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>k</mi><mi>x</mi><mi>;</mi><mtext>&#x000A0;</mtext><mi>k</mi><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x0003D;</mo><msqrt><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-26"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-26"], ["PhET «Vector Addition»", "https://phet.colorado.edu/en/simulations/vector-addition"], ["Mozaik: «векторын координат» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L26.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo stretchy=\"false\">&#x00028;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mi>B</mi><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>A</mi><mi>B</mi></mrow><mo>&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>⟧", "√41; √5", "Олонлог 10, Дасгал 11 №7"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>2</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>0</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mn>3</mn><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0002B;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo></mrow></math>⟧", "|(−6; 8)| = 10", "Олонлог 10, Дасгал 11 №10"]], "tb": [], "digital": false, "stype": "A", "mode": "станц", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хүчээ нийлүүлэх»:** Векторыг координатаар нэмэхэд бүрэлдэхүүн бүр тусдаа нэмэгддэг. Багт ч хүн бүрийн хувь нэмэр нийлж нэг үр дүн гарна. Асуулт: «Миний багт оруулах хувь нэмэр юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) −4 + 3·2; 2) 6/3 = m/2 бол m; 3) a⃗(−1; 4)-ийн урт", "**Холбоос (1 мин):** №25-д векторын координатыг үзсэн; өнөөдөр координатаар үйлдэл хийж, коллинеар эсэхийг шалгана."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Хоёр морь ачааг F₁⃗(3; 4), F₂⃗(5; −2) хүчээр татна. Нийт хүч хэд вэ? Ачаа хөдлөхгүй байхын тулд гурав дахь хүч ямар байх ёстой вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a⃗(x₁; y₁), b⃗(x₂; y₂): a⃗ ± b⃗ = (x₁ ± x₂; y₁ ± y₂); ka⃗ = (kx₁; ky₁).", "   Коллинеар ⇔ x₁/x₂ = y₁/y₂ (буюу x₁y₂ − x₂y₁ = 0). Тэнцвэр: бүх хүчний нийлбэр 0⃗.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): a⃗(−1; 4), b⃗(3; 5) бол a⃗ − b⃗", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): a⃗(3; 2), b⃗(6; m) коллинеар бол m", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): a⃗(1; −5), b⃗(−2; 0) бол a⃗ + 2b⃗", "**3. Түгээмэл алдаа:** ka⃗-д зөвхөн x-ийг үржүүлэх; ялгаварт тэмдэг алдах; коллинеар шалгахдаа 0-д хуваах.", "**4. Шалгах цэг (3 мин):** 1) a⃗(−3; −4), b⃗(−5; 3) бол a⃗ − b⃗; 2) a⃗(3; 4), b⃗(6; m) коллинеар бол m. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Станцын ажил (3 станц)", ["**Станцын ажил (3 станц):** 3 станц (6 минут тутам шилжинэ). 1 «Үйлдэл»: a⃗(−1; 3), b⃗(2; 4) бол a⃗ + b⃗, a⃗ − b⃗, 3a⃗, 5b⃗, 3a⃗ + 5b⃗. 2 «Коллинеар»: a⃗(x; 1), b⃗(−2; −1), c⃗(3; −2) бол a⃗ ба b⃗ + c⃗ коллинеар байх x. 3 «Морины хүч»: F₁⃗(3; 4), F₂⃗(5; −2) бол нийт хүч, түүний урт, тэнцвэржүүлэх F₃⃗.", "**Бүтээгдэхүүн:** Станц бүрийн бодолт бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "27": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: скаляр үржвэр ба өнцөг", 28], ["V. Оюуны зураглал (багаар)", 15], ["VI. Бие даан дадлага", 12], ["VII. Зураглал танилцуулах, нөхөх", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хоёр векторын скаляр үржвэрийг координат ба өнцгөөр тооцоолж, векторуудын хоорондох өнцөг, перпендикуляр байх нөхцөлийг олох; «Вектор» нэгжийг оюуны зураглалаар нэгтгэх.", "crit": ["Би скаляр үржвэрийг координатаар тооцоолж чадна.", "Би векторуудын хоорондох өнцгийг олж, перпендикуляр байх нөхцөлийг хэрэглэж чадна.", "Би ажлын бодлогыг скаляр үржвэрээр бодож, нэгжийг зураглалаар нэгтгэж чадна."], "words": "скаляр үржвэр — a⃗·b⃗ = x₁x₂ + y₁y₂ (тоо гарна); векторуудын хоорондох өнцөг; перпендикуляр — a⃗·b⃗ = 0.", "ex": [["a⃗(4; 4)·b⃗(−5; 5)", "−20 + 20 = 0 → перпендикуляр"], ["a⃗(m; −1) ⊥ b⃗(3; −2) бол m", "3m + 2 = 0 → m = −2/3"], ["a⃗(1; 0), b⃗(1; 1)-ийн хоорондох өнцөг", "cos φ = 1/√2 → φ = 45°"]], "ck": [["a⃗(1; −2)·b⃗(3; 1)", "3 − 2 = 1"], ["|a⃗| = 5, |b⃗| = 6, φ = 60° бол a⃗·b⃗", "5·6·1/2 = 15"]], "ws": [["Сэргээх", ["cos 0°, cos 180°", "√2 · √2"]], ["Дадлага 1", ["a⃗(2; 3)·b⃗(4; −1)", "a⃗(1; 2)·b⃗(−2; 1)"]], ["Дадлага 2", ["a⃗(m; 2) ⊥ b⃗(4; −6) бол m", "a⃗(1; 1), b⃗(1; −1)-ийн хоорондох өнцөг"]], ["★ Сорилт", ["|a⃗| = 4, |b⃗| = 6, a⃗·b⃗ = 12 бол φ", "A(3; 2), B(8; 1), D(2; 7): AB⃗ ба AD⃗-ийн хоорондох өнцгийн cos"]], ["Хэрэглээ", ["Чаргыг 100 Н хүчээр 50 м татав, олс 60° өнцөгтэй. Ажил хэд вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "a⃗(3; 4)·b⃗(−4; 3)", "a⃗(3; 4) ⊥ b⃗(m; 2) бол m", "|a⃗| = 5, |b⃗| = 6, φ = 60° бол a⃗·b⃗", "a⃗(−2; 3)·b⃗(1; 3)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo s >a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x0003D;</mo><mn>4</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x0007C;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x0003D;</mo><mn>6</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x000B7;</mo><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mn>12</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>cos</mi><mi>&#x003B8;</mi></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B8;</mi></mrow></math>⟧", "1/2; 60°", "Олонлог 10, Дасгал 11 №4"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>5</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>2</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>7</mn><mi>;</mi><mo>&#x02212;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x000B7;</mo><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mn>38</mn><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mover><mrow><mi>b</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x000B7;</mo><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mn>30</mn></mrow></math>⟧ бол ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover></mrow></math>⟧", "c⃗(6; 4)", "Олонлог 10, Дасгал 11 №8"]], "tb": [], "digital": true, "stype": "B", "mode": "зураглал", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Зөв чиглэлд хүч гаргах»:** Физикт ажил A = F·s·cos α: хүчийг хөдөлгөөний чиглэлд гаргахад л ажил их болдог. Хүчин чармайлтаа зорилгынхоо чиглэлд гаргацгаая. Асуулт: «Миний хүчин чармайлт зорилгынхоо чиглэлд байна уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) cos 60°, cos 90°; 2) a⃗(3; 4)-ийн урт; 3) 2·(−3) + 4·5", "**Холбоос (1 мин):** 9 дүгээр ангид cos-ийг, №25–26-д векторын координатыг үзсэн; өнөөдөр хоёр векторын «үржвэр»-ийг тоо болгоно."]], ["IV. Самбарын тайлбар: скаляр үржвэр ба өнцөг", ["**Асуудал:** Чаргыг 100 Н хүчээр 50 м татав. Олс газартай 60° өнцөг үүсгэвэл хийсэн ажил хэд вэ? Хэвтээ татвал ажил ихсэх үү?", "**1. Гол санаа (самбарт):** a⃗·b⃗ = |a⃗|·|b⃗|·cos φ = x₁x₂ + y₁y₂ (хариу нь тоо). cos φ = a⃗·b⃗ / (|a⃗|·|b⃗|).", "   a⃗ ⊥ b⃗ ⇔ a⃗·b⃗ = 0; φ хурц ⇔ a⃗·b⃗ > 0; φ мохоо ⇔ a⃗·b⃗ < 0. Физик: A = F⃗·s⃗ = F·s·cos α.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): a⃗(4; 4)·b⃗(−5; 5)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): a⃗(m; −1) ⊥ b⃗(3; −2) бол m", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): a⃗(1; 0), b⃗(1; 1)-ийн хоорондох өнцөг", "**3. Түгээмэл алдаа:** Скаляр үржвэрийн хариуг вектор гэж бичих; x₁x₂ + y₁y₂-ийн оронд x₁y₁ + x₂y₂ авах; a⃗·b⃗ = 0 бол аль нэг вектор 0⃗ гэж дүгнэх.", "**4. Шалгах цэг (3 мин):** 1) a⃗(1; −2)·b⃗(3; 1); 2) |a⃗| = 5, |b⃗| = 6, φ = 60° бол a⃗·b⃗. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Оюуны зураглал (багаар)", ["**Оюуны зураглал (багаар):** «Хавтгай дээрх вектор» нэгжийн оюуны зураглал: төвд «Вектор»; 5 салаа: 1) ойлголт (урт, чиглэл, тэнцүү, эсрэг, коллинеар); 2) зургаар үйлдэл (гурвалжин, параллелограммын дүрэм); 3) координат (AB⃗ = төгсгөл − эхлэл, урт, i⃗, j⃗); 4) координатаар үйлдэл; 5) скаляр үржвэр (томьёо, өнцөг, перпендикуляр). Салаа бүрт өөрсдийн бодсон жишээ ба амьдралын жишээ (дрон, морь, чарга) нэмнэ.", "**Бүтээгдэхүүн:** А3 оюуны зураглал", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Зураглал танилцуулах, нөхөх", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "28": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн гүйцэтгэлийн даалгавар", 16], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Мэдээллийг матриц хэлбэрээр илэрхийлж, d><mn>7</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002B;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>6</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0003D;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>5</mn></mtd><mtd><mn>9</mn></mtd></mtr><mtr><mtd><mn>8</mn></mtd><mtd><mn>6</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k</mi><mi>A</mi><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>k</mi><mspace width=\"0.167em\" /><msub><mi>a</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-28"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-28"], ["Desmos матриц", "https://www.desmos.com/matrix"], ["Mozaik: «матриц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L28.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>3</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>8</mn></mtd><mtd><mn>5</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x02212;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>5</mn></mtd><mtd><mn>5</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧", "[2 1 −1; 3 0 −1]", "Олонлог 10, Дасгал 7 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A</mi><mo>&#x0003D;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>5</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧-ийн хэмжээс ба хөрвүүлсэн матриц", "3×2; [2 0 4; 3 5 1]", "Олонлог 10, Дасгал 7 №2"]], "tb": [], "digital": false, "stype": "A", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Эмх цэгц»:** Матриц мэдээллийг мөр, баганаар цэгцэлдэг. Цэгцтэй мэдээлэл зөв шийдвэрийн үндэс. Асуулт: «Миний дэвтэр, цагийн хуваарь цэгцтэй юу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) −3 + (−5); 2) 3·5 − 1; 3) 2·(−4) − (−3)", "**Холбоос (1 мин):** 6–8 дугаар ангид хүснэгтээс мэдээлэл уншиж сурсан; өнөөдөр хүснэгтийг матриц болгож тооцоолно."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Хоёр дэлгүүр 7 хоногт сүү, тараг, айраг хэдэн литр зарсныг хүснэгтээр өгөв. Хоёр 7 хоногийн нийт борлуулалтыг хамгийн хурдан яаж олох вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** m × n матриц: m мөр, n багана; aᵢⱼ — i-р мөр, j-р баганын элемент. Тэнцүү матриц: хэмжээс ба харгалзах элементүүд тэнцүү. (Бичлэг: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>6</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>7</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ — «;» мөрийг тусгаарлана.)", "   Ижил хэмжээстэй матрицыг элементээр нь нэмж, хасна; kA — элемент бүрийг k-аар үржүүлнэ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>8</mn></mtd><mtd><mn>4</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>5</mn></mtd><mtd><mo>&#x02212;</mo><mn>7</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийн a₁₂ + a₂₃ + a₃₁", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>6</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>7</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ + ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>6</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 3·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>5</mn></mtd></mtr><mtr><mtd><mn>5</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ − ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "**3. Түгээмэл алдаа:** 2×3 ба 3×2 матрицыг нэмэх; kA-д зөвхөн эхний мөрийг үржүүлэх; aᵢⱼ-д мөр, баганыг андуурах.", "**4. Шалгах цэг (3 мин):** 1) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>3</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>8</mn></mtd><mtd><mn>5</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ − ⟦<math xmlns=\"http://www.w3.org/1998/ ><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧² = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>4</mn></mtd><mtd><mn>7</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mn>5</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>4</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>5</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>4</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "**3. Түгээмэл алдаа:** Элементийг харгалзах байрлалаар нь үржүүлэх (мөр × багана биш); AB = BA гэж үзэх; хэмжээс таарахгүй матрицыг үржүүлэх.", "**4. Шалгах цэг (3 мин):** 1) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>3</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийн (1; 1) элемент; 2) 4×5 ба 5×3 матрицын үржвэрийн хэмжээс. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Захын орлого»: Q = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>5</mn></mtd><mtd><mn>10</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>20</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ (мөр — лангуу 1, 2; багана — мах, гурил, будаа, кг), P = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>18000</mn></mtd></mtr><mtr><mtd><mn>2500</mn></mtd></mtr><mtr><mtd><mn>3000</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ (₮/кг). 1) QP-г олж лангуу бүрийн орлогыг тайлбарла. 2) PQ үржвэр тодорхойлогдох уу? Яагаад? 3) Маргааш үнэ P′ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>20000</mn></mtd></mtr><mtr><mtd><mn>2500</mn></mtd></mtr><mtr><mtd><mn>3200</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ болбол орлого хэрхэн өөрчлөгдөх вэ?", "**Бүтээгдэхүүн:** Тооцоо ба тайлбар бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "30": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн уралдаан", 16], ["VIII. Дүн гаргах, алдааг задлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Тэг ба нэгж матрицын чанарыг тайлбарлаж, 2×2 матрицын тодорхойлогчийг тооцоолох, урвуутай эсэхийг тогтоох, |AB| = |A|·|B| чанарыг шалгах.", "crit": ["Би 2×2 матрицын тодорхойлогчийг зөв олж чадна.", "Би матриц урвуутай эсэхийг тодорхойлогчоор тогтоож чадна.", "Би тодорхойлогчийг талбайн өөрч /mrow></math>⟧: AE = EA = A.", "   |A| = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo movablelimits=\"true\">det</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧ = ad − bc. Чанар: |AB| = |A|·|B|; мөр (багана) нь 0 эсвэл пропорциональ бол |A| = 0. |A| ≠ 0 бол урвуутай, |A| = 0 бол урвуугүй.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): det ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ урвуутай юу?", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>5</mn></mtd><mtd><mo>&#x02212;</mo><mn>4</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·E", "**3. Түгээмэл алдаа:** det = ab − cd гэж бодох (зөв нь ad − bc); тэг ба нэгж матрицыг андуурах; хасахдаа тэмдэг алдах.", "**4. Шалгах цэг (3 мин):** 1) det ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>3</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧; 2) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>6</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ урвуутай юу?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн уралдаан", ["**Багийн уралдаан:** «Тодорхойлогчийн уралдаан» (3 шат). 1 (1 оноо): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>5</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>8</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>5</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>6</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийн det. 2 (2 оноо): аль нь урвуугүй вэ, яагаад? ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo movablelimits=\"true\">det</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>7</mn></mtd><mtd><mn>4</mn></mtd></mtr><mtr><mtd><mn>3</mn><mi>x</mi></mtd><mtd><mi>x</mi><mo>&#x0002B;</mo><mn>2</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧ + 1 = 0-ийг бод. 3 (3 оноо): A = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, B = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>4</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ бол |AB|-г шууд ба |A|·|B|-ээр олж харьцуул.", "**Бүтээгдэхүүн:** Онооны самбар, бодолттой картууд", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Дүн гаргах, алдааг задлах", ["• Багуудын онооны самбарыг нэгтгэж, хамгийн олон алдсан даалгаврыг ангиар задлан шинжилнэ.", "• Баг бүр алдсан нэг даалгавраа засаж, засварын оноо авна (сайжруулалтыг урамшуулна)."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "31": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: урвуу матриц ба системийг матрицаар бодох", 28], ["V. Бие даасан гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Өөрийгөө шалгах, засварлах", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "2×2 матрицын урвуу матрицыг тодорхойлогчоор олж, тэгшитгэлийн системийг матрицын аргаар бодох, шифрлэлтэд хэрэглэх.", "crit" mat/265"], ["Mozaik: «урвуу матриц» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L31.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mn>5</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧-ийн урвуу", "(1/26)[4 −3; 2 5]; [−2 −3/2; −1 −1/2]", "Олонлог 10, Дасгал 7 №5"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0003D;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mn>6</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧", "[14 7; 8 4]", "Олонлог 10, Дасгал 7 №6"]], "tb": [], "digital": true, "stype": "B", "mode": "ганцаар", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Буцаах боломж»:** Урвуу матриц үйлдлийг «буцаадаг»: A⁻¹·A = E. Амьдралд зарим үйлдлийг буцаах боломжгүй (хэлсэн хатуу үг, эвдсэн итгэл), тиймээс бодож байж хийнэ. Асуулт: «Буцаах боломжгүй ямар үйлдлээс болгоомжлох вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) det ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mo>&#x02212;</mo><mn>2</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧; 2) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mo>&#x02212;</mo><mn>4</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>4</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧; 3) 2x + 2y = −2 ба 3x + 2y = 0 (хасах арга)", "**Холбоос (1 мин):** 8 дугаар ангид системийг нэмэх аргаар бодсон (Олонлог 8, х. 2); №30-д тодорхойлогчийг үзсэн; өнөөдөр системийг матрицаар бодно."]], ["IV. Самбарын тайлбар: урвуу матриц ба системийг матрицаар бодох", ["**Асуудал:** Хуушуур 2, бууз 3 авахад 8 500₮; хуушуур 1, бууз 2 авахад 5 000₮. Нэг хуушуур, нэг бууз хэд вэ? Матрицаар бодож болох уу?", "**1. Гол санаа (самбарт):** A = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, |A| ≠ 0 бол A⁻¹ = (1/|A|)·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>d</mi></mtd><mtd><mo>&#x02212;</mo><mi>b</mi></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mi>c</mi></mtd><mtd><mi>a</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧: a ба d-ийн байрыг сольж, b ба c-ийн тэмдгийг өөрчлөөд |A|-д хуваана. Шалгалт: A·A⁻¹ = E.", "   Систем {ax + by = e; cx + dy = f} → AX = B, X = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>x</mi></mtd></mtr><mtr><mtd><mi>y</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, B = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>e</mi></mtd></mtr><mtr><mtd><mi>f</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ → X = A⁻¹B.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mo>&#x02212;</mo><mn>4</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийн урвуу", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>6</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийн урвуу", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): {2x + 3y = 8500; x + 2y = 5000}-ийг матрицаар бод", "**3. Түгээмэл алдаа:** A⁻¹ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn><mo>&#x0002F;</mo><mi>a</mi></mtd><mtd><mn>1</mn><mo>&#x0002F;</mo><mi>b</mi></mtd></mtr><mtr><mtd><mn>1</mn><mo>&#x0002F;</mo><mi>c</mi></mtd><mtd><mn>1</mn><mo>&#x0002F;</mo><mi>d</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ гэж бодох; a, d-ийн байрыг солихоо эсвэл b, c-ийн тэмдгийг солихоо мартах; |A| = 0 үед урвуу олох гэж оролдох.", "**4. Шалгах цэг (3 мин):** 32;</mi></mrow></msup></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0003D;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x00028;</mo><mtable><mtr><mtd><mi>x</mi></mtd></mtr><mtr><mtd><mi>y</mi></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mi>a</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0003D;</mo><mtext>(1;&#x000A0;0)-ийн&#x000A0;дүр</mtext><mo>&#x0002C;</mo><mspace width=\"1em\" /><mo>&#x00028;</mo><mtable><mtr><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0003D;</mo><mtext>(0;&#x000A0;1)-ийн&#x000A0;дүр</mtext></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-32"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-32"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «геометрийн хувиргалт» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L32.png", "ol": [["Ямар хувиргалт вэ: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x00028;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x00028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>5</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>5</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧", "90° эргүүлэлт (цагийн зүүний эсрэг); 90° (цагийн зүүний дагуу); k = −0,5 гомотет", "Олонлог 10, Дасгал 12 №4"]], "tb": [], "digital": false, "stype": "C", "mode": "дүгнэлт", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Өөрчлөгдөвч хадгалах»:** Хувиргалтаар дүрсийн байрлал өөрчлөгдсөн ч зарим чанар (урт, өнцөг) хадгалагддаг. Хүн ч өсөж өөрчлөгдөвч үнэт зүйлсээ хадгалдаг. Асуулт: «Би юуг өөрчилж, юуг хадгалах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧; 2) (3; −2)-той OX-ийн хувьд тэгш хэмтэй цэг; 3) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>2</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mo>&#x02212;</mo><mn>3</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧", "**Холбоос (1 мин):** №20-д тэгш хэм, №29-д матрицын үржвэрийг үзсэн; өнөөдөр хувиргалтыг матрицаар илэрхийлнэ."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Утсан дээр зургийг 90° эргүүлэхэд компьютер цэг бүрийг ямар томьёогоор шилжүүлдэг вэ?", "**1. Гол санаа (самбарт):** (x; y) → (x′; y′) = M·(x; y), M = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧: x′ = ax + by, y′ = cx + dy.", "   M-ийн 1-р багана — (1; 0)-ийн дүр, 2-р багана — (0; 1)-ийн дүр. Хувиргалт эдгээрийг хаашаа шилжүүлэхийг мэдвэл матрицыг шууд бичнэ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>2</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ээр (2; −3)-ын дүр", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): OY-ийн тэгш хэмийн матриц", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-оор A(1; 2), B(3; 1)-ийн дүр; AB-ийн урт хэрхэн өөрчлөгдөх вэ?", "**3. Түгээмэл алдаа:** Матрицыг координатаар үржүүлэхдээ дарааллыг солих; баганыг (1; 0)-ийн дүр гэдгийг анзаарахгүй байх; x′-д 2-р мөрийг хэрэглэх.", "**4. Шалгах цэг (3 мин):** 1) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>2</mn></mtd><mtd><mo>&#x02212;</mo><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-оор (−4; −2)-ын дүр; 2) O цэгийн тэгш хэмийн матриц. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Ажиглаж оюун дүгнэлт гаргах:** «Матрицын нууц»: «F» хэлбэрийн дүрсийн оройнууд A(1; 1), B(1; 3), C(2; 3), D(1; 2), E(2; 2). M₁ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, M₂ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, M₃ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧, M₄ = ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>2</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>2</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧ матриц бүрээр хувиргаж зурна. Хүснэгтэд «Ямар хувиргалт вэ? Урт хадгалагдсан уу?» гэж бичнэ. «(1; 0) ба (0; 1)-ийн дүр матрицын баганатай ямар холбоотой вэ?» гэсэн дүгнэлт гаргаж, өөр матрицаар шалгана.", "**Бүтээгдэхүүн:** Хувиргасан 4 дүрс ба дүгнэлтийн хүснэгт", "• Хос ажиглалтаа хүснэгтэд бичиж, «Үргэлж … байна» гэсэн дүгнэлт (таамаглал) гаргана.", "• Багш «Энэ дүгнэлт бүх тохиолдолд үнэн үү? Яаж шалгах вэ?» гэж асууна."]], ["VI. Дүгнэлтээ шалгах, батлах", ["• 2–3 хос дүгнэлтээ самбарт бичнэ. Анги эсрэг жишээ хайж шалгана.", "• Багш дүгнэлтийг теорем/чанар болгон нэрлэж, үндэслэлийг товч харуулна."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "33": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Загвар үзүүлэх", 14], ["V. Багийн лабораторийн ажил", 28], ["VI. Галерейн алхалт, сайжруулалт", 12], ["VII. Бие даан баталгаажуулах", 9], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Координатын хавтгай дахь дүрсийг цэгийн ба тэнхлэгийн тэгш хэмээр хувиргаж, хувиргалтыг матрицаар илэрхийлэх, хээ угалзын бүтээлд хэрэглэх.", "crit": ["Би цэгийг O, OX, OY, y = x-ийн хувьд тэгш хэмээр хувиргаж чадна.", "Би дүрсийг тэгш хэмээр хувиргаж, матрицаар илэрхийлж чадна.", "Би хээний тэгш хэмийн бүтцийг тайлбарлаж чадна."], "words": "тэнхлэгийн тэгш хэм — толин тусгал; цэгийн тэгш хэм — 180° эргүүлэлт; y = x шулууны тэгш хэм — (y; x).", "ex": [["A(−5; 5)-тай O-ийн хувьд тэгш хэмтэй цэг", "(5; −5)"], ["A(1; 2), B(4; 2), C(1; 5) гурвалжныг OY-ийн хувьд хувирга", "A′(−1; 2), B′(−4; 2), C′(−1; 5)"], ["A(−2; −5)-тай y = x-ийн хувьд", "(−5; −2)"]], "ck": [["A(−7; −3)-тай OY-ийн хувьд", "(7; −3)"], ["A(4; −3)-тай OX-ийн хувьд", "(4; 3)"]], "ws": [["Сэргээх", ["(6; −2)-той OX-ийн хувьд", "(−1; −4)-тэй OY-ийн хувьд"]], ["Дадлага 1", ["A(7; 4)-тэй O-ийн хувьд", "A(−1; −6)-тай y = x-ийн хувьд"]], ["Дадлага 2", ["A(0; 3), B(2; 0), C(4; 028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>y</mi><mo>&#x0003D;</mo><mi>x</mi><mi>:</mi><mtext>&#x000A0;</mtext><mo>&#x00028;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-33"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-33"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Mozaik: «тэгш хэм» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L33.png", "ol": [["Ямар хувиргалт вэ: ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x00028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x00028;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo>&#x00028;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x00029;</mo></mrow></math>⟧", "OY-ийн тэгш хэм; O цэгийн тэгш хэм; y = x шулууны тэгш хэм", "Олонлог 10, Дасгал 12 №4"]], "tb": [], "digital": false, "stype": "C", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Тэнцвэр»:** Монгол хээ угалз тэгш хэмээрээ гоо сайхан, тэнцвэртэй харагддаг. Амьдралд ч хичээл, амралт, гэр бүл, найз нөхдийн тэнцвэр чухал. Асуулт: «Миний өдрийн хуваарь тэнцвэртэй юу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) (3; −5)-тай OX-ийн хувьд тэгш хэмтэй цэг; 2) (−2; 7)-той OY-ийн хувьд; 3) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·(4; −1)", "**Холбоос (1 мин):** №20-д тэгш хэмтэй цэгийг, №32-т хувиргалтын матрицыг үзсэн; өнөөдөр бүтэн дүрсийг тэгш хэмээр хувиргана."]], ["IV. Загвар үзүүлэх", ["**Асуудал:** Монгол хээний нэг хагасыг зурсан. Нөгөө хагасыг толин тусгал байхаар яаж зурах вэ? Координатаар хэрхэн илэрхийлэх вэ?", "**1. Гол санаа (самбарт):** O цэгийн тэгш хэм: (x; y) → (−x; −y), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧. OX: (x; −y), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧. OY: (−x; y), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧. y = x: (y; x), ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧.", "   Тэгш хэм урт, өнцөг, талбайг хадгална. Дүрсийг хувиргахдаа орой бүрийг хувиргаад дарааллаар нь холбоно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): A(−5; 5)-тай O-ийн хувьд тэгш хэмтэй цэг", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): A(1; 2), B(4; 2), C(1; 5) гурвалжныг OY-ийн хувьд хувирга", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): A(−2; −5)-тай y = x-ийн хувьд", "**3. Түгээмэл алдаа:** OX ба OY-ийн тэгш хэмийг андуурах; y = x-ийн тэгш хэмд тэмдэг өөрчлөх (зөвхөн байрыг солино); зөвхөн нэг оройг хувиргах.", "**4. Шалгах цэг (3 мин):** 1) A(−7; −3)-тай OY-ийн хувьд; 2) A(4; −3)-тай OX-ийн хувьд. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн лабораторийн ажил", ["**Багийн гүйцэтгэлийн даалгавар:** «Монгол хээ»: тор бүхий А3 цаасан дээр хээний дөрөвний нэг хэсгийн оройнууд: (1; 0), (1; 2), (2; 3), (3; 3), (3; 1), (4; 1). 1) OY-ийн хувьд тэгш хэмээр зурж хагас хээ гарга. 2) OX-ийн хувьд дахин тэгш хэмээр зурж бүтэн хээ гарга. 3) Бүтэн хээ O цэгийн хувьд тэгш хэмтэй юу? 4) ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mo>&#x02212;</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧·⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0005B;</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mn>0</mn></mtd><mtd><mo>&#x02212;</mo><mn>1</mn></mtd></mtr></mtable><mo>&#x0005D;</mo></mrow></math>⟧-ийг олж тайлбарла.", "**Бүтээгдэхүүн:** Бүтэн хээ ба тайлбар бүхий А3", "**Нэгж 8-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Галерейн алхалт, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VII. Бие даан баталгаажуулах", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "34": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Станцын ажил (3 станц)", 16], ["VIII. Станцын дүнг нэгтгэх, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Параллел зөөлтийг вектороор илэрхийлж, цэг ба дүрсийг зөөх, зөөлтийн векторыг олох, давтагдах хээний загварт хэрэглэх.", "crit": ["Би цэг, дүрсийг өгсөн вектороор зөөж чадна.", "Би эх ба дүрээр зөөлтийн векторыг олж чадна.", "Би давтагдах хээг параллел зөөлтөөр бүтээж чадна."], "words": "параллел зөөлт — бүх цэг нэг вектороор шилжинэ; (x; y) → (x + a; y + b); зөөлтийн вектор a⃗(a; b).", "ex": [["A(6; 0)-ийг a⃗(2; 1)-ээр зөө", "(8; 1)"], ["(−3; 0)-ийн дүр (1; 2) бол (4; −1)-ийн дүр", "a⃗(4; 2) → (8; 1)"], ["A(0; 0), B(2; 0), C(1; 3)-ыг a⃗(−3; 2)-оор зөө", "(−3; 2), (−1; 2), (−2; 5)"]], "ck": [["A(−3; −3)-ыг a⃗(−1; −1)-ээр зөө", "(−4; −4)"], ["(x; y) → (x − 2; y + 2) бол (−1; 2)-ын дүр", "(−3; 4)"]], "ws": [["Сэргээх", ["(−1; 4) + (3; −2)", "A(5; 1), B(2; 3) бол AB⃗"]], ["Дадлага 1", ["A(1; −2)-ыг a⃗(−3; 3)-аар зөө", "A(4; 2)-ыг a⃗(−4; −2)-оор зөө"]], ["Дадлага 2", ["A(2; 5)-ын дүр A′(−1; 1) бол зөөлтийн вектор", "Тэр зөөлтөөр B(0; 3)-ын дүр"]], ["★ Сорилт", ["(x; y) → (x + 5; y − 2) зөөлтөөр дүр нь (3; 3) болсон цэг", "a⃗(1; 2), дараа нь b⃗(3; −5)-аар дараалан зөөсөн. Ганц зөөлтийн вектор"]], ["Хэрэглээ", ["Хайсны хэсгийн оройнууд (0; 0), (1; 2), (2; 0). a⃗(2; 0)-оор 2 удаа зөөхөд гарах оройнууд"]], ["Код унших (сонголттой)", ["Гаралт:", "int x = 1, y = 1;", "for (int k = 0; k < 3; k++) x += 2;  cout << x << \" \" << y;"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "A(1; −4)-ийг a⃗(−5; −2)-оор зөө", "A(−5; 3)-ыг a⃗(−4; −1)-ээр зөө", "A(3; −1)-ийн дүр A′(7; −1) бол зөөлтийн вектор", "(x; y) → (x + 5; y − 2) зөөлтийн вектор", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>4</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>8</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ вектороор ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ оройтой тугийг зөө __(Олонлог 10, Дасгал 12 №1-ийн санаагаар)__"], "quiz": ["A(−6; −4)-ийг a⃗(−4; −1)-ээр зөө", "(1; 1)-ийн дүр (4; −1) бол (0; 5)-ын дүр", "Зөөлтөөр 3 см талтай квадратын талбай хэд болох вэ?"], "key": [["III. Суурь сэргээх", ["1) (6; 2)", "2) (3; 4)", "3) −7"]], ["Жишээ 1–3", ["Жишээ 1: (8; 1)", "Жишээ 2: a⃗(4; 2) → (8; 1)", "Жишээ 3: (−3; 2), (−1; 2), (−2; 5)"]], ["Шалгах цэг", ["1) (−4; −4)", "2) (−3; 4)"]], ["I. Ажлын хуудас", ["№1: (2; 2)", "№2: (−3; 2)", "№3: (−2; 1)", "№4: (0; 0)", "№5: (−3; −4)", "№6: (−3; −1)", "№7: (−2; 5)", "№8: (4; −3)", "№9: (2; 0), (3; 2), (4; 0); (4; 0), (5; 2), (6; 0)", "№10: 7 1 (a⃗(2; 0)-оор 3 удаа)"]], ["Багийн даалгавар", ["1: (−4; 2), (−1; 1), (−6; 6), (1; 7).", "2: a⃗(−3; 4); B′(−3; 2).", "3: хэсгүүд (2; 0)–(3; 2)–(4; 0), (4; 0)–(5; 2)–(6; 0), …; 2 дахь эгнээнд бүх y-аас 3-ыг хасна."]], ["II. Гэрийн даалгавар", ["№1: (−4; −6)", "№2: (−9; 2)", "№3: (4; 0)", "№4: a⃗(5; −2)", "№5: (5; −4), (5; −2), (7; −3)"]], ["III. Гарах тасалбар", ["№1: (−10; −5) (шалгуур 1)", "№2: a⃗(3; −2) → (3; 3) (шалгуур 2)", "№3: 9 см² (өөрчлөгдөхгүй) (шалгуур 3)"]]], "F": ["(x;\\,y)\\ \\to\\ (x+a;\\ y+b)", "\\vec{a}=(x^{\\prime}-x;\\ y^{\\prime}-y)"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mi>;</mi><mspace width=\"0.167em\" /><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo><mtext>&#x000A0;</mtext><mo>&#x02192;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>a</mi><mi>;</mi><mtext>&#x000A0;</mtext><mi>y</mi><mo>&#x0002B;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>a</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mi>x</mi><mrow><mi>&#x02032;</mi></mrow></msup><mo>&#x02212;</mo><mi>x</mi><mi>;</mi><mtext>&#x000A0;</mtext><msup><mi>y</mi><mrow><mi>&#x02032;</mi></mrow></msup><mo>&#x02212;</mo><mi>y</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-34"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-34"], ["GeoGebra геометр", "https://www.geogebra.org/geometry"], ["Дараалсан хувиргалт (8-р анги)", "https://econtent.edu.mn/videoEBS/8rangi/mat/1567"], ["Mozaik: «параллел зөөлт» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L34.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mover><mrow><mi>c</mi></mrow><mo stretchy=\"true\">&#x02192;</mo></mover><mo stretchy=\"false\">&#x00028;</mo><mn>4</mn><mi>;</mi><mspace width=\"0.167em\" /><mo>&#x02212;</mo><mn>8</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ вектороор ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>4</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>6</mn><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mn>3</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>5</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ оройтой тугийг зөө", "(5; −4), (5; −2), (7; −3)", "Олонлог 10, Дасгал 12 №1-ийн санаагаар"], ["Зөөлтөөр ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mo>&#x02212;</mo><mn>3</mn><mi>;</mi><mspace width=\"0.167em\" /><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧-ийн дүр ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mn>1</mn><mi>;</
