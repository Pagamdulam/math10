<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Математик X · 10-р анги</title>
<meta name="description" content="10-р ангийн математик: 54 хичээл — видео, гол томьёо, жишээ, дадлага, гэрийн даалгавар.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a5f">
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#22262b;--mute:#6a6f76;--line:#dcd7cd;--soft:#f1ede5;--pri:#1e3a5f;--pri2:#eef1f4;--acc:#a8432a;--gold:#c99a2e;--ok:#3d6b45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.logo,.serif{font-family:Georgia,"PT Serif","Times New Roman",serif}
a{color:var(--pri);text-decoration:underline;text-decoration-color:#b9c3cf;text-underline-offset:3px}a:hover{text-decoration-color:var(--pri)}
.top{background:var(--bg);border-bottom:3px double var(--line)}
.top .in{max-width:900px;margin:auto;display:flex;align-items:baseline;gap:10px;padding:16px 20px 10px;flex-wrap:wrap}
.logo{font-weight:700;font-size:21px;color:var(--pri);text-decoration:none}.logo small{font:400 14px "Segoe UI",Arial,sans-serif;color:var(--mute);margin-left:8px}
.top nav{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}
.top nav a{padding:4px 0;color:var(--mute);font-size:15px;text-decoration:none;border-bottom:2px solid transparent}
.top nav a.on,.top nav a:hover{color:var(--ink);border-color:var(--acc)}
main{max-width:900px;margin:auto;padding:22px 20px 60px}
h1{font-size:29px;line-height:1.25;margin:4px 0 8px;color:var(--pri)}h2{font-size:21px;margin:26px 0 8px;color:var(--pri)}h3{font-size:17px;margin:16px 0 6px}
.mute{color:var(--mute)}.small{font-size:14.5px}
.card{border-top:1px solid var(--line);padding:12px 0 14px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 28px}
.unit{display:block;color:var(--ink);text-decoration:none}.unit .t{text-decoration:underline;text-decoration-color:#b9c3cf;text-underline-offset:3px}.unit:hover .t{text-decoration-color:var(--pri)}
.unit .n{font-size:13px;color:var(--mute)}.unit .t{font:700 18px Georgia,serif;color:var(--pri);margin:2px 0 4px}
.pill{font-size:14px;color:var(--mute)}
.btn{display:inline-block;padding:8px 15px;border-radius:4px;border:1px solid var(--pri);background:transparent;color:var(--pri);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--pri);color:#fff}.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{padding:0}.list a{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--soft);color:var(--ink);text-decoration:none}
.list a:last-child{border-bottom:0}.list a:hover span:last-child{text-decoration:underline;text-decoration-color:#b9c3cf}
.list .no{color:var(--pri);font-weight:700;min-width:38px;font-variant-numeric:tabular-nums}
.list a.done .no{color:var(--ok)}
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin:18px 0 6px}
.tabs button{border:0;background:none;font:inherit;font-size:16px;padding:8px 0;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.formula{border-left:3px solid var(--gold);padding:6px 0 6px 16px;font-size:19px;overflow-x:auto}
.formula math{display:block;margin:6px 0}
.fig{display:block;max-width:min(440px,100%);margin:14px auto;background:#fff;border:1px solid var(--soft)}
video{width:100%;background:#000}
ol.q{padding-left:26px}ol.q li{margin:10px 0}
details.ans summary{cursor:pointer;color:var(--mute);font-size:14px;list-style:none}details.ans summary::-webkit-details-marker{display:none}
details.ans summary:before{content:"+ "}details.ans[open] summary:before{content:"– "}
details.ans div{border-left:2px solid var(--ok);padding:2px 10px;margin-top:4px;color:var(--ok)}
.lvl{font:700 16px Georgia,serif;color:var(--pri);margin:20px 0 0}
.ex{padding:10px 0;border-top:1px solid var(--soft)}
.pager{display:flex;justify-content:space-between;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.search{width:100%;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font:inherit}
.hero p{max-width:620px}
.cont{border-left:3px solid var(--acc);padding:4px 0 4px 14px;margin:16px 0}
details.card summary{cursor:pointer}
.tw{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg)}
.tbar .st{font-weight:600}.tbar .tm{font:600 22px ui-monospace,Consolas,monospace;margin-left:auto}.tm.over{color:var(--acc)}
.tprog{display:flex;gap:2px}.tprog i{height:4px;background:var(--line)}.tprog i.d{background:var(--ok)}.tprog i.c{background:var(--acc)}
.slide{flex:1;overflow:auto;padding:28px max(4vw,16px);font-size:clamp(18px,2.2vw,26px);max-width:1200px;margin:0 auto;width:100%}
.slide h2{font-size:1.5em;margin-top:0}.slide .rv{display:none}.slide.show .rv{display:block}
.rvbox{border-left:3px solid var(--ok);padding:2px 14px;margin-top:6px;color:var(--ok)}
@media (max-width:640px){.top nav{margin-left:0;width:100%;gap:16px;overflow-x:auto}.logo small{display:none}h1{font-size:24px}body{font-size:16px}}
@media print{.top,.tabs,.pager,.btn{display:none}}
</style>
</head>

эг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 2³ · 2²; 2) 5⁴ : 5²; 3) (3²)³", "**Холбоос (1 мин):** 2³ = 8, 2² = 4, 2¹ = 2 — зүй тогтлоор 2⁰ ба 2⁻¹ хэд байх вэ?"]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Хүний цусны улаан эсийн диаметр 7·10⁻⁶ м, томуугийн вирус 7·10⁻⁸ м. Улаан эс вирусээс хэд дахин том вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a⁰ = 1, a⁻ⁿ = 1/aⁿ, (a/b)⁻ⁿ = (b/a)ⁿ (a, b ≠ 0). Яагаад a ≠ 0 байх ёстойг (0-д хуваахгүй) тайлбарлана.", "   Чанар (m, n бүхэл): aᵐ·aⁿ = aᵐ⁺ⁿ;  aᵐ : aⁿ = aᵐ⁻ⁿ;  (aᵐ)ⁿ = aᵐⁿ;  (ab)ⁿ = aⁿbⁿ;  (a/b)ⁿ = aⁿ/bⁿ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 2⁻³ + (3/4)⁻² − (−5)⁰", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (9⁻² · 27³) / 3⁻²", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): ((3a⁻²b⁴) / (6a³b⁻¹))⁻²", "**3. Түгээмэл алдаа:** 3⁻² = −9 гэж бичих (зөв нь 1/9); −2⁴ = 16 гэж бичих (−2⁴ = −16, (−2)⁴ = 16); (a + b)⁻¹ = a⁻¹ + b⁻¹ гэж бичих.", "**4. Шалгах цэг (3 мин):** 1) 5⁰ + 4⁻¹; 2) (1/3)⁻². Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Бичил ертөнцийн хэмжээний шат»: транзистор 5·10⁻⁹ м, вирус 1·10⁻⁷ м, бактери 2·10⁻⁶ м, улаан эс 7·10⁻⁶ м, хүний үсний голч 5·10⁻⁵ м. Жижгээс том руу эрэмбэлж, хөрш хоёр бүрийн харьцааг (хэд дахин) зэргийн чанараар алхамчлан олж, шат хэлбэрийн зураг хийнэ.", "**Бүтээгдэхүүн:** Хэмжээний шат (зураг) ба харьцааны тооцоо бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "2": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Квадрат язгуурын ойлголтыг n зэргийн язгуур болгон өргөтгөж, тэгш ба сондгой зэргийн язгуурын ялгааг тайлбарлах, язгуурын чанараар илэрхийлэл хялбарчилж, хэмжээний бодлогод хэрэглэх.", "crit": ["Би ∛(−8) бодит тоо, √(−9) бодит биш гэдгийг тайлбарлаж чадна.", "Би √72 зэрэг язгуурыг хялбарчилж чадна.", "Би талбай, эзэлхүүнээс тал, ирмэгийн уртыг язгуураар олж чадна."], "words": "язгуур — зэрэг дэвшүүлэхийн урвуу үйлдэл; арифметик язгуур — сөрөг биш утга; тэгш, сондгой зэрэг; хялбарчлах.", "ex": [["⁴√81", "3, учир нь 3⁴ = 81"], ["∛(−125) ба √(−125)-ийн аль нь бодит тоо вэ?", "∛(−125) = −5; √(−125) бодит тоонд байхгүй (тэгш зэргийн язгуур)"], ["√48-ийг хялбарчил", "√(16·3) = 4√3"]], "ck": [["∛4 · ∛16", "∛64 = 4"], ["√75-ыг хялбарчил", "√(25·3) = 5√3"]], "ws": [["Сэргээх", ["(−2)⁵", "Квадрат нь 144 байх бүх тоо"]], ["Дадлага 1", ["⁴√16 + ∛27", "√45 · √5"]], ["Дадлага 2", ["√98-ийг хялбарчил", "∛54 : ∛2"]], ["★ Сорилт", ["∛(−27) бодит тоо мөн, харин ⁴√(−16) бодит тоо биш. Яагаад? Тайлбарла.", "Аль нь их вэ: 2√7 эсвэл 3√3? (Үржигдэхүүнийг язгуур дор оруулж харьцуул.)"]], ["Хэрэглээ", ["Дэлгэцийн өргөн 48 см, өндөр 36 см. Диагональ = √(48² + 36²) хэд вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "∛(−64) + ⁴√81", "√12 · √3", "√200-ийг хялбарчил", "Шоо савны эзэлхүүн 343 л бол ирмэгийн урт хэд вэ?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>81</mn></mrow><mn>4</mn></mroot></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>32</mn></mrow><mn>5</mn></mroot></mrow></math>⟧ __(Олонлог 10, Дасгал 3 №1)__"], "quiz": ["√(−9) ба ∛(−8)-ийн аль нь бодит тоо вэ? Утгыг нь ол.", "√72-ийг хялбарчил", "Квадрат талбайн талбай 18 м² бол талын урт хэд вэ? (хялбарчилсан язгуураар)"], "key": [["III. Суурь сэргээх", ["1) −27", "2) 32", "3) 9 ба −9"]], ["Жишээ 1–3", ["Жишээ 1: 3, учир нь 3⁴ = 81", "Жишээ 2: ∛(−125) = −5; √(−125) бодит тоонд байхгүй (тэгш зэргийн язгуур)", "Жишээ 3: √(16·3) = 4√3"]], ["Шалгах цэг", ["1) ∛64 = 4", "2) √(25·3) = 5√3"]], ["I. Ажлын хуудас", ["№1: −32", "№2: 12 ба −12", "№3: 2 + 3 = 5", "№4: √225 = 15", "№5: √(49·2) = 7√2", "№6: ∛27 = 3", "№7: (−3)³ = −27 тул ∛(−27) = −3; ямар ч бодит тооны 4 зэрэг сөрөг биш тул ⁴√(−16) байхгүй", "№8: 2√7 = √28, 3√3 = √27 тул 2√7 их", "№9: √(2304 + 1296) = √3600 = 60 см"]], ["Багийн даалгавар", ["Ирмэг: ∛27 = 3 дм, ∛125 = 5 дм, ∛1000 = 10 дм (1 л = 1 дм³).", "Тал: √50 = 5√2 ≈ 7,1 м; √72 = 6√2 ≈ 8,5 м; √200 = 10√2 ≈ 14,1 м.", "Талбай 2 дахин ихсэхэд тал √2 ≈ 1,41 дахин ихэснэ: √(2S) = √2 · √S (жишээ: 100 м² → 10 м, 200 м² → 10√2 м)."]], ["II. Гэрийн даалгавар", ["№1: −4 + 3 = −1", "№2: √36 = 6", "№3: √(100·2) = 10√2", "№4: ∛343 = 7 дм", "№5: 3; 2"]], ["III. Гарах тасалбар", ["№1: ∛(−8) = −2; √(−9) бодит тоо биш (шалгуур 1)", "№2: √(36·2) = 6√2 (шалгуур 2)", "№3: √18 = 3√2 м ≈ 4,2 м (шалгуур 3)"]]], "F": ["\\sqrt[n]{a^{n}}=|a|\\ (n\\ \\text{тэгш}),\\quad \\sqrt[n]{a^{n}}=a\\ (n\\ \\text{сондгой})", "\\sqrt[n]{ab}=\\sqrt[n]{a}\\cdot\\sqrt[n]{b}", "\\sqrt[3]{-8}=-2"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><msup><mi>a</mi><mrow><mi>n</mi></mrow></msup></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x0007C;</mo><mi>a</mi><mo stretchy=\"false\">&#x0007C;</mo><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mtext>&#x000A0;</mtext><mtext>тэгш</mtext><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0002C;</mo><mspace width=\"1em\" /><mroot><mrow><msup><mi>a</mi><mrow><mi>n</mi></mrow></msup></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mi>a</mi><mtext>&#x000A0;</mtext><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mtext>&#x000A0;</mtext><mtext>сондгой</mtext><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mi>a</mi><mi>b</mi></mrow><mi>n</mi></mroot><mo>&#x0003D;</mo><mroot><mrow><mi>a</mi></mrow><mi>n</mi></mroot><mo>&#x000B7;</mo><mroot><mrow><mi>b</mi></mrow><mi>n</mi></mroot></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mo>&#x02212;</mo><mn>8</mn></mrow><mn>3</mn></mroot><mo>&#x0003D;</mo><mo>&#x02212;</mo><mn>2</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-2"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-2"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «язгуур» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L02.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>81</mn></mrow><mn>4</mn></mroot></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mroot><mrow><mn>32</mn></mrow><mn>5</mn></mroot></mrow></math>⟧", "3; 2", "Олонлог 10, Дасгал 3 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mn>113</mn><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mn>112</mn><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mn>25</mn><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mn>24</mn><mrow><mn>2</mn></mrow></msup></mrow></msqrt></mrow></math>⟧", "√225 = 15; √49 = 7", "Олонлог 10, Дасгал 3 №2"]], "tb": [["a = 16, n = 4 ба a = 1024, n = 5 бол a тооны n зэргийн язгуур", "±2; 4", "Математик X, §1.3 №27"]], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Үндсээ мэдэх»:** Язгуур гэдэг үг «үндэс» гэсэн утгатай. Мод үндсээрээ тогтдог шиг хүн ч өдөр бүрийн дадал, зарчмаараа тогтдог. Асуулт: «Миний сурлагын үндэс юу вэ — өдөр бүрийн бага давтлага уу, шалгалтын өмнөх шахалт уу?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) (−3)³; 2) 2⁵; 3) Квадрат нь 81 байх бүх тоо", "**Холбоос (1 мин):** «Ямар тоог 3 удаа өөрөөр нь үржүүлэхэд 64 гарах вэ?» — өнөөдөр зэрэг дэвшүүлэхийн урвуу үйлдлийг судална."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Шоо хэлбэрийн савны эзэлхүүн 64 дм³, квадрат талбайн талбай 81 м². Савны ирмэг, талбайн тал хэд вэ? ∛(−8) гэж бичиж болох уу?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** bⁿ = a бол b нь a-ийн n зэргийн язгуур. n сондгой: язгуур ганц, a сөрөг байж болно (∛(−8) = −2). n тэгш: a ≥ 0 байх ёстой; сөрөг биш утгыг арифметик язгуур гэнэ (√81 = 9).", "   Чанар (a, b ≥ 0): ⁿ√a · ⁿ√b = ⁿ√(ab);  ⁿ√a : ⁿ√b = ⁿ√(a/b);  (ⁿ√a)ⁿ = a.  Үржигдэхүүн гаргах: √48 = √(16·3) = 4√3.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): ⁴√81", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): ∛(−125) ба √(−125)-ийн аль нь бодит тоо вэ?", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): √48-ийг хялбарчил", "**3. Түгээмэл алдаа:** √(a + b) = √a + √b гэж бичих (√(9 + 16) = 5, харин √9 + √16 = 7); √81 = ±9 гэж бичих (арифметик язгуур нь 9).", "**4. Шалгах цэг (3 мин):** 1) ∛4 · ∛16; 2) √75-ыг хялбарчил. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Малчин өрхийн аж ахуй»: Өвөрхангайн малчин өрх шоо хэлбэрийн 3 усны савтай — эзэлхүүн 27 л, 125 л, 1000 л; Арвайхээрт квадрат хэлбэрийн 3 хашаа — 50 м², 72 м², 200 м². Савны ирмэг, хашааны талыг (хялбарчилсан язгуур ба 0,1 хүртэл ойролцоо утгаар) олж хүснэгт хийнэ. «Талбай 2 дахин ихсэхэд тал хэд дахин ихсэх вэ?» гэдэгт тооцоогоор үндэслэж хариулна.", "**Бүтээгдэхүүн:** Хүснэгт ба 2–3 өгүүлбэр дүгнэлт бүхий хосын хуудас", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "3": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 6], ["IV. Самбарын тайлбар: рационал илтгэгчийг язгуураас гаргах", 28], ["V. Багийн гүйцэтгэлийн даалгавар", 15], ["VI. Бие даан дадлага", 12], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "n зэргийн язгуурыг ашиглан рационал илтгэгчтэй зэргийн тодорхойлолтыг гаргаж, зэргийн чанараар тооцоолох, хялбарчлах, өсөлтийн бодлогод хэрэглэх.", "crit": ["Би 125^(2/3) зэрэг утгыг язгуураар тайлбарлан олж чадна.", "Би x^(2/3) · x^(1/6) зэрэг илэрхийллийг хялбарчилж чадна.", "Би өсөлтийн бодлогод рационал илтгэгч хэрэглэж чадна."], "words": "рационал илтгэгч — бутархай илтгэгч m/n; хуваарь n — язгуурын зэрэг; хүртвэр m — зэрэг.", "ex": [["125^(2/3)", "(∛125)² = 5² = 25"], ["16^(−3/4)", "1 / (⁴√16)³ = 1/2³ = 1/8"], ["x^(1/2) · x^(1/3)-ийг язгуураар бич", "x^(5/6) = ⁶√(x⁵)"]], "ck": [["27^(2/3)", "(∛27)² = 9"], ["6^(3/2) · 6^(5/2)", "6^(8/2) = 6⁴ = 1296"]], "ws": [["Сэргээх", ["∛64", "(√3)²"]], ["Дадлага 1", ["25^(1/2)", "7^(4/5)-ийг язгуураар бич"]], ["Дадлага 2", ["64^(−2/3)", "(9^(2/3))^(3/2)"]], ["★ Сорилт", ["2^(1/2) · 4^(1/4) · 8^(1/6)", "Алдааг ол, зас: 8^(2/3) = 16/3"]], ["Хэрэглээ", ["Мөнгө жилд 1,21 дахин өсдөг. Хагас жилд хэд дахин өсөх вэ? Хувиар илэрхийл."]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "49^(1/2) + 27^(1/3)", "32^(3/5)", "a^(2/3) · a^(1/3) : a^(1/2)", "16^(0,75)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>y</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo>&#x02212;</mo><mn>3</mn></mrow></msup></mrow></math>⟧ __(Олонлог 10, Дасгал 2 №1)__"], "quiz": ["81^(1/4)-ийг язгуураар бичиж утгыг ол", "x^(2/3) · x^(1/6)", "Үнэ жилд 1,44 дахин өссөн. Хагас жилд хэд дахин (хэдэн хувиар) өссөн бэ?"], "key": [["III. Суурь сэргээх", ["1) 2", "2) 7", "3) 2⁶ = 64"]], ["Жишээ 1–3", ["Жишээ 1: (∛125)² = 5² = 25", "Жишээ 2: 1 / (⁴√16)³ = 1/2³ = 1/8", "Жишээ 3: x^(5/6) = ⁶√(x⁵)"]], ["Шалгах цэг", ["1) (∛27)² = 9", "2) 6^(8/2) = 6⁴ = 1296"]], ["I. Ажлын хуудас", ["№1: 4", "№2: 3", "№3: √25 = 5", "№4: ⁵√(7⁴)", "№5: 1 / (∛64)² = 1/16", "№6: 9^(2/3 · 3/2) = 9¹ = 9", "№7: 2^(1/2) · 2^(1/2) · 2^(1/2) = 2^(3/2) = 2√2", "№8: Үржүүлж болохгүй: 8^(2/3) = (∛8)² = 4", "№9: (1,21)^(1/2) = √1,21 = 1,1 → 10%"]], ["Багийн даалгавар", ["4 хагас ая: 440 · 2^(1/3) ≈ 440 · 1,26 ≈ 554,4 Гц.", "6 хагас ая: 440 · 2^(1/2) = 440√2 ≈ 622,3 Гц.", "12 хагас ая: 440 · 2¹ = 880 Гц. 2^(1/2) · 2^(1/2) = 2^(1/2 + 1/2) = 2.", "Морин хуур: 2^(5/12) ≈ 1,335 ≈ 4/3 (1,333)."]], ["II. Гэрийн даалгавар", ["№1: 7 + 3 = 10", "№2: (⁵√32)³ = 2³ = 8", "№3: a^(1 − 1/2) = a^(1/2) = √a", "№4: 16^(3/4) = (⁴√16)³ = 8", "№5: y^(5/3); y^(12/5)"]], ["III. Гарах тасалбар", ["№1: ⁴√81 = 3 (шалгуур 1)", "№2: x^(4/6 + 1/6) = x^(5/6) (шалгуур 2)", "№3: (1,44)^(1/2) = 1,2 → 20% (шалгуур 3)"]]], "F": ["a^{\\frac{m}{n}}=\\sqrt[n]{a^{m}}\\quad (a>0)", "8^{\\frac{2}{3}}=\\left(\\sqrt[3]{8}\\right)^{2}=4", "a^{-\\frac{1}{2}}=\\frac{1}{\\sqrt{a}}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mfrac><mrow><mi>m</mi></mrow><mrow><mi>n</mi></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><mroot><mrow><msup><mi>a</mi><mrow><mi>m</mi></mrow></msup></mrow><mi>n</mi></mroot><mspace width=\"1em\" /><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>8</mn><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mroot><mrow><mn>8</mn></mrow><mn>3</mn></mroot><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mn>4</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mrow><mi>a</mi></mrow></msqrt></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-3"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-3"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «зэрэг» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L03.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>y</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>y</mi><mrow><mo>&#x02212;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo>&#x02212;</mo><mn>3</mn></mrow></msup></mrow></math>⟧", "y^(5/3); y^(12/5)", "Олонлог 10, Дасгал 2 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo>&#x000B7;</mo><msup><mi>y</mi><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mn>3</mn></mrow></msup></mrow></math>⟧", "xy²", "Олонлог 10, Дасгал 2 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><mn>64</mn><msup><mi>p</mi><mrow><mn>12</mn></mrow></msup><msup><mi>q</mi><mrow><mo>&#x02212;</mo><mn>6</mn></mrow></msup><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></msup></mrow></math>⟧", "32p¹⁰q⁻⁵", "Олонлог 10, Дасгал 2 №2"]], "tb": [], "digital": false, "stype": "B", "mode": "баг", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Хэсэг ба бүхэл»:** 8^(1/3) гэдэг нь 8-ын «гуравны нэг хэсэг» биш, 3 удаа үржихэд 8 болох тоо. Багт ч хүн бүрийн хувь нэмэр үржигдэж бүхэл болдог. Асуулт: «Өнөөдөр би багтаа ямар хувь нэмэр оруулах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (3 мин):** 1) ∛8; 2) √49; 3) (2³)²", "**Холбоос (1 мин):** (√5)² = 5. Хэрэв 5ˣ · 5ˣ = 5¹ бол x хэд байх ёстой вэ? (2x = 1 → x = 1/2)"]], ["IV. Самбарын тайлбар: рационал илтгэгчийг язгуураас гаргах", ["**Асуудал:** Банк мөнгийг жилд 1,21 дахин өсгөдөг. Хагас жилд хэд дахин өсөх вэ? (1,21)^(1/2) гэж юу гэсэн үг вэ?", "**1. Гол санаа (самбарт):** (a^(1/n))ⁿ = a^((1/n)·n) = a¹ = a тул a^(1/n) нь a-ийн n зэргийн язгуур: a^(1/n) = ⁿ√a. Үүнээс a^(m/n) = (a^(1/n))ᵐ = (ⁿ√a)ᵐ = ⁿ√(aᵐ), a > 0.", "   Дүрэм: эхлээд язгуурыг (жижиг тоо), дараа нь зэргийг олбол тооцоо хялбар: 8^(2/3) = (∛8)² = 2² = 4. Сөрөг илтгэгч: a^(−m/n) = 1 / a^(m/n).", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 125^(2/3)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 16^(−3/4)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x^(1/2) · x^(1/3)-ийг язгуураар бич", "**3. Түгээмэл алдаа:** 8^(2/3)-ийг 8 · 2/3 гэж үржүүлэх (зөв нь (∛8)² = 4); a^(−1/2)-ийг −√a гэж бичих (зөв нь 1/√a).", "**4. Шалгах цэг (3 мин):** 1) 27^(2/3); 2) 6^(3/2) · 6^(5/2). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["V. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Морин хуурын ая»: Октавын 12 хагас аяны хагас ая бүрт давтамж 2^(1/12) дахин өсдөг. «Ла» нот 440 Гц. 4, 6, 12 хагас аяны дараах давтамжийг 440 · 2^(k/12) хэлбэрээр бичиж, илтгэгчийг хялбарчлаад, тооны машинаар 0,1 Гц хүртэл тооцоолж хүснэгт хийнэ. «6 + 6 хагас ая нь яагаад 2 дахин өсөлт болдог вэ?» гэдгийг зэргийн чанараар тайлбарлана. Нэмэлт: морин хуурын 2 утасны давтамжийн харьцаа 2^(5/12)-ийг тооцоолж 4/3-тай харьцуулна.", "**Бүтээгдэхүүн:** Хүснэгт ба зэргийн чанарын тайлбар бүхий багийн хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["VIII. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "4": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Маш их, маш бага тоог стандарт дүрсээр бичиж, тэдгээр дээр үйлдэл гүйцэтгэх, шинжлэх ухаан ба технологийн тооцоонд хэрэглэх.", "crit": ["Би 0,00045 зэрэг тоог стандарт дүрсээр бичиж чадна.", "Би стандарт дүрсээр бичсэн тоог үржүүлж, хувааж, хариуг зөв хэлбэрт оруулж чадна.", "Би бодит бодлогыг стандарт дүрсээр бодож, хариуг тайлбарлаж чадна."], "words": "стандарт дүрс — a·10ⁿ (1 ≤ a < 10); таслал шилжүүлэх; их тоо — n эерэг; бага тоо — n сөрөг.", "ex": [["4 280 000-ыг стандарт дүрсээр бич", "4,28·10⁶"], ["0,00071-ийг стандарт дүрсээр бич", "7,1·10⁻⁴"], ["(8·10⁵) · (5·10⁻²)", "40·10³ = 4·10⁴"]], "ck": [["0,0032-ыг стандарт дүрсээр бич", "3,2·10⁻³"], ["(6·10⁸) : (3·10⁻²)", "2·10¹⁰"]], "ws": [["Сэргээх", ["5,6 · 100", "0,3 : 1000"]], ["Дадлага 1", ["52 000-ыг стандарт дүрсээр бич", "0,0009-ийг стандарт дүрсээр бич"]], ["Дадлага 2", ["(2,5·10⁻³) · (4·10⁷)", "(9·10⁴) : (3·10⁻²)"]], ["★ Сорилт", ["7·10³ + 5·10²", "(6·10⁴)(5·10³) = 30·10⁷ гэсэн хариу стандарт дүрс мөн үү? Зас."]], ["Хэрэглээ (бүх бүлэг)", ["Нэг зураг ≈ 3·10⁶ байт. 6,4·10¹⁰ байтын санах ойд хэдэн зураг багтах вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "3 700 000-ыг стандарт дүрсээр бич", "0,00058-ыг стандарт дүрсээр бич", "(1,2·10⁵) · (3·10⁻²)", "(4,8·10⁶) : (1,2·10⁹)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>6</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧-ыг стандарт хэлбэрээр бич __(Олонлог 10, Дасгал 1 №2)__"], "quiz": ["0,00045-ыг стандарт дүрсээр бич", "(5·10⁶) · (4·10⁻⁹)", "Нэг бактерийн масс 2·10⁻¹² г. 1 г-д хэдэн бактери байх вэ?"], "key": [["III. Суурь сэргээх", ["1) 32", "2) 5", "3) 10⁻²"]], ["Жишээ 1–3", ["Жишээ 1: 4,28·10⁶", "Жишээ 2: 7,1·10⁻⁴", "Жишээ 3: 40·10³ = 4·10⁴"]], ["Шалгах цэг", ["1) 3,2·10⁻³", "2) 2·10¹⁰"]], ["I. Ажлын хуудас", ["№1: 560", "№2: 0,0003", "№3: 5,2·10⁴", "№4: 9·10⁻⁴", "№5: 10·10⁴ = 1·10⁵", "№6: 3·10⁶", "№7: 7·10³ + 0,5·10³ = 7,5·10³", "№8: Үгүй (30 ≥ 10): 3·10⁸", "№9: 6,4·10¹⁰ : (3·10⁶) ≈ 2,1·10⁴ ≈ 21 000 зураг"]], ["Багийн даалгавар", ["Сар: 3,84·10⁵ : (3·10⁵) = 1,28 с.", "Нар: 1,5·10⁸ : (3·10⁵) = 0,5·10³ = 5·10² с = 500 с ≈ 8,3 мин.", "Харьцаа: 1,5·10⁸ : (3,84·10⁵) ≈ 0,39·10³ = 3,9·10² ≈ 390 дахин.", "Тойрог зам: 3,5·10² : (3·10⁵) ≈ 1,17·10⁻³ с."]], ["II. Гэрийн даалгавар", ["№1: 3,7·10⁶", "№2: 5,8·10⁻⁴", "№3: 3,6·10³", "№4: 4·10⁻³", "№5: 2·10⁵; 2·10³"]], ["III. Гарах тасалбар", ["№1: 4,5·10⁻⁴ (шалгуур 1)", "№2: 20·10⁻³ = 2·10⁻² (шалгуур 2)", "№3: 1 : (2·10⁻¹²) = 0,5·10¹² = 5·10¹¹ (шалгуур 3)"]]], "F": ["a\\cdot 10^{n},\\quad 1\\le a<10", "(a\\cdot 10^{m})(b\\cdot 10^{n})=ab\\cdot 10^{m+n}", "\\frac{6{,}4\\cdot 10^{10}}{3\\cdot 10^{6}}\\approx 2{,}1\\cdot 10^{4}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>n</mi></mrow></msup><mo>&#x0002C;</mo><mspace width=\"1em\" /><mn>1</mn><mo>&#x02264;</mo><mi>a</mi><mo>&#x0003C;</mo><mn>10</mn></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>m</mi></mrow></msup><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>b</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>n</mi></mrow></msup><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>a</mi><mi>b</mi><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mi>m</mi><mo>&#x0002B;</mo><mi>n</mi></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>6</mn><mrow><mo>&#x0002C;</mo></mrow><mn>4</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>10</mn></mrow></msup></mrow><mrow><mn>3</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>6</mn></mrow></msup></mrow></mfrac><mo>&#x02248;</mo><mn>2</mn><mrow><mo>&#x0002C;</mo></mrow><mn>1</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>4</mn></mrow></msup></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-4"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-4"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «стандарт хэлбэр» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L04.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>6</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>5</mn><mrow><mn>3</mn></mrow></msup></mrow></math>⟧-ыг стандарт хэлбэрээр бич", "2·10⁵; 2·10³", "Олонлог 10, Дасгал 1 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10</mn><mrow><mn>4</mn></mrow></msup><mo>&#x000B7;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><msup><mn>1</mn><mrow><mn>5</mn></mrow></msup></mrow></math>⟧", "0,1 = 1·10⁻¹", "Олонлог 10, Дасгал 1 №2"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mn>25</mn><mrow><mn>3</mn></mrow></msup><mo>&#x000B7;</mo><msup><mn>14</mn><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>49</mn><mo>&#x000B7;</mo><msup><mn>10</mn><mrow><mn>6</mn></mrow></msup></mrow></mfrac></mrow></math>⟧-ийг стандарт хэлбэрээр бич", "1/16 = 6,25·10⁻²", "Олонлог 10, Дасгал 1 №5"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Жижиг ч гэсэн үржигддэг»:** Өдөрт 10 минут цаг алдах нь жилд 10·365 ≈ 3,65·10³ минут буюу 60 гаруй цаг болдог. Жижиг зүйл 10ⁿ дахин томордог. Асуулт: «Би өдөр бүр 10 минутыг юунд зарцуулбал жилийн дараа том үр дүн гарах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 3,2 · 10; 2) 0,05 · 100; 3) 10³ · 10⁻⁵", "**Холбоос (1 мин):** 10-аар үржүүлэхэд таслал баруун тийш 1 орон, 10-д хуваахад зүүн тийш 1 орон шилждэг — стандарт дүрс үүн дээр тулгуурлана."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Нэг зураг ≈ 3·10⁶ байт, утасны санах ой 64 GB ≈ 6,4·10¹⁰ байт. Хэдэн зураг багтах вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** a·10ⁿ, 1 ≤ a < 10, n бүхэл. Таслалыг k орон зүүн тийш шилжүүлбэл n = k, баруун тийш шилжүүлбэл n = −k.", "   (a·10ᵐ)(b·10ⁿ) = ab·10ᵐ⁺ⁿ; (a·10ᵐ):(b·10ⁿ) = (a:b)·10ᵐ⁻ⁿ. ab ≥ 10 эсвэл a:b < 1 бол дахин стандарт дүрсэд оруулна. Нэмэхдээ эхлээд 10-ын зэргийг ижил болгоно.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 4 280 000-ыг стандарт дүрсээр бич", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 0,00071-ийг стандарт дүрсээр бич", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): (8·10⁵) · (5·10⁻²)", "**3. Түгээмэл алдаа:** 35·10⁴-ийг стандарт дүрс гэх (1 ≤ a < 10 биш; зөв нь 3,5·10⁵); 10⁻³ · 10⁻⁴ = 10¹² гэж илтгэгчийг үржүүлэх (зөв нь 10⁻⁷).", "**4. Шалгах цэг (3 мин):** 1) 0,0032-ыг стандарт дүрсээр бич; 2) (6·10⁸) : (3·10⁻²). Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Гэрлийн аялал»: Дэлхий–Сар 3,84·10⁵ км, Дэлхий–Нар 1,5·10⁸ км, гэрлийн хурд 3·10⁵ км/с. Гэрэл Сар ба Нараас Дэлхийд хүрэх хугацааг (секунд, минут) олж, Нар Сараас хэд дахин хол болохыг стандарт дүрсээр тооцоолно. Нэмэлт: Ж.Гүррагчаагийн нисэх үеийн тойрог замын өндөр ≈ 3,5·10² км бол радио долгион (гэрлийн хурдтай) энэ зайг хэдэн секундэд туулах вэ? Бүх алхмыг стандарт дүрсээр бичнэ.", "**Бүтээгдэхүүн:** Тооцоо ба 2 өгүүлбэр дүгнэлт бүхий хосын хуудас", "**Нэгж 1-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "5": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн гүйцэтгэлийн даалгавар", 16], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Бодит тоог натурал, бүхэл, рационал, иррационал тоонд ангилж, тооны шулуун дээр байршуулах, үйлдлийн чанараар тооцоог хялбарчлах.", "crit": ["Би тоог N, Z, Q, иррационал гэж зөв ангилж чадна.", "Би тараах чанараар хялбар тооцоолж, √30 зэрэг язгуурыг хоёр бүхэл тооны хооронд байршуулж чадна.", "Би тоонуудыг тооны шулуун дээр эрэмбэлж, үндэслэж чадна."], "words": "рационал — бутархайгаар бичигддэг; иррационал — үегүй, төгсгөлгүй бутархай (√2, π); тараах чанар — a(b + c) = ab + ac.", "ex": [["{−3; 0; 2/5; √9; √7; 0,(6); π}-ийг ангил", "N: √9; Z: −3, 0, √9; Q: −3, 0, 2/5, √9, 0,(6); иррационал: √7, π"], ["19·52 + 19·48", "19·(52 + 48) = 1900"], ["√35 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "25 < 35 < 36 тул 5 ба 6"]], "ck": [["53·70 + 53·30", "53·100 = 5300"], ["√95 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "81 < 95 < 100 тул 9 ба 10"]], "ws": [["Сэргээх", ["0,6-г энгийн бутархайгаар бич", "2/9-ийг аравтын бутархайгаар бич"]], ["Дадлага 1", ["√49 ба √50-ийн аль нь иррационал вэ?", "25·4·7-г хялбар аргаар бод"]], ["Дадлага 2", ["0,(4)-ийг энгийн бутархайгаар бич", "(√8 + √2)(√8 − √2)"]], ["★ Сорилт", ["√2 + (−√2) = 0. Хоёр иррационал тооны нийлбэр үргэлж иррационал байх уу? Тайлбарла.", "3 ба 4-ийн хооронд орших 2 иррационал тоо бич"]], ["Хэрэглээ", ["Квадрат талбайн талбай 2 м². Талын уртыг 0,01 нарийвчлалтай ол (1,41² ба 1,42²-ийг харьцуул)."]], ["Код унших (сонголттой)", ["Код уншаад гаралтыг таамагла:", "cout << (0.1 + 0.2 == 0.3);"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "√25; −7; √3; 1,5 тоог ангил", "0,(7)-г энгийн бутархайгаар бич", "37·45 + 63·45", "√60 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x02212;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x0002B;</mo><mn>3</mn><mo stretchy=\"false\">&#x00029;</mo></mrow></math>⟧ __(Олонлог 10, Дасгал 3 №3)__"], "quiz": ["0,(3) рационал уу? Энгийн бутархайгаар бич.", "48·25 + 52·25", "−√3; 1,7; 7/4-ийг өсөхөөр эрэмбэл"], "key": [["III. Суурь сэргээх", ["1) 3/4", "2) 0,333… = 0,(3)", "3) 4"]], ["Жишээ 1–3", ["Жишээ 1: N: √9; Z: −3, 0, √9; Q: −3, 0, 2/5, √9, 0,(6); иррационал: √7, π", "Жишээ 2: 19·(52 + 48) = 1900", "Жишээ 3: 25 < 35 < 36 тул 5 ба 6"]], ["Шалгах цэг", ["1) 53·100 = 5300", "2) 81 < 95 < 100 тул 9 ба 10"]], ["I. Ажлын хуудас", ["№1: 3/5", "№2: 0,(2)", "№3: √50 (√49 = 7)", "№4: (25·4)·7 = 700", "№5: 4/9", "№6: 8 − 2 = 6", "№7: Үгүй: нийлбэр 0 нь рационал", "№8: Жишээ нь √10, √15 эсвэл π", "№9: 1,41² = 1,9881 < 2 < 2,0164 = 1,42² тул ≈ 1,41 м", "№10: 0 (худал): 0,1 ба 0,2 хоёртын системд яг бичигдэхгүй"]], ["Багийн даалгавар", ["Эрэмбэ: −√5 (≈ −2,24) < −1,5 < −2/3 < 0,(3) < √2 (≈ 1,41) < 7/3 (≈ 2,33) < π (≈ 3,14) < √16 = 4.", "N ба Z: √16; Q: −1,5; −2/3; 0,(3); 7/3; √16; иррационал: −√5, √2, π.", "Үндэслэл: 1,4² = 1,96 < 2 < 2,25 = 1,5²; 2,2² = 4,84 < 5 < 5,29 = 2,3²."]], ["II. Гэрийн даалгавар", ["№1: √25 = 5 натурал; −7 бүхэл; √3 иррационал; 1,5 рационал", "№2: 7/9", "№3: 45·100 = 4500", "№4: 49 < 60 < 64 тул 7 ба 8", "№5: x − 9"]], ["III. Гарах тасалбар", ["№1: Тийм, 1/3 (шалгуур 1)", "№2: 25·100 = 2500 (шалгуур 2)", "№3: −√3 < 1,7 < 7/4 (√3 ≈ 1,73) (шалгуур 3)"]]], "F": ["\\mathbb{N}\\subset\\mathbb{Z}\\subset\\mathbb{Q}\\subset\\mathbb{R}", "a(b+c)=ab+ac", "|a|\\cdot|b|=|ab|"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x02115;</mi><mo>&#x02282;</mo><mi>&#x02124;</mi><mo>&#x02282;</mo><mi>&#x0211A;</mi><mo>&#x02282;</mo><mi>&#x0211D;</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo stretchy=\"false\">&#x00028;</mo><mi>b</mi><mo>&#x0002B;</mo><mi>c</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003D;</mo><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><mi>a</mi><mi>c</mi></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;</mo><mi>a</mi><mo stretchy=\"false\">&#x0007C;</mo><mo>&#x рийн цор ганц байртай; нэг ч тоо илүүц биш. Багт ч хүн бүр өөр давуу талтай. Асуулт: «Багийн гишүүн бүрийн давуу тал юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 0,75-ыг энгийн бутархайгаар бич; 2) 1/3-ийг аравтын бутархайгаар бич; 3) √16", "**Холбоос (1 мин):** Бүх тоог бутархайгаар бичиж болох уу? Өнөөдөр бүх тооны «гэр бүл»-ийг ангилна."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Талбай нь 2 м² квадратын тал √2 м. Үүнийг бутархайгаар яг бичиж болох уу? π-г 3,14 гэж бичихэд яагаад «ойролцоо» гэдэг вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** N ⊂ Z ⊂ Q ⊂ R. Рационал тоо m/n нь төгсгөлөг эсвэл үет бутархай; иррационал (√2, √7, π) нь төгсгөлгүй, үегүй бутархай.", "   Чанар: a + b = b + a, ab = ba; (a + b) + c = a + (b + c); тараах: a(b + c) = ab + ac. Язгуурыг үнэлэх: 5² = 25 < 35 < 36 = 6² тул 5 < √35 < 6.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): {−3; 0; 2/5; √9; √7; 0,(6); π}-ийг ангил", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): 19·52 + 19·48", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): √35 аль хоёр дараалсан бүхэл тооны хооронд вэ?", "**3. Түгээмэл алдаа:** Бүх язгуурыг иррационал гэх (√9 = 3 рационал); 0,(3)-ийг иррационал гэх (= 1/3 рационал).", "**4. Шалгах цэг (3 мин):** 1) 53·70 + 53·30; 2) √95 аль хоёр дараалсан бүхэл тооны хооронд вэ?. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн гүйцэтгэлийн даалгавар", ["**Багийн гүйцэтгэлийн даалгавар:** «Тооны шулуун»: Баг бүрт 8 карт: −1,5; √2; 7/3; −√5; π; 0,(3); √16; −2/3. Тоо бүрийг ангилж (N, Z, Q, иррационал), А3 хуудсан дээрх тооны шулуунд өсөхөөр наана. √2 ба −√5-ийн байрлалыг квадратаар харьцуулж үндэслэнэ (жишээ: 1,4² = 1,96 < 2 < 2,25 = 1,5²).", "**Бүтээгдэхүүн:** Тооны шулуун ба ангиллын хүснэгт бүхий А3 хуудас", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Танилцуулга, үе тэнгийн үнэлгээ, сайжруулалт", ["• Багууд дараагийн багийн ажлыг шалгуураар үнэлж, «2 од, 1 хүсэл» наалт бичнэ.", "• Саналын дагуу ажлаа засна. Багш оноог (0–3) тэмдэглэнэ."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Цахим гарах тасалбар (4 мин):** Microsoft Forms (Teams)-оор 3 асуулт, дүн автоматаар гарна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "6": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хураангуй үржүүлэхийн томьёо ба зэргийн чанарыг рационал илтгэгчтэй алгебрын илэрхийлэлд хэрэглэж хялбарчлах, алгебрын бутархайг хураах.", "crit": ["Би (x^(1/2) − 1)(x^(1/2) + 1) зэрэг илэрхийллийг томьёогоор хялбарчилж чадна.", "Би (x² − 9)/(x² + 3x) зэрэг бутархайг хураагаад нөхцөлийг бичиж чадна.", "Би талбайн өөрчлөлтийг илэрхийллээр загварчилж, алдааг илрүүлж чадна."], "words": "төстэй гишүүн — үсэг, зэрэг нь ижил; хураах — ерөнхий үржигдэхүүнд хуваах; нөхцөл — хуваарь ≠ 0.", "ex": [["(x − 3)²", "x² − 6x + 9"], ["(3x^(1/3) − 2)²", "9x^(2/3) − 12x^(1/3) + 4"], ["(x² − 9)/(x² + 3x)-ийг хураа", "(x − 3)(x + 3)/(x(x + 3)) = (x − 3)/x; x ≠ 0, x ≠ −3"]], "ck": [["(√a − √b)(√a + √b)", "a − b"], ["(x² − 4x)/(x² − 16)-г хураа", "x(x − 4)/((x − 4)(x + 4)) = x/(x + 4); x ≠ ±4"]], "ws": [["Сэргээх", ["(x + 2)(x + 5)", "3x² − 5x + x² + 2x"]], ["Дадлага 1", ["(x + 4)²", "(2x − 1)(2x + 1)"]], ["Дадлага 2", ["(x^(1/2) + 3)(x^(1/2) − 3)", "(x² − 25)/(x² − 5x)-ийг хураа"]], ["★ Сорилт", ["(a^(1/2) + b^(1/2))² − 2(ab)^(1/2)", "Алдааг ол: (x² + 9)/(x + 3) = x + 3"]], ["Хэрэглээ", ["Квадрат хашааны тал x м. Нэг талыг 3 м уртасгаж, нөгөөг 3 м богиносговол талбай хэрхэн өөрчлөгдөх вэ?"]], ["Код унших (сонголттой)", ["Excel: A1 = 3, B1-д =(A1+5)^2-(A1-5)^2, C1-д =20*A1. B1, C1-д юу гарах вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "(x − 5)²", "(3a + 2)(3a − 2)", "(m^(1/2) − 1)(m^(1/2) + 1)", "(y + 6)/(y² − 36)-г хураа", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>6</mn></mrow><mrow><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>36</mn></mrow></mfrac></mrow></math>⟧-г хураа __(Олонлог 10, Дасгал 4 №3)__"], "quiz": ["(x − 7)(x + 7)", "(x² − 6x)/(x² − 36)-г хураа", "(x + 5)² = x² + 25 гэсэн бодолтод ямар алдаа байна вэ?"], "key": [["III. Суурь сэргээх", ["1) x² + x − 6", "2) 2x² − 8x", "3) x⁷"]], ["Жишээ 1–3", ["Жишээ 1: x² − 6x + 9", "Жишээ 2: 9x^(2/3) − 12x^(1/3) + 4", "Жишээ 3: (x − 3)(x + 3)/(x(x + 3)) = (x − 3)/x; x ≠ 0, x ≠ −3"]], ["Шалгах цэг", ["1) a − b", "2) x(x − 4)/((x − 4)(x + 4)) = x/(x + 4); x ≠ ±4"]], ["I. Ажлын хуудас", ["№1: x² + 7x + 10", "№2: 4x² − 3x", "№3: x² + 8x + 16", "№4: 4x² − 1", "№5: x − 9", "№6: (x + 5)/x; x ≠ 0, x ≠ 5", "№7: a + 2(ab)^(1/2) + b − 2(ab)^(1/2) = a + b", "№8: x² + 9 задрахгүй тул хураахгүй; (x + 3)² = x² + 6x + 9 ≠ x² + 9", "№9: (x + 3)(x − 3) = x² − 9: 9 м²-аар багасна", "№10: 60 ба 60 — (x + 5)² − (x − 5)² = 20x"]], ["Багийн даалгавар", ["S₁ − S₂ = (x² + 10x + 25) − (x² − 10x + 25) = 20x.", "x = 20: 625 − 225 = 400; томьёогоор 20·20 = 400.", "Хялбарчилсан томьёо цөөн үйлдэлтэй тул хурдан, алдаа бага."]], ["II. Гэрийн даалгавар", ["№1: x² − 10x + 25", "№2: 9a² − 4", "№3: m − 1", "№4: 1/(y − 6); y ≠ ±6", "№5: x + 5; 1/(y − 6)"]], ["III. Гарах тасалбар", ["№1: x² − 49 (шалгуур 1)", "№2: x/(x + 6); x ≠ ±6 (шалгуур 2)", "№3: Дунд гишүүн 10x орхигдсон: x² + 10x + 25 (шалгуур 3)"]]], "F": ["(a\\pm b)^{2}=a^{2}\\pm 2ab+b^{2}", "\\frac{x^{2}-9}{x+3}=x-3,\\quad x\\ne -3"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>&#x000B1;</mi><mi>b</mi><msup><mo stretchy=\"false\">&#x00029;</mo><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mi>&#x000B1;</mi><mn>2</mn><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>9</mn></mrow><mrow><mi>x</mi><mo>&#x0002B;</mo><mn>3</mn></mrow></mfrac><mo>&#x0003D;</mo><mi>x</mi><mo>&#x02212;</mo><mn>3</mn><mo>&#x0002C;</mo><mspace width=\"1em\" /><mi>x</mi><mo>&#x02260;</mo><mo>&#x02212;</mo><mn>3</mn></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-6"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-6"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «алгебрын илэрхийлэл» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L06.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><mi>x</mi><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>y</mi><mo>&#x0002B;</mo><mn>6</mn></mrow><mrow><msup><mi>y</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>36</mn></mrow></mfrac></mrow></math>⟧-г хураа", "x + 5; 1/(y − 6)", "Олонлог 10, Дасгал 4 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x</mi><mo>&#x02212;</mo><mn>25</mn></mrow><mrow><msqrt><mrow><mi>x</mi></mrow></msqrt><mo>&#x02212;</mo><mn>5</mn></mrow></mfrac></mrow></math>⟧-г хураа", "√x + 5", "Олонлог 10, Дасгал 4 №3"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>28</mn><msup><mi>x</mi><mrow><mn>3</mn></mrow></msup><msup><mi>y</mi><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>14</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><msup><mi>y</mi><mrow><mn>3</mn></mrow></msup></mrow></mfrac></mrow></math>⟧-г хураа", "2x", "Олонлог 10, Дасгал 4 №7"]], "tb": [], "digital": false, "stype": "A", "mode": "хос", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Төстэй ба ялгаатай»:** Зөвхөн төстэй гишүүдийг нэгтгэж болдог: x² ба x-ийг нэмэхгүй. Харин хүмүүс ялгаатай ч нэг зорилгоор хамтарч чаддаг. Асуулт: «Надаас өөр давуу талтай хүнтэй хамтрахын ашиг юу вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) (x + 3)(x − 2); 2) 2x(x − 4); 3) x³ · x⁴", "**Холбоос (1 мин):** 8 дугаар ангид үзсэн хураангуй үржүүлэхийн томьёог (Олонлог 8, х. 2) сэргээж, рационал илтгэгчтэй илэрхийлэлд хэрэглэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** Квадрат хашааны тал x м. Нэг талыг 3 м уртасгаж, нөгөөг 3 м богиносговол талбай нь өөрчлөгдөх үү? (x + 3)(x − 3) = ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** (a ± b)² = a² ± 2ab + b²; (a − b)(a + b) = a² − b². a, b нь x^(1/2), x^(1/3) зэрэг байж болно: (x^(1/2) − 1)(x^(1/2) + 1) = x − 1.", "   Бутархай хураах: хүртвэр, хуваарийг үржигдэхүүнд задлаад ерөнхий үржигдэхүүнээр хуваана; хуваарь ≠ 0 нөхцөлийг бичнэ.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): (x − 3)²", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (3x^(1/3) − 2)²", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): (x² − 9)/(x² + 3x)-ийг хураа", "**3. Түгээмэл алдаа:** (a + b)² = a² + b² гэж бичих (2ab орхигдоно); x⁻¹ ба x-ийг төстэй гишүүн гэж нэмэх; (x + 3)/3 = x гэж нэмэгдэхүүнийг хураах.", "**4. Шалгах цэг (3 мин):** 1) (√a − √b)(√a + √b); 2) (x² − 4x)/(x² − 16)-г хураа. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Хосын гүйцэтгэлийн даалгавар", ["**Хосын гүйцэтгэлийн даалгавар:** «Хашааны талбай»: Хоёр квадрат хашааны талбай S₁ = (x + 5)² ба S₂ = (x − 5)². 1) S₁ − S₂-ийг хялбарчил. 2) x = 20 м үед ялгаврыг хоёр аргаар (шууд орлуулж ба хялбарчилсан томьёогоор) тооцоолж харьцуул. 3) Аль арга хурдан, яагаад вэ?", "**Бүтээгдэхүүн:** Хоёр аргын тооцоо ба дүгнэлт бүхий хосын хуудас", "**Нэгж 2-ийн гүйцэтгэлийн даалгавар:** энэ ажил нэгжийн дүгнэх нотолгоо болно — шалгуураар (0–3) оноог бүртгэж, дуусаагүй хэсгийг гэрт гүйцээлгэнэ.", "• Хос дотроо нэг нь бодож, нөгөө нь алхам бүрийг шалгаад, дараагийн бодлогод үүргээ солино.", "• Багш хосуудыг тойрч «Яагаад ийм алхам хийсэн бэ?» гэж асууна."]], ["VIII. Хос солилцож шалгах, сайжруулах", ["• Хоёр хос ажлаа солилцож, шалгуураар шалгаад «2 од, 1 хүсэл» бичнэ.", "• Хосууд санал авч ажлаа засна; багш 2–3 ажлыг самбарт харуулж, сайн шийдлийг онцолно."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "7": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Багийн уралдаан", 16], ["VIII. Дүн гаргах, алдааг задлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Алгебрын илэрхийллийг ерөнхий үржигдэхүүн гаргах, бүлэглэх, томьёо, x₁, x₂-ээр задлах 4 аргаар үржигдэхүүнд задалж, тэгшитгэл бодох, тооцоо хялбарчлахад хэрэглэх.", "crit": ["Би x² − 81, x³ − 8 зэргийг томьёогоор задалж чадна.", "Би x² + 2x − 8, xy + 2x + 3y + 6 зэргийг задалж, буцааж үржүүлж шалгаж чадна.", "Би x² + 16 яагаад задрахгүйг тайлбарлаж, задаргааг тэгшитгэлд хэрэглэж чадна."], "words": "үржигдэхүүнд задлах — үржвэр хэлбэрт бичих; ерөнхий үржигдэхүүн; бүлэглэх; бүрэн задлах.", "ex": [["3x² − 12", "3(x² − 4) = 3(x − 2)(x + 2)"], ["x³ − 2x² + 5x − 10 (бүлэглэ)", "x²(x − 2) + 5(x − 2) = (x − 2)(x² + 5)"], ["x² − 2x − 15", "(x − 5)(x + 3)"]], "ck": [["x³ − 8", "(x − 2)(x² + 2x + 4)"], ["ab − 3a + 2b − 6", "a(b − 3) + 2(b − 3) = (b − 3)(a + 2)"]], "ws": [["Сэргээх", ["ХИЕХ(15; 25)", "(x − 4)(x + 4)"]], ["Дадлага 1", ["10x + 14", "x² − 36"]], ["Дадлага 2", ["x² − 8x + 12", "xy + 2x + 3y + 6 (бүлэглэ)"]], ["★ Сорилт", ["2x³ − 50x", "99² − 1-ийг задлалаар толгойгоор бод"]], ["Хэрэглээ", ["x² − 49 = 0 тэгшитгэлийг задлалаар бод"]], ["Код унших (сонголттой)", ["Гаралт:", "int n = 84;", "for (int d = 2; n > 1; d++) while (n % d == 0) { cout << d << \" \"; n /= d; }"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "13a² − 26a", "x² − 9x + 20", "8x³ − 1", "2ax − 6a + bx − 3b", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>26</mn><mi>a</mi></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>15</mn><mi>x</mi></mrow></math>⟧-ийг задал __(Олонлог 10, Дасгал 4 №4)__"], "quiz": ["x² − 81", "x² + 2x − 8", "x² + 16 = (x + 4)(x − 4) гэсэн задаргаа зөв үү? Тайлбарла."], "key": [["III. Суурь сэргээх", ["1) 2²·3·7", "2) 6", "3) x² − 3x − 10"]], ["Жишээ 1–3", ["Жишээ 1: 3(x² − 4) = 3(x − 2)(x + 2)", "Жишээ 2: x²(x − 2) + 5(x − 2) = (x − 2)(x² + 5)", "Жишээ 3: (x − 5)(x + 3)"]], ["Шалгах цэг", ["1) (x − 2)(x² + 2x + 4)", "2) a(b − 3) + 2(b − 3) = (b − 3)(a + 2)"]], ["I. Ажлын хуудас", ["№1: 5", "№2: x² − 16", "№3: 2(5x + 7)", "№4: (x − 6)(x + 6)", "№5: (x − 6)(x − 2)", "№6: x(y + 2) + 3(y + 2) = (y + 2)(x + 3)", "№7: 2x(x² − 25) = 2x(x − 5)(x + 5)", "№8: (99 − 1)(99 + 1) = 98·100 = 9800", "№9: (x − 7)(x + 7) = 0 → x = ±7", "№10: 2 2 3 7 (84 = 2²·3·7)"]], ["Багийн даалгавар", ["(x − 8)(x + 8); 5x(x + 2); (x + 4)².", "(x − 4)(x + 3); 2(x − 3)(x + 3); (y + 3)(y² − 3y + 9).", "(x + 3)(x − 2)(x + 2); (a² + 4)(a − 2)(a + 2); (x − 3 − y)(x − 3 + y)."]], ["II. Гэрийн даалгавар", ["№1: 13a(a − 2)", "№2: (x − 4)(x − 5)", "№3: (2x − 1)(4x² + 2x + 1)", "№4: 2a(x − 3) + b(x − 3) = (x − 3)(2a + b)", "№5: 13a(a − 2); 5x(x − 3)"]], ["III. Гарах тасалбар", ["№1: (x − 9)(x + 9) (шалгуур 1)", "№2: (x + 4)(x − 2) (шалгуур 2)", "№3: Буруу: (x + 4)(x − 4) = x² − 16; x² + 16 бодит тоонд задрахгүй (шалгуур 3)"]]], "F": ["a^{2}-b^{2}=(a-b)(a+b)", "x^{2}+(p+q)x+pq=(x+p)(x+q)", "a^{3}\\pm b^{3}=(a\\pm b)(a^{2}\\mp ab+b^{2})"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x02212;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo>&#x0002B;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x0002B;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>p</mi><mo>&#x0002B;</mo><mi>q</mi><mo stretchy=\"false\">&#x00029;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>p</mi><mi>q</mi><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>p</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>x</mi><mo>&#x0002B;</mo><mi>q</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a</mi><mrow><mn>3</mn></mrow></msup><mi>&#x000B1;</mi><msup><mi>b</mi><mrow><mn>3</mn></mrow></msup><mo>&#x0003D;</mo><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>&#x000B1;</mi><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo><mo stretchy=\"false\">&#x00028;</mo><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02213;</mo><mi>a</mi><mi>b</mi><mo>&#x0002B;</mo><msup><mi>b</mi><mrow><mn>2</mn></mrow></msup><mo stretchy=\"false\">&#x00029;</mo></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-7"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-7"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «үржигдэхүүнд задлах» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L07.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>26</mn><mi>a</mi></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>15</mn><mi>x</mi></mrow></math>⟧-ийг задал", "13a(a − 2); 5x(x − 3)", "Олонлог 10, Дасгал 4 №4"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mo>&#x02212;</mo><mn>4</mn></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>14</mn><mo>&#x02212;</mo><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup></mrow></math>⟧-ийг задал", "(x − 2)(x + 2); (√14 − x)(√14 + x)", "Олонлог 10, Дасгал 4 №6"]], "tb": [], "digital": false, "stype": "A", "mode": "уралдаан", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Том ажлыг задлах»:** Олон гишүүнтийг үржигдэхүүнд задлахад хэцүү илэрхийлэл энгийн хэсгүүдэд хуваагддаг. Том ажил ч жижиг алхамд задрахаар амархан болдог. Асуулт: «Миний хийх нэг том ажлыг ямар 3 алхамд задлах вэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 84-ийг анхны үржигдэхүүнд задал; 2) ХИЕХ(12; 18); 3) (x + 2)(x − 5)", "**Холбоос (1 мин):** Тоог анхны үржигдэхүүнд задалдаг (6 дугаар анги) шиг олон гишүүнтийг үржигдэхүүнд задална; ХИЕХ нь ерөнхий үржигдэхүүн гаргахтай ижил санаа."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** x² − 49 = 0 тэгшитгэлийг томьёогүйгээр хэрхэн хурдан бодох вэ? Үржвэр 0 бол юу гэсэн үг вэ?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** Задлах 4 арга: 1) ерөнхий үржигдэхүүн: 6x² − 9x = 3x(2x − 3); 2) бүлэглэх: ax + ay + bx + by = (a + b)(x + y); 3) томьёо: a² − b², a² ± 2ab + b², a³ ± b³ = (a ± b)(a² ∓ ab + b²); 4) x² + px + q = (x − x₁)(x − x₂), x₁ + x₂ = −p, x₁x₂ = q.", "   Дараалал: эхлээд ерөнхий үржигдэхүүн → томьёо эсвэл бүлэглэх → буцааж үржүүлж шалгах.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): 3x² − 12", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): x³ − 2x² + 5x − 10 (бүлэглэ)", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): x² − 2x − 15", "**3. Түгээмэл алдаа:** x² + 9 = (x + 3)(x − 3) гэж задлах (бодит тоонд задрахгүй); 3x + 3 = 3x гэж 1-ийг орхих (зөв нь 3(x + 1)).", "**4. Шалгах цэг (3 мин):** 1) x³ − 8; 2) ab − 3a + 2b − 6. Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Багийн уралдаан", ["**Багийн уралдаан:** «Задаргааны уралдаан»: 3 шатлалт 9 карт. 1 оноо: x² − 64; 5x² + 10x; x² + 8x + 16. 2 оноо: x² − x − 12; 2x² − 18; y³ + 27. 3 оноо: x³ + 3x² − 4x − 12; a⁴ − 16; x² − 6x + 9 − y². Баг карт сонгож задлаад, буцааж үржүүлж шалгасны дараа багшид өгнө. Зөв бол оноо авна; буруу бол засаж дахин өгнө (засвар хагас оноо). 12 минутад хамгийн их оноо цуглуулна.", "**Бүтээгдэхүүн:** Задаргаа ба шалгалтын үржвэр бичсэн картууд, онооны самбар", "• Багш «Яаж мэдсэн бэ?» гэж асууна, хариуг хэлж өгөхгүй. Санамсаргүй нэг гишүүнээр тайлбарлуулна."]], ["VIII. Дүн гаргах, алдааг задлах", ["• Багуудын онооны самбарыг нэгтгэж, хамгийн олон алдсан даалгаврыг ангиар задлан шинжилнэ.", "• Баг бүр алдсан нэг даалгавраа засаж, засварын оноо авна (сайжруулалтыг урамшуулна)."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "8": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Бие даасан гүйцэтгэлийн даалгавар", 16], ["VIII. Өөрийгөө шалгах, засварлах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Энгийн бутархайн үйлдлийн дүрмийг алгебрын бутархайд өргөтгөж, задлах → нөхцөл бичих → хураах → үржүүлэх алгоритмаар үржүүлэх, хуваах үйлдэл гүйцэтгэх.", "crit": ["Би алгебрын бутархайг задалж хураагаад үржүүлж, хувааж чадна.", "Би хариундаа хуваарь ≠ 0 нөхцөлийг бичиж чадна.", "Би хугацааны харьцааг бутархайгаар илэрхийлж, утгыг тайлбарлаж чадна."], "words": "алгебрын бутархай; эргүүлэх (урвуу бутархай); хураах; нөхцөл (x ≠ …).", "ex": [["(x² − 4)/(x + 6) · (x + 6)/(x − 2)", "x + 2; x ≠ −6, x ≠ 2"], ["(x² − 9)/x : (x + 3)/x²", "(x − 3)(x + 3)/x · x²/(x + 3) = x(x − 3); x ≠ 0, x ≠ −3"], ["5x²y / (25xy²)", "x/(5y); x ≠ 0, y ≠ 0"]], "ck": [["(x² − 25)/(3x) · 6x²/(x + 5)", "2x(x − 5); x ≠ 0, x ≠ −5"], ["(a² − ab)/b : (a − b)/b²", "a(a − b)/b · b²/(a − b) = ab; a ≠ b, b ≠ 0"]], "ws": [["Сэргээх", ["3/4 · 8/9", "7/10 : 14/5"]], ["Дадлага 1", ["6x/(5y) · 10y²/(3x²)", "(x − 5)/(x + 1) · (x + 1)/(x − 5)"]], ["Дадлага 2", ["(x² − 16)/(x + 2) · (x + 2)/(x − 4)", "(x² − 49)/x : (x + 7)/x²"]], ["★ Сорилт", ["(x² + 5x + 6)/(x² − 9) · (x − 3)/(x + 2)", "Алдааг ол: (x + 6)/6 = x"]], ["Хэрэглээ", ["(x² − 4)/(x + 2)-ийг хялбарчилж, x = 100 үед утгыг толгойгоор ол"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "4a/(9b) · 3b²/(2a²)", "(x² − 1)/(x + 3) · (x + 3)/(x − 1)", "(y² − 36)/y : (y − 6)/y³", "28x³y³ / (14x²y³)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x0002B;</mo><mn>1</mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow></mrow></math>⟧ __(Олонлог 10, Дасгал 4 №1)__"], "quiz": ["(x² − 36)/x : (x + 6)/x²", "6x²y / (36xy²)-г хураагаад нөхцөлийг бич", "Хоёр хотын зай 300 км. v ба 2v хурдтай явахад зарцуулах хугацааны харьцаа хэд вэ?"], "key": [["III. Суурь сэргээх", ["1) 3/2", "2) 5/6 · 3/10 = 1/4", "3) (x − 3)(x + 3)"]], ["Жишээ 1–3", ["Жишээ 1: x + 2; x ≠ −6, x ≠ 2", "Жишээ 2: (x − 3)(x + 3)/x · x²/(x + 3) = x(x − 3); x ≠ 0, x ≠ −3", "Жишээ 3: x/(5y); x ≠ 0, y ≠ 0"]], ["Шалгах цэг", ["1) 2x(x − 5); x ≠ 0, x ≠ −5", "2) a(a − b)/b · b²/(a − b) = ab; a ≠ b, b ≠ 0"]], ["I. Ажлын хуудас", ["№1: 2/3", "№2: 1/4", "№3: 4y/x", "№4: 1; x ≠ −1, x ≠ 5", "№5: x + 4; x ≠ −2, x ≠ 4", "№6: x(x − 7); x ≠ 0, x ≠ −7", "№7: (x + 2)(x + 3)/((x − 3)(x + 3)) · (x − 3)/(x + 2) = 1; x ≠ ±3, x ≠ −2", "№8: Нэмэгдэхүүн 6-г хураахгүй: (x + 6)/6 = x/6 + 1", "№9: x − 2 = 98 (x ≠ −2)"]], ["Багийн даалгавар", ["t₁ = 430/v, t₂ = 430/(v + 20); t₁ : t₂ = 430/v · (v + 20)/430 = (v + 20)/v.", "v = 60: 80/60 = 4/3 ≈ 1,33.", "Автобус машинаас 1,33 дахин удаан явна."]], ["II. Гэрийн даалгавар", ["№1: 2b/(3a)", "№2: x + 1; x ≠ −3, x ≠ 1", "№3: y²(y + 6); y ≠ 0, y ≠ 6", "№4: 2x; x ≠ 0, y ≠ 0", "№5: x − 1"]], ["III. Гарах тасалбар", ["№1: x(x − 6); x ≠ 0, x ≠ −6 (шалгуур 1)", "№2: x/(6y); x ≠ 0, y ≠ 0 (шалгуур 2)", "№3: (300/v) : (300/(2v)) = 2 (шалгуур 3)"]]], "F": ["\\frac{a}{b}\\cdot\\frac{c}{d}=\\frac{ac}{bd}", "\\frac{a}{b}:\\frac{c}{d}=\\frac{a}{b}\\cdot\\frac{d}{c}"], "FM": ["<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mo>&#x000B7;</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mi>d</mi></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>a</mi><mi>c</mi></mrow><mrow><mi>b</mi><mi>d</mi></mrow></mfrac></mrow></math>", "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mi>:</mi><mfrac><mrow><mi>c</mi></mrow><mrow><mi>d</mi></mrow></mfrac><mo>&#x0003D;</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mo>&#x000B7;</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>c</mi></mrow></mfrac></mrow></math>"], "links": [["Цахим хичээл (видео, дадлага)", "https://pagamdulam.github.io/math10/#lesson-8"], ["Заах горим (проектор)", "https://pagamdulam.github.io/math10/#teach-8"], ["Desmos", "https://www.desmos.com/calculator"], ["Mozaik: «алгебрын бутархай» гэж хайна", "https://us.mozaweb.com/mn/MediaLibrary/MICROCURRICULUM?main_topic_azon=MAT"]], "fig": "figs/L08.png", "ol": [["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x02212;</mo><mn>1</mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;</mo><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><mo>&#x0002B;</mo><mn>1</mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;</mo></mrow></mrow></math>⟧", "x − 1", "Олонлог 10, Дасгал 4 №1"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>5</mn><msup><mi>x</mi><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></msup></mrow><mrow><mn>15</mn><msup><mi>x</mi><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></mrow></mfrac></mrow></math>⟧", "x^(1/4)/3", "Олонлог 10, Дасгал 4 №5"], ["⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>25</mn><msup><mi>x</mi><mrow><mn>2</mn></mrow></msup><mi>y</mi><msup><mi>z</mi><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>125</mn><mi>x</mi><mi>y</mi><mi>z</mi></mrow></mfrac></mrow></math>⟧", "xz²/5", "Олонлог 10, Дасгал 4 №7"]], "tb": [], "digital": false, "stype": "A", "mode": "ганцаар", "teach": [["I. Зохион байгуулалт, баг", ["• Мэндэлж, ирц бүртгэнэ. Өнөөдрийн ажлын хэлбэрээр (баг, хос, ганцаар) суулгана."]], ["II. Ёс зүйн 1 минут", ["**«Эргүүлж харах»:** Бутархайд хуваахдаа хоёр дахь бутархайг эргүүлдэг. Санал зөрөхөд нөгөө хүний байр сууринаас «эргүүлж» харвал шийдэл олддог. Асуулт: «Сүүлд хэнтэй санал зөрөхөд түүний байр сууринаас харсан бэ?»"]], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", ["**Гэрийн даалгавар шалгах, алдаа засах (2 мин):** хосууд дэвтрээ солилцож самбарт (Teams-д) гаргасан хариугаар шалгана; багш 3–4 дэвтрийг түүвэрлэн харж, хамгийн олон алдсан бодлого эсвэл өмнөх тасалбарын нэг алдааг засуулна.", "**Өмнөх ангийн мэдлэг (4 мин):** 1) 2/3 · 9/4; 2) 5/6 : 10/3; 3) x² − 9-ийг задал", "**Холбоос (1 мин):** 6 дугаар ангийн энгийн бутархайн үржүүлэх, хуваах дүрэм алгебрын бутархайд яг хэвээр хэрэглэгдэнэ."]], ["IV. Асуудал дэвшүүлэх, зорилго", ["**Асуудал:** (x² − 4)/(x + 2) илэрхийллийн утгыг x = 100 үед толгойгоор бодож чадах уу?", "• 1 минут таамаглуулна; хичээлийн төгсгөлд эргэж шалгана.", "**Зорилго:** Амжилтын 3 шалгуурыг самбарт бичнэ."]], ["V. Шинэ мэдлэг (загварчлах)", ["**1. Гол санаа (самбарт):** (a/b)·(c/d) = ac/(bd); (a/b) : (c/d) = (a/b)·(d/c). Алгоритм: 1) бүгдийг үржигдэхүүнд задлах; 2) хуваарь ≠ 0 нөхцөл бичих (хуваахад хуваагч бутархайн хүртвэр ч ≠ 0); 3) хураах; 4) үржүүлэх.", "**2. Жишээ (Би хийнэ → Бид хийнэ → Та нар хийнэ):**", "   Жишээ 1 (багш бодож, бодох явцаа чангаар хэлнэ): (x² − 4)/(x + 6) · (x + 6)/(x − 2)", "   Жишээ 2 (анги хамтдаа, багш асуултаар хөтөлнө): (x² − 9)/x : (x + 3)/x²", "   Жишээ 3 (хосоороо бодоод самбартай тулгана): 5x²y / (25xy²)", "**3. Түгээмэл алдаа:** (x + 3)/x-д x-ийг хураах (нэмэгдэхүүнийг хураахгүй, зөвхөн үржигдэхүүнийг); хуваахад хоёр дахь бутархайг эргүүлэхээ мартах; нөхцөлийг орхих.", "**4. Шалгах цэг (3 мин):** 1) (x² − 25)/(3x) · 6x²/(x + 5); 2) (a² − ab)/b : (a − b)/b². Алдсан суралцагчтай багш дараагийн шатанд түрүүлж ажиллана."]], ["VI. Бие даан дадлага", ["**Ажлын хуудас:** хүн бүр «Сэргээх»-ээс эхэлж, аль болох хол явна (бодлого хөнгөнөөс хүнд рүү). Багш тойрон ажиглаж: гацсан суралцагчид томьёоны карт/жишээ бодолт, хурдан дууссанд ★ сорилт өгнө.", "**Түрүүлж дууссан:** ар талын «А», «Б» хэсгийн номын бодлого эсвэл «Г» хэсэг."]], ["VII. Бие даасан гүйцэтгэлийн даалгавар", ["**Бие даасан гүйцэтгэлийн даалгавар:** «Аяллын төлөвлөгөө»: Улаанбаатар–Арвайхээр 430 км. Автобус v км/ц, машин (v + 20) км/ц хурдтай. 1) Хугацааны харьцаа t₁ : t₂-ийг алгебрын бутархайгаар илэрхийлж хялбарчил. 2) v = 60 үед харьцааг тооцоол. 3) Харьцаа 1-ээс их байх нь юу гэсэн үг вэ?", "**Бүтээгдэхүүн:** Бие даасан бодолт ба тайлбар (дэвтэрт)", "• Суралцагч бүр өөрийн бүтээгдэхүүнийг хийнэ; багш шалгуурын дагуу ажиглаж, хэрэгтэй хүнд чиглүүлэх асуулт тавина."]], ["VIII. Өөрийгөө шалгах, засварлах", ["• Багш түлхүүрийг (эсвэл шалгуурын жишээ хариуг) үзүүлнэ.", "• Суралцагч бүр ажлаа шалгуураар өөрөө шалгаж, алдаагаа өөр өнгөөр засна. 2–3 суралцагч засварласан алхмаа тайлбарлана."]], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", ["**Гарах тасалбар (4 мин):** дэвтэрт 3 асуулт, гараа өргөж хариулна. 3 асуулт = 3 шалгуур. 3/3 — бэлэн; 2/3 — гэрийн даалгавраар бататгана; 0–1/3 — дараагийн хичээлд багштай.", "**Эргэцүүлэл (2 мин):** «Өнөөдөр би юуг сайжруулсан бэ?»", "**Гэрийн даалгавар (2 мин):** Ажлын хуудасны II хэсэг (Teams-ээс харж, дэвтэрт). Бүгд: 1–3; ★ сорилт: 4–5, ар талын «А», «Б»."]]]}, "9": {"stages": [["I. Зохион байгуулалт, баг", 2], ["II. Ёс зүйн 1 минут", 1], ["III. Алдаа засах, өмнөх ангийн мэдлэг сэргээх", 7], ["IV. Асуудал дэвшүүлэх, зорилго", 4], ["V. Шинэ мэдлэг (загварчлах)", 20], ["VI. Бие даан дадлага", 14], ["VII. Хосын гүйцэтгэлийн даалгавар", 16], ["VIII. Хос солилцож шалгах, сайжруулах", 8], ["IX. Дүгнэлт, үнэлгээ, эргэцүүлэл", 8]], "goal": "Хуваарь нь шугаман эсвэл квадрат олон гишүүнт байх алгебрын бутархайн ерөнхий хуваарийг үржигдэхүүнд задлах замаар олж, нэмэх, хасах үйлдэл гүйцэтгэх, бүтээмжийн бодлогод хэрэглэх.", "crit": ["Би 1/(x − 6) − 1/(x + 6) зэргийг ерөнхий хуваарьт оруулж бодож чадна.", "Би квадрат хуваарийг задалж (2/(x² − 4) + 1/(x + 2)) нэмж чадна.", "Би хамтын ажлын бодлогыг бутархайгаар бодож чадна."], "words": "ерөнхий хуваарь — хуваариудын ХБЕХ; нэмэлт үржигдэхүүн; бүтээмж — 1 цагт хийх хэсэг.", "ex": [["1/(x − 3) + 1/(x + 3)", "2x/(x² − 9); x ≠ ±3"], ["4/(x² − 4) − 1/(x + 2)", "(4 − (x − 2))/((x − 2)(x + 2)) = (6 − x)/(x² − 4); x ≠ ±2"], ["x/(x − 5) − 5/(x − 5)", "(x − 5)/(x − 5) = 1; x ≠ 5"]], "ck": [["1/(x − 5) − 1/(x + 5)", "10/(x² − 25); x ≠ ±5"], ["3/(x² − 9) + 1/(x − 3)", "(3 + x + 3)/(x² − 9) = (x + 6)/(x² − 9); x ≠ ±3"]], "ws": [["Сэргээх", ["2/3 + 1/4", "ХБЕХ(10; 15)"]], ["Дадлага 1", ["3/(2x) + 5/(2x)", "1/(x + 1) + 1/(x − 1)"]], ["Дадлага 2", ["2/(x² − 1) − 1/(x − 1)", "x/(x + 2) + 4/(x² + 2x)"]], ["★ Сорилт", ["1/(a − 2) + 1/(a − 3)", "Алдааг ол: 1/x + 1/y = 2/(x + y)"]], ["Хэрэглээ", ["R₁ = 3 Ом, R₂ = 6 Ом эсэргүүцлийг зэрэгцээ холбов. 1/R = 1/R₁ + 1/R₂ бол R хэд вэ?"]]], "hw": ["**Бүгд:** 1–3. **★ Сорилт (хүссэн нь):** 4–5 ба ар талын «А» хэсэг.", "5/(12x) − 7/(18y)", "a²/(a − b) − b²/(a − b)", "1/(a − 4) + 1/(a − 2)", "3/(x² − 16) − 1/(x + 4)", "⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn><mi>y</mi></mrow></mfrac><mo>&#x0002B;</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn><mi>y</mi></mrow></mfrac></mrow></math>⟧ ба ⟦<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msup><mi>a</mi><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></math>⟧ __(Олонлог 10, Дасгал 4 №2)__"], "quiz": ["1/(x − 6) − 1/(x + 6)", "2/(x² − 4) + 1/(x + 2)", "Хоёр хүн нэг ажлыг тус бүр 3 ба 6 цагт хийдэг. Хамтдаа хэдэн цагт хийх вэ?"], "key": [["III. Суурь сэргээх", ["1) 1/12", "2) 24", "3) (x − 3)(x + 3)"]], ["Жишээ 1–3", ["Жишээ 1: 2x/(x² − 9); x ≠ ±3", "Жишээ 2: (4 − (x − 2))/((x − 2)(x + 2)) = (6 − x)/(x² − 4); x ≠ ±2", "Жишээ 3: (x − 5)/(x − 5) = 1; x ≠ 5"]], ["Шалгах цэг", ["1) 10/(x² − 25); x ≠ ±5", "2) (3 + x + 3)/(x² − 9) = (x + 6)/(x² − 9); x ≠ ±3"]], ["I. Ажлын хуудас", ["№1: 11/12", "№2: 30", "№3: 8/(2x) = 4/x; x ≠ 0", "№4: 2x/(x² − 1); x ≠ ±1", "№5: (2 − (x + 1))/(x² − 1) = (1 − x)/((x − 1)(x + 1)
