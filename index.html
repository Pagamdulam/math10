:root{
  /* Layout: sticky top nav; home = four entry tiles + 13 units of lesson cards; lesson, level-check,
     assessment and teacher views share one centered column. Exponents in burnt orange, accent in deep blue. */
  --paper:#faf8f4; --surface:#ffffff; --ink:#22262b; --muted:#6a6f76; --line:#dcd7cd;
  --accent:#1e3a5f; --accent-soft:#eef1f4; --exp:#a8432a;
  --good:#2f7d3a; --good-soft:#e4f2e6; --warn:#a15c00; --warn-soft:#fbf0dc; --bad:#b42323; --bad-soft:#fae8e8;
  --grid:rgba(10,95,138,.055);
  --display:"Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}

:root[data-theme="dark"]{
  --paper:#111920; --surface:#19242e; --ink:#e6ecf1; --muted:#9db0bf; --line:#2b3946;
  --accent:#62b4dd; --accent-soft:#17303f; --exp:#fb923c;
  --good:#6cc47a; --good-soft:#163022; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#f07a7a; --bad-soft:#3a1c1e;
  --grid:rgba(98,180,221,.05); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
sup{color:var(--exp);font-weight:700;font-size:.68em;line-height:0}
.rad{white-space:nowrap}.rad .rc{display:inline-block;line-height:1;border-top:.07em solid currentColor;padding:.1em .1em 0 .05em;margin-left:.01em}
.vec{position:relative;display:inline-block;padding-top:.15em}.vec::before{content:"→";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);font-size:.7em;line-height:1}
.mat{font-variant-numeric:tabular-nums;white-space:nowrap}
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px max(16px,3vw)}
.brand{font-family:var(--display);font-size:18px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;background:var(--accent);color:var(--surface);border-radius:8px;padding:2px 8px;font-size:15px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav a{border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tchip{font-size:12.5px;border-radius:999px;padding:3px 9px;background:var(--warn-soft);color:var(--warn);font-weight:600}
main{max-width:1120px;margin:0 auto;padding:22px max(16px,3vw) 60px}
.lead{color:var(--muted);max-width:70ch;margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 28px}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}
.tile b{font-family:var(--display);font-size:18px;font-weight:500;display:block;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14.5px}
.tile:hover{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lc{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.lc:hover{border-color:var(--accent)}
.lc .no{font-family:var(--display);font-size:15px;min-width:2.2em;height:2.2em;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lc.as .no{background:var(--warn-soft);color:var(--warn)}
.lc .t{font-size:14.5px;line-height:1.35}
.lc .c{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-left:4px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stack{display:grid;gap:14px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted)}
.pill{display:inline-block;font-size:13px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.note{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:15px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.s{font-size:14px;padding:5px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.items{display:grid;gap:12px;counter-reset:q}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:9px}
.item.ok{border-left-color:var(--good)} .item.no{border-left-color:var(--bad)}
.q{font-size:17.5px;font-variant-numeric:tabular-nums}
.q .n{color:var(--muted);margin-right:.35em;font-size:.9em}
.q .src{font-size:12px;color:var(--muted);margin-left:.5em}
.in{flex:0 1 200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;text-align:left}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)} .opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-size:14.5px} .fb.g{color:var(--good)} .fb.b{color:var(--bad)}
.sol{font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.sol b{color:var(--accent)}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:600}
.scroll{overflow-x:auto}
.score{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.big{font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums}
.lv{font-weight:700;border-radius:8px;padding:4px 10px}
.lv.A{background:var(--good-soft);color:var(--good)} .lv.B{background:var(--warn-soft);color:var(--warn)} .lv.C{background:var(--bad-soft);color:var(--bad)}
.alist{display:grid;gap:8px}
.arow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.arow b{font-weight:600}
.arow small{color:var(--muted)}
.muted{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
textarea.copy{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:center;z-index:50;padding:16px}
.dlg.on{display:grid}
.dlg .card{max-width:380px;width:100%}

.h1{font-size:27px;margin:6px 0 4px}
.sec{font-size:20px;margin:26px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400}
.st{font-size:15px;line-height:1;margin-left:auto;flex:none}
.st.m{color:#d99a00;font-weight:700} .st.p{color:var(--accent)} .st.n{color:var(--line)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch;margin-bottom:6px}
.hero h1{font-size:30px}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14.5px}
.stats b{font-family:var(--display);color:var(--accent)}
.cont{display:flex;flex-direction:column;gap:4px;justify-content:center;background:var(--accent);color:var(--surface);border-radius:14px;padding:18px 20px;text-decoration:none}
.cont small{opacity:.85}
.cont b{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.25}
.cont span{font-weight:600;margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.fc{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--exp);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:14.5px}
.fc span:not(.st){flex:1}
.fc:hover{border-color:var(--exp)}
details.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
details.unit[open]{padding-bottom:14px}
details.unit summary{cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 0;list-style:none}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.unit[open] summary::before{transform:rotate(90deg)}
.uh{font-family:var(--display);font-size:17px;flex:1}
.bar{width:90px;height:7px;border-radius:9px;background:var(--accent-soft);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:#d99a00}
details.unit summary small{color:var(--muted);min-width:3.2em;text-align:right}
.hook{color:var(--muted);font-size:14.5px;margin:2px 0 10px}
.lhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.stepper{display:flex;gap:6px;margin:14px 0;overflow-x:auto;position:sticky;top:57px;z-index:5;background:var(--paper);padding:6px 0}
.stepper button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;white-space:nowrap;font-size:15px}
.stepper button span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.stepper button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stepper button.on span{background:var(--accent);color:var(--surface)}
.prose p,.prose ul{margin:.4em 0} .prose ul{padding-left:1.2em}
.prose code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:17px;font-variant-numeric:tabular-nums}
.steps li{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exans{color:var(--good);font-size:16px}
.twin{border-top:1px dashed var(--line);padding-top:10px}
.twh{font-weight:600;margin-bottom:6px;color:var(--exp)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dots i.g{background:var(--good);border-color:var(--good)} .dots i.b{background:var(--bad);border-color:var(--bad)}
.celebrate{margin-top:12px;background:#fff6dc;border:2px solid #d99a00;color:#5a4100;border-radius:12px;padding:14px;display:grid;gap:10px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.warnbox{margin-top:12px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px}
.okbox{margin-top:12px;background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 12px}
.tkey{font-size:14px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin-top:6px}
.codebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.codebox.col{flex-direction:column;align-items:stretch;background:none;padding:0}
textarea.copy.small{min-height:44px;flex:1 1 220px;font-size:12px}
.chk{display:flex;gap:5px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.cycle{padding-left:1.2em;display:grid;gap:6px;max-width:80ch}
/* widgets */
.wg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.wtitle{font-family:var(--display);font-size:17px;margin-bottom:8px}
.wbody{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:16px;align-items:start}
.wfig.full{grid-column:1/-1}
.wsvg{width:100%;height:auto;display:block;background:var(--paper);border-radius:10px;touch-action:pan-y}
.wsvg.wide{max-width:none}
.wgr{stroke:var(--line);stroke-width:.6} .wax{stroke:var(--muted);stroke-width:1.2}
.wlbl{fill:var(--ink);font-size:13px;font-family:var(--body)} .wtick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.wc1{stroke:var(--accent);stroke-width:2.6;fill:none} .wc2{stroke:var(--exp);stroke-width:2.6;fill:none} .wc3{stroke:var(--good);stroke-width:2;fill:none}
.dash{stroke-dasharray:6 5} .thick{stroke-width:5} .nofill{fill:none}
.wd1{fill:var(--accent)} .wd2{fill:var(--exp)}
.wv1{stroke:var(--accent);stroke-width:3} .wv2{stroke:var(--exp);stroke-width:3} .wv3{stroke:var(--good);stroke-width:3.4}
.wv1f{fill:var(--accent)} .wv2f{fill:var(--exp)} .wv3f{fill:var(--good)}
.wfill{fill:var(--accent);opacity:.14}
.wpoly0{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2}
.wpoly1{fill:var(--exp);fill-opacity:.25;stroke:var(--exp);stroke-width:2}
.wside{display:grid;gap:10px}
.wsl{display:grid;gap:2px;font-size:14.5px}
.wsl input{width:100%;accent-color:var(--accent)}
.wsl b{font-family:var(--display);color:var(--exp)}
.wbtns{display:flex;flex-wrap:wrap;gap:6px}
.wbtns .on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.wout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6}
.k2{color:var(--exp);font-weight:700} .k3{color:var(--good);font-weight:700}

.teach{display:grid;gap:10px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;position:sticky;top:0;z-index:5}
.tstage{flex:1;min-width:200px}
.ttime{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
.ttime.big{font-size:44px;text-align:left}
.ttime.over{color:var(--bad)}
.tcount{color:var(--muted);font-size:14px}
.tprog{display:flex;gap:3px;height:6px}
.tprog i{border-radius:4px;background:var(--line)} .tprog i.d{background:var(--good)} .tprog i.c{background:var(--accent)}
.tslide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 30px;min-height:68vh;font-size:clamp(18px,2.1vw,26px);line-height:1.5}
.th{font-size:clamp(26px,3.2vw,42px);margin:8px 0 12px}
.th small{font-family:var(--body);font-size:.45em;color:var(--muted);font-weight:400}
.tl{font-size:1em} .tl.big{font-size:1.2em}
.tslide h3{font-size:.95em;margin:16px 0 6px;color:var(--accent)}
.crit{margin:0;padding-left:1.3em} .tq{padding-left:1.3em;display:grid;gap:14px}
.tq .rv{color:var(--good);font-size:.85em;margin-top:4px}
.steps.big{font-size:1.1em;gap:10px}
.q2{font-family:var(--body);font-weight:400}
.mist li{margin:8px 0}
.url{color:var(--accent);word-break:break-all}
.lvbox{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tslide .wg{font-size:16px}
.tstrip{margin:4px 0 6px;gap:8px}
#pick{place-items:center}
.pickcard{background:var(--surface);border-radius:20px;padding:30px 40px;display:grid;gap:16px;text-align:center;min-width:min(90vw,460px)}
.pname{font-family:var(--display);font-size:clamp(36px,6vw,64px);color:var(--muted)}
.pname.final{color:var(--accent);animation:pop .4s ease}
.btn.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* board */
.boardmode .top{display:none}
.board{display:grid;gap:18px;min-height:85vh;align-content:start}
.bq{font-size:clamp(26px,4.2vw,48px);line-height:1.35;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 30px;font-variant-numeric:tabular-nums}
.bn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:var(--surface);font-size:.6em;margin-right:.5em;vertical-align:middle}
.bopts{display:flex;flex-wrap:wrap;gap:12px 30px;font-size:.8em;margin-top:14px}
.bans{font-size:clamp(20px,3vw,34px);background:var(--good-soft);border-radius:14px;padding:16px 22px}
.bsol{font-size:.8em}
.bctl .btn{font-size:20px;padding:10px 22px}
@media (max-width:720px){.h1{font-size:22px}.hero h1{font-size:25px}.lead{font-size:15px}.note{line-height:1.85}.hero{grid-template-columns:1fr}.wbody{grid-template-columns:1fr}.stepper{top:0}.top{position:static}.q{font-size:17px}.bar{width:50px}}


.vbtn{display:inline-flex;align-items:center;gap:12px;margin:10px 0 4px;padding:10px 18px 10px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:0 1px 0 var(--line)}
.vbtn:hover{border-color:var(--accent)}
.vbtn b{display:block}.vbtn small{color:var(--muted)}

<script>
/* ===== Math 10 question bank: generators with exact answers and worked solutions ===== */
const M = (() => {
"use strict";
/* --- seeded rng --- */
function rng(seed){let a=seed>>>0;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  f.int=(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)); f.pick=a=>a[Math.floor(f()*a.length)];
  f.nz=(lo,hi)=>{let v;do{v=f.int(lo,hi)}while(v===0);return v};
  f.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  return f;}
/* --- rationals --- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function Q(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const add=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d), sub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d),
  mul=(a,b)=>Q(a.n*b.n,a.d*b.d), div=(a,b)=>Q(a.n*b.d,a.d*b.n);
function qpow(a,e){if(e===0)return Q(1);if(e<0)return qpow(Q(a.d,a.n),-e);return Q(a.n**e,a.d**e)}
const val=q=>q.n/q.d;
const mn=x=>{let s=String(x);if(typeof x==="number"){s=String(+x.toPrecision(12));if(/e-/.test(s))s=x.toFixed(15).replace(/0+$/,"");s=s.replace(".",",")}return s.replace("-","−")};
function qs(q){return q.d===1?mn(q.n):`${mn(q.n)}/${q.d}`}
function qsp(q){return(q.d!==1||q.n<0)?`(${qs(q)})`:qs(q)}  // parenthesised for bases
const S=e=>`<sup>${mn(e)}</sup>`;
const sgn=(k,first)=>k<0?(first?"−":" − ")+Math.abs(k):(first?""+k:" + "+k);
function lin(a,b,v="x"){ // a·x + b
  let s=a===1?v:a===-1?"−"+v:mn(a)+v; if(b) s+=sgn(b); return s}
function poly2(a,b,c,v="x"){let s=(a===1?"":a===-1?"−":mn(a))+v+"²";
  if(b) s+=(b<0?" − ":" + ")+(Math.abs(b)===1?"":Math.abs(b))+v; if(c) s+=sgn(c); return s}
/* --- item builders --- */
function num(q,ans,sol,hint){return{type:"num",q,ans:typeof ans==="number"?ans:val(ans),ansText:typeof ans==="number"?mn(+ans.toPrecision(12)):qs(ans),sol,hint}}
function mc(r,q,right,wrongs,sol){const set=[right];for(const w of wrongs){if(!set.includes(w)&&set.length<4)set.push(w)}
  const opts=r.shuffle(set);return{type:"mc",q,opts,c:opts.indexOf(right),ansText:right,sol}}
const sq=n=>Math.round(Math.sqrt(n))**2===n;
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]];
const RT=n=>n===2?"√":`<sup>${n}</sup>√`;

/* ===================== generators by lesson ===================== */
const G={};
// 1 integer exponents
G[1]=[
 r=>{const a=r.pick([2,3,4,5,10]),n=r.int(-3,0);const v=qpow(Q(a),n);
   return num(`${a}${S(n)}`,v,n===0?`Тэгээс ялгаатай тооны 0 зэрэг 1: ${a}⁰ = 1`:`${a}${S(n)} = 1/${a}${S(-n)} = ${qs(v)}`,"a⁻ⁿ = 1/aⁿ, a⁰ = 1")},
 r=>{const a=r.pick([2,3,5]);let m,n,k,e;do{m=r.int(-4,5);n=r.int(-4,5);k=r.int(-4,5);e=m+n-k}while(e<-3||e>3);
   const v=qpow(Q(a),e);return num(`${a}${S(m)} · ${a}${S(n)} : ${a}${S(k)}`,v,`Илтгэгч: ${mn(m)} + ${n<0?"("+mn(n)+")":n} − ${k<0?"("+mn(k)+")":k} = ${mn(e)}, тэгэхээр ${a}${S(e)} = ${qs(v)}`,"Үржихэд илтгэгч нэмэгдэж, хуваахад хасагдана")},
 r=>{let p,q;do{p=r.int(1,4);q=r.int(2,6)}while(p>=q||gcd(p,q)>1);const n=r.int(1,3);const v=qpow(Q(q,p),n);
   return num(`(${p}/${q})${S(-n)}`,v,`(${p}/${q})${S(-n)} = (${q}/${p})${S(n)} = ${qs(v)}`,"(a/b)⁻ⁿ = (b/a)ⁿ")},
 r=>{const a=r.pick([2,3,4,5]),b=r.pick([2,3,4,6]),c=r.int(2,9);const v=add(add(Q(1,a),Q(1,b)),Q(1));
   return num(`${a}${S(-1)} + ${b}${S(-1)} + ${c}${S(0)}`,v,`1/${a} + 1/${b} + 1 = ${qs(v)}`,"Гишүүн бүрийг тусад нь ол")},
 r=>{const a=r.pick([2,3]),m=r.int(2,4),n=r.int(-3,-1);const e=m*n;const v=qpow(Q(a),e);
   return num(`(${a}${S(m)})${S(n)}`,v,`(${a}${S(m)})${S(n)} = ${a}${S(e)} = ${qs(v)}`,"(aᵐ)ⁿ = aᵐⁿ")}
];
// 2 n-th roots
G[2]=[
 r=>{const n=r.pick([3,4,5]);const b=n===3?r.int(2,5):r.int(2,3);return num(`${RT(n)}${b**n}`,b,`${b}${S(n)} = ${b**n} тул ${RT(n)}${b**n} = ${b}`,"Аль тоог n зэрэгт дэвшүүлэхэд гарах вэ?")},
 r=>{const m=r.pick([2,3,5]),s=r.int(1,4),t=r.int(1,4);return num(`√${m*s*s} · √${m*t*t}`,m*s*t,`√(${m*s*s}·${m*t*t}) = √${m*m*s*s*t*t} = ${m*s*t}`,"√a · √b = √(ab)")},
 r=>{const [a,b,c]=r.pick([[2,4,2],[3,9,3],[5,25,5],[4,16,4],[2,32,4]]);return num(`∛${a} · ∛${b}`,c,`∛(${a}·${b}) = ∛${a*b} = ${c}`,"ⁿ√a · ⁿ√b = ⁿ√(ab)")},
 r=>{const k=r.int(2,6),m=r.pick([2,3,5,6,7]);return mc(r,`√${k*k*m}-ийг хялбарчил`,`${k}√${m}`,[`${m}√${k}`,`${k*k}√${m}`,`${k}√${k*m}`,`${k+m}√${m}`],`√${k*k*m} = √(${k*k}·${m}) = ${k}√${m}`)},
 r=>{const n=r.pick([3,4]);const a=2,b=r.pick([3,5]);return num(`${RT(n)}(${a**n}·${b**n})`,a*b,`${RT(n)}(${a}${S(n)}·${b}${S(n)}) = ${a}·${b} = ${a*b}`,"ⁿ√(aⁿbⁿ) = ab")}
];
// 3 rational exponents
G[3]=[
 r=>{const q=r.pick([2,3]);const b=q===2?r.int(2,9):r.int(2,5);const p=r.pick([1,2,-1,-2]);const v=qpow(Q(b),p);
   return num(`${b**q}${S(p+"/"+q)}`,v,`${b**q} = ${b}${S(q)} тул ${b**q}${S(p+"/"+q)} = ${b}${S(p)} = ${qs(v)}`,"a^(p/q) = (q√a)^p")},
 r=>{const a=r.pick([2,3,5,7]),m=r.int(1,4),n=r.pick([3,4,5]);return mc(r,`${a}${S(m+"/"+n)}-ийг язгуураар бич`,`${RT(n)}${a}${S(m)}`,[`${RT(m)}${a}${S(n)}`,`${RT(n)}${a*m}`,`${a}${S(m)}/${n}`],`a${S("m/n")} = ${RT("n")}a${S("m")} тул ${RT(n)}${a}${S(m)}`)},
 r=>{const b=r.int(2,7);const [p1,p2]=r.pick([[1,3],[3,5],[1,1]]);const e=(p1+p2)/2;return num(`${b}${S(p1+"/2")} · ${b}${S(p2+"/2")}`,b**e,`Илтгэгч: ${p1}/2 + ${p2}/2 = ${e}, тэгэхээр ${b}${S(e)} = ${b**e}`,"aᵐ · aⁿ = aᵐ⁺ⁿ")},
 r=>{const b=r.int(2,9);return num(`(${b}${S("2/3")})${S("3/2")}`,b,`Илтгэгч: 2/3 · 3/2 = 1, тэгэхээр ${b}`,"(aᵐ)ⁿ = aᵐⁿ")}
];
// 4 standard form
function decStr(a10,k){ // a10 = a*10 (int 10..99), value = a*10^k
  let digits=String(a10);let exp=k-1;
  if(exp>=0) return digits+"0".repeat(exp);
  const pos=digits.length+exp; if(pos>0) return digits.slice(0,pos)+","+digits.slice(pos);

G[4]=[
 r=>{let a10;do{a10=r.int(11,99)}while(a10%10===0);let k;do{k=r.int(-6,7)}while(k===0);const s=decStr(a10,k);
   return num(`${s} тоог a · 10ⁿ (1 ≤ a < 10) хэлбэрт бичихэд n хэд вэ?`,k,`${s} = ${String(a10/10).replace(".",",")} · 10${S(k)}`,"Таслалыг хэдэн орон шилжүүлэхийг тоол")},
 r=>{const [a,b]=r.pick([[2,3],[2,4],[3,3],[1.5,4],[2,2.5],[1.2,5]]);const m=r.int(-5,6),n=r.int(-5,6);const p=a*b;const e=m+n;

 r=>{const a=r.int(2,12),b=r.int(2,12),k=r.int(0,2);const A=(k===1?1:-1)*a*b,B=k===0?b:-b;const s=A/B;return num(`${pr(A)} : ${pr(B)}`,s,`${s>0?"Тэмдэг ижил тул +":"Тэмдэг өөр тул −"}, ${a*b} : ${b} = ${a} тул хариу ${mn(s)}`,"Хуваахад ч үржихтэй ижил тэмдгийн дүрэм")},
 r=>{const xs=[r.nz(-5,5),r.nz(-5,5),r.nz(-4,4)];const p=xs[0]*xs[1]*xs[2];const neg=xs.filter(x=>x<0).length;return num(`${pr(xs[0])} · ${pr(xs[1])} · ${pr(xs[2])}`,p,`Сөрөг үржигдэхүүн ${neg} ширхэг, ${neg%2?"сондгой тул −":"тэгш тул +"}. ${Math.abs(xs[0])}·${Math.abs(xs[1])}·${Math.abs(xs[2])} = ${Math.abs(p)} тул хариу ${mn(p)}`,"Сөрөг үржигдэхүүн тэгш тоотой бол +, сондгой бол −")}
];
F.f3=[
 r=>{const a=r.nz(-10,10),b=r.nz(-6,6),c=r.nz(-6,6);return num(`${mn(a)} + ${pr(b)} · ${pr(c)}`,a+b*c,`Эхлээд үржинэ: ${pr(b)} · ${pr(c)} = ${mn(b*c)}; ${mn(a)} + ${pr(b*c)} = ${mn(a+b*c)}`,"Үржих, хуваах нь нэмэх, хасахаас өмнө")},
 r=>{const a=r.nz(-9,9),b=r.nz(-9,9),c=r.nz(-5,5);return num(`(${mn(a)} − ${pr(b)}) · ${pr(c)}`,(a-b)*c,`Эхлээд хаалт: ${mn(a)} − ${pr(b)} = ${mn(a-b)}; ${pr(a-b)} · ${pr(c)} = ${mn((a-b)*c)}`,"Хаалт хамгийн түрүүнд")},
 r=>{const b=r.int(2,5),c=r.nz(-4,4),a=r.nz(-10,10);return num(`${mn(a)} − ${pr(c)}${S(2)} · ${b}`,a-c*c*b,`Зэрэг: ${pr(c)}${S(2)} = ${c*c}; үржих: ${c*c} · ${b} = ${c*c*b}; ${mn(a)} − ${c*c*b} = ${mn(a-c*c*b)}`,"Дараалал: хаалт → зэрэг → үржих, хуваах → нэмэх, хасах")}
];
F.f4=[
 r=>{let b,d;do{b=r.int(2,9);d=r.int(2,9)}while(b===d);const a=r.int(1,b-1),c=r.int(1,d-1);const L=lcm(b,d);const v=add(Q(a,b),Q(c,d));
   return num(`${a}/${b} + ${c}/${d}`,v,`Ерөнхий хуваарь ${L}: ${a*L/b}/${L} + ${c*L/d}/${L} = ${a*L/b+c*L/d}/${L}${v.d!==L?" = "+qs(v):""}`,"Хуваарийг ижил болгоод хүртвэрийг нэмнэ")},
 r=>{let b,d;do{b=r.int(2,9);d=r.int(2,9)}while(b===d);const a=r.int(1,b-1),c=r.int(1,d-1);const L=lcm(b,d);const v=sub(Q(a,b),Q(c,d));
   return num(`${a}/${b} − ${c}/${d}`,v,`Ерөнхий хуваарь ${L}: ${a*L/b}/${L} − ${c*L/d}/${L} = ${mn(a*L/b-c*L/d)}/${L}${v.d!==L?" = "+qs(v):""}`,"Хуваарийг ижил болгоод хүртвэрийг хасна")},
 r=>{const n=r.int(1,4),b=r.int(2,6),a=r.int(1,b-1);const v=add(Q(n),Q(a,b));return num(`${n} + ${a}/${b}`,v,`${n} = ${n*b}/${b}; ${n*b}/${b} + ${a}/${b} = ${qs(v)}`,"Бүхэл тоог бутархай болго")}
];
F.f5=[
 r=>{const a=r.int(1,8),b=r.int(2,9),c=r.int(1,8),d=c+r.int(1,5);const v=mul(Q(a,b),Q(c,d));return num(`${a}/${b} · ${c}/${d}`,v,`(${a}·${c})/(${b}·${d}) = ${a*c}/${b*d}${v.d!==b*d||v.n!==a*c?" = "+qs(v):""}`,"Хүртвэрийг хүртвэрээр, хуваарийг хуваариар")},
 r=>{const a=r.int(1,8),b=r.int(2,9),c=r.int(1,8),d=c+r.int(1,5);const v=div(Q(a,b),Q(c,d));return num(`${a}/${b} : ${c}/${d}`,v,`${a}/${b} · ${d}/${c} = ${a*d}/${b*c}${v.d!==b*c||v.n!==a*d?" = "+qs(v):""}`,"Хуваахыг урвуу бутархайгаар үржихээр солино")},
 r=>{const b=r.int(2,6),a=r.int(1,b-1),k=r.int(2,6);const N=b*k;return num(`${N}-ийн ${a}/${b} хэсэг хэд вэ?`,N*a/b,`${N} : ${b} = ${k}; ${k} · ${a} = ${k*a}`,"Эхлээд хуваарьт хувааж, дараа нь хүртвэрээр үржүүл")}
];
F.f6=[
 r=>{const p=r.pick([10,20,25,30,40,50,75,15,5]),N=r.pick([20,40,60,80,120,200,300,500]);return num(`${N}-ийн ${p}% хэд вэ?`,N*p/100,`${p}% = ${p}/100; ${N} · ${p}/100 = ${N*p/100}`,"p% = p/100")},
 r=>{const P=r.pick([20000,30000,50000,80000,120000]),p=r.pick([10,20,25,30,15]);return num(`${P} төгрөгийн бараа ${p}% хямдарвал үнэ нь хэд болох вэ?`,P*(100-p)/100,`Хямдрал: ${P} · ${p}/100 = ${P*p/100}; ${P} − ${P*p/100} = ${P*(100-p)/100}`,"Эхлээд хямдралын хэмжээг ол")},
 r=>{const [d,f]=r.pick([["0,5","1/2"],["0,25","1/4"],["0,75","3/4"],["0,2","1/5"],["0,4","2/5"],["0,125","1/8"],["1,5","3/2"]]);return mc(r,`${d}-ийг энгийн бутархайгаар илэрхийл`,f,["1/2","1/4","3/4","1/5","2/5","1/8","3/2","5/2"].filter(x=>x!==f),`${d} = ${f}`)},
 r=>{const a=r.int(11,99)/10,b=r.int(11,49)/10;const s=Math.round((a+b)*10)/10;return num(`${String(a).replace(".",",")} + ${String(b).replace(".",",")}`,s,`Аравтын оронг дор нь бичиж нэмнэ: ${String(s).replace(".",",")}`,"Таслалыг таслалын доор")}
];
F.f7=[
 r=>{const a=r.int(2,9);return num(`(−${a})${S(2)}`,a*a,`(−${a})·(−${a}) = ${a*a}`,"Хаалттай бол хасах тэмдэг ч зэрэгт орно")},
 r=>{const a=r.int(2,9);return num(`−${a}${S(2)}`,-a*a,`−(${a}·${a}) = ${mn(-a*a)}`,`Хаалтгүй бол зөвхөн ${a} нь зэрэгт орж, хасах тэмдэг гадна үлдэнэ`)},
 r=>{const a=r.int(2,5),n=r.pick([3,4]);return num(`${a}${S(n)}`,a**n,`${Array(n).fill(a).join(" · ")} = ${a**n}`,"aⁿ = a·a·…·a (n удаа)")},
 r=>{const a=r.int(2,15);return num(`√${a*a}`,a,`${a}${S(2)} = ${a*a} тул √${a*a} = ${a}`,"Квадрат нь энэ тоо болох эерэг тоо")}
];
F.f8=[
 r=>{const a=r.nz(-5,5),b=r.nz(-6,6),k=r.nz(-3,3);const x=k;return num(`x = ${mn(x)} үед ${lin(a,b)}-ийн утга`,a*x+b,`${mn(a)} · ${pr(x)} ${b<0?"− "+(-b):"+ "+b} = ${mn(a*x)} ${b<0?"− "+(-b):"+ "+b} = ${mn(a*x+b)}`,"x-ийн оронд тоог хаалтад хийж орлуул")},
 r=>{const a=r.int(2,6),b=r.nz(-7,7);const right=lin(a,a*b);return mc(r,`${a}(${lin(1,b)})-ийг задал`,right,[lin(a,b),lin(a,-a*b),lin(1,a*b),lin(a+1,a*b)],`${a}·x ${a*b<0?"−":"+"} ${a}·${Math.abs(b)} = ${right}`)},
 r=>{const a=r.nz(-6,6),b=r.nz(-6,6),c=r.nz(-6,6),d=r.nz(-6,6);if(a+c===0)return num(`${lin(a,b)} + ${pr(c)}x + ${pr(d)} илэрхийллийн сул гишүүн`,b+d,`${mn(b)} + ${pr(d)} = ${mn(b+d)}`,"Тоонуудыг нэмнэ");
   return num(`(${lin(a,b)}) + (${lin(c,d)}) = mx + n бол m хэд вэ?`,a+c,`x-тэй гишүүдийг нэгтгэнэ: ${mn(a)} + ${pr(c)} = ${mn(a+c)}`,"Төстэй гишүүд: x-тэй нь x-тэйгээ")}
];
F.f9=[
 r=>{const a=r.nz(-6,6),x=r.int(-8,8),b=r.nz(-10,10);const c=a*x+b;return num(`${lin(a,b)} = ${mn(c)} бол x`,x,`${lin(a,0)} = ${mn(c)} ${b<0?"+ "+(-b):"− "+b} = ${mn(c-b)}; x = ${mn(c-b)} : ${pr(a)} = ${mn(x)}`,"Тоог нөгөө тал руу тэмдгийг нь өөрчилж шилжүүл")},
 r=>{const a=r.int(2,5),p=r.nz(-6,6),x=r.int(-6,9);const c=a*(x-p);return num(`${a}(${lin(1,-p)}) = ${mn(c)} бол x`,x,`${lin(1,-p)} = ${mn(c)} : ${a} = ${mn(c/a)}; x = ${mn(c/a)} ${p<0?"− "+(-p):"+ "+p} = ${mn(x)}`,"Эхлээд хоёр талыг хаалтын өмнөх тоонд хуваа")},
 r=>{let a,c;do{a=r.nz(-6,6);c=r.nz(-6,6)}while(a===c);const x=r.int(-6,6),b=r.nz(-9,9);const d=a*x+b-c*x;return num(`${lin(a,b)} = ${lin(c,d)} бол x`,x,`x-тэй гишүүдийг зүүн, тоог баруун тал руу: ${mn(a)}x − ${pr(c)}x = ${mn(d)} − ${pr(b)}; ${mn(a-c)}x = ${mn(d-b)}; x = ${mn(x)}`,"Төстэй гишүүдийг нэг тал руу цуглуул")}
];
F.f10=[
 r=>{const x=r.nz(-7,7),y=r.nz(-7,7);const qd=x>0?(y>0?"I":"IV"):(y>0?"II":"III");return mc(r,`A(${mn(x)}; ${mn(y)}) цэг аль мөчид оршдог вэ?`,qd+" мөч",["I мөч","II мөч","III мөч","IV мөч"],`x ${x>0?"> 0":"< 0"}, y ${y>0?"> 0":"< 0"} тул ${qd} мөч`)},
 r=>{const x=r.int(-6,6),y=r.int(-6,6),dx=r.int(1,5),dy=r.int(1,5);const right=r.int(0,1);const nx=right?x+dx:x-dx;return num(`A(${mn(x)}; ${mn(y)}) цэгийг ${dx} нэгж ${right?"баруун":"зүүн"} тийш, ${dy} нэгж доош шилжүүлэв. Шинэ цэгийн x + y-ийг ол`,nx+y-dy,`x: ${mn(x)} ${right?"+":"−"} ${dx} = ${mn(nx)}, y: ${mn(y)} − ${dy} = ${mn(y-dy)}; ${mn(nx)} + ${pr(y-dy)} = ${mn(nx+y-dy)}`,"Баруун: x нэмэгдэнэ, доош: y хорогдоно")},
 r=>{const k=r.nz(-3,3),b=r.nz(-5,5),x=r.int(-4,4);return num(`y = ${lin(k,b)} шулуун дээрх x = ${mn(x)} абсцисстай цэгийн y`,k*x+b,`y = ${mn(k)}·${pr(x)} ${b<0?"− "+(-b):"+ "+b} = ${mn(k*x+b)}`,"x-ийг томьёонд орлуул")}
];
F.f11=[
 r=>{const [a,b,c]=r.pick(TRIPLES);return num(`Тэгш өнцөгт гурвалжны катетууд ${a} ба ${b}. Гипотенуз хэд вэ?`,c,`c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}; c = √${c*c} = ${c}`,"c² = a² + b²")},
 r=>{const [a,b,c]=r.pick(TRIPLES);return num(`Гипотенуз ${c}, нэг катет ${a}. Нөгөө катет хэд вэ?`,b,`b² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}; b = ${b}`,"b² = c² − a²")},
 r=>{const [a,b,c]=r.pick(TRIPLES);return num(`${a} м өндөр ханан дээр шат тулжээ. Шатны хөл ханаас ${b} м зайтай. Шатны урт хэд вэ?`,c,`√(${a*a} + ${b*b}) = √${c*c} = ${c}`,"Хана, газар, шат — тэгш өнцөгт гурвалжин")}
];

F.f12=[
 r=>{const a=r.int(2,9),b=r.int(2,9),k=r.int(2,6);const c=a*k;return num(`${a} : ${b} = ${c} : x бол x`,b*k,`a·d = b·c тул ${a}·x = ${b}·${c}; x = ${b*c} : ${a} = ${b*k}`,"Пропорцын захын гишүүдийн үржвэр = дундын гишүүдийн үржвэр")},
 r=>{let m,n;do{m=r.int(1,5);n=r.int(1,5)}while(m===n);const k=r.int(3,15);const N=(m+n)*k;return num(`${N}-ийг ${m} : ${n} харьцаагаар хуваахад их хэсэг нь хэд вэ?`,Math.max(m,n)*k,`Нийт ${m} + ${n} = ${m+n} хэсэг; нэг хэсэг ${N} : ${m+n} = ${k}; их хэсэг ${Math.max(m,n)} · ${k} = ${Math.max(m,n)*k}`,"Эхлээд нэг хэсгийн хэмжээг ол")},
 r=>{const S=r.pick([1000,2000,5000,10000,25000]),d=r.int(2,9);return num(`Газрын зургийн масштаб 1 : ${S}. Зураг дээр ${d} см бол бодит зай хэдэн метр вэ?`,d*S/100,`${d} · ${S} = ${d*S} см = ${d*S/100} м`,"1 м = 100 см")},
 r=>{const a=r.int(2,5),u=r.pick([1500,2000,2500,3000,4000]),b=r.int(3,9);return num(`${a} кг алим ${a*u} төгрөг. ${b} кг алим хэдэн төгрөг вэ?`,b*u,`1 кг: ${a*u} : ${a} = ${u}; ${b} кг: ${b} · ${u} = ${b*u}`,"Шууд пропорциональ: эхлээд 1 кг-ийн үнийг ол")}
];
F.f13=[
 r=>{const a=r.int(25,85),b=r.int(25,85);return num(`Гурвалжны хоёр өнцөг ${a}° ба ${b}°. Гурав дахь өнцөг хэдэн градус вэ?`,180-a-b,`180° − ${a}° − ${b}° = ${180-a-b}°`,"Гурвалжны өнцгийн нийлбэр 180°")},
 r=>{const a=r.int(20,160);return num(`Хөрш хоёр өнцгийн нэг нь ${a}°. Нөгөө нь хэдэн градус вэ?`,180-a,`180° − ${a}° = ${180-a}°`,"Хөрш өнцгийн нийлбэр 180°")},
 r=>{const a=2*r.int(10,70);return num(`Адил хажуут гурвалжны оройн өнцөг ${a}°. Суурийн өнцөг хэдэн градус вэ?`,(180-a)/2,`(180° − ${a}°) : 2 = ${(180-a)/2}°`,"Суурийн хоёр өнцөг тэнцүү")},
 r=>{const a=r.int(30,70),b=r.int(30,70);return num(`Гурвалжны хоёр дотоод өнцөг ${a}° ба ${b}°. Гурав дахь оройн гадаад өнцөг хэдэн градус вэ?`,a+b,`Гадаад өнцөг = хөрш биш хоёр дотоод өнцгийн нийлбэр: ${a}° + ${b}° = ${a+b}°`,"Гадаад өнцгийн чанар")}
];
F.f14=[
 r=>{const a=r.int(3,15),b=r.int(2,12);return num(`Тэгш өнцөгтийн талууд ${a} см ба ${b} см. Талбай нь хэдэн см² вэ?`,a*b,`S = ${a} · ${b} = ${a*b} см²`,"S = a·b")},
 r=>{const a=2*r.int(2,9),h=r.int(3,12);return num(`Гурвалжны суурь ${a} см, өндөр ${h} см. Талбай нь хэдэн см² вэ?`,a*h/2,`S = ½ · ${a} · ${h} = ${a*h/2} см²`,"S = ½·a·h")},
 r=>{const rr=r.int(2,10);return num(`Радиус ${rr} см дугуйн талбай S = kπ см² бол k-г ол`,rr*rr,`S = π · ${rr}² = ${rr*rr}π`,"S = πr²")},
 r=>{const rr=r.int(2,12);return num(`Радиус ${rr} см тойргийн урт C = kπ см бол k-г ол`,2*rr,`C = 2π · ${rr} = ${2*rr}π`,"C = 2πr")},
 r=>{const a=r.int(3,10),b=a+2*r.int(1,4),h=r.int(2,8);return num(`Трапецийн суурь ${a} ба ${b}, өндөр ${h}. Талбайг ол`,(a+b)*h/2,`S = ½(${a} + ${b}) · ${h} = ${(a+b)*h/2}`,"S = ½(a + b)·h")}
];
F.f15=[
 r=>{const a=r.int(2,9),b=r.int(2,9),c=r.int(2,9);return num(`Тэгш өнцөгт параллелепипедийн хэмжээс ${a} см, ${b} см, ${c} см. Эзэлхүүн нь хэдэн см³ вэ?`,a*b*c,`V = ${a} · ${b} · ${c} = ${a*b*c} см³`,"V = a·b·c")},
 r=>{const a=r.int(2,7);return num(`Кубын ирмэг ${a} см. Эзэлхүүн нь хэдэн см³ вэ?`,a**3,`V = ${a}³ = ${a**3} см³`,"V = a³")},
 r=>{const a=r.int(2,8);return num(`Кубын ирмэг ${a} см. Бүтэн гадаргуун талбай хэдэн см² вэ?`,6*a*a,`S = 6 · ${a}² = ${6*a*a} см²`,"Куб 6 тэнцүү квадрат талтай")},
 r=>{const a=r.int(2,9),b=r.int(2,6),c=r.int(2,6);return num(`Савны дотор хэмжээ ${a} дм × ${b} дм × ${c} дм. Хэдэн литр ус багтах вэ?`,a*b*c,`V = ${a*b*c} дм³ = ${a*b*c} литр`,"1 дм³ = 1 литр")}
];
F.f16=[
 r=>{const m=r.int(5,15);const d=[r.int(-4,4),r.int(-4,4),r.int(-4,4),r.int(-4,4)];d.push(-(d[0]+d[1]+d[2]+d[3]));const xs=r.shuffle(d.map(x=>m+x));return num(`${xs.join(", ")} тоонуудын арифметик дундаж хэд вэ?`,m,`(${xs.join(" + ")}) : 5 = ${5*m} : 5 = ${m}`,"Нийлбэрийг тоонуудын тоонд хуваа")},

  function draw(){P.clear();const arc=AB();const a1=(-90-arc/2)*Math.PI/180,a2=(-90+arc/2)*Math.PI/180;let cd=C();const lo=(-90+arc/2)+8,hi=(270-arc/2)-8;cd=Math.max(lo,Math.min(hi,cd-0));const ac=cd*Math.PI/180;
    const A=[Math.cos(a1),Math.sin(a1)],B=[Math.cos(a2),Math.sin(a2)],Cp=[Math.cos(ac),Math.sin(ac)];
    el("circle",{cx:P.X(0),cy:P.Y(0),r:P.X(1)-P.X(0),class:"wc1 nofill"},P.layer);
    el("path",{d:`M${P.X(A[0])} ${P.Y(A[1])} A ${P.X(1)-P.X(0)} ${P.X(1)-P.X(0)} 0 0 0 ${P.X(B[0])} ${P.Y(B[1])}`,class:"wc2 thick nofill"},P.layer);
    el("polyline",{points:[A,Cp,B].map(p=>P.X(p[0])+","+P.Y(p[1])).join(" "),class:"wc1 nofill"},P.layer);
    el("polyline",{points:[A,[0,0],B].map(p=>P.X(p[0])+","+P.Y(p[1])).join(" "),class:"wc3 nofill"},P.layer);
    dot(P,A[0],A[1],"wd1","A");dot(P,B[0],B[1],"wd1","B");dot(P,Cp[0],Cp[1],"wd2","C");dot(P,0,0,"wd1","O");
    s.out.innerHTML=`<span class="k3">Төв өнцөг ∠AOB = ${arc}°</span><br><b>Багтсан өнцөг ∠ACB = ${arc/2}°</b><br>C цэгийг нумын дагуу хөдөлгөж үз: багтсан өнцөг өөрчлөгдөхгүй, үргэлж төв өнцгийн хагас.`}
  draw()}
};

, "it": "Эзэлхүүн, гэрлийн эрчим (1/r²) зэрэг функцээр загварчлагдана."}, "13": {"m": "1 бактери 20 минут тутамд 2 хуваагдана. 3 цагийн дараа хэд болох вэ?", "a": "3 цагт 9 удаа хуваагдана: 2⁹ = 512. y = 2ˣ хурдан өсөлт.", "x": ["y = 2ˣ-ийг y = x²-тэй адилхан гэж үзэх", "Илтгэгч функцийг сөрөг утга авна гэж зурах (үргэлж y > 0)"], "it": "Вирус тархалт, хүүгийн нийлмэл өсөлт, алгоритмын 2ⁿ хугацаа."}, "14": {"m": "Утасны багц сард 15 000₮ суурьтай, GB тутамд 2 000₮. 35 000₮-өөс хэтрүүлэхгүйн тулд хэдэн GB хэрэглэж болох вэ?", "a": "15000 + 2000x ≤ 35000 → x ≤ 10 GB.", "x": ["−2x > 6-г x > −3 гэж бодох (сөрөг тоонд хуваахад тэмдэг эргэнэ: x < −3)", "Шийдийг тооны шулуун дээр дугуй цэгийг буруу тэмдэглэх (≤ бол будсан)"], "it": "Программ дахь if (x <= 10) нөхцөл."}, "15": {"m": "Талбай нь 24 м², урт нь өргөнөөсөө 2 м илүү тэгш өнцөгт талбайн хэмжээг ол.", "a": "x(x + 2) = 24 → x² + 2x − 24 = 0 → x = 4 (x = −6 тохирохгүй). 4 × 6 м.", "x": ["D = b² − 4ac-д b сөрөг үед b²-ийг сөрөг гэж үзэх ((−5)² = 25)", "Бодлогын утгад тохирохгүй (сөрөг урт) шийдийг үлдээх"], "it": "Квадрат тэгшитгэл: шидэлтийн хугацаа, талбайн бодлого."}, "16": {"m": "x⁴ − 13x² + 36 = 0 тэгшитгэлийг квадрат тэгшитгэл болгож чадах уу?", "a": "x² = t → t² − 13t + 36 = 0 → t = 4; 9 → x = ±2; ±3.", "x": ["t-г олоод x руу буцаж шилжихээ мартах", "Рационал тэгшитгэлд хуваарийг 0 болгох гаднын шийдийг шалгахгүй байх"], "it": "Орлуулга (хувьсагч солих) — программд ч, математикт ч гол арга."}, "17": {"m": "Цехэд A бүтээгдэхүүн 2 цаг, B 3 цаг шаарддаг, өдөрт 12 цагаас хэтрэхгүй. Боломжит бүх хослолыг графикаар яаж харуулах вэ?", "a": "2x + 3y ≤ 12, x ≥ 0, y ≥ 0 — гурвалжин муж.", "x": ["< үед шулууныг бүтэн зураасаар зурах (тасархай байх ёстой)", "Аль хагас хавтгайг будахаа шалгах цэггүйгээр таах"], "it": "Шугаман програмчлал: үйлдвэрлэлийн төлөвлөлт, оновчлол."}, "18": {"m": "Хуримтлал жил бүр 2 дахин өсдөг бол 1 саяас хэдэн жилийн дараа 32 сая болох вэ?", "a": "2ˣ = 32 = 2⁵ → x = 5 жил.", "x": ["2ˣ = 32-ыг x = 32 : 2 гэж бодох", "4ˣ = 8-ыг ижил суурьт шилжүүлэхгүй таах (2²ˣ = 2³ → x = 3/2)"], "it": "Хоёртын хайлт: 2ˣ = n → алхмын тоо."}, "20": {"m": "Компьютерийн дэлгэц дээр хулганы байрлалыг (x; y)-ээр өгдөг. Тоглоомын дүр (3; −2) цэгт байвал хаана байна вэ?", "a": "Эхээс 3 нэгж баруун, 2 нэгж доош — IV мөч.", "x": ["Цэгийг (y; x) дарааллаар уншиж тэмдэглэх", "Тэнхлэг дээрх цэгийг (0; 5) аль нэг мөчид хамааруулах"], "it": "Дэлгэцийн координат: y тэнхлэг доош чиглэдэг нь сонирхолтой ялгаа."}, "21": {"m": "Газрын зураг дээр сургууль (1; 2), гэр (7; 10) цэгт. Шулуун замаар хэр хол вэ? (1 нэгж = 100 м)", "a": "√(6² + 8²) = 10 нэгж = 1 км.", "x": ["Зайны томьёонд ялгаврыг квадрат зэрэгт дэвшүүлэхээ мартах", "Дундаж цэгт 2-т хуваахын оронд хасах"], "it": "GPS, тоглоомд хоёр объектын зай (мөргөлдөөн шалгах)."}, "22": {"m": "Уулын замын налуу 10% гэдэг юу гэсэн үг вэ? Налалт нь хоёр цэгээс хэрхэн тооцогдох вэ?", "a": "100 м хэвтээ явахад 10 м өгсөнө: k = 10/100 = 0,1.", "x": ["k = (x₂ − x₁)/(y₂ − y₁) гэж урвуу бичих", "Перпендикуляр шулууны налалтыг зөвхөн тэмдгийг өөрчилж олох (зөв нь −1/k)"], "it": "Excel-ийн SLOPE() функц, графикийн чиг хандлага."}, "23": {"m": "Радио станц эх цэгээс 5 км радиуст цацдаг. (3; 4) цэгт байгаа хүн дохио авах уу? (6; 1)?", "a": "x² + y² ≤ 25: (3; 4) → 25 авна; (6; 1) → 37 авахгүй.", "x": ["x² + y² = 16 тойргийн радиусыг 16 гэж үзэх (r = 4)", "ax + by + c = 0-ээс налалтыг a гэж авах (k = −a/b)"], "it": "Утасны антенны хамрах хүрээ, тоглоомд тойрог мөргөлдөөн."}, "24": {"m": "Онгоц хойд зүг 300 км/ц, салхи зүүнээс 40 км/ц үлээвэл онгоцны жинхэнэ хөдөлгөөн ямар байх вэ?", "a": "Хоёр хурдыг вектороор нэмнэ — чиглэл, хэмжээ хоёулаа чухал.", "x": ["Векторыг зөвхөн уртаар нь (тоо мэт) нэмэх", "AB⃗ ба BA⃗-г адил гэж үзэх (эсрэг вектор)"], "it": "Тоглоомын хөдөлгүүр: байрлал + хурд вектор."}, "25": {"m": "Робот «3 алхам баруун, 4 алхам дээш» гэсэн командаар хөдөлнө. Үүнийг нэг вектороор хэрхэн бичих вэ?", "a": "a⃗ = (3; 4) = 3i⃗ + 4j⃗, урт |a⃗| = 5.", "x": ["AB⃗-ийн координатыг эхлэл − төгсгөл гэж бодох (зөв нь төгсгөл − эхлэл)", "|a⃗| = x + y гэж бодох"], "it": "Робот, дрон программчлал: (dx, dy) хөдөлгөөн."}, "26": {"m": "Хоёр хүч F₁(3; 2), F₂(−1; 4) нэг биед үйлчилбэл нийлбэр хүч ямар вэ?", "a": "F⃗ = (2; 6). Координатаар нь нэмнэ.", "x": ["ka⃗-д зөвхөн x координатыг үржүүлэх", "Коллинеар нөхцөлийг x₁/y₁ = x₂/y₂ гэж зөв бичих ч тэгээр хуваах"], "it": "Физикийн хүчний нийлбэр, графикийн шилжилт."}, "27": {"m": "Ачаа 10 Н хүчээр 60° өнцгөөр 5 м чирэхэд хийсэн ажил хэд вэ?", "a": "A = F·s·cos 60° = 10·5·0,5 = 25 Ж — скаляр үржвэр.", "x": ["Скаляр үржвэрийн хариуг вектор гэж бичих (тоо гарна)", "a⃗·b⃗ = 0 бол векторын аль нэг нь 0 гэж дүгнэх (перпендикуляр байж болно)"], "it": "Компьютер графикт гэрэлтүүлэг (cos φ) тооцох."}, "28": {"m": "Гурван дэлгүүрийн 2 сарын борлуулалтыг хүснэгтээр өгвөл нийт борлуулалтыг хэрхэн хурдан олох вэ?", "a": "Ижил хэмжээтэй хоёр матрицыг элементээр нь нэмнэ.", "x": ["2×3 ба 3×2 матрицыг нэмэх", "kA-д зөвхөн эхний мөрийг үржүүлэх"], "it": "Excel хүснэгт, зургийн пикселийн матриц."}, "29": {"m": "Кафе 3 төрлийн хоолны тоо ширхэг ба үнийн хүснэгтээс нийт орлогыг нэг үйлдлээр олох боломжтой юу?", "a": "Тоо ширхгийн мөр × үнийн багана = орлого: матрицын үржвэр.", "x": ["Элементийг харгалзах байрлалаар нь үржүүлэх (мөр × багана биш)", "AB = BA гэж үзэх"], "it": "Нейрон сүлжээ, 3D графикт матрицын үржвэр."}, "30": {"m": "Ямар матриц ямар ч матрицыг үржүүлэхэд өөрчлөхгүй вэ? (Тоонд 1 шиг)", "a": "Нэгж матриц E: AE = EA = A.", "x": ["det[a b; c d] = ab − cd гэж бодох (зөв нь ad − bc)", "Тэг матриц ба нэгж матрицыг андуурах"], "it": "Тодорхойлогч: талбайн өөрчлөлт, тэгшитгэлийн систем шийдтэй эсэх."}, "31": {"m": "Нууц үгийг матрицаар шифрлэсэн бол буцааж тайлахын тулд юу хэрэгтэй вэ?", "a": "Урвуу матриц: A⁻¹·(AX) = X.", "x": ["A⁻¹ = [1/a 1/b; 1/c 1/d] гэж бодох", "det A = 0 үед урвуу матриц олох гэж оролдох"], "it": "Hill шифр, криптограф."}, "32": {"m": "Зураг засварын программ «томруулах», «толин тусгал» хийхэд пиксел бүрийн координатыг яаж өөрчилдөг вэ?", "a": "(x′; y′) = M·(x; y) — хувиргалтын матриц.", "x": ["Матрицыг координатаар үржүүлэхдээ дарааллыг солих", "Баганыг (1; 0)-ийн дүрс гэдгийг анзаарахгүй байх"], "it": "CSS transform: matrix(a, b, c, d, e, f)."}, "33": {"m": "Толинд харагдах дүрс ба биет хоёрын координат хэрхэн холбоотой вэ?", "a": "OY тэнхлэгийн тэгш хэм: (x; y) → (−x; y).", "x": ["OX ба OY тэнхлэгийн тэгш хэмийг андуурах", "y = x шулууны тэгш хэмд тэмдэг өөрчлөх (зөв нь (y; x))"], "it": "Тэгш хэмтэй лого, тоглоомын дүрсийг толин тусгалаар үүсгэх."}, "34": {"m": "Тоглоомын дүр 5 нэгж баруун, 2 нэгж доош шилжвэл бүх цэгийн координат яаж өөрчлөгдөх вэ?", "a": "(x; y) → (x + 5; y − 2): a⃗(5; −2) вектороор зөөлт.", "x": ["Доош шилжүүлэхэд y-д нэмэх", "Зөөлтөөр дүрсийн хэмжээ өөрчлөгдөнө гэж үзэх"], "it": "Анимаци: кадр бүрт байрлалд хурдны вектор нэмэх."}, "35": {"m": "Утасны зургийг 90° эргүүлэхэд (2; 1) цэг хаана очих вэ? Зургийг 2 дахин томруулбал?", "a": "90°: (−1; 2); 2 дахин гомотет: (4; 2).", "x": ["Эргүүлэлтийн чиглэлийг (цагийн зүүний эсрэг) буруу авах", "k < 0 гомотетийг томруулалт гэж үзэх (эсрэг талд гарна)"], "it": "Зургийн эргүүлэлт, масштаб — график программ."}, "37": {"m": "Ангийн 30 сурагчийн өндрийг бүлэглэсэн хүснэгтээс дундаж өндрийг хэрхэн олох вэ?", "a": "Бүлгийн дундаж утгыг давтамжаар үржүүлж нэмээд нийтэд хуваана.", "x": ["Бүлгийн хилийн утгыг дундаж утга гэж авах", "Давтамжийн нийлбэрийн оронд бүлгийн тоонд хуваах"], "it": "Өгөгдөл боловсруулалт, Excel-ийн SUMPRODUCT."}, "38": {"m": "Сурагчдын хичээл давтсан цаг ба шалгалтын дүн хоорондоо холбоотой юу? Цэгэн диаграмм юу харуулах вэ?", "a": "Цэгүүд дээшээ чиглэвэл эерэг корреляц.", "x": ["Корреляцыг шалтгаан гэж дүгнэх", "Тэнцүү биш өргөнтэй гистограммд баганын өндрийг давтамж гэж авах"], "it": "Өгөгдлийн шинжилгээ, машин сургалтын шугаман регресс."}, "39": {"m": "Цалингийн өгөгдөлд хэт өндөр утга байвал дундаж уу, медиан уу аль нь бодит байдлыг сайн харуулах вэ?", "a": "Медиан ба квартил хэт утгад мэдрэг биш.", "x": ["Медианыг эрэмбэлэлгүй өгөгдлөөс авах", "IQR = Q₃ + Q₁ гэж бодох"], "it": "Box plot — өгөгдлийн тархалтын дүрслэл."}, "40": {"m": "Налуу дээврийн өнцөг 120° бол түүний sin, cos-ийг 60°-аар яаж олох вэ?", "a": "sin 120° = sin 60° = √3/2, cos 120° = −cos 60° = −1/2.", "x": ["Мохоо өнцгийн sin-ийг сөрөг гэж үзэх", "cos 120°-ийг cos 60°-тэй тэнцүү гэж бичих"], "it": "Дэлгэцийн эргэлт, дуу авианы долгион sin функцээр."}, "41": {"m": "Гурвалжин хэлбэрийн газрын хоёр тал 40 м, 30 м, хоорондох өнцөг 30°. Талбайг өндрийг хэмжихгүйгээр олох уу?", "a": "S = ½·40·30·sin 30° = 300 м².", "x": ["S = ½ab·sin C-д C нь a, b-гийн хоорондох өнцөг биш байх", "sin 30°-ийг √3/2 гэж авах"], "it": "Газрын хэмжилт, CAD программ."}, "42": {"m": "Голын хоёр эргийн хоорондох зайг гатлахгүйгээр хэрхэн олох вэ?", "a": "Хоёр өнцөг, нэг талаас синусын теоремоор.", "x": ["Косинусын теоремд −2ab·cos C-ийн тэмдгийг алдах", "Синусын теоремд тал ба өнцгийг харгалзуулахгүй байх"], "it": "Геодези, GPS триангуляци."}, "44": {"m": "Театрын тайзыг тойргийн нум дээрх ямар ч суудлаас ижил өнцгөөр харах уу?", "a": "Ижил нумд тулсан багтсан өнцгүүд тэнцүү.", "x": ["Багтсан өнцгийг төв өнцөгтэй тэнцүү гэж үзэх (хагас нь)", "Диаметрт тулсан өнцгийг 180° гэж бодох (90°)"], "it": "Камер байршуулалт, харах өнцөг."}, "45": {"m": "Дугуйн радиус 30 см, тэнхлэгээс 50 см зайтай цэгээс шүргэгчийн урт хэд вэ?", "a": "t = √(50² − 30²) = 40 см (шүргэгч ⟂ радиус).", "x": ["Огтлолцох хөвчид AE·EB = CE·ED-ийн оронд нийлбэрийг тэнцүүлэх", "Шүргэгч ба радиусын перпендикулярыг ашиглахгүй байх"], "it": "Араа, туузан дамжуулга."}, "46": {"m": "Гурвалжин талбайд тойрог хэлбэрийн хамгийн том цэцэрлэг төлөвлөе. Төвийг хаана байрлуулах вэ?", "a": "Биссектрисуудын огтлолцол — багтсан тойргийн төв.", "x": ["Багтсан ба багтаасан тойргийн төвийг андуурах", "Тойрогт багтсан дөрвөн өнцөгтийн эсрэг өнцгийн нийлбэрийг 360° гэж үзэх"], "it": "Цэгийн геометр байр — роботын замын төлөвлөлт."}, "47": {"m": "Пицца 8 хэсэг, диаметр 32 см. Нэг хэсгийн талбай ба ирмэгийн урт хэд вэ?", "a": "Сектор 45°: S = π·16²/8 = 32π ≈ 100 см², нум = 4π ≈ 12,6 см.", "x": ["Радиус ба диаметрийг андуурах", "Градусыг 360-д биш 180-д хуваах (талбайд)"], "it": "Дугуй диаграм (pie chart)."}, "48": {"m": "Майхан (пирамид) ба тэвш (призм) хоёрын суурь, өндөр ижил бол аль нь хэд дахин их агаар багтаах вэ?", "a": "Пирамид призмийн 1/3.", "x": ["Пирамидын эзэлхүүнд 1/3-ийг мартах", "Хажуугийн ирмэгийг өндөр гэж авах"], "it": "Савлагаа, барилгын материалын тооцоо."}, "49": {"m": "Ундааны лааз (цилиндр) ба зайрмагны конус: ижил радиус, өндөртэй бол аль нь их багтаамжтай вэ?", "a": "Конус = цилиндрийн 1/3.", "x": ["Конусын хажуугийн талбайд өндрийг налуу өндрийн оронд авах", "Диаметрийг радиус гэж орлуулах"], "it": "Савны багтаамж, 3D хэвлэлийн материал."}, "50": {"m": "Хөл бөмбөгийн радиус 11 см. Түүнийг бүрэх арьс, доторх агаар хэд вэ?", "a": "S = 4π·121 ≈ 1521 см², V = 4/3·π·1331 ≈ 5575 см³.", "x": ["Бөмбөрцгийн эзэлхүүнд r²-ийг авах (r³)", "Талбайд 4/3 коэффициент хэрэглэх"], "it": "Дэлхийн гадаргуу, бөмбөлөгний хий."}, "51": {"m": "Талхыг янз бүрээр зүсэхэд ямар дүрс гардаг вэ? Цилиндр хэлбэрийн хиамыг хөндлөн, налуу зүсвэл?", "a": "Хөндлөн — дугуй, налуу — эллипс, дагуу — тэгш өнцөгт.", "x": ["Конусын тэнхлэгийн огтлолыг тойрог гэж үзэх (гурвалжин)", "Огтлолын дүрсийг огтлох хавтгайн байрлалаас хамааруулахгүй байх"], "it": "Анагаахын CT зураг — биеийн хавтгай огтлол."}, "52": {"m": "Бөмбөрцгийг төвөөс 3 см-т огтлоход радиус 5 см бол огтлолын талбай?", "a": "r = √(25 − 9) = 4, S = 16π см².", "x": ["Огтлолын радиусыг R − d гэж бодох", "Тэнхлэгийн огтлолын талбайд 2r-ийн оронд r авах (цилиндр)"], "it": "3D загварчлал, CT скан."}, "53": {"m": "Ус халах үйл явцыг үгээр, хүснэгтээр, графикаар, томьёогоор хэрхэн өгөх вэ? Аль нь хамгийн ойлгомжтой вэ?", "a": "Ижил функцийн 4 дүрслэл; зорилгоосоо хамаарч сонгоно.", "x": ["Хүснэгтээс томьёо гаргахдаа нэг цэгээр шалгах", "Графикийн тэнхлэгийн нэгжийг харахгүй уншиж алдах"], "it": "Өгөгдлийн визуалчлал, Excel график."}, "1": {"m": "Нанотехнологид 1 нм = 10⁻⁹ м гэж бичдэг. Цусны улаан эс 7·10⁻⁶ м, томуугийн вирус 7·10⁻⁸ м бол улаан эс вирусаас хэд дахин том бэ?", "a": "(7·10⁻⁶) : (7·10⁻⁸) = 10⁻⁶⁻⁽⁻⁸⁾ = 10² = 100 дахин.", "x": ["3⁻² = −9 гэж бодох (зөв нь 1/9)", "−2⁴ = 16 гэж бодох (зөв нь −16; харин (−2)⁴ = 16)", "(a + b)⁻¹ = a⁻¹ + b⁻¹ гэж бодох"], "it": "1 KB = 2¹⁰ байт; C++ дээр pow(2, -3) = 0.125."}}, "E": [["Нягт нямбай байдал", "Нэг тэмдэг алдахад бүх хариу өөрчлөгдөнө. Алхам бүрээ шалгаж, цэгцтэй бичье."], ["Үнэнч шударга байдал", "Бусдын хариуг хуулахаас илүү алдаа гаргаж сурах нь үнэ цэнтэй. Өөрийн бодолтдоо үнэнч байя."], ["Хамтын ажиллагаа", "Хосоороо ажиллахдаа хариугаа хэлэх бус, яаж бодсоноо тайлбарлая. Тайлбарласан хүн хоёр дахин сурдаг."], ["Тэвчээр, хичээл зүтгэл", "Хэцүү бодлого бол тархины дасгал. Шууд бууж өгөхгүй, өөр аргаар дахин оролдъё."], ["Хариуцлага", "Гэрийн даалгавар бол өөртөө өгсөн амлалт. Хийснээ өөрөө шалгаж, ойлгоогүйгээ асууя."], ["Бусдыг хүндлэх", "Ангийнхныхаа алдааг шоолохгүй, хамт засъя. Алдаа бол суралцахын нэг хэсэг."], ["Цагийг үр бүтээлтэй ашиглах", "80 минут бол 4800 секунд. Утсаа зөвхөн сурах зорилгоор ашиглая."], ["Өөртөө итгэх", "«Би математикт муу» гэдэг бол тогтсон зүйл биш. Дадлага хийх тусам чадвар өсдөг."], ["Сониуч зан", "«Яагаад?» гэж асуух нь математикийн эхлэл. Хариугаас гадна шалтгааныг нь хайя."], ["Мэдээллийн соёл", "Интернэт, AI-аас хариу хуулахаас өмнө өөрөө оролдоод, дараа нь шалгах хэрэгсэл болгон ашиглая."], ["Бие даан суралцах", "Өнөөдөр юуг сурах, хэр сурснаа өөрөө үнэлэх нь насан туршийн чадвар."], ["Байгаль орчинд ээлтэй", "Ноорог цаасаа хоёр талаар нь ашиглаж, ангиа цэвэр байлгая."]], "T": {"1": {"c": "1, 2, 3, 6, 7", "h": "9, 12, 14, 20", "a": "22, 25, 26", "r": "Бүлгийн нэмэлт даалгавар (х. 20): В, Б бүлэг №1–6, А бүлэг №7–12"}, "2": {"c": "27, 28, 30, 31, 33, 34", "h": "35–37, 39, 40", "a": "41, 43, 45", "r": "Бүлгийн нэмэлт даалга гэгчтэй зэргийн чанараар илэрхийллийг хялбарчилж чадна.", "Би хүүгийн өсөлт, дууны давтамжийн бодлогод бутархай илтгэгч хэрэглэж чадна."], "4": ["Би тоог a·10ⁿ (1 ≤ a < 10) стандарт дүрсэд бичиж чадна.", "Би стандарт дүрсээр бичсэн тоог үржүүлж, хувааж, хариуг стандарт дүрсэд шилжүүлж чадна.", "Би санах ойн багтаамж, бичил хэмжээ зэрэг бодит тооцоог стандарт дүрсээр гүйцэтгэж чадна."], "5": ["Би N ⊂ Z ⊂ Q ⊂ R ангиллыг тайлбарлаж, өгсөн тоо аль олонлогт хамаарахыг тодорхойлж чадна.", "Би хуваах чанарыг ашиглан тооцоог хялбар аргаар хийж, √a хоёр бүхэл тооны хооронд байрлахыг олж чадна.", "Би рационал ба иррационал тооны жишээ гаргаж, ойролцоо утгыг үндэслэлтэй хэрэглэж чадна."], "6": ["Би хураангуй үржүүлэхийн томьёог (a ± b)², (a − b)(a + b) нэрлэж, тайлбарлаж чадна.", "Би томьёо ашиглан илэрхийллийг задалж, төстэй гишүүнийг эмхэтгэж чадна.", "Би хялбарчилсан илэрхийллийн утгыг өгсөн хувьсагчийн утгаар тооцож, тэмдгийн алдааг илрүүлж чадна."], "7": ["Би үржигдэхүүнд задлах 3 аргыг (ерөнхий үржигдэхүүн, бүлэглэх, томьёо) нэрлэж чадна.", "Би олон гишүүнтийг тохирох аргаар үржигдэхүүнд задалж, үржүүлж шалгаж чадна.", "Би x² − 49 = 0 хэлбэрийн тэгшитгэлийг задлах аргаар бодож чадна."], "8": ["Би алгебрын бутархайг үржүүлэх, хуваах дүрмийг тайлбарлаж чадна.", "Би бутархайн хүртвэр, хуваарийг задлаад хурааж, үйлдлийг гүйцэтгэж чадна.", "Би хуваарь 0 биш байх нөхцөлийг бичиж, хялбарчилсан илэрхийллийн утгыг олж чадна."], "9": ["Би ерөнхий хуваарь олох аргыг тайлбарлаж чадна.", "Би шугаман ба квадрат хуваарьтай бутархайг нэмж, хасаж, хураасан хэлбэрт бичиж чадна.", "Би хамтын ажлын (хоолой, ажилчин) бодлогыг алгебрын бутархайгаар загварчилж чадна."], "10": ["Би функц, тодорхойлогдох муж, утгын мужийн утгыг тайлбарлаж чадна.", "Би f(a)-г тооцож, язгуур ба бутархайтай функцийн тодорхойлогдох мужийг олж чадна.", "Би такси, утасны төлбөр зэрэг бодит хамаарлыг функцээр илэрхийлж чадна."], "11": ["Би y = a(x − p)² + q параболын орой, тэгш хэмийн тэнхлэгийг нэрлэж чадна.", "Би утгын хүснэгт зохиож параболын график байгуулж, оройг x₀ = −b/2a томьёогоор олж чадна.", "Би параболын хамгийн их, бага утгыг бодит асуудалд (шидэлт, талбай) хэрэглэж чадна."], "12": ["Би y = axⁿ функц n-ээс хамааран тэгш эсвэл сондгой байхыг тайлбарлаж чадна.", "Би y = axⁿ, y = k/x функцийн утгын хүснэгт зохиож, график байгуулж чадна.", "Би y = k/x графикийн байрлалыг k-ийн тэмдгээр тодорхойлж, урвуу хамаарлын жишээ хэлж чадна."], "13": ["Би y = aˣ функц a > 1 үед өсөх, 0 < a < 1 үед буурахыг тайлбарлаж чадна.", "Би илтгэгч функцийн утгыг тооцож, графикийг байгуулж, (0; 1) цэгийг дайрахыг харуулж чадна.", "Би вирус тархалт, нийлмэл хүүгийн өсөлтийг илтгэгч функцээр загварчилж чадна."], "14": ["Би сөрөг тоогоор үржүүлэх, хуваахад тэнцэтгэл бишийн тэмдэг эргэдгийг тайлбарлаж чадна.", "Би шугаман тэнцэтгэл биш ба системийг бодож, шийдийг тоон шулуун, завсраар бичиж чадна.", "Би төлбөр, төсвийн хязгаарын бодлогыг тэнцэтгэл бишээр зохиож бодож чадна."], "15": ["Би дискриминантын тэмдгээр квадрат тэгшитгэлийн шийдийн тоог тодорхойлж чадна.", "Би бүтэн квадрат ялгах арга болон ерөнхий томьёогоор квадрат тэгшитгэл бодож чадна.", "Би талбай, хөдөлгөөний бодлогыг квадрат тэгшитгэлд шилжүүлж, шийдийн утгыг шалгаж чадна."], "16": ["Би биквадрат тэгшитгэлд x² = t орлуулга хийх санааг тайлбарлаж чадна.", "Би биквадрат ба рационал тэгшитгэлийг квадрат тэгшитгэлд шилжүүлж бодож чадна.", "Би рационал тэгшитгэлийн гаднын шийдийг хуваарийн нөхцөлөөр шалгаж хасаж чадна."], "17": ["Би y > kx + b тэнцэтгэл бишийн шийд хагас хавтгай болохыг тайлбарлаж чадна.", "Би шалгах цэг ашиглан тэнцэтгэл биш ба системийн шийдийг координатын хавтгайд дүрсэлж чадна.", "Би нөөц, төсвийн хязгаарлалтыг хоёр хувьсагчтай тэнцэтгэл бишээр загварчилж чадна."], "18": ["Би aᶠ⁽ˣ⁾ = aᵍ⁽ˣ⁾ бол f(x) = g(x) гэдгийг тайлбарлаж чадна.", "Би илтгэгч тэгшитгэлийг ижил суурьт шилжүүлэх эсвэл t = aˣ орлуулгаар бодож чадна.", "Би өсөлт, хуримтлалын хугацааг илтгэгч тэгшитгэлээр олж чадна."], "20": ["Би цэгийн координат, мөчүүдийг тайлбарлаж, цэгийн тэгш хэмийн дүрмийг нэрлэж чадна.", "Би цэгийг координатын хавтгайд байрлуулж, OX, OY тэнхлэгийн тэгш хэмтэй цэгийг олж чадна.", "Би газрын зураг, дэлгэцийн пикселийн байршлыг координатаар илэрхийлж чадна."], "21": ["Би хоёр цэгийн хоорондох зай ба хэрчмийн дундаж цэгийн томьёог тайлбарлаж чадна.", "Би томьёогоор хоёр цэгийн зай, дундаж цэгийн координатыг олж чадна.", "Би газрын зураг дээрх хоёр байршлын бодит зайг тооцож, зайны томьёоны алдааг илрүүлж чадна."], "22": ["Би шулууны налалт k ба y − y₁ = k(x − x₁) тэгшитгэлийг тайлбарлаж чадна.", "Би хоёр цэгийг дайрсан шулууны налалт, тэгшитгэлийг олж, параллель ба перпендикуляр шулууныг таньж чадна.", "Би өсөлтийн хурд, хандлагыг налалтаар тайлбарлаж чадна."], "23": ["Би ax + by + c = 0 ерөнхий тэгшитгэл ба x² + y² = r² тойргийн тэгшитгэлийг тайлбарлаж чадна.", "Би ерөнхий тэгшитгэлээс налалтыг олж, тойргийн радиусыг тодорхойлж, цэг тойрог дээр орших эсэхийг шалгаж чадна.", "Би цацрагийн хүрээ, хамрах бүсийн бодлогыг тойргийн тэгшитгэлээр бодож чадна."], "24": ["Би векторыг нэмэх гурвалжны ба параллелограммын дүрмийг тайлбарлаж чадна.", "Би векторыг нэмж, хасаж, тоогоор үржүүлж, коллинеар векторыг таньж чадна.", "Би шилжилт, хүчийг вектороор дүрсэлж чадна."], "25": ["Би векторын координат ба уртын томьёог тайлбарлаж чадна.", "Би хоёр цэгээр векторын координатыг олж, урт, суурь нэгж вектор дахь задаргааг бичиж чадна.", "Би робот, тоглоомын дүрийн хөдөлгөөнийг вектороор илэрхийлж чадна."], "26": ["Би координатаар өгсөн векторын үйлдлийн дүрмийг тайлбарлаж чадна.", "Би векторын нийлбэр, ялгавар, тоогоор үржвэрийн координатыг олж, коллинеар байх нөхцөлийг хэрэглэж чадна.", "Би хүчний нийлбэр, шилжилтийг векторын координатаар тооцож чадна."], "27": ["Би скаляр үржвэрийн хоёр томьёог тайлбарлаж чадна.", "Би скаляр үржвэр, векторын хоорондох өнцгийг олж, перпендикуляр байх нөхцөлийг хэрэглэж чадна.", "Би физикийн ажил A = F·s·cos α-г скаляр үржвэрээр тооцож чадна."], "28": ["Би m × n хэмжээстэй матриц, түүний мөр, багана, элементийг тайлбарлаж чадна.", "Би ижил хэмжээстэй матрицыг нэмж, хасаж, тоогоор үржүүлж чадна.", "Би хүснэгт мэдээллийг (борлуулалт, оноо) матрицаар илэрхийлж чадна."], "29": ["Би матриц үржих нөхцөл ба (m×n)(n×p) = m×p дүрмийг тайлбарлаж чадна.", "Би «мөр × багана» дүрмээр матриц үржүүлж чадна.", "Би үнэ × тоо ширхэгийн нийт дүнг матриц үржвэрээр тооцож, AB ≠ BA гэдгийг харуулж чадна."], "30": ["Би тэг ба нэгж матриц, 2×2 матрицын тодорхойлогчийг тайлбарлаж чадна.", "Би det = ad − bc-г тооцож, матриц урвуутай эсэхийг тодорхойлж чадна.", "Би тэг матриц ба нэгж матрицыг андуурах алдааг тайлбарлаж чадна."], "31": ["Би A⁻¹ = (1/det A)·[d −b; −c a] томьёо ба det A ≠ 0 нөхцөлийг тайлбарлаж чадна.", "Би 2×2 матрицын урвуу матрицыг олж, AA⁻¹ = E-ээр шалгаж чадна.", "Би хоёр үл мэдэгдэгчтэй шугаман тэгшитгэлийн системийг X = A⁻¹B аргаар бодож чадна."], "32": ["Би хувиргалтын матриц цэгийн координатыг (x'; y') = M·(x; y) болгон хувиргадгийг тайлбарлаж чадна.", "Би өгсөн матрицаар цэг, дүрсийг хувиргаж, хувиргалтын матрицыг (1; 0), (0; 1) цэгийн дүрсээр бичиж чадна.", "Би компьютер графикт дүрсийг матрицаар хувиргадгийг жишээгээр тайлбарлаж чадна."], "33": ["Би цэгийн болон тэнхлэгийн тэгш хэмийн координатын дүрмийг нэрлэж чадна.", "Би O цэг, OX, OY, y = x шулууны хувьд тэгш хэмтэй цэг, дүрсийг байгуулж чадна.", "Би тэгш хэмийг хээ, лого, архитектурын жишээнд таньж тайлбарлаж чадна."], "34": ["Би a⃗(a; b) вектороор параллель зөөхөд (x; y) → (x + a; y + b) болохыг тайлбарлаж чадна.", "Би зөөлтийн дараах цэг, дүрсийн координатыг олж, байгуулж чадна.", "Би тоглоом, анимацын хөдөлгөөнийг параллель зөөлтөөр дүрсэлж, зөөлтөөр хэмжээ өөрчлөгдөхгүйг тайлбарлаж чадна."], "35": ["Би 90°, 180° эргүүлэлт ба гомотетийн координатын дүрмийг тайлбарлаж чадна.", "Би цэг, дүрсийг O цэгийг тойруулан эргүүлж, k коэффициенттэй гомотетоор хувиргаж чадна.", "Би масштаб, томруулалтыг гомотетоор тайлбарлаж, k < 0 үед дүрс эсрэг талд гарахыг харуулж чадна."], "37": ["Би бүлэгл function evalAnswer(raw){
  let s=String(raw).trim().toLowerCase().replace(/\s+/g,"").replace(/π|pi/g,"");
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>"^"+m.split("").map(c=>SUPC[c]).join(""));
  s=s.replace(/−|–/g,"-").replace(/[·×∙]/g,"*").replace(/:/g,"/").replace(/,/g,".");
  if(!s) return null;
  if(/^-?\d*\.?\d+e-?\d+$/.test(s)) return Number(s);
  if((s.match(/(\d+(?:\.\d+)?)\^/g)||[]).some(p=>p!=="10^")) return "pow";
  let i=0;
  const num=()=>{const m=s.slice(i).match(/^\d+(?:\.\d+)?|^\.\d+/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const atom=()=>{if(s[i]==="-"){i++;return -atom()}if(s[i]==="+"){i++;return atom()}
    let v;if(s[i]==="("){i++;v=expr();if(s[i]!==")")throw 0;i++}else v=num();
    if(s[i]==="^"){i++;let sg=1;if(s[i]==="-"){sg=-1;i++}else if(s[i]==="+")i++;v=Math.pow(v,sg*num())}return v};
  const term=()=>{let v=atom();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=atom();v=o==="*"?v*r:v/r}return v};
  const expr=()=>{let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v};
  try{const v=expr();return i===s.length&&isFinite(v)?v:null}catch(e){return null}
}

/* single practice item with feedback; cb(firstTryOk) once solved or revealed */
function mountItem(box,it,opts){opts=opts||{};const uid="i"+Math.random().toString(36).slice(2,8);
  box.innerHTML=`<div class="item"><div class="q">${opts.num?`<span class="n">${opts.num}.</span>`:""}${it.q}</div>${ctrlHTML(it,uid)}<div class="fb" aria-live="polite"></div><div class="sol" hidden></div>${teacher?`<div class="tkey">Хариу: <b>${it.ansText}</b> · ${it.sol}</div>`:""}</div>`;
  const card=box.firstChild,fb=card.querySelector(".fb"),sol=card.querySelector(".sol");let tries=0,done=false;
  const finish=(ok)=>{done=true;card.classList.add(ok?"ok":"no");opts.onDone&&opts.onDone(tries===1&&ok)};
  const showSol=()=>{sol.hidden=false;sol.innerHTML="<b>Бодолт:</b> "+it.sol};
  const attempt=input=>{if(done)return;const r=judge(it,input);if(r.err){fb.className="fb b";fb.textContent=r.err;return}tries++;
    if(r.ok){fb.className="fb g";fb.innerHTML=tries===1?"Зөв! ":"Зөв боллоо.";showSol();finish(true)}
    else if(tries===1){fb.className="fb b";fb.innerHTML="Арай өөр байна. "+(it.hint?"<b>Сануулга:</b> "+it.hint:"Дахин оролдоорой.")}
    else{fb.className="fb b";fb.innerHTML=`Зөв хариу: <b>${it.ansText}</b>. Бодолтыг харж, дараагийнхыг оролдоорой.`;showSol();finish(false)}};
  if(it.type==="mc")card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;const j=+b.dataset.j;b.classList.add(j===it.c?"right":"bad");if(j!==it.c&&tries>=1)card.querySelectorAll(".opt")[it.c].classList.add("right");attempt(j)});
  else{const inp=card.querySelector("input");card.querySelector("[data-check]").onclick=()=>attempt(inp.value);inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();attempt(inp.value)}})}
}

/* tests */
function runQuiz(items,{onFinish}){const ans={};
  const box=$("#qitems");box.innerHTML=items.map((it,i)=>`<div class="item" data-i="${i}"><div class="q"><span class="n">${i+1}.</span>${it.q}</div>${it.type==="mc"?`<div class="row">${it.opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}">${"АБВГ"[j]}) ${o}</button>`).join("")}</div>`:`<div class="row"><label class="muted" for="t${i}">Хариу:</label><input class="in" id="t${i}" autocomplete="off"></div>`}<div class="fb"></div>${teacher?`<div class="tkey">Хариу: <b>${it.ansText}</b> · ${it.sol}</div>`:""}<div class="sol" hidden>Бодолт: ${it.sol}</div></div>`).join("");
  box.querySelectorAll(".item").forEach(b=>{const i=+b.dataset.i;b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{b.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");ans[i]=+o.dataset.j})});
  $("#finish").onclick=()=>{let ok=0;const wrong=[];
    box.querySelectorAll(".item").forEach(b=>{const i=+b.dataset.i,it=items[i];const r=judge(it,it.type==="mc"?ans[i]:b.querySelector("input").value);const good=!!r.ok;
      b.className="item "+(good?"ok":"no");const fb=b.querySelector(".fb");fb.className="fb "+(good?"g":"b");fb.textContent=good?"Зөв":"Буруу. Зөв хариу: "+plain(it.ansText);
      b.querySelector(".sol").hidden=good||teacher;if(it.type==="mc")b.querySelectorAll(".opt")[it.c].classList.add("right");if(good)ok++;else wrong.push(it.lesson||it.skill||0)});
    $("#finish").disabled=true;onFinish(ok,items.length,wrong)}}
function recList(wrong){const ls=[...new Set(wrong.filter(x=>typeof x==="number"&&x>0))].sort((a,b)=>a-b);return ls.map(n=>`<a href="#lesson-${n}">№${n} ${esc(LBY[n].title)}</a>`).join("<br>")}
function vAssess(){const last=store.get("m10s",{});
  const row=id=>{const t=TESTS[id],r=last[id];return `<div class="arow"><div><b>${esc(t.title)}</b> <small class="muted">· ${esc(t.when)}</small><br><small>${esc(t.desc)} · ${t.n} бодлого · ~${t.n*2} мин${r!=null?` · сүүлийн дүн <b>${r}%</b>`:""}</small></div><div class="row"><a class="btn p s" href="#test-${id}-a">А хувилбар</a><a class="btn s" href="#test-${id}-b">Б хувилбар</a></div></div>`};
  app.innerHTML=`<h1 class="h1">Сорил, шалгалт</h1><p class="lead">А, Б хувилбарыг хоёр эгнээнд өгнө. Дуусгасны дараа дүн, алдсан бодлогын бодолт, давтах хичээл гарна. Дүнгийн кодоо багшдаа илгээгээрэй.</p>
  <h2 class="sec">1. Оношлох</h2><div class="alist">${row("diag")}${row("rediag")}</div>
  <h2 class="sec">2. Явцын сорил <small>нэгж бүрийн төгсгөлд</small></h2><div class="alist">${M.UNITS.map(u=>row(u.id)).join("")}</div>
  <h2 class="sec">3. Хөтөлбөрийн үнэлгээ</h2><div class="alist">${row("h19")}${row("h36")}${row("h43")}${row("final")}</div>`}
function vTest(id,v){const t=TESTS[id];if(!t)return vAssess();const items=testItems(id,v);
  app.innerHTML=`<div class="crumb"><a href="#assess">Сорил, шалгалт</a></div><span class="pill">${v==="a"?"А":"Б"} хувилбар · ${items.length} бодлого</span><h1 class="h1">${esc(t.title)}</h1><p class="lead">${esc(t.desc)} Бүх бодлогыг бодоод «Дуусгах» дар.</p>
   <div class="items" id="qitems" style="margin-top:14px"></div><div class="row noprint" style="margin-top:14px"><button class="btn p" type="button" id="finish">Дуусгах</button></div><div id="result"></div>${teacher?teacherKey(t,v,items):""}`;
  runQuiz(items,{onFinish:(ok,T,wrong)=>{const p=Math.round(100*ok/T),lv=level(p);const last=store.get("m10s",{});last[id]=p;store.set("m10s",last);
    const rl=recList(wrong);const fWrong=[...new Set(wrong.filter(x=>typeof x==="string"))];
    $("#result").innerHTML=`<div class="card stack" style="margin-top:14px"><div class="score"><span class="big">${ok}/${T}</span><span class="big sm">${p}%</span><span class="lv ${lv.k}">${lv.t}</span></div>${rl?`<div><b>Давтах хичээлүүд:</b><br>${rl}</div>`:""}${id.includes("diag")&&p<80?`<div><b>Суурь мэдлэгээ нөхөөрэй:</b><br>${FOUND.slice(0,6).map(f=>`<a href="#found-${f.id}">${esc(f.t)}</a>`).join("<br>")}</div>`:""}<div id="rc"></div></div>`;
    askName(nm=>{$("#rc").innerHTML=codeBox(enc({k:"t",n:nm,id,v,s:ok,T,w:wrong.filter(x=>typeof x==="number"&&x>0),d:new Date().toISOString().slice(0,10)}));wireCopy($("#rc"))});
    $("#result").scrollIntoView({behavior:"smooth",block:"start"})}});
  wireCopy(app);
}
function teacherKey(t,v,items){const txt=`${t.title} — ${v==="a"?"А":"Б"} хувилбар\nНэр: ____________________\n\n`+items.map((it,i)=>`${i+1}. ${plain(it.q)}${it.type==="mc"?"\n   "+it.opts.map((o,j)=>"АБВГ"[j]+") "+plain(o)).join("   "):""}`).join("\n\n")+`\n\nХАРИУНЫ ТҮЛХҮҮР\n`+items.map((it,i)=>`${i+1}. ${plain(it.ansText)} — ${plain(it.sol)}`).join("\n");
  return `<div class="card stack noprint" style="margin-top:16px"><h2 style="font-size:19px">Багшид: хариуны түлхүүр</h2><div class="scroll"><table class="tbl"><thead><tr><th>№</th><th>Хариу</th><th>Хичээл</th></tr></thead><tbody>${items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.ansText}</td><td>${it.lesson?"№"+it.lesson:"суурь"}</td></tr>`).join("")}</tbody></table></div><p class="muted" style="margin:0">Хэвлэх хувилбар: текстийг хуулж Word-д буулгана.</p><div class="codebox col"><textarea class="copy" readonly>${esc(txt)}</textarea><button class="btn s" type="button" data-copy>Хуулах</button><span class="muted cmsg"></span></div></div>`}

/* level check */
const SCOPES=[{id:"base",name:"Суурь мэдлэг (6–9-р анги)",make:s=>M.diagItems(10,s)},{id:"all",name:"Бүх агуулга (холимог)",make:s=>M.itemsFrom(LS_ALL,12,s)}].concat(M.UNITS.map(u=>({id:u.id,name:u.name,make:s=>M.itemsFrom(u.ls,10,s)})));
function vLevel(scope){const hist=store.get("m10lv",[]);
  if(!scope){app.innerHTML=`<h1 class="h1">Түвшингээ шалгах</h1><p class="lead">Сэдвээ сонгоод 10 орчим бодлого бод. А, Б, В түвшний аль нь болох, юуг давтахыг харуулна.</p>
    <div class="grid" style="margin-top:16px">${SCOPES.map(s=>`<a class="lc" href="#level-${s.id}"><span class="no">${s.id==="base"?"6–9":s.id==="all"?"Σ":s.id.slice(1)}</span><span class="t">${esc(s.name)}</span></a>`).join("")}</div>
    ${hist.length?`<h2 class="sec">Сүүлийн үр дүн</h2><div class="scroll"><table class="tbl"><thead><tr><th>Огноо</th><th>Сэдэв</th><th>Дүн</th><th>Түвшин</th></tr></thead><tbody>${hist.slice(-8).reverse().map(r=>`<tr><td>${esc(r.d)}</td><td>${esc(r.s)}</td><td>${r.p}%</td><td>${level(r.p).t.split(" — ")[0]}</td></tr>`).join("")}</tbody></table></div>`:""}`;return}
  const sc=SCOPES.find(s=>s.id===scope);if(!sc)return vLevel();const items=sc.make(Date.now()%1e6);
  app.innerHTML=`<div class="crumb"><a href="#level">Түвшингээ шалгах</a></div><h1 class="h1">${esc(sc.name)}</h1><div class="items" id="qitems" style="margin-top:14px"></div><div class="row" style="margin-top:14px"><button class="btn p" type="button" id="finish">Түвшингээ харах</button><button class="btn" type="button" id="again">Шинэ бодлогууд</button></div><div id="result"></div>`;
  $("#again").onclick=()=>vLevel(scope);
  runQuiz(items,{onFinish:(ok,T,wrong)=>{const p=Math.round(100*ok/T),lv=level(p);hist.push({d:new Date().toLocaleDateString("mn-MN"),s:sc.name,p});store.set("m10lv",hist);
    const adv=lv.k==="A"?"Сайн байна! Дараагийн нэгж рүү ахиж, сурах бичгийн бүлгийн нэмэлт даалгаврыг бодоорой.":lv.k==="B"?"Доорх хичээлүүдийн дадлагыг дахин хийж эзэмшээрэй.":"Давтлагын цагт багштайгаа доорх сэдвүүдийг давтаарай."+(scope==="base"?" Суурь мэдлэгийн хэсгээс эхлээрэй.":"");
    $("#result").innerHTML=`<div class="card stack" style="margin-top:14px"><div class="score"><span class="big">${p}%</span><span class="lv ${lv.k}">${lv.t}</span></div><p style="margin:0">${adv}</p>${recList(wrong)?`<div>${recList(wrong)}</div>`:""}${scope==="base"&&p<80?`<div>${FOUND.map(f=>`<a href="#found-${f.id}">${esc(f.t)}</a>`).join("<br>")}</div>`:""}</div>`;
    $("#result").scrollIntoView({behavior:"smooth",block:"start"})}});
}

/* review: interleaved retrieval */
function reviewPool(){const p=prog();const L=Object.keys(p.L||{}).map(Number).filter(n=>M.G[n]);const F=Object.keys(p.F||{});return{L,F}}
function vReview(){const {L,F}=reviewPool();
  app.innerHTML=`<h1 class="h1">Давтлага</h1><p class="lead">Өмнө үзсэн сэдвүүдээ холимог байдлаар бод. Холимог давтлага нь мэдлэгийг удаан хадгалдаг. ${L.length?`Таны үзсэн ${L.length} хичээлээс сонгоно.`:"Хичээлийн дадлага хийсний дараа энд таны үзсэн сэдвүүд орно. Одоогоор суурь мэдлэгийн бодлого гарна."}</p>
  <div class="row" style="margin:12px 0"><button class="btn p" type="button" id="rgo">10 бодлого эхлүүлэх</button>${teacher?'<a class="btn" href="#board-mix">Самбарт давтлага</a><a class="btn" href="#warm">Өдрийн 5 бодлого</a>':""}</div><div class="items" id="qitems"></div><div class="row" style="margin-top:14px" hidden id="frow"><button class="btn p" type="button" id="finish">Дуусгах</button></div><div id="result"></div>`;
  $("#rgo").onclick=()=>{const s=Date.now()%1e6;let items=[];if(L.length){const recent=L.sort((a,b)=>(prog().L[a].t||0)-(prog().L[b].t||0));items=M.itemsFrom(recent,8,s)}
    const fs=F.length?F:["f1","f2","f3","f4"];fs.slice(0,4).forEach((f,i)=>{if(items.length<10)items.push(M.foundItems(f,1,s+i)[0])});while(items.length<10)items.push(M.diagItems(1,s+items.length)[0]);
    items=M.rng(s).shuffle(items);$("#frow").hidden=false;
    runQuiz(items,{onFinish:(ok,T,wrong)=>{const p=Math.round(100*ok/T);$("#result").innerHTML=`<div class="card stack" style="margin-top:14px"><div class="score"><span class="big">${ok}/${T}</span><span class="lv ${level(p).k}">${level(p).t}</span></div>${recList(wrong)?`<div><b>Дахин үзэх:</b><br>${recList(wrong)}</div>`:""}<button class="btn" type="button" onclick="location.hash='review';dispatchEvent(new HashChangeEvent('hashchange'))">Шинэ давтлага</button></div>`;$("#result").scrollIntoView({behavior:"smooth"})}})}}

/* board (projector) mode */
function vBoard(src){let make,title;
  if(/^l\d+$/.test(src)){const n=+src.slice(1);make=s=>M.lessonItems(n,1,s)[0];title="№"+n+" "+(LBY[n]||{}).title}
  else if(/^f\d+$/.test(src)){make=s=>M.foundItems(src,1,s)[0];title=FBY[src].t}
  else if(/^u\d+$/.test(src)){const u=M.UNITS.find(x=>x.id===src);make=s=>M.itemsFrom(u.ls,1,s)[0];title=u.name}
  else{const opts=store.get("m10bmix",M.UNITS.slice(0,2).map(u=>u.id));make=s=>{const ls=M.UNITS.filter(u=>opts.includes(u.id)).flatMap(u=>u.ls);return ls.length?M.itemsFrom(ls,1,s)[0]:M.diagItems(1,s)[0]};title="Холимог давтлага"}
  let seed=Date.now()%1e6,k=0;
  const pickU=src==="mix"?`<details class="noprint"><summary>Нэгж сонгох</summary><div class="row">${M.UNITS.map(u=>`<label class="chk"><input type="checkbox" value="${u.id}" ${store.get("m10bmix",["u1","u2"]).includes(u.id)?"checked":""}> ${esc(u.name.replace(/^Нэгж /,""))}</label>`).join("")}</div></details>`:"";
  app.innerHTML=`<div class="board"><div class="row" style="justify-content:space-between"><span class="muted">${esc(title)}</span><a class="btn s" href="#home">Гарах</a></div>${pickU}<div class="bq" id="bq"></div><div class="bans" id="ba" hidden></div><div class="row bctl"><button class="btn" type="button" id="bshow">Хариу</button><button class="btn" type="button" id="bsol">Бодолт</button><button class="btn p" type="button" id="bnext">Дараах →</button></div></div>`;
  app.querySelectorAll(".chk input").forEach(c=>c.onchange=()=>{store.set("m10bmix",[...app.querySelectorAll(".chk input:checked")].map(x=>x.value))});
  let it;const show=()=>{it=make(seed+(k++)*31);$("#bq").innerHTML=`<span class="bn">${k}</span>${it.q}${it.type==="mc"?`<div class="bopts">${it.opts.map((o,j)=>`<span>${"АБВГ"[j]}) ${o}</span>`).join("")}</div>`:""}`;$("#ba").hidden=true};
  $("#bshow").onclick=()=>{$("#ba").hidden=false;$("#ba").innerHTML=`Хариу: <b>${it.ansText}</b>`};
  $("#bsol").onclick=()=>{$("#ba").hidden=false;$("#ba").innerHTML=`Хариу: <b>${it.ansText}</b><br><span class="bsol">${it.sol}</span>`};
  $("#bnext").onclick=show;show();
}
